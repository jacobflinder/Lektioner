<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Coulombs lag · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"></head><body><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Coulombs lag</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Coulombs lag","subject":"Fysik nivå 1","chapter":"8.1 · Elektrisk laddning","source":"261102 Coulombs lag Fy1.pdf","goals":["Förklara laddningens bevarande och hur elektronunderskott/överskott ger laddning.","Förutsäga attraktion/repulsion och använda Coulombs lag, även avståndets kvadratiska betydelse.","Lösa uppgifter om elektrisk kraft och antal elektroner."],"pages":[{"title":"Elektroner flyttas – laddning bevaras","body":"<div class=\"question\">Vilket föremål har elektronunderskott? Vad skiljer neutral, positiv och negativ laddning?<\/div><p>Elektroner kan flyttas mellan föremål. Protonerna sitter kvar i atomkärnorna. Ett föremål kan bli positivt genom att <b>förlora elektroner<\/b>, och negativt genom att <b>få elektroner<\/b>.<\/p><p>Rita med plus- och minussymboler: lika laddningar stöter bort varandra, olika laddningar attraherar.<\/p><p class=\"note\"><b>Mål:<\/b> bevara laddning, förklara attraktion/repulsion, använda Coulombs lag och beräkna elektronantal.<\/p>","source":"1","lead":"Alla symboler står för lika stor positiv eller negativ laddning.","quiz":{"prompt":"Två föremål laddas genom att elektroner flyttas från A till B. Vilket blir positivt?","options":["A","B","Båda"],"correct":0,"why":"A förlorar elektroner och får elektronunderskott. Totala laddningen är bevarad.","hint":""},"teacher":"Använd enskilt → par → gemensamt. Kontrollera att eleven skiljer protoner från elektroner.","time":"Elevtänkande 1 min","side":"<figure class=\"graph static-graph\"><svg role=\"img\" aria-label=\"Antalet laddningar visas schematiskt. Nettoladdning beror på skillnaden mellan plus och minus.\" viewBox=\"0 0 535 250\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"23\" y=\"60\" rx=\"10\" width=\"160\" height=\"164\" fill=\"#e6f0f4\"/><text x=\"103\" y=\"40\" fill=\"#214956\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">Neutral<\/text><circle cx=\"50\" cy=\"105\" r=\"20\" fill=\"#c66d4c\"/><text x=\"50\" y=\"112\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"87\" cy=\"105\" r=\"20\" fill=\"#c66d4c\"/><text x=\"87\" y=\"112\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"124\" cy=\"105\" r=\"20\" fill=\"#c66d4c\"/><text x=\"124\" y=\"112\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"161\" cy=\"105\" r=\"20\" fill=\"#c66d4c\"/><text x=\"161\" y=\"112\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"50\" cy=\"163\" r=\"20\" fill=\"#176f8b\"/><text x=\"50\" y=\"170\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><circle cx=\"87\" cy=\"163\" r=\"20\" fill=\"#176f8b\"/><text x=\"87\" y=\"170\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><circle cx=\"124\" cy=\"163\" r=\"20\" fill=\"#176f8b\"/><text x=\"124\" y=\"170\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><circle cx=\"161\" cy=\"163\" r=\"20\" fill=\"#176f8b\"/><text x=\"161\" y=\"170\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><rect x=\"194\" y=\"60\" rx=\"10\" width=\"160\" height=\"164\" fill=\"#e6f0f4\"/><text x=\"274\" y=\"40\" fill=\"#214956\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">Positiv<\/text><circle cx=\"221\" cy=\"105\" r=\"20\" fill=\"#c66d4c\"/><text x=\"221\" y=\"112\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"258\" cy=\"105\" r=\"20\" fill=\"#c66d4c\"/><text x=\"258\" y=\"112\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"295\" cy=\"105\" r=\"20\" fill=\"#c66d4c\"/><text x=\"295\" y=\"112\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"332\" cy=\"105\" r=\"20\" fill=\"#c66d4c\"/><text x=\"332\" y=\"112\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"221\" cy=\"163\" r=\"20\" fill=\"#176f8b\"/><text x=\"221\" y=\"170\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><circle cx=\"258\" cy=\"163\" r=\"20\" fill=\"#176f8b\"/><text x=\"258\" y=\"170\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><circle cx=\"295\" cy=\"163\" r=\"20\" fill=\"#176f8b\"/><text x=\"295\" y=\"170\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><rect x=\"365\" y=\"60\" rx=\"10\" width=\"160\" height=\"164\" fill=\"#e6f0f4\"/><text x=\"445\" y=\"40\" fill=\"#214956\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">Negativ<\/text><circle cx=\"392\" cy=\"105\" r=\"20\" fill=\"#c66d4c\"/><text x=\"392\" y=\"112\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"429\" cy=\"105\" r=\"20\" fill=\"#c66d4c\"/><text x=\"429\" y=\"112\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"466\" cy=\"105\" r=\"20\" fill=\"#c66d4c\"/><text x=\"466\" y=\"112\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"503\" cy=\"105\" r=\"20\" fill=\"#c66d4c\"/><text x=\"503\" y=\"112\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"392\" cy=\"163\" r=\"20\" fill=\"#176f8b\"/><text x=\"392\" y=\"170\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><circle cx=\"429\" cy=\"163\" r=\"20\" fill=\"#176f8b\"/><text x=\"429\" y=\"170\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><circle cx=\"466\" cy=\"163\" r=\"20\" fill=\"#176f8b\"/><text x=\"466\" y=\"170\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><circle cx=\"503\" cy=\"163\" r=\"20\" fill=\"#176f8b\"/><text x=\"503\" y=\"170\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><circle cx=\"500\" cy=\"197\" r=\"20\" fill=\"#176f8b\"/><text x=\"500\" y=\"204\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><\/svg><figcaption class=\"figcap\">Antalet laddningar visas schematiskt. Nettoladdning beror på skillnaden mellan plus och minus.<\/figcaption><\/figure>"},{"title":"Vad händer i elektroskopet?","body":"<div class=\"question\">Elektroskopet tillförs elektroner. Rita hur visaren rör sig <b>innan<\/b> försöket.<\/div><h2>Före → under → efter<\/h2><ol><li>Förutsäg visarrörelsen.<\/li><li>Observera och markera laddningstecken på stång och visare.<\/li><li>Förklara utslaget med elektriska krafter.<\/li><\/ol><p class=\"note\">Verklig demonstration i klassrummet. Kan visaren ensam avslöja laddningens tecken?<\/p>","source":"2","steps":["<p>Stång och visare laddas med samma tecken och repellerar varandra.<\/p>","<p>Utslagets riktning/storlek räcker inte ensamt för att bestämma om den tillförda laddningen var positiv eller negativ.<\/p>"],"teacher":"Elektroskopet är en fysisk demonstration som inte ersätts med en animation.","side":"<figure class=\"graph static-graph\"><svg role=\"img\" aria-label=\"Elektroskop före laddning. Eleven ska själv rita ett förutsagt utslag.\" viewBox=\"0 0 535 305\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"268\" cy=\"153\" r=\"104\" fill=\"none\" stroke=\"#6f8a95\" stroke-width=\"3\"/><path d=\"M226 25H310 M268 25V184\" fill=\"none\" stroke=\"#183d4c\" stroke-width=\"4\"/><path d=\"M268 126 L268 184\" fill=\"none\" stroke=\"#a5b8bf\" stroke-width=\"2\"/><text x=\"267\" y=\"281\" fill=\"#214956\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">Före laddning: visaren hänger nedåt<\/text><\/svg><figcaption class=\"figcap\">Elektroskop före laddning. Eleven ska själv rita ett förutsagt utslag.<\/figcaption><\/figure>"},{"title":"Längre avstånd – hur ändras kraften?","body":"<p>Samma två punktladdningar placeras på avstånden <i>r<\/i>, <i>2r<\/i> och <i>3r<\/i>.<\/p><div class=\"question\">Om kraftens storlek vid <i>r<\/i> är <i>F<\/i>₀, hur stor är den vid <i>2r<\/i> och <i>3r<\/i>?<\/div><p>Skriv ett eget svar, jämför i par och motivera. Ändra sedan bara avståndet i modellen.<\/p>","source":"3","model":"coulomb","quiz":{"prompt":"Vid dubbla avståndet (samma laddningar) blir kraften…","options":["hälften","en fjärdedel","dubbelt","oförändrad"],"correct":1,"why":"Coulombs lag har r² i nämnaren: (2r)² = 4r².","hint":""},"teacher":"Visa inte resultat innan eleverna valt. Använd r och 2r före reglaget släpps fritt."},{"title":"Coulombs lag förklarar förändringen","body":"<p>Laddningarna och deras tecken avgör attraktion eller repulsion. Kraftens storlek är omvänt proportionell mot avståndet i kvadrat.<\/p><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>F<\/mi><mo>=<\/mo><mi>k<\/mi><mfrac><mrow><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><\/mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/math><\/div><p><b>k<\/b> = 8,99 · 10⁹ N·m²/C². <i>Q<\/i> anges i C och <i>r<\/i> i m. I den använda teckenkonventionen betyder positivt produktsvar repulsion och negativt attraktion; det är inte en x-komponent av en kraftvektor.<\/p>","source":"4","steps":["<p><i>r<\/i> → 2<i>r<\/i>: F₀ → F₀/4.<\/p>","<p><i>r<\/i> → 3<i>r<\/i>: F₀ → F₀/9. Om den ena laddningen fördubblas vid oförändrat avstånd blir kraftens storlek dubbelt så stor.<\/p>"],"teacher":"Peka ut skillnaden mellan ett attraktivt/repulsivt tecken och riktade vektorkomponenter. Eleverna ska rita två motriktade krafter."},{"title":"Förbered exemplen – föreslå första steget","body":"<div class=\"panel\"><h2>1 · Metallklotet<\/h2><p>Ett klot har laddningen +2,5 nC. Det ska bli neutralt.<\/p><div class=\"question\">Ska elektroner tillföras eller tas bort? Skriv laddningen i coulomb.<\/div><\/div><div class=\"panel\"><h2>2 · Proton och elektron<\/h2><p>Avståndet är 0,051 nm.<\/p><div class=\"question\">Skriv om till meter. Rita krafterna på partiklarna. Attraktion eller repulsion?<\/div><\/div>","source":"5","teacher":"Varje par förklarar ett steg. Kontrollera att de inte blandar ihop enheten nC med nm."},{"title":"Exempel 1 · Hur många elektroner?","body":"<p>Ett metallklot har laddningen +2,5 nC. Hur många elektroner måste tillföras för neutralitet?<\/p><p><b>Fysikalisk idé:<\/b> positiv laddning betyder elektronunderskott. Varje elektron bidrar med laddningen −e där e = 1,602 · 10⁻¹⁹ C.<\/p>","source":"6","steps":["<div class=\"mathrow\">Q = +2,5 · 10<sup>−9<\/sup> C<\/div>","<div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>Q<\/mi><mo>−<\/mo><mi>N<\/mi><mi>e<\/mi><mo>=<\/mo><mn>0<\/mn><mo>⇒<\/mo><mi>N<\/mi><mo>=<\/mo><mfrac><mi>Q<\/mi><mi>e<\/mi><\/mfrac><\/math><\/div>","<div class=\"mathrow\">N = (2,5 · 10<sup>−9<\/sup> C) / (1,602 · 10<sup>−19<\/sup> C) ≈ 1,6 · 10<sup>10<\/sup><\/div>","<p><b>Svar:<\/b> cirka 16 miljarder elektroner tillförs. Kontrollera: slutladdningen blir noll.<\/p>"],"teacher":"Låt eleverna föreslå varför elektroner tillförs innan formeln avslöjas."},{"title":"Exempel 2 · Kraften i väteatomen","body":"<p>En proton och en elektron befinner sig 0,051 nm från varandra. Beräkna kraftens storlek och ange om den är attraktiv eller repulsiv.<\/p><div class=\"question\">Peka ut båda kraftpilarna: de är lika stora och motriktade.<\/div><p>Vi använder den <b>klassiska punktladdningsmodellen<\/b> vid det angivna avståndet.<\/p>","source":"7","steps":["<div class=\"mathrow\">r = 0,051 · 10<sup>−9<\/sup> m = 5,1 · 10<sup>−11<\/sup> m<\/div>","<div class=\"mathrow\">Q₁ = +1,602 · 10<sup>−19<\/sup> C, &nbsp; Q₂ = −1,602 · 10<sup>−19<\/sup> C<\/div>","<div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>F<\/mi><mo>=<\/mo><mi>k<\/mi><mfrac><mrow><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><\/mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/math><\/div>","<div class=\"mathrow\">F ≈ −8,9 · 10<sup>−8<\/sup> N<\/div>","<p><b>Svar:<\/b> attraktion. Kraftens storlek är 8,9 · 10<sup>−8<\/sup> N på var och en av partiklarna.<\/p>"],"teacher":"Tydliggör att − i denna modell betecknar attraktion; kraftvektorerna har motsatta riktningar."},{"title":"Socrative → tillsammans → boken","body":"<div class=\"socrative\"><h2>Socrative · Fy1 · 901. Laddning<\/h2><p>Quiz-ID: <code>SOC-36980496<\/code><\/p><p>Rum: <b>LRJ<\/b><\/p><ol><li>Svara enskilt.<\/li><li>Jämför och förklara i par.<\/li><li>Gemensam återkoppling: motivera med fysik.<\/li><\/ol><\/div><div class=\"bookbox\"><strong>Bokens uppgifter: 801–811<\/strong><p>Arbeta med bokens uppgifter. Visa beräkningar, enheter och tolkning.<\/p><p>Jämför frågor som klassen har fastnat på innan självständigt arbete.<\/p><\/div>","source":"8","time":"Eget bokarbete","teacher":"Originalet har en befintlig Socrative (quiz-ID och rum från bilden). Inga nya frågebatterier antas."},{"title":"Visa vad du har förstått","body":"<div class=\"question\">1. Ett klot är positivt laddat. Vad betyder det för antalet elektroner jämfört med protoner?<\/div><div class=\"question\">2. Avståndet mellan två laddningar halveras. Hur förändras kraftens storlek? Visa varför.<\/div><div class=\"bookbox\"><strong>Bokens uppgifter: 801–811<\/strong><p>Läxa: gör klart till nästa lektion.<\/p><p><b>Lässtöd:<\/b> Inför elektriska kretsar: s. 270–280, särskilt de gröna rutorna.<\/p><\/div>","source":"9","steps":["<p>1. Ett positivt laddat klot har elektronunderskott.<\/p>","<p>2. Halvt avstånd betyder fyra gånger kraftens storlek eftersom kraften varierar med 1/r².<\/p>"],"teacher":"Låt eleverna svara utan facit och återkoppla till målen. Bokhänvisning hämtad från originalets sista sida."}]}</script><script src="../../gemensamt/models.js"></script><script src="../../gemensamt/app.js"></script></body></html>
