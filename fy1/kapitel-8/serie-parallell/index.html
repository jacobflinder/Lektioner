Fysik nivå 1","chapter":"8.3 · Serie- och parallellkoppling","source":"261116 8.3 Seriekoppling och parallellkoppling.pdf","goals":["Känna igen serie- och parallellkoppling samt placera mätinstrument korrekt.","Förklara ström och spänning i respektive koppling.","Beräkna ersättningsresistans och strömmar i kretsar med två resistorer."],"pages":[{"title":"En extra resistor – större eller mindre ström?","body":"\u003cdiv class=\"question\"\u003eVi har 12 V över en resistor på 100 Ω. En resistor på 200 Ω tillkommer. Hur ändras strömmen från batteriet?\u003c/div\u003e\u003cdiv class=\"predict-cards\"\u003e\u003cdiv\u003e\u003cb\u003eA · Serie\u003c/b\u003e\u003cspan\u003eÖkar, minskar eller oförändrad?\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cb\u003eB · Parallellt\u003c/b\u003e\u003cspan\u003eÖkar, minskar eller oförändrad?\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e\u003cstrong\u003eGör först en förutsägelse.\u003c/strong\u003e Rita de båda kopplingarna och förklara för en kamrat varför du tror att strömmen ändras.\u003c/p\u003e\u003cdiv class=\"goalcard\"\u003e\u003cb\u003eEfter lektionen ska du kunna\u003c/b\u003e\u003col\u003e\u003cli\u003eKänna igen serie- och parallellkoppling och koppla A/V rätt.\u003c/li\u003e\u003cli\u003eFörklara strömmar med laddningens bevarande och spänningar med gemensamma noder och energins bevarande.\u003c/li\u003e\u003cli\u003eBeräkna ersättningsresistans och strömmar.\u003c/li\u003e\u003c/ol\u003e\u003c/div\u003e","source":"1","quiz":{"prompt":"Jämfört med en ensam resistor på 100 Ω blir batteriets ström ...","options":["Mindre i serie, större i parallellt","Större i serie, mindre i parallellt","Oförändrad i båda fallen"],"correct":0,"why":"Seriekoppling ger större total resistans och mindre ström. En extra parallell strömväg ger mindre ersättningsresistans och större totalström."},"teacher":"Start 6 min: låt eleverna förutsäga båda kopplingarna, gärna enskilt → par. Den här nya webbfrågan är inte originalets Socrative. Förhandsavslöja inte svaret genom modellen.","side":"\u003cfigure class=\"circuit-figure\"\u003e\u003csvg role=\"img\" aria-label=\"Startkrets: idealt batteri 12 V och en resistor 100 Ω\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 335\"\u003e\u003ctitle\u003eStartkrets: idealt batteri 12 V och en resistor 100 Ω\u003c/title\u003e\u003cdesc\u003eRita först hur en extra resistor kan kopplas i serie respektive parallellt.\u003c/desc\u003e\u003cpath d=\"M88 156V77H497V267H88V156\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/\u003e\u003crect x=\"70\" y=\"140\" width=\"36\" height=\"90\" fill=\"white\"/\u003e\u003cpath data-battery-contact=\"vertical\" d=\"M88 140V177 M88 198V230\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cline x1=\"67\" y1=\"177\" x2=\"109\" y2=\"177\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/\u003e\u003cline x1=\"76\" y1=\"198\" x2=\"100\" y2=\"198\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/\u003e\u003ctext x=\"48\" y=\"150\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\"\u003e+\u003c/text\u003e\u003ctext x=\"48\" y=\"220\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"22\"\u003e−\u003c/text\u003e\u003crect x=\"262.5\" y=\"63\" width=\"75\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/\u003e\u003ctext x=\"300\" y=\"45\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\"\u003e100 Ω\u003c/text\u003e\u003ctext x=\"121\" y=\"296\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\"\u003e12 V\u003c/text\u003e\u003c/svg\u003e\u003cfigcaption\u003eRita först hur en extra resistor kan kopplas i serie respektive parallellt.\u003c/figcaption\u003e\u003c/figure\u003e","time":"Enskilt → par → klass"},{"title":"Samma batteri. Samma resistorer. Två kopplingar.","body":"\u003cp\u003eSamma ideala \u003cb\u003e12 V-batteri\u003c/b\u003e och två resistorer: \u003cb\u003e100 Ω\u003c/b\u003e respektive \u003cb\u003e200 Ω\u003c/b\u003e.\u003c/p\u003e\u003cdiv class=\"question\"\u003eFölj strömmens väg med pennan. Vilken koppling har förgreningar? Vad händer med batteriets ström när du byter koppling?\u003c/div\u003e\u003cp\u003eRita båda kretsschemana. Byt sedan med \u003cb\u003eSerie / Parallellt\u003c/b\u003e i modellen. \u003cb\u003eFörutsäg talvärdena innan du visar resultatet.\u003c/b\u003e\u003c/p\u003e\u003cp\u003eJämför med en ensam resistor på 100 Ω: då blir batteriströmmen \u003cb\u003e0,120 A\u003c/b\u003e.\u003c/p\u003e","source":"2","model":"series","teacher":"Här gör klassen ett omkopplingsförsök i webben efter att eleverna ritat. Modellen håller U, R₁, R₂ samordnade med krets, strömmar, spänningar och R_ers. Laborationen i PhET är separat; denna bild är ingen ersättning för den.","time":"Förutsäg → pröva → förklara"},{"title":"Serie: samma ström genom båda","body":"\u003cp\u003eTvå resistorer på \u003cb\u003e100 Ω\u003c/b\u003e och \u003cb\u003e200 Ω\u003c/b\u003e är kopplade i serie till \u003cb\u003e12 V\u003c/b\u003e.\u003c/p\u003e\u003cdiv class=\"question\"\u003eVilken ström går genom var och en? Vilken resistor har störst spänningsfall? Föreslå beräkningsordningen.\u003c/div\u003e\u003cp\u003eEn enda strömväg ger \u003cb\u003esamma ström genom båda\u003c/b\u003e. Spänningsfallen tillsammans blir batterispänningen.\u003c/p\u003e","source":"3","steps":["\u003cdiv class=\"worked\"\u003e\u003cb\u003e1 · Ersättningsresistans\u003c/b\u003e\u003cdiv class=\"series-math-stack\"\u003e\u003cdiv class=\"series-equation\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmtext\u003eers\u003c/mtext\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cm x=\"391\" y=\"382\" fill=\"#087f99\" text-anchor=\"middle\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"750\"\u003eI = 0,180 A\u003c/text\u003e\n\u003c/svg\u003e\u003cfigcaption\u003eEfter beräkningen: \u003cb\u003eRₑᵣₛ = 66,7 Ω\u003c/b\u003e ger samma \u003cb\u003eI = 0,180 A\u003c/b\u003e vid samma 12 V som de två parallella grenarna.\u003c/figcaption\u003e\u003c/figure\u003e\u003c/div\u003e","quiz":{"prompt":"Vilken ersättningsresistans är rimlig för 100 Ω och 200 Ω parallellt?","options":["66,7 Ω","150 Ω","300 Ω"],"correct":0,"why":"Parallellt blir ersättningsresistansen mindre än den minsta enskilda grenresistansen. Här Rₑᵣₛ ≈ 66,7 Ω."}},{"title":"Mät ström genom – spänning över","body":"\u003cp\u003e\u003cstrong\u003eRita själv först:\u003c/strong\u003e var ska du placera A och V för att mäta strömmen genom en resistor och spänningen över den?\u003c/p\u003e\u003cdiv class=\"question\"\u003eVad skulle kunna hända om amperemetern kopplas parallellt över resistorn?\u003c/div\u003e\u003cdiv class=\"meter-points\"\u003e\u003cp\u003e\u003cb\u003eAmperemeter:\u003c/b\u003e i serie så att strömmen går genom instrumentet. Låg inre resistans.\u003c/p\u003e\u003cp\u003e\u003cb\u003eVoltmeter:\u003c/b\u003e parallellt mellan komponentens båda anslutningar. Hög inre resistans.\u003c/p\u003e\u003c/div\u003e\u003cp class=\"safety-small\"\u003eKoppla inte en amperemeter direkt över en spänningskälla eller resistor i verkligheten: stor ström kan skada instrument eller krets.\u003c/p\u003e","source":"6","steps":["\u003cp\u003e\u003cb\u003eKontroll:\u003c/b\u003e amperemetern visar ström \u003cem\u003egenom\u003c/em\u003e; voltmetern visar spänning \u003cem\u003emellan\u003c/em\u003e två punkter.\u003c/p\u003e","\u003cp\u003e\u003cb\u003eFelsökning:\u003c/b\u003e att lägga en lågohmig amperemeter över resistorn ger en nästan kortslutande gren och kan orsaka hög ström.\u003c/p\u003e"],"teacher":"Cirka 4 min. Rita först utan mätare på tavlan och låt eleverna placera A och V själva. Visa sedan denna figur. Kopplingslabben i PhET behålls separat.","side":"\u003cdiv class=\"meter-predict\"\u003eRita först var A respektive V ska kopplas. Visa steg 1 för att jämföra med kretsschemat.\u003c/div\u003e\u003cfigure class=\"circuit-figure meter-reveal\"\u003e\u003csvg role=\"img\" aria-label=\"Krets med batteri på 6 volt, amperemeter i serie och voltmeter parallellt över R\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 335\"\u003e\u003ctitle\u003eKrets med batteri på 6 volt, amperemeter i serie och voltmeter parallellt över R\u003c/title\u003e\u003cdesc\u003eMätaren A ligger i huvudströmvägen. Voltmeter V har var sin anslutning på resistorns båda sidor.\u003c/desc\u003e\u003cpath d=\"M98 158V84H207 M263 84H345 M435 84H498V274H98V158 M345 84V171H363 M417 171H435V84\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/\u003e\u003crect x=\"80\" y=\"149\" width=\"36\" height=\"90\" fill=\"white\"/\u003e\u003cpath data-battery-contact=\"vertical\" d=\"M98 149V186 M98 207V239\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\"/\u003e\u003cline x1=\"77\" y1=\"186\" x2=\"119\" y2=\"186\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/\u003e\u003cline x1=\"86\" y1=\"207\" x2=\"110\" y2=\"207\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/\u003e\u003ctext x=\"58\" y=\"159\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\"\u003e+\u003c/text\u003e\u003ctext x=\"58\" y=\"229\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"22\"\u003e−\u003c/text\u003e\u003crect x=\"345.0\" y=\"70\" width=\"90\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/\u003e\u003ccircle cx=\"235\" cy=\"84\" r=\"28\" fill=\"white\" stroke=\"#0a8094\" stroke-width=\"3\"/\u003e\u003ccircle cx=\"390\" cy=\"171\" r=\"27\" fill=\"white\" stroke=\"#0a8094\" stroke-width=\"3\"/\u003e\u003ctext x=\"235\" y=\"92\" fill=\"#087d93\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"24\"\u003eA\u003c/text\u003e\u003ctext x=\"390\" y=\"180\" fill=\"#087d93\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"23\"\u003eV\u003c/text\u003e\u003ctext x=\"390\" y=\"46\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\"\u003eR\u003c/text\u003e\u003ctext x=\"116\" y=\"316\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\"\u003e6 V\u003c/text\u003e\u003ctext x=\"301\" y=\"312\" fill=\"#56727e\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"16\"\u003eA i strömvägen · V över resistorn\u003c/text\u003e\u003c/svg\u003e\u003cfigcaption\u003eMätaren A ligger i huvudströmvägen. Voltmeter V har var sin anslutning på resistorns båda sidor.\u003c/figcaption\u003e\u003c/figure\u003e","quiz":{"prompt":"Hur ska en ideal voltmeter kopplas för att mäta spänningen över R?","options":["Parallellt över R","I serie före R","Direkt över amperemetern"],"correct":0,"why":"En voltmeter har hög inre resistans och ansluts mellan de två punkter vars potentialskillnad ska mätas."}},{"title":"Batterier: samma ord, en annan fråga","body":"\u003cp\u003eTvå likadana \u003cb\u003e1,5 V-celler\u003c/b\u003e. Förutsäg batterispänningen när de kopplas i serie respektive parallellt med samma polaritet.\u003c/p\u003e\u003cdiv class=\"question\"\u003eNär får vi 3,0 V och när får vi 1,5 V? Två likadana parallellkopplade celler med \u003cb\u003esamma inre resistans och symmetriska anslutningar\u003c/b\u003e driver tillsammans 0,10 A: vilken ström ger varje cell?\u003c/div\u003e\u003cp class=\"note\"\u003e\u003cspan class=\"cell-answer\" data-hidden-answer=\"yes\"\u003eSymmetrisk modell med två likadana celler, samma inre resistans och likadana anslutningar: serie adderar spänning; parallellt ger oförändrad spänning men kan ge större tillgänglig kapacitet. Strömmen delas lika i detta symmetriska fall, inte enbart därför att cellernas polspänning är lika.\u003c/span\u003e Koppla inte i praktiken ihop olika celler utan lämpligt skydd.\u003c/p\u003e","source":"7","steps":["\u003cdiv class=\"worked\"\u003e\u003cb\u003e1 · Likriktad seriekoppling\u003c/b\u003e\u003cdiv class=\"series-math-stack\"\u003e\u003cdiv class=\"series-equation\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003cmsub\u003e\u003cmi\u003eU\u003c/mi\u003e\u003cmtext\u003eserie\u003c/mtext\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmn\u003e1,5\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eV\u003c/mtext\u003e\u003c/mrow\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmrow\u003e\u003cmn\u003e1,5\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eV\u003c/mtext\u003e\u003c/mrow\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmn\u003e3,0\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eV\u003c/mtext\u003e\u003c/mrow\u003e\u003c/math\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","\u003cdiv class=\"worked\"\u003e\u003cb\u003e2 · Parallellkoppling: lika polspänning\u003c/b\u003e\u003cdiv class=\"series-math-stack\"\u003e\u003cdiv class=\"series-equation\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003cmsub\u003e\u003cmi\u003eU\u003c/mi\u003e\u003cmtext\u003eparallell\u003c/mtext\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmn\u003e1,5\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eV\u003c/mtext\u003e\u003c/mrow\u003e\u003c/math\u003e\u003c/div\u003e\u003cdiv class=\"series-equation\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmtext\u003ecell\u003c/mtext\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmn\u003e0,10\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eA\u003c/mtext\u003e\u003c/mrow\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmn\u003e0,050\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eA\u003c/mtext\u003e\u003c/mrow\u003e\u003c/math\u003e\u003c/div\u003e\u003cp\u003eStrömdelningen 0,050 A per cell gäller när även inre resistanser och anslutningar är symmetriska. Enbart ideal spänningskälla med 1,5 V bestämmer inte varje individuell källström.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e"],"teacher":"Cirka 3 min. Markera de viktiga antagandena lika ems, lika inre resistans och symmetriska anslutningar; en helt ideal parallellduo ger inte bestämd strömfördelning. Låt eleverna först rita polaritet och bara därefter avslöja 3,0/1,5 V. Webbfrågan är ett nytt övningsinslag, inte Socrative.","side":"\u003cfigure class=\"circuit-figure\"\u003e\u003csvg role=\"img\" aria-label=\"Två identiska 1,5-voltsceller kopplade i serie och parallellt\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 275\"\u003e\u003ctitle\u003eTvå identiska 1,5-voltsceller kopplade i serie och parallellt\u003c/title\u003e\u003cdesc\u003eTvå identiska celler, 1,5 V vardera. Förutsäg innan värdena visas stegvis.\u003c/desc\u003e\u003cpath d=\"M50 113V55H260V174H50V113\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/\u003e\u003crect x=\"121.5\" y=\"160\" width=\"65\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/\u003e\u003ctext x=\"153\" y=\"202\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"16\"\u003eR\u003c/text\u003e\u003crect x=\"91\" y=\"44\" width=\"42\" height=\"21\" fill=\"white\"/\u003e\u003cpath data-battery-contact=\"horizontal\" d=\"M91 55H105 M116 55H133\" strok "round\"/\u003e\u003cline x1=\"441\" y1=\"103\" x2=\"441\" y2=\"117\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/\u003e\u003ctext x=\"153\" y=\"24\" fill=\"#087c93\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\"\u003eSERIE · samma riktning\u003c/text\u003e\u003ctext x=\"446\" y=\"24\" fill=\"#087c93\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\"\u003ePARALLELLT · lika poler ihop\u003c/text\u003e\u003ctext x=\"153\" y=\"248\" fill=\"#b56b45\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"24\"\u003e? V\u003c/text\u003e\u003ctext x=\"446\" y=\"248\" fill=\"#b56b45\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"24\"\u003e? V\u003c/text\u003e\u003c/svg\u003e\u003cfigcaption\u003eTvå identiska celler, 1,5 V vardera. Förutsäg innan värdena visas stegvis.\u003c/figcaption\u003e\u003c/figure\u003e","quiz":{"prompt":"Två likadana 1,5 V-celler parallellt (lika poler ihop) ger idealiskt ...","options":["1,5 V","3,0 V","0 V"],"correct":0,"why":"Parallellkopplade identiska celler har samma polspänning som en cell; de kan tillsammans leverera större kapacitet."}},{"title":"Socrative: pröva din förklaring","body":"\u003cdiv class=\"socrative\"\u003e\u003cp\u003e\u003cb\u003eOriginalets Socrative\u003c/b\u003e · Fy1 … 903. Kopplingar\u003c/p\u003e\u003ccode\u003eSOC-37285032\u003c/code\u003e\u003cp\u003e1. Svara först enskilt och motivera en osäker fråga.\u003cbr\u003e2. Jämför med en kamrat: följ strömmens vägar och jämför potentialskillnaderna.\u003cbr\u003e3. Ompröva svaret. Förklara varför.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"question\"\u003eVilket resonemang i klassen behöver vi reda ut tillsammans? Målet är att förstå – inte bara få rätt alternativ.\u003c/div\u003e","source":"8","time":"Enskilt → par → klass","teacher":"Befintlig Socrative Fy1 903, quiz-ID SOC-37285032 från originalet. Använd endast originalets aktiviteter; den får inte ersättas med nyskapad fråga. Föreslagen tidsram 6 min, anpassas till behovet."},{"title":"Nu använder du sambanden själv","body":"\u003cdiv class=\"book-main\"\u003e\u003ch2\u003eBoken · s. 281–293\u003c/h2\u003e\u003cp class=\"big-assignment\"\u003eUppgifter / läxa \u003cstrong\u003e829–838\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cb\u003eBörja med 834 och 835 (s. 293)\u003c/b\u003e – jämför samma resistorer i två olika kopplingar.\u003c/p\u003e\u003cdetails class='v23-summary' style='margin:13px 0 4px;padding:12px 14px;border:1px solid #bfd8df;border-radius:12px;background:#f4f9fb'\u003e\u003csummary style='cursor:pointer;font-weight:750;color:#13566c'\u003eVisa lektionens samband · försök minnas först\u003c/summary\u003e\u003cdiv style='margin-top:9px'\u003e\u003cp style='margin:8px 0;line-height:1.5'\u003e\u003cstrong\u003eOhms lag:\u003c/strong\u003e \u003cmath xmlns='http://www.w3.org/1998/Math/MathML' display='inline'\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmi\u003eU\u003c/mi\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003c/math\u003e \u003cspan\u003eU är potentialskillnaden över resistorn.\u003c/span\u003e\u003c/p\u003e\u003cp style='margin:8px 0;line-height:1.5'\u003e\u003cstrong\u003eSeriekoppling:\u003c/strong\u003e \u003cmath xmlns='http://www.w3.org/1998/Math/MathML' display='inline'\u003e\u003cmi\u003eU\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eU\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eU\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003c/math\u003e \u003cspan\u003eSamma ström genom alla seriekopplade resistorer. Ersättningsresistansen är summan av delresistanserna.\u003c/span\u003e\u003c/p\u003e\u003cp style='margin:8px 0;line-height:1.5'\u003e\u003cstrong\u003eParallellkoppling:\u003c/strong\u003e \u003cmath xmlns='http://www.w3.org/1998/Math/MathML' display='inline'\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003c/math\u003e \u003cspan\u003eSamma spänning mellan alla parallellgrenars gemensamma noder. Ersättningsresistansen är mindre än den minsta positiva grenresistansen.\u003c/span\u003e\u003c/p\u003e\u003cp style='margin:8px 0;line-height:1.5'\u003e\u003cstrong\u003eErsättningsresistans parallellt:\u003c/strong\u003e \u003cmath xmlns='http://www.w3.org/1998/Math/MathML' display='inline'\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmi\u003eR\u003c/mi\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003c/math\u003e \u003cspan\u003eFör två ohmska resistorer parallellt.\u003c/span\u003e\u003c/p\u003e\u003c/div\u003e\u003c/details\u003e\u003c/div\u003e\u003cdiv class=\"book-other\"\u003e\u003cp\u003e\u003cb\u003eFortsätt:\u003c/b\u003e 833 (mätinstrument) och 829 (batterier).\u003c/p\u003e\u003cp\u003e\u003cb\u003eDärefter:\u003c/b\u003e 830–832 (lampor) och 836–838 (blandade kretsar).\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"question\"\u003eFör varje uppgift: rita och markera → välj samband → redovisa mellanled och enheter → rimlighetskontroll.\u003c/div\u003e\u003cp\u003e\u003cb\u003eArbeta själv först.\u003c/b\u003e Jämför sedan resonemang med gruppen. Behöver du stöd för blandade kretsar finns sidan 11.\u003c/p\u003e\u003cp\u003eAlla uppgifter ska inte hinnas under lektionen. Skriv ner vilka du fortsätter med efteråt.\u003c/p\u003e","source":"9","time":"Eget bokarbete · planera 20–25 min","teacher":"Bokarbetet är en obligatorisk arbetsfas, ingen restpost. Prioritera 834/835 med motivering och återkoppling; därefter 833 och 829. Avgränsa läxan utifrån elevernas faktiska arbete, inte automatiskt alla uppgifter."},{"title":"Visa vad du kan – på egen hand","body":"\u003cp\u003eSista fem minuterna: \u003cstrong\u003esvara enskilt utan bok\u003c/strong\u003e. Skriv kort, men motivera.\u003c/p\u003e\u003cdiv class=\"exit-items\"\u003e\u003csection\u003e\u003cb\u003e1 · Serie eller parallellt?\u003c/b\u003e\u003cp\u003eTvå resistorer sitter i serie. Vad är samma, I eller U? Vad gäller om de kopplas parallellt?\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003cb\u003e2 · Beräkning\u003c/b\u003e\u003cp\u003e6,0 V över två parallella resistorer på 300 Ω vardera. Beräkna totalström och ersättningsresistans.\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003cb\u003e3 · Mätning\u003c/b\u003e\u003cp\u003eRita A och V för att mäta ström genom och spänning över en resistor.\u003c/p\u003e\u003c/section\u003e\u003c/div\u003e\u003cdiv class=\"selfcheck\"\u003eMarkera vilket av dagens lektionsmål du behöver träna mer på.\u003c/div\u003e\u003cp\u003e\u003cb\u003eInför nästa lektion:\u003c/b\u003e Effekt, s. 294–299. Läs \u003cb\u003ede gröna rutorna\u003c/b\u003e noggrant och försök förklara sambanden.\u003c/p\u003e","source":"10","steps":["\u003cp\u003e\u003cb\u003e1 · Begrepp:\u003c/b\u003e I är lika genom serieresistorer; U är lika över parallellgrenar. Eleven motiverar med en enda strömväg respektive samma två anslutningspunkter.\u003c/p\u003e","\u003cdiv class=\"worked\"\u003e\u003cb\u003e2 · Två parallella 300 Ω-resistorer\u003c/b\u003e\u003cdiv class=\"series-math-stack\"\u003e\u003cdiv class=\"series-equation\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmi\u003eU\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmn\u003e6,0\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eV\u003c/mtext\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmn\u003e300\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eΩ\u003c/mtext\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmn\u003e0,020\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eA\u003c/mtext\u003e\u003c/mrow\u003e\u003c/math\u003e\u003c/div\u003e\u003cdiv class=\"series-equation\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmi\u003eU\u003c/mi\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmn\u003e6,0\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eV\u003c/mtext\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmn\u003e300\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eΩ\u003c/mtext\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmn\u003e0,020\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eA\u003c/mtext\u003e\u003c/mrow\u003e\u003c/math\u003e\u003c/div\u003e\u003cdiv class=\"series-equation\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmn\u003e1\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e+\u003c/mo\u003e\u003cmsub\u003e\u003cmi\u003eI\u003c/mi\u003e\u003cmn\u003e2\u003c/mn\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmn\u003e0,040\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eA\u003c/mtext\u003e\u003c/mrow\u003e\u003c/math\u003e\u003c/div\u003e\u003cdiv class=\"series-equation\"\u003e\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"\u003e\u003cmsub\u003e\u003cmi\u003eR\u003c/mi\u003e\u003cmtext\u003eers\u003c/mtext\u003e\u003c/msub\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmi\u003eU\u003c/mi\u003e\u003cmi\u003eI\u003c/mi\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmfrac\u003e\u003cmrow\u003e\u003cmn\u003e6,0\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eV\u003c/mtext\u003e\u003c/mrow\u003e\u003cmrow\u003e\u003cmn\u003e0,040\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eA\u003c/mtext\u003e\u003c/mrow\u003e\u003c/mfrac\u003e\u003cmo\u003e=\u003c/mo\u003e\u003cmrow\u003e\u003cmn\u003e150\u003c/mn\u003e\u003cmspace width=\"0.2em\"/\u003e\u003cmtext\u003eΩ\u003c/mtext\u003e\u003c/mrow\u003e\u003c/math\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","\u003cp\u003e\u003cb\u003e3 · Mätning:\u003c/b\u003e koppla A i serie så att strömmen går genom instrumentet; koppla V parallellt mellan resistorns båda anslutningar.\u003c/p\u003e"],"teacher":"Avsätt fem minuter för individuell exit. Repetitionsläge kan visa facit stegvis. Nästa gång 8.4 Effekt, s. 294–299 och gröna rutorna."},{"title":"Stöd: förenkla en del i taget","body":"\u003cp\u003e\u003cstrong\u003eFrivilligt stöd vid eget bokarbete.\u003c/strong\u003e En resistor på 60 Ω ligger i serie med
