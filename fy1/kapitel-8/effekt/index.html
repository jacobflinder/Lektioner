<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Elektrisk effekt · Fysik nivå 1</title><link rel="stylesheet" href="../../_gemensamt/lektion.css"></head><body><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Elektrisk effekt</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Elektrisk effekt","subject":"Fysik nivå 1","chapter":"8.4 · Elektrisk effekt","source":"Fy1_Effekt.pdf","goals":["Förklara skillnaden mellan effekt och energi.","Beräkna effekt, energi och ström i en resistor.","Förklara uppvärmning och batteriets inre resistans."],"pages":[{"title":"Vad betyder 500 watt?","body":"<div class=\"question\">En doppvärmare är märkt <b>500 W<\/b>. Vad betyder det egentligen?<\/div><p>Syfte: förstå uppvärmning och bedöma elektrisk belastning.<\/p><div class=\"goals\"><article><b>1<\/b> Effekt eller energi?<\/article><article><b>2<\/b> Beräkna P, E och I.<\/article><article><b>3<\/b> Batteriets inre resistans.<\/article><\/div><p>Vi arbetar: demonstration → modell → beräkningar → Socrative → bok.<\/p>","source":"1","teacher":"Reell demonstration av doppvärmare på 500 W – märkningen får inte ersättas med tidigare uppskattningar."},{"title":"Doppvärmaren · tänk före","body":"<p>Läraren visar en verklig doppvärmare märkt 500 W.<\/p><div class=\"question\">Hur mycket energi omvandlar den under 10 s?<\/div><div class=\"question\">Under samma tid: 500 W respektive 1 000 W. Vilken omvandlar mest energi och hur mycket mer?<\/div><p>Tänk själv 30 s → par 30 s → observera demonstrationen.<\/p><p class=\"note\">Skilj observation (värmaren verkar) från modell (energi per tidsenhet).<\/p>","source":"2","teacher":"Säker hantering av verklig doppvärmare; inget digitalt element ersätter observationen."},{"title":"Effekt är energi per sekund","body":"<p>Justera tid och effekt. Förutsäg först, visa sedan energiresultaten. Staplarna har samma skala och visar inte temperatur.<\/p>","source":"3–4","model":"power","steps":["<div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>P<\/mi><mo>=<\/mo><mfrac><mi>E<\/mi><mi>t<\/mi><\/mfrac><mo>⇒<\/mo><mi>E<\/mi><mo>=<\/mo><mi>P<\/mi><mi>t<\/mi><\/math><\/div>","<div class=\"mathrow\">500 W · 10 s = 5 000 J<\/div>","<div class=\"mathrow\">1 000 W · 10 s = 10 000 J<\/div>","<p>Dubbel effekt ger dubbel energi under samma tid. Effekt är takten; energi är den omvandlade mängden.<\/p>"],"teacher":"Animationen från originalets PDF ersätts här med en styrbar modell; inte med en dekorativ GIF."},{"title":"Från laddning till effekt","body":"<p>Utgå från tidigare samband för energi, laddning och ström. Motivera ett mellanled i taget.<\/p>","source":"5","steps":["<div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>E<\/mi><mo>=<\/mo><mi>U<\/mi><mi>Q<\/mi><mspace width=\"1em\"/><mi>I<\/mi><mo>=<\/mo><mfrac><mi>Q<\/mi><mi>t<\/mi><\/mfrac><\/math><\/div>","<div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>P<\/mi><mo>=<\/mo><mfrac><mi>E<\/mi><mi>t<\/mi><\/mfrac><mo>=<\/mo><mfrac><mrow><mi>U<\/mi><mi>Q<\/mi><\/mrow><mi>t<\/mi><\/mfrac><mo>=<\/mo><mi>U<\/mi><mi>I<\/mi><\/math><\/div>","<div class=\"mathrow\">Ohms lag: U = RI; alltså P = UI = RI² = U²/R.<\/div>","<p>Välj uttryck utifrån vilka storheter som är kända. Spänningen <i>över<\/i> och strömmen <i>genom<\/i> samma resistor avses.<\/p>"],"teacher":"Låt eleverna föreslå nästa matematiska steg innan ett färdigt uttryck visas."},{"title":"Stor ström ger stor värmeeffekt","body":"<div class=\"question\">Strömmen fördubblas vid konstant R. Hur förändras effekten?<\/div><p>Exempel: 500 W vid 230 V. Bestäm strömmen.<\/p><div class=\"question\">Din tur: apparater på 1 500 W och 1 200 W används på samma 230 V-grupp. Är 10 A tillräckligt?<\/div>","source":"6","steps":["<div class=\"mathrow\">Pₙʸ = R(2I)² = 4RI² = 4P<\/div>","<div class=\"mathrow\">I = P/U = 500 W / 230 V ≈ 2,17 A<\/div>","<p>För totalströmmen behöver du först bestämma sammanlagd effekt. Jämför med märkströmmen.<\/p>"],"teacher":"Förutsätt att båda apparaterna är parallellt anslutna till samma ideala spänning och ungefär har angiven effekt."},{"title":"Ryms båda apparaterna inom 10 A?","body":"<p>Jämför ditt svar med modellen och diskutera vad en säkring skyddar.<\/p>","source":"7","steps":["<div class=\"mathrow\">Pₜₒₜ = (1 500 + 1 200) W = 2 700 W<\/div>","<div class=\"mathrow\">Iₜₒₜ = Pₜₒₜ/U = 2 700/230 ≈ 11,7 A<\/div>","<p>11,7 A överstiger 10 A. Minska den samtidiga belastningen. Säkringen skyddar ledningar mot överström och uppvärmning.<\/p>"],"teacher":"Förklara skillnaden mellan märkström och den verkliga utlösningskarakteristiken hos en säkring."},{"title":"Även batteriet har resistans","body":"<p>Ett verkligt batteri modelleras som en ideal källa med ems ℰ och en inre resistans <i>r<\/i>, i serie med den yttre resistansen R.<\/p><div class=\"mathrow\">ℰ = U + rI<\/div><p>U är polspänningen mellan batteriets poler.<\/p><div class=\"question\">Vad händer med polspänningen när strömmen ökar, om ems och r är konstanta?<\/div>","source":"8","teacher":"Ha gärna en verklig batterimätning som kontrast till modellen. Använd tydliga index r/R i figur och formler."},{"title":"Vad händer när belastningen ökar?","body":"<p>Prova olika yttre resistansvärden. När R minskar blir strömmen större. Vad händer då med spänningsfallet <i>rI<\/i>?<\/p>","source":"9–10","model":"internal","steps":["<div class=\"mathrow\">ℰ = 6,0 V och r = 1,0 Ω<\/div>","<div class=\"mathrow\">R = 5,0 Ω ⇒ I = 1,0 A, inre fall = 1,0 V, U = 5,0 V<\/div>","<div class=\"mathrow\">R = 2,0 Ω ⇒ I = 2,0 A, inre fall = 2,0 V, U = 4,0 V<\/div>","<p>Det som minskar är polspänningen; ems är oförändrad i denna idealiserade modell.<\/p>"],"teacher":"Visa att färgsegmentens längder motsvarar volt, inte energi eller temperatur."},{"title":"Hur bestämmer vi strömmen?","body":"<p>Givet: ℰ = 6,0 V, inre resistans r = 1,0 Ω och yttre R = 5,0 Ω. Sök I och U.<\/p><div class=\"question\">Föreslå ett samband från energibalans/spänningsfall och lös därefter I.<\/div>","source":"11","steps":["<div class=\"mathrow\">ℰ = U + rI, &nbsp; U = RI<\/div>","<div class=\"mathrow\">ℰ = RI + rI = (R + r)I<\/div>","<div class=\"mathrow\">I = ℰ/(R + r) = 6,0/(5,0 + 1,0) = 1,0 A<\/div>","<div class=\"mathrow\">U = RI = 5,0 Ω · 1,0 A = 5,0 V<\/div>","<p>Din tur: ändra R till 3,0 Ω. Bestäm I och U.<\/p>"],"teacher":"Låt eleverna identifiera vilken storhet som kan elimineras med substitution."},{"title":"Återkoppling → Socrative","body":"<p>För R = 3,0 Ω, ℰ = 6,0 V och r = 1,0 Ω:<\/p>","source":"12","steps":["<div class=\"mathrow\">I = 6,0/(3,0 + 1,0) = 1,5 A<\/div>","<div class=\"mathrow\">U = 3,0 · 1,5 = 4,5 V<\/div>","<p>Kontroll: 6,0 − 1,0·1,5 = 4,5 V. Större ström ger större inre spänningsfall och lägre polspänning.<\/p>","<div class=\"socrative\"><h2>Socrative · Effekt i resistor<\/h2><p>Quiz-ID: <code>SOC-37285324<\/code><\/p><ol><li>Svara enskilt.<\/li><li>Jämför och förklara i par.<\/li><li>Gemensam återkoppling: motivera med fysik.<\/li><\/ol><\/div>"],"teacher":"Befintlig Socrative efter genomgång och beräkning, före bokuppgifter."},{"title":"Träna · visa vad du kan","body":"<div class=\"bookbox\"><strong>Bokens uppgifter: 839–850<\/strong><p>s. 298–299, hela avsnittet 8.4.<\/p><p><b>Lässtöd:<\/b> s. 294–297 och gröna rutorna.<\/p><p>Läxa: gör klart bokens uppgifter 839–850.<\/p><\/div><div class=\"question\">Exit 1: 12 V över en resistor, I = 0,50 A. Bestäm P och E på 20 s.<\/div><div class=\"question\">Exit 2: Varför ökar effekten vid större I och konstant R?<\/div><div class=\"question\">Exit 3: Varför blir polspänningen U lägre när I ökar?<\/div>","source":"13","time":"Bokarbete + exit","steps":["<p>P = UI = 6,0 W; E = Pt = 120 J.<\/p>","<p>P = RI², så för konstant R ökar P med kvadraten på I.<\/p>","<p>U = ℰ − rI, alltså större inre spänningsfall vid större ström.<\/p>"],"teacher":"Skydda tid till uppgifter. Gör sista frågorna muntligt om arbetsfasen kräver mer tid."}]}</script><script src="../../_gemensamt/models.js"></script><script src="../../_gemensamt/app.js"></script></body></html>
