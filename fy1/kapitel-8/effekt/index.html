<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Elektrisk effekt · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"><link rel="stylesheet" href="effekt.css?v=rev84b"><link rel="stylesheet" href="../../gemensamt/sjalvtest.css?v=papper1"><link rel="stylesheet" href="../../gemensamt/matematik-typografi.css?v=2"></head><body data-fy1-lesson="effekt"><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Elektrisk effekt</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Elektrisk effekt","subject":"Fysik nivå 1","chapter":"8.4 · Elektrisk effekt","source":"Fy1_Effekt.pdf","goals":["Förklara skillnaden mellan effekt och energi.","Beräkna effekt, energi och ström i en resistor.","Förklara uppvärmning och batteriets inre resistans."],"pages":[{"title":"Vad betyder 500 watt?","body":"\u003cdiv class=\"question\">En doppvärmare är märkt \u003cstrong>500 W\u003c/strong>. Vad betyder siffran? Är det en energimängd eller en hastighet för energiomvandling?\u003c/div>\u003cdiv class=\"goallocal\">\u003cb>Efter lektionen ska du kunna\u003c/b>\u003col>\u003cli>Förklara skillnaden mellan \u003cb>effekt\u003c/b> och \u003cb>energi\u003c/b>.\u003c/li>\u003cli>Beräkna \u003ci>P\u003c/i>, \u003ci>E\u003c/i> och \u003ci>I\u003c/i> i en resistor.\u003c/li>\u003cli>Förklara uppvärmning och batteriets \u003cb>inre resistans\u003c/b>.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"lesson-route\">Verklig demonstration → undersökning → samband → beräkningar → Socrative → bokarbete.\u003c/p>","source":"1","side":"\u003cfigure class=\"effect-figure\">\u003csvg viewBox=\"0 0 550 348\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Principbild av doppvärmare i vattenkärl, märkt 500 watt\">\u003crect x=\"153\" y=\"100\" width=\"246\" height=\"160\" rx=\"14\" fill=\"#edf7fb\" stroke=\"#8bbac9\" stroke-width=\"3\"/>\u003cpath d=\"M160 160 Q202 148 244 160 T327 160 T396 160\" fill=\"none\" stroke=\"#63b1cb\" stroke-width=\"3\"/>\u003cpath d=\"M238 70 V206 h77 V70\" fill=\"none\" stroke=\"#bd6d3e\" stroke-width=\"10\" stroke-linecap=\"round\" />\u003cpath d=\"M238 70 V31 H356\" fill=\"none\" stroke=\"#355c69\" stroke-width=\"5\" stroke-linecap=\"round\"/>\u003ccircle cx=\"355\" cy=\"31\" r=\"8\" fill=\"#355c69\" />\u003ctext x=\"280\" y=\"288\" text-anchor=\"middle\" fill=\"#1c6b83\" font-size=\"21\" font-family=\"system-ui\" font-weight=\"650\">Doppvärmare · 500 W\u003c/text>\u003ctext x=\"282\" y=\"324\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"15\" font-family=\"system-ui\" font-weight=\"650\">Verklig demonstration i klassrummet\u003c/text>\u003c/svg>\u003cfigcaption>Bilden är en principillustration. Observera den verkliga doppvärmaren innan modellen visas.\u003c/figcaption>\u003c/figure>","teacher":"Låt eleverna skriva ett eget svar före begreppen. Själva doppvärmaren demonstreras på nästa bild.","time":"Startfråga","label":"Start och mål"},{"title":"Doppvärmaren · tänk före","body":"\u003cdiv class=\"question\">Vad betyder märkningen 500 W? Hur mycket energi överförs under 10 s?\u003c/div>\u003cp>\u003cstrong>Förutsäg:\u003c/strong> En apparat på 500 W och en på 1 000 W körs lika länge. Vem omvandlar mest energi? \u003ci>Hur mycket mer\u003c/i> under 10 s?\u003c/p>\u003cp>\u003cb>Enskilt 30 s → par 30 s → observera.\u003c/b> Skilj mellan det ni \u003cem>ser\u003c/em> och det ni \u003cem>förklarar\u003c/em> med en energimodell.\u003c/p>\u003cdiv class=\"safety-small\">Läraren sköter den verkliga demonstrationen och säkerheten. Eleverna ska inte själva koppla utrustning till nätspänning.\u003c/div>","source":"2","side":"\u003cfigure class=\"effect-figure\">\u003csvg viewBox=\"0 0 550 348\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Principbild av doppvärmare i vattenkärl, märkt 500 watt\">\u003crect x=\"153\" y=\"100\" width=\"246\" height=\"160\" rx=\"14\" fill=\"#edf7fb\" stroke=\"#8bbac9\" stroke-width=\"3\"/>\u003cpath d=\"M160 160 Q202 148 244 160 T327 160 T396 160\" fill=\"none\" stroke=\"#63b1cb\" stroke-width=\"3\"/>\u003cpath d=\"M238 70 V206 h77 V70\" fill=\"none\" stroke=\"#bd6d3e\" stroke-width=\"10\" stroke-linecap=\"round\" />\u003cpath d=\"M238 70 V31 H356\" fill=\"none\" stroke=\"#355c69\" stroke-width=\"5\" stroke-linecap=\"round\"/>\u003ccircle cx=\"355\" cy=\"31\" r=\"8\" fill=\"#355c69\" />\u003ctext x=\"280\" y=\"288\" text-anchor=\"middle\" fill=\"#1c6b83\" font-size=\"21\" font-family=\"system-ui\" font-weight=\"650\">Doppvärmare · 500 W\u003c/text>\u003ctext x=\"282\" y=\"324\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"15\" font-family=\"system-ui\" font-weight=\"650\">Verklig demonstration i klassrummet\u003c/text>\u003c/svg>\u003cfigcaption>Bilden är en principillustration. Observera den verkliga doppvärmaren innan modellen visas.\u003c/figcaption>\u003c/figure>","teacher":"Bevara originalets verkliga demonstration av 500 W-doppvärmaren. Ha vatten och lämplig säker utrustning. Fråga vad 500 W betyder före försöket.","time":"Demo och förutsägelse"},{"title":"Effekt är energi per sekund","body":"\u003cp>Först: bestäm energin efter 10 s för \u003cb>500 W\u003c/b> och \u003cb>1 000 W\u003c/b>. Skriv två svar innan du visar dem.\u003c/p>\u003cdiv class=\"question\">Vad händer med omvandlad energi om tiden fördubblas medan effekten är konstant?\u003c/div>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>E\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>P\u003c/mi>\u003cmi>t\u003c/mi>\u003c/math>\u003c/div>\u003c/div>\u003cp>Ändra \u003cb>tid\u003c/b> och \u003cb>effekt\u003c/b> efter din förutsägelse. Visa resultat och pröva ett nytt värde.\u003c/p>","source":"3–4","steps":["\u003cdiv class=\"worked\">\u003cb>Gemensam beräkning\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmi>t\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>500\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>J/s\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>10\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>s\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>5 000\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>J\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>Jämför\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmi>t\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>1 000\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>J/s\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>10\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>s\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>10 000\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>J\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cp>\u003cb>Tolkning:\u003c/b> Dubbla effekten under samma tid ger dubbla energin. Staplarna visar energi, inte temperatur.\u003c/p>"],"model":"effektpower","teacher":"Originalets animationsförlopp 500 W respektive 1 000 W över 10 s är nu styrbart. Både blankt förutsägelseläge och en exakt skala 0–45 kJ.","time":"Modell · förutsäg först"},{"title":"Från laddning till effekt","body":"\u003cp>Utgå från redan kända samband: \u003cb>E = UQ\u003c/b> och \u003cb>I = Q/t\u003c/b>. Vilket matematiskt steg visar att P = UI?\u003c/p>\u003cdiv class=\"question\">Varför måste \u003ci>U\u003c/i> och \u003ci>I\u003c/i> höra till samma komponent när vi beräknar dess effekt?\u003c/div>\u003cp>Ohms lag: \u003cb>U = RI\u003c/b>. Välj det uttryck som passar de två storheter du vet.\u003c/p>","source":"5","side":"\u003cfigure class=\"effect-figure\">\u003csvg viewBox=\"0 0 550 294\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Batterikrets med resistor och markerad spänning över samt ström genom resistorn\">\u003cpath d=\"M65 129V55H485V224H65V161\" fill=\"none\" stroke=\"#355969\" stroke-width=\"3.2\"/>\u003cpath d=\"M44 129h42 M53 161h24\" stroke=\"#bd6a46\" stroke-width=\"4\" />\u003ctext x=\"31\" y=\"123\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">+\u003c/text>\u003ctext x=\"31\" y=\"175\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">−\u003c/text>\u003crect x=\"236\" y=\"42\" width=\"88\" height=\"26\" fill=\"#fff\" stroke=\"#18778c\" stroke-width=\"3\" rx=\"2\" />\u003ctext x=\"280.0\" y=\"32\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">Resistor R\u003c/text>\u003cpath d=\"M199 15 H357\" stroke=\"#b9693d\" stroke-width=\"3\" fill=\"none\"/>\u003ctext x=\"278\" y=\"12\" text-anchor=\"middle\" fill=\"#b9693d\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">U över R\u003c/text>\u003cpath d=\"M343 54l42 0m-12-9 12 9-12 9\" fill=\"none\" stroke=\"#23816c\" stroke-width=\"3\"/>\u003ctext x=\"412\" y=\"48\" text-anchor=\"middle\" fill=\"#237e6a\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">I genom R\u003c/text>\u003ctext x=\"274\" y=\"270\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"19\" font-family=\"system-ui\" font-weight=\"650\">Samma komponent i P = UI\u003c/text>\u003c/svg>\u003cfigcaption>Spänningen U mäts över den resistor som genomflyts av strömmen I.\u003c/figcaption>\u003c/figure>","steps":["\u003cdiv class=\"worked\">\u003cb>1 · Definition\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>E\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>2 · Sätt in E = UQ\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>U\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>U\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>U\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>3 · Med Ohms lag U = RI\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>U\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003cmi>I\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003cmsup>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>4 · Med I = U/R\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>R\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>U\u003c/mi>\u003cmfrac>\u003cmrow>\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>R\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsup>\u003cmi>U\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmi>R\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cp>\u003cb>Enhetskontroll:\u003c/b> samma effekt kan anges som energi per sekund eller elektrisk effekt.\u003c/p>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmn>1\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>W\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>J/s\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmn>1\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>W\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmn>1\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V·A\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>"],"quiz":{"prompt":"Strömmen genom en resistor fördubblas medan R är konstant. Hur ändras effekten?","options":["Den fördubblas","Den fyrdubblas","Den är oförändrad"],"correct":1,"why":"P = RI². Om I fördubblas gäller P = R(2I)² = 4RI²."},"teacher":"Fråga eleverna vilket mellanled som kommer härnäst. Betona att vi använder U över och I genom samma resistor.","time":"Härledning och omprövning"},{"title":"Stor ström ger stor värmeeffekt","body":"\u003cp>\u003cb>Påståendet:\u003c/b> större ström kan ge större värmeeffekt. I en ohmsk resistor med konstant R ökar effekten med \u003ci>strömmen i kvadrat\u003c/i>.\u003c/p>\u003cdiv class=\"question\">En 500 W-apparat är ansluten till 230 V. Beräkna strömmen.\u003c/div>\u003cp>\u003cb>Din tur:\u003c/b> två rent resistiva apparater på 1 500 W och 1 200 W används samtidigt på samma 230 V-grupp. Föreslå hur totalströmmen ska beräknas.\u003c/p>","source":"6","side":"\u003cfigure class=\"effect-figure\">\u003csvg viewBox=\"0 0 550 293\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Relativa effektstaplar med en och fyra gånger effekt när strömmen fördubblas vid konstant resistans\">\u003cpath d=\"M70 53H485\" stroke=\"#d0e1e6\" stroke-width=\"2\"/>\u003ctext x=\"280\" y=\"37\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"21\" font-family=\"system-ui\" font-weight=\"650\">Effekt och ström – proportioner\u003c/text>\u003crect x=\"105\" y=\"94\" width=\"105\" height=\"28\" rx=\"5\" fill=\"#187b95\"/>\u003ctext x=\"65\" y=\"115\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"650\">I\u003c/text>\u003ctext x=\"285\" y=\"161\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\">P = RI²\u003c/text>\u003crect x=\"105\" y=\"182\" width=\"420\" height=\"28\" rx=\"5\" fill=\"#c77643\"/>\u003ctext x=\"65\" y=\"203\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"650\">2I\u003c/text>\u003ctext x=\"285\" y=\"249\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\">4P = R(2I)²\u003c/text>\u003ctext x=\"285\" y=\"267\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">Dubbel ström vid oförändrat R → fyrdubbel effekt\u003c/text>\u003c/svg>\u003cfigcaption>Jämför effekt vid samma resistans. Staplarna representerar relativ värmeeffekt, inte temperatur.\u003c/figcaption>\u003c/figure>","steps":["\u003cdiv class=\"worked\">\u003cb>1 · Fyra gånger effekt\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>P\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003cmsup>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>I\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>P\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>4\u003c/mn>\u003cmi>R\u003c/mi>\u003cmsup>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>P\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>4\u003c/mn>\u003cmi>P\u003c/mi>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>2 · Bestäm strömmen\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>P\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>U\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>500\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>W\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>230\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>2,17\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cp>\u003cb>Rimlighet:\u003c/b> 500 W vid 230 V motsvarar några ampere, inte hundratals. Beräkningarna förutsätter resistiv belastning vid angiven spänning.\u003c/p>"],"teacher":"Nätspänning är ett teoretiskt beräkningsexempel, inte en elevlaboration. Koppla tillbaka till energibegreppet och P = RI².","time":"Beräkning · din tur"},{"title":"Ryms båda apparaterna inom 10 A?","body":"\u003cdiv class=\"question\">En 1 500 W-apparat och en 1 200 W-apparat är parallellt anslutna till 230 V. Bestäm sammanlagd effekt och ström. Jämför med 10 A.\u003c/div>\u003cp>Skriv beräkningen själv → jämför i par → visa mellanled.\u003c/p>\u003cp class=\"safety-small\">Vid märkström 10 A är den beräknade kontinuerliga belastningen för hög. Verklig säkringsutlösning beror också på ström och tid. Gör inga elevförsök med 230 V.\u003c/p>","source":"7","side":"\u003cfigure class=\"effect-figure\">\u003csvg viewBox=\"0 0 550 337\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Två parallellkopplade belastningar märkta 1500 och 1200 watt till 230 volt\">\u003cpath d=\"M74 135V60H369 M74 167V268H369 M240 60V96 M240 195V268 M369 60V96 M369 195V268\" fill=\"none\" stroke=\"#355969\" stroke-width=\"3\" />\u003cpath d=\"M53 135h42 M62 167h24\" stroke=\"#bd6a46\" stroke-width=\"4\" />\u003ctext x=\"40\" y=\"129\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">+\u003c/text>\u003ctext x=\"40\" y=\"181\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">−\u003c/text>\u003crect x=\"220\" y=\"96\" width=\"40\" height=\"99\" fill=\"#fff\" stroke=\"#18758f\" stroke-width=\"3\" rx=\"2\" />\u003ctext x=\"208\" y=\"151\" text-anchor=\"end\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">1 500 W\u003c/text>\u003crect x=\"349\" y=\"96\" width=\"40\" height=\"99\" fill=\"#fff\" stroke=\"#ad6a44\" stroke-width=\"3\" rx=\"2\" />\u003ctext x=\"401\" y=\"151\" text-anchor=\"start\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">1 200 W\u003c/text>\u003ctext x=\"112\" y=\"292\" text-anchor=\"middle\" fill=\"#a65e40\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">230 V\u003c/text>\u003ctext x=\"311\" y=\"47\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"19\" font-family=\"system-ui\" font-weight=\"650\">Två apparater parallellt\u003c/text>\u003ctext x=\"275\" y=\"318\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">Iₜₒₜ = I₁ + I₂\u003c/text>\u003c/svg>\u003cfigcaption>Idealiserad parallellanslutning av två resistiva apparater till 230 V. Ingen övning med nätspänning.\u003c/figcaption>\u003c/figure>","steps":["\u003cdiv class=\"worked\">\u003cb>1 · Total effekt\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>P\u003c/mi>\u003cmtext>tot\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>P\u003c/mi>\u003cmtext>tot\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>1 500\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>W\u003c/mtext>\u003cmo>+\u003c/mo>\u003cmn>1 200\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>W\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>P\u003c/mi>\u003cmtext>tot\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>2 700\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>W\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>2 · Total ström\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmi>U\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>≈\u003c/mo>\u003cmn>6,52\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmi>U\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003cmo>≈\u003c/mo>\u003cmn>5,22\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>tot\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>tot\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2 700\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>W\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>230\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>tot\u003c/mtext>\u003c/msub>\u003cmo>≈\u003c/mo>\u003cmn>11,7\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cp>\u003cb>Bedömning:\u003c/b> 11,7 A är större än 10 A. Minska den samtidiga belastningen. Säkringen skyddar framför allt ledningarna mot överström och för hög uppvärmning.\u003c/p>"],"quiz":{"prompt":"Två resistiva laster på 1 500 W och 1 200 W ansluts parallellt till 230 V. Vilket alternativ stämmer?","options":["Totalströmmen är cirka 5 A","Totalströmmen är cirka 11,7 A","Strömmen är densamma genom båda apparaterna"],"correct":1,"why":"Pₜₒₜ = 2 700 W och I = P/U = 2700/230 ≈ 11,7 A. Grenströmmarna behöver inte vara lika."},"teacher":"Säkringens märkström är inte en knivskarp momentan utlösningströskel. Diskutera endast principen.","time":"Tillämpning och återkoppling"},{"title":"Även batteriet har resistans","body":"\u003cp>En verklig spänningskälla kan modelleras som en ideal ems \u003cb>ℰ\u003c/b> med en inre resistans \u003cb>r\u003c/b> i serie med den yttre resistansen \u003cb>R\u003c/b>.\u003c/p>\u003cdiv class=\"question\">Om strömmen ökar och ℰ och r är konstanta: vad händer med polspänningen U? Var försvinner spänningen?\u003c/div>\u003cp>Följ \u003cb>en och samma ström\u003c/b> genom batteriets inre och yttre resistans.\u003c/p>","source":"8","side":"\u003cfigure class=\"effect-figure\">\u003csvg viewBox=\"0 0 550 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Batteri med elektromotorisk spänning, inre resistans i serie med yttre resistans och voltmeter parallellt över yttre kretsen\">\u003cpath d=\"M92 145V74H470V239H92V177\" stroke=\"#355969\" stroke-width=\"3.2\" fill=\"none\"/>\u003cpath d=\"M71 145h42 M80 177h24\" stroke=\"#bd6a46\" stroke-width=\"4\" />\u003ctext x=\"58\" y=\"139\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">+\u003c/text>\u003ctext x=\"58\" y=\"191\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">−\u003c/text>\u003crect x=\"267\" y=\"61\" width=\"75\" height=\"26\" fill=\"#fff\" stroke=\"#c27443\" stroke-width=\"3\" rx=\"2\" />\u003ctext x=\"304.5\" y=\"51\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">r = 1,0 Ω\u003c/text>\u003crect x=\"266\" y=\"226\" width=\"80\" height=\"26\" fill=\"#fff\" stroke=\"#19758c\" stroke-width=\"3\" rx=\"2\" />\u003ctext x=\"306.0\" y=\"216\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">R = 5,0 Ω\u003c/text>\u003cpath d=\"M215 239 V188 H274 M330 188 H395 V239\" stroke=\"#397080\" stroke-width=\"2.6\" fill=\"none\"/>\u003ccircle cx=\"302\" cy=\"188\" r=\"28\" fill=\"#ffffff\" stroke=\"#397080\" stroke-width=\"2.6\"/>\u003ctext x=\"302\" y=\"195\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\">V\u003c/text>\u003ctext x=\"110\" y=\"281\" text-anchor=\"middle\" fill=\"#9d6343\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">ℰ = 6,0 V\u003c/text>\u003ctext x=\"421\" y=\"185\" text-anchor=\"middle\" fill=\"#16758b\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">U\u003c/text>\u003c/svg>\u003cfigcaption>Riktigt kretsschema för batterimodellen. Den ideala voltmetern har mycket hög resistans och mäter polspänningen U.\u003c/figcaption>\u003c/figure>","steps":["\u003cdiv class=\"worked\">\u003cb>Modell för urladdning\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>ℰ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>U\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>r\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>ℰ\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>r\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cp>\u003cb>Förklaring:\u003c/b> när I ökar, ökar spänningsfallet rI inne i batteriet. Därför sjunker polspänningen U i denna modell.\u003c/p>"],"teacher":"Undersök om eleverna säger att den inre resistansen ligger parallellt med belastningen; rätta med det riktiga seriekopplingsschemat. Ingen fysisk batterimätning krävs av originalet.","time":"Modell och förutsägelse"},{"title":"Vad händer när belastningen ökar?","body":"\u003cp>Originalets två jämförelselägen har samma ems \u003cb>6,0 V\u003c/b> och inre resistans \u003cb>1,0 Ω\u003c/b>:\u003c/p>\u003cdiv class=\"question\">Först R = 5,0 Ω, sedan R = 2,0 Ω. Vad händer med strömmen, polspänningen och uppvärmningen inne i batteriet?\u003c/div>\u003cp>Använd reglaget för den yttre resistansen. Pröva först 5,0 Ω, därefter 2,0 Ω, och jämför hur samma 6 V fördelas.\u003c/p>","source":"9–10","steps":["\u003cdiv class=\"worked\">\u003cb>Originalets första fall\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>ℰ\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmo>(\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>R\u003c/mi>\u003cmo>)\u003c/mo>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>1,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>5,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>Ω\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>1,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>5,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>Ökad belastning: R = 2,0 Ω\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>3,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>2,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>2,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>Ω\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>2,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>4,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>Värmeeffekt inne i batteriet\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>P\u003c/mi>\u003cmtext>inre\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>r\u003c/mi>\u003cmsup>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>P\u003c/mi>\u003cmtext>inre\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>1,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>Ω\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmrow>\u003cmn>1,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmn>1,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>W\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>P\u003c/mi>\u003cmtext>inre\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>1,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>Ω\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmrow>\u003cmn>2,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmn>4,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>W\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cp>\u003cb>Kontroll:\u003c/b> i båda fallen är rI + U = 6,0 V. En större ström ger större inre effektförlust.\u003c/p>"],"model":"effektinternal","teacher":"Visa inte voltandelarna i förutsägelseläget. Efter första avslöjandet ska alla tal och färgsegment fortsätta uppdateras. Originalets jämförelse 1 A→2 A måste visas korrekt.","time":"Styrbar batterimodell"},{"title":"Hur bestämmer vi strömmen?","body":"\u003cp>Givet ett batteri som levererar \u003cb>ℰ = 6,0 V\u003c/b>, har \u003cb>r = 1,0 Ω\u003c/b> och matar \u003cb>R = 5,0 Ω\u003c/b>.\u003c/p>\u003cdiv class=\"question\">Hur kan vi bestämma strömmen \u003ci>I\u003c/i> och polspänningen \u003ci>U\u003c/i>? Föreslå första steget innan du visar lösningen.\u003c/div>","source":"11","side":"\u003cfigure class=\"effect-figure\">\u003csvg viewBox=\"0 0 550 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Batteri med elektromotorisk spänning, inre resistans i serie med yttre resistans och voltmeter parallellt över yttre kretsen\">\u003cpath d=\"M92 145V74H470V239H92V177\" stroke=\"#355969\" stroke-width=\"3.2\" fill=\"none\"/>\u003cpath d=\"M71 145h42 M80 177h24\" stroke=\"#bd6a46\" stroke-width=\"4\" />\u003ctext x=\"58\" y=\"139\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">+\u003c/text>\u003ctext x=\"58\" y=\"191\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">−\u003c/text>\u003crect x=\"267\" y=\"61\" width=\"75\" height=\"26\" fill=\"#fff\" stroke=\"#c27443\" stroke-width=\"3\" rx=\"2\" />\u003ctext x=\"304.5\" y=\"51\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">r = 1,0 Ω\u003c/text>\u003crect x=\"266\" y=\"226\" width=\"80\" height=\"26\" fill=\"#fff\" stroke=\"#19758c\" stroke-width=\"3\" rx=\"2\" />\u003ctext x=\"306.0\" y=\"216\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">R = 5,0 Ω\u003c/text>\u003cpath d=\"M215 239 V188 H274 M330 188 H395 V239\" stroke=\"#397080\" stroke-width=\"2.6\" fill=\"none\"/>\u003ccircle cx=\"302\" cy=\"188\" r=\"28\" fill=\"#ffffff\" stroke=\"#397080\" stroke-width=\"2.6\"/>\u003ctext x=\"302\" y=\"195\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\">V\u003c/text>\u003ctext x=\"110\" y=\"281\" text-anchor=\"middle\" fill=\"#9d6343\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">ℰ = 6,0 V\u003c/text>\u003ctext x=\"421\" y=\"185\" text-anchor=\"middle\" fill=\"#16758b\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">U\u003c/text>\u003c/svg>\u003cfigcaption>Riktigt kretsschema för batterimodellen. Den ideala voltmetern har mycket hög resistans och mäter polspänningen U.\u003c/figcaption>\u003c/figure>","steps":["\u003cdiv class=\"worked\">\u003cb>1 · Två samband\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>ℰ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>U\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>r\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>2 · Ersätt U med RI\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>ℰ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003cmi>I\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>r\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>ℰ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmo>(\u003c/mo>\u003cmi>R\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>r\u003c/mi>\u003cmo>)\u003c/mo>\u003c/mrow>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>3 · Lös ut I\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>ℰ\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>R\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>1,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>4 · Polspänningen\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>5,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>Ω\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>1,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>5,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cp>\u003cb>Rimlighet:\u003c/b> U = 5,0 V är lägre än ems 6,0 V, eftersom 1,0 V faller internt.\u003c/p>"],"teacher":"Eleven ska själv se att U kan ersättas med RI. Använd samma figur genom mellanleden för att minska splittrad uppmärksamhet.","time":"Genomarbetat exempel"},{"title":"Din tur · återkoppling och Socrative","body":"\u003cdiv class=\"question\">Ändra nu yttre resistansen till \u003cb>R = 3,0 Ω\u003c/b> (ℰ = 6,0 V och r = 1,0 Ω). Bestäm I och U innan lösningen visas.\u003c/div>\u003cp>Skriv eget svar → jämför i par → gemensam återkoppling.\u003c/p>\u003cdiv class=\"socrative\">\u003cb>Originalets Socrative · Effekt i resistor\u003c/b>\u003cp>\u003ccode>SOC-37285324\u003c/code>\u003c/p>\u003cp>Diskutera särskilt frågan: \u003cb>Vilken spänning? Vilken ström? Vilken komponent?\u003c/b>\u003c/p>\u003c/div>","source":"12","side":"\u003cfigure class=\"effect-figure\">\u003csvg viewBox=\"0 0 550 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Batteri med elektromotorisk spänning, inre resistans i serie med yttre resistans och voltmeter parallellt över yttre kretsen\">\u003cpath d=\"M92 145V74H470V239H92V177\" stroke=\"#355969\" stroke-width=\"3.2\" fill=\"none\"/>\u003cpath d=\"M71 145h42 M80 177h24\" stroke=\"#bd6a46\" stroke-width=\"4\" />\u003ctext x=\"58\" y=\"139\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">+\u003c/text>\u003ctext x=\"58\" y=\"191\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">−\u003c/text>\u003crect x=\"267\" y=\"61\" width=\"75\" height=\"26\" fill=\"#fff\" stroke=\"#c27443\" stroke-width=\"3\" rx=\"2\" />\u003ctext x=\"304.5\" y=\"51\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">r = 1,0 Ω\u003c/text>\u003crect x=\"266\" y=\"226\" width=\"80\" height=\"26\" fill=\"#fff\" stroke=\"#19758c\" stroke-width=\"3\" rx=\"2\" />\u003ctext x=\"306.0\" y=\"216\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">R = 3,0 Ω\u003c/text>\u003cpath d=\"M215 239 V188 H274 M330 188 H395 V239\" stroke=\"#397080\" stroke-width=\"2.6\" fill=\"none\"/>\u003ccircle cx=\"302\" cy=\"188\" r=\"28\" fill=\"#ffffff\" stroke=\"#397080\" stroke-width=\"2.6\"/>\u003ctext x=\"302\" y=\"195\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\">V\u003c/text>\u003ctext x=\"110\" y=\"281\" text-anchor=\"middle\" fill=\"#9d6343\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">ℰ = 6,0 V\u003c/text>\u003ctext x=\"421\" y=\"185\" text-anchor=\"middle\" fill=\"#16758b\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">U\u003c/text>\u003c/svg>\u003cfigcaption>Riktigt kretsschema för batterimodellen. Den ideala voltmetern har mycket hög resistans och mäter polspänningen U.\u003c/figcaption>\u003c/figure>","steps":["\u003cdiv class=\"worked\">\u003cb>1 · Ström genom samma seriekrets\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>ℰ\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>R\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>4,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>1,5\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>2 · Spänning över yttre R\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>3,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>Ω\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>1,5\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>4,5\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>3 · Kontroll\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>ℰ\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>r\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>1,5\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>4,5\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>"],"teacher":"Befintlig Socrative, inget nykonstruerat quiz. Låt eleverna skilja r från R. Om tiden är knapp, följ upp bara svaret med störst osäkerhet.","time":"Öva och återkoppla"},{"title":"Träna · visa vad du kan","body":"\u003cdiv class=\"book-main\">\u003ch2>Bokens uppgifter 839–850 · avsnitt 8.4\u003c/h2>\u003cp>\u003cb>Uppgifter:\u003c/b> s. 298–299. \u003cb>Lässtöd:\u003c/b> s. 294–297, särskilt de \u003cb>gröna rutorna\u003c/b>.\u003c/p>\u003cp>\u003cb>Läxa:\u003c/b> gör klart bokens uppgifter 839–850. Arbeta först själv och jämför sedan metod med en kamrat.\u003c/p>\u003c/div>\u003cdiv class=\"question\">\u003cb>Exit – svara själv utan bok:\u003c/b> 12 V över en resistor där I = 0,50 A. Beräkna P och E under 20 s. Förklara skillnaden mellan energi och effekt. Varför ökar värmeeffekten med I² om R är konstant? Varför sjunker batteriets U när I ökar?\u003c/div>\u003cdiv class=\"goallocal\">\u003cb>Återvänd till dagens mål\u003c/b>\u003col>\u003cli>Skilja effekt från energi.\u003c/li>\u003cli>Beräkna effekt, energi och ström.\u003c/li>\u003cli>Förklara uppvärmning och inre resistans.\u003c/li>\u003c/ol>\u003c/div>","source":"13","steps":["\u003cdiv class=\"worked\">\u003cb>Kontroll av beräkningar\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>U\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>0,50\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>W\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>Energi under 20 s\u003c/b>\u003cdiv class=\"effect-math-stack\">\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>P\u003c/mi>\u003cmi>t\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>W\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>20\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>s\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"effect-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>120\u003c/mn>\u003cmspace width=\"0.15em\"/>\u003cmtext>J\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cp>\u003cb>Fördjupad förklaring:\u003c/b> P = RI² om R är konstant. I batterimodellen gäller U = ℰ − rI, så större I ger större inre spänningsfall.\u003c/p>"],"teacher":"Skydda en lång sammanhängande bokarbetsfas. Vid tidsbrist görs exit muntligt eller som kort skriftlig fråga; innehållet på denna sida är inte ett extra helt föreläsningsmoment.","time":"Bokarbete · avslut"}]}</script><script src="../../gemensamt/models.js"></script><script src="effekt-models.js?v=rev84b"></script><script src="../../gemensamt/app.js"></script><script src="effekt-ui.js?v=diagram-qa-20261119"></script><script src="../../gemensamt/sjalvtest.js?v=papper1" defer></script><script src="../../gemensamt/matematik-typografi.js?v=2" defer></script></body></html>
