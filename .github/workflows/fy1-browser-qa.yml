name: Fy1 web lesson quality checks
on:
  push:
    paths:
      - "fy1/kapitel-8/**"
      - "fy1/kapitel-9/**"
      - "fy1/gemensamt/**"
      - ".github/workflows/fy1-browser-qa.yml"
  pull_request:
    paths:
      - "fy1/kapitel-8/**"
      - "fy1/kapitel-9/**"
      - "fy1/gemensamt/**"
      - ".github/workflows/fy1-browser-qa.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coulomb-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
    steps:
      - name: Settle closely spaced commits
        run: sleep 20
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve all Fy1 lessons locally
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/fy1-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8123/fy1/kapitel-8/ >/dev/null && break; sleep 1; done
      - name: Verify Coulomb lesson and other five Fy1 lessons
        run: |
          failed=0
          for script in \
            fy1/kapitel-9/qa/standardmodellen-qa.cjs \
            fy1/kapitel-9/qa/elektromagnetisk-stralning-qa.cjs \
            fy1/kapitel-8/qa/charge-q-v23-all-16.cjs \
            fy1/kapitel-8/qa/deep-review-fy1-36.cjs \
            fy1/kapitel-8/qa/figure-interaction-coulomb-v23.cjs \
            fy1/kapitel-8/qa/deep-review-fy1-37.cjs \
            fy1/kapitel-8/qa/deep-review-fy1-38.cjs \
            fy1/kapitel-8/qa/deep-review-fy1-39.cjs \
            fy1/kapitel-8/qa/figure-interaction-circuits-v23.cjs \
            fy1/kapitel-8/qa/deep-review-fy1-40.cjs \
            fy1/kapitel-8/qa/deep-review-fy1-41.cjs \
            fy1/kapitel-8/qa/figure-interaction-fy1-41.cjs \
            fy1/kapitel-8/qa/figure-interaction-series-v23.cjs \
            fy1/kapitel-8/qa/figure-interaction-effect-v23.cjs \
            fy1/kapitel-8/qa/figure-interaction-fields-v23.cjs \
            fy1/kapitel-8/qa/figure-interaction-potential-v23.cjs \
            fy1/kapitel-9/qa/standardmodellen.cjs
          do
            node "$script" || failed=1
          done
          exit "$failed"
      - name: Upload QA screenshots and independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fy1-browser-quality-evidence
          path: fy1-qa-screenshots/
          retention-days: 14
      - name: Upload 9.2 screenshots for final visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fy1-9-2-visual-evidence
          path: fy1-qa-screenshots/elektromagnetisk-stralning/
          retention-days: 14
