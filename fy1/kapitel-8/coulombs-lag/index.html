<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Coulombs lag · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"><link rel="stylesheet" href="coulomb.css?v=revision1"><link rel="stylesheet" href="../../gemensamt/sjalvtest.css?v=papper1"><link rel="stylesheet" href="../../gemensamt/matematik-typografi.css?v=1"></head><body data-fy1-lesson="coulombs-lag"><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Coulombs lag</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Coulombs lag","subject":"Fysik nivå 1","chapter":"8.1 · Elektrisk laddning","source":"261102 Coulombs lag Fy1.pdf","goals":["Förklara hur elektroner kan flyttas och varför den totala laddningen bevaras.","Rita elektriska kraftpilar samt förutsäga hur Coulombkraften ändras med laddning och avstånd.","Beräkna elektrisk kraft och elektronantal med tydliga enheter och rimlighetskontroll."],"pages":[{"title":"Elektroner flyttas – laddning bevaras","label":"Startfråga · förutsäg","source":"1","time":"Enskilt → par","body":"\u003cdiv class=\"question\">En elektron flyttas från ett neutralt föremål A till ett neutralt föremål B. Vad får A och B för laddning? Vad händer med den totala laddningen?\u003c/div>\u003cp>\u003cb>Först:\u003c/b> Rita laddningstecken och förklara för en kamrat. Använd figuren som stöd.\u003c/p>\u003cdiv class=\"step\">\u003cp>\u003cb>Återkoppling:\u003c/b> A förlorar en elektron och får elektronunderskott, alltså positiv nettoladdning. B får elektronöverskott, alltså negativ nettoladdning. Protonerna flyttas inte mellan föremålen.\u003c/p>\u003cfigure class=\"lesson-figure \">\u003csvg viewBox=\"0 0 650 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Efter elektronförflyttningen blir A positivt och B negativt\">\u003ctitle>Efter elektronförflyttningen blir A positivt och B negativt\u003c/title>\u003cdesc>A har elektronunderskott och B elektronöverskott. Totala nettoladdningen är fortfarande noll.\u003c/desc>\u003cg>\u003crect x=\"22\" y=\"30\" width=\"260\" height=\"160\" rx=\"15\" fill=\"#ecf5f7\" stroke=\"#bfdbe1\"/>\u003ctext x=\"152\" y=\"61\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"750\" fill=\"#244b59\">A · positiv\u003c/text>\u003ccircle cx=\"67\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"67\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"122\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"122\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"177\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"177\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"232\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"232\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"67\" cy=\"150\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"67\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"110\" cy=\"150\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"110\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"153\" cy=\"150\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"153\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003c/g>\u003cg>\u003crect x=\"365\" y=\"30\" width=\"260\" height=\"160\" rx=\"15\" fill=\"#ecf5f7\" stroke=\"#bfdbe1\"/>\u003ctext x=\"495\" y=\"61\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"750\" fill=\"#244b59\">B · negativ\u003c/text>\u003ccircle cx=\"410\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"410\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"465\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"465\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"520\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"520\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"575\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"575\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"410\" cy=\"150\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"410\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"453\" cy=\"150\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"453\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"496\" cy=\"150\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"496\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"539\" cy=\"150\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"539\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"582\" cy=\"150\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"582\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003c/g>\u003ctext x=\"325\" y=\"246\" font-size=\"19\" text-anchor=\"middle\" fill=\"#214956\">+e + (−e) = 0 · totala laddningen bevaras\u003c/text>\u003c/svg>\u003cfigcaption>Schematisk laddningsbokföring efter elektronförflyttningen. Varje symbol står för samma laddningsstorlek.\u003c/figcaption>\u003c/figure>\u003c/div>\u003cdiv class=\"step\">\u003cp>\u003cb>Laddning bevaras:\u003c/b> Det A förlorar får B. Lika tecken repellerar, olika tecken attraherar.\u003c/p>\u003cdiv class=\"goals-min\">\u003cstrong>Efter lektionen ska du kunna\u003c/strong>\u003cspan>förklara laddning\u003c/span>\u003cspan>rita krafter\u003c/span>\u003cspan>använda Coulombs lag\u003c/span>\u003c/div>\u003c/div>","side":"\u003cfigure class=\"lesson-figure \">\u003csvg viewBox=\"0 0 650 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Två neutrala föremål: en elektron förs från A till B\">\u003ctitle>Två neutrala föremål: en elektron förs från A till B\u003c/title>\u003cdesc>A och B har lika många plus och minus från början. En elektron går från A till B. Eleverna ska förutsäga nettoladdningarna.\u003c/desc>\u003cg>\u003crect x=\"22\" y=\"36\" width=\"260\" height=\"160\" rx=\"15\" fill=\"#ecf5f7\" stroke=\"#bfdbe1\"/>\u003ctext x=\"152\" y=\"67\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"750\" fill=\"#244b59\">A · från början neutral\u003c/text>\u003ccircle cx=\"67\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"67\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"122\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"122\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"177\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"177\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"232\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"232\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"67\" cy=\"156\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"67\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"110\" cy=\"156\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"110\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"153\" cy=\"156\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"153\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"196\" cy=\"156\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"196\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003c/g>\u003cg>\u003crect x=\"365\" y=\"36\" width=\"260\" height=\"160\" rx=\"15\" fill=\"#ecf5f7\" stroke=\"#bfdbe1\"/>\u003ctext x=\"495\" y=\"67\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"750\" fill=\"#244b59\">B · från början neutral\u003c/text>\u003ccircle cx=\"410\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"410\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"465\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"465\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"520\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"520\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"575\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/>\u003ctext x=\"575\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"410\" cy=\"156\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"410\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"453\" cy=\"156\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"453\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"496\" cy=\"156\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"496\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"539\" cy=\"156\" r=\"15\" fill=\"#147993\"/>\u003ctext x=\"539\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−\u003c/text>\u003c/g>\u003cpath d=\"M292 132 H350\" stroke=\"#127d96\" stroke-width=\"5\" fill=\"none\"/>\u003cpath d=\"M337 122 L352 132 L337 142\" stroke=\"#127d96\" stroke-width=\"4\" fill=\"none\"/>\u003ctext x=\"322\" y=\"96\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#166981\">en elektron\u003c/text>\u003ctext x=\"325\" y=\"254\" text-anchor=\"middle\" font-size=\"19\" fill=\"#345766\">Vad händer med nettoladdningarna?\u003c/text>\u003c/svg>\u003cfigcaption>Före förflyttningen är båda föremålen neutrala. Nettoladdningarna går att förutsäga utan att räkna verkliga partiklar.\u003c/figcaption>\u003c/figure>","quiz":{"prompt":"Elektroner flyttas från A till B. Vilket föremål blir positivt?","options":["A","B","Båda"],"correct":0,"why":"A förlorar elektroner och får positiv nettoladdning. B får motsvarande negativ laddning. Den totala laddningen bevaras."},"teacher":"Låt eleverna bestämma tecken innan de ser återkopplingen. Plus-symbolerna föreställer bunden positiv laddning, minus-symbolerna elektroner."},{"title":"Vad händer i elektroskopet?","label":"Verklig demonstration · observera","source":"2","time":"Rita → observera → förklara","body":"\u003cdiv class=\"question\">Elektroskopet är från början neutralt. Det tillförs elektroner genom kontakt. Hur rör sig visaren? Rita före demonstrationen.\u003c/div>\u003col class=\"tight\">\u003cli>\u003cb>Före:\u003c/b> Rita en förutsägelse på egen hand.\u003c/li>\u003cli>\u003cb>Under:\u003c/b> Observera lärarens verkliga elektroskop.\u003c/li>\u003cli>\u003cb>Efter:\u003c/b> Markera laddningarna på stång och visare. Förklara.\u003c/li>\u003c/ol>\u003cdiv class=\"step\">\u003cp>\u003cb>Förklaring:\u003c/b> Stång och visare får laddning med samma tecken. De elektriska krafterna mellan dem gör att visaren slår ut.\u003c/p>\u003cfigure class=\"lesson-figure \">\u003csvg viewBox=\"0 0 540 315\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Elektroskop efter tillförsel av elektroner\">\u003ctitle>Elektroskop efter tillförsel av elektroner\u003c/title>\u003cdesc>Stången och visaren har negativ laddning. Visaren har slagit ut. Vinkeln är schematisk.\u003c/desc>\u003ccircle cx=\"270\" cy=\"157\" r=\"121\" stroke=\"#8aa1ac\" stroke-width=\"3\" fill=\"#f9fcfd\"/>\n\u003cpath d=\"M218 43 H322 M270 43 V234\" stroke=\"#20495a\" stroke-width=\"5\"/>\n\u003cpath d=\"M270 160 L345 221\" stroke=\"#bd7548\" stroke-width=\"5\"/>\n\u003ctext x=\"255\" y=\"130\" font-size=\"22\" text-anchor=\"middle\" fill=\"#137a96\">−\u003c/text>\n\u003ctext x=\"322\" y=\"209\" font-size=\"22\" text-anchor=\"middle\" fill=\"#137a96\">−\u003c/text>\n\u003ctext x=\"270\" y=\"295\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"#225562\">Lika tecken → repulsion\u003c/text>\u003c/svg>\u003cfigcaption>Efter tillförsel av elektroner: båda delarna är negativt laddade och stöter bort varandra.\u003c/figcaption>\u003c/figure>\u003c/div>\u003cdiv class=\"step\">\u003cp>\u003cb>Kontrollfråga:\u003c/b> Kan ett utslag ensamt avslöja om elektroskopet har positiv eller negativ nettoladdning? \u003cb>Nej.\u003c/b> Både positiv och negativ laddning kan ge ett utslag.\u003c/p>\u003c/div>","side":"\u003cfigure class=\"lesson-figure \">\u003csvg viewBox=\"0 0 540 310\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Elektroskop innan laddning\">\u003ctitle>Elektroskop innan laddning\u003c/title>\u003cdesc>Schema av ett elektroskop med lodrät metallstång och en visare som hänger nedåt.\u003c/desc>\u003cpath d=\"M270 52 V75 M217 52 H323 M270 75 V236\" stroke=\"#234f60\" stroke-width=\"6\" fill=\"none\"/>\n\u003ccircle cx=\"270\" cy=\"165\" r=\"122\" stroke=\"#8aa1ac\" stroke-width=\"3\" fill=\"#f9fcfd\" opacity=\"0.35\"/>\n\u003cpath d=\"M270 78 V238\" stroke=\"#20495a\" stroke-width=\"5\"/>\u003cpath d=\"M270 165 L270 244\" stroke=\"#bf7549\" stroke-width=\"5\"/>\n\u003ctext x=\"270\" y=\"285\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\" fill=\"#355c68\">Före: visaren hänger nedåt\u003c/text>\u003c/svg>\u003cfigcaption>Före den verkliga demonstrationen. Den schematiska bilden är inte en ersättning för observationen.\u003c/figcaption>\u003c/figure>","teacher":"Utför originalets elektroskopdemonstration fysiskt. Begär ritning innan du laddar elektroskopet. Förutsätt i förklaringen laddning via kontakt, inte enbart induktion."},{"title":"Längre avstånd – hur ändras kraften?","label":"Förutsäg → pröva","source":"3","time":"Enskilt → par → modell","body":"\u003cp>Samma två punktladdningar, men olika avstånd. Bara avståndet ändras.\u003c/p>\u003cdiv class=\"question\">Om kraftens storlek vid \u003ci>r\u003c/i> är F₀: vad händer vid \u003ci>2r\u003c/i> och \u003ci>3r\u003c/i>?\u003c/div>\u003cp>Välj ett svar och \u003cb>motivera först\u003c/b>. Jämför sedan i par. Använd modellen: ändra endast \u003ci>r\u003c/i> och låt laddningarna vara oförändrade.\u003c/p>\u003cdiv class=\"step\">\u003cp>\u003cb>Överför:\u003c/b> Halverar vi avståndet blir kraftens storlek fyra gånger större. Vilken del av sambandet ger det resultatet?\u003c/p>\u003c/div>","model":"coulomb","quiz":{"prompt":"Vid dubbla avståndet (oförändrade, icke-noll laddningar) blir kraften …","options":["hälften","en fjärdedel","dubbelt","oförändrad"],"correct":1,"why":"Avståndet ingår i kvadrat: (2r)² = 4r², så kraftens storlek blir F₀/4."},"teacher":"Använd originalets r, 2r och 3r. Visa inte modellens värde förrän eleverna har valt och motiverat. Kraftpilarna i modellen visar bara riktning; det numeriska kraftbeloppet har separat skala."},{"title":"Coulombs lag förklarar förändringen","label":"Härled · kontrollera","source":"4","body":"\u003cp>Laddningarnas tecken avgör \u003cb>attraktion eller repulsion\u003c/b>. Avståndet avgör hur stor kraften blir.\u003c/p>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>F\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>k\u003c/mi>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mfrac>\u003c/math>\u003c/div>\u003cp>\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\">\u003csemantics>\u003cmrow>\u003cmrow>\u003cmi>k\u003c/mi>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmn>8,99\u003c/mn>\u003c/mrow>\u003cmo>·\u003c/mo>\u003cmrow>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>9\u003c/mn>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>N\u003c/mtext>\u003c/mrow>\u003cmo>·\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmsup>\u003cmi>m\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mrow>\u003cmrow>\u003cmrow>\u003cmsup>\u003cmi>C\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"text/plain\">k = 8,99 · 10⁹ N·m²/C²\u003c/annotation>\u003c/semantics>\u003c/math>, laddning i C och avstånd i m.\u003c/p>\u003cp class=\"note\">\u003cb>Teckenkonvention i den här lektionen:\u003c/b> Positivt värde av \u003ci>F\u003c/i> betecknar \u003cb>repulsion\u003c/b>, negativt \u003cb>attraktion\u003c/b>. Detta tecken är \u003cem>inte\u003c/em> en x-komponent av kraften. Kraftens riktning måste visas med separata pilar.\u003c/p>\u003cdiv class=\"step\">\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>F\u003c/mi>\u003cmo>∼\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mfrac>\u003c/math>\u003c/div>\u003cp>Vid \u003cb>2r\u003c/b> blir kraftens storlek en fjärdedel.\u003c/p>\u003c/div>\u003cdiv class=\"step\">\u003cp>Vid \u003cb>3r\u003c/b> blir den en niondel. Om en laddning fördubblas vid oförändrat avstånd blir kraftens storlek dubbelt så stor.\u003c/p>\u003c/div>","side":"\u003cfigure class=\"lesson-figure \">\u003csvg viewBox=\"0 0 670 350\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Tre lika laddningspar med avstånd r, 2r och 3r\">\u003ctitle>Tre lika laddningspar med avstånd r, 2r och 3r\u003c/title>\u003cdesc>Laddningarna har samma storlek i alla tre fallen. Avstånden är ritade i proportion. Kraftstorleken är F noll, F noll delat med fyra och F noll delat med nio.\u003c/desc>\u003ccircle cx=\"100\" cy=\"76\" r=\"19\" fill=\"#b85b45\"/>\u003ccircle cx=\"215\" cy=\"76\" r=\"19\" fill=\"#b85b45\"/>\u003ctext x=\"100\" y=\"83\" font-size=\"24\" text-anchor=\"middle\" fill=\"white\">+\u003c/text>\u003ctext x=\"215\" y=\"83\" font-size=\"24\" text-anchor=\"middle\" fill=\"white\">+\u003c/text>\u003cpath d=\"M100 108 V116 H215 V108\" fill=\"none\" stroke=\"#658894\" stroke-width=\"2\"/>\u003ctext x=\"157.5\" y=\"135\" text-anchor=\"middle\" font-size=\"18\" fill=\"#315562\">r\u003c/text>\u003cpath d=\"M72 76 h-25 m10 -10 l-10 10 l10 10\" fill=\"none\" stroke=\"#26816f\" stroke-width=\"3\"/>\u003cpath d=\"M243 76 h25 m-10 -10 l10 10 l-10 10\" fill=\"none\" stroke=\"#26816f\" stroke-width=\"3\"/>\u003ctext x=\"535\" y=\"84\" font-size=\"25\" fill=\"#1c596b\" font-weight=\"760\">F₀\u003c/text>\u003ccircle cx=\"100\" cy=\"171\" r=\"19\" fill=\"#b85b45\"/>\u003ccircle cx=\"330\" cy=\"171\" r=\"19\" fill=\"#b85b45\"/>\u003ctext x=\"100\" y=\"178\" font-size=\"24\" text-anchor=\"middle\" fill=\"white\">+\u003c/text>\u003ctext x=\"330\" y=\"178\" font-size=\"24\" text-anchor=\"middle\" fill=\"white\">+\u003c/text>\u003cpath d=\"M100 203 V211 H330 V203\" fill=\"none\" stroke=\"#658894\" stroke-width=\"2\"/>\u003ctext x=\"215.0\" y=\"230\" text-anchor=\"middle\" font-size=\"18\" fill=\"#315562\">2r\u003c/text>\u003cpath d=\"M72 171 h-25 m10 -10 l-10 10 l10 10\" fill=\"none\" stroke=\"#26816f\" stroke-width=\"3\"/>\u003cpath d=\"M358 171 h25 m-10 -10 l10 10 l-10 10\" fill=\"none\" stroke=\"#26816f\" stroke-width=\"3\"/>\u003ctext x=\"535\" y=\"179\" font-size=\"25\" fill=\"#1c596b\" font-weight=\"760\">F₀/4\u003c/text>\u003ccircle cx=\"100\" cy=\"266\" r=\"19\" fill=\"#b85b45\"/>\u003ccircle cx=\"445\" cy=\"266\" r=\"19\" fill=\"#b85b45\"/>\u003ctext x=\"100\" y=\"273\" font-size=\"24\" text-anchor=\"middle\" fill=\"white\">+\u003c/text>\u003ctext x=\"445\" y=\"273\" font-size=\"24\" text-anchor=\"middle\" fill=\"white\">+\u003c/text>\u003cpath d=\"M100 298 V306 H445 V298\" fill=\"none\" stroke=\"#658894\" stroke-width=\"2\"/>\u003ctext x=\"272.5\" y=\"325\" text-anchor=\"middle\" font-size=\"18\" fill=\"#315562\">3r\u003c/text>\u003cpath d=\"M72 266 h-25 m10 -10 l-10 10 l10 10\" fill=\"none\" stroke=\"#26816f\" stroke-width=\"3\"/>\u003cpath d=\"M473 266 h25 m-10 -10 l10 10 l-10 10\" fill=\"none\" stroke=\"#26816f\" stroke-width=\"3\"/>\u003ctext x=\"535\" y=\"274\" font-size=\"25\" fill=\"#1c596b\" font-weight=\"760\">F₀/9\u003c/text>\u003c/svg>\u003cfigcaption>Avstånd och laddningar är ritade konsekvent. Kraftens storlek anges som uttryck, inte genom pilarnas längd.\u003c/figcaption>\u003c/figure>","teacher":"Visa Newtons tredje lag: de två laddningarna påverkar varandra med lika stora och motsatt riktade krafter. Krafternas riktning avgörs av positionen och laddningstecknen; F:s tecken ovan är en särskilt definierad samspelskonvention."},{"title":"Förbered exemplen – välj modell först","label":"Eget första steg","source":"5","time":"Skriv först · jämför i par","body":"\u003cdiv class=\"task-grid\">\u003carticle class=\"mini-card\">\u003ch2>1 · Metallklot\u003c/h2>\u003cp>Ett metallklot har laddningen \u003cb>+2,5 nC\u003c/b> och ska bli neutralt.\u003c/p>\u003cp>\u003cb>Fråga:\u003c/b> Ska elektroner tillföras eller tas bort? Omvandla nC till C.\u003c/p>\u003c/article>\u003carticle class=\"mini-card\">\u003ch2>2 · Proton och elektron\u003c/h2>\u003cp>Avståndet är \u003cb>0,051 nm\u003c/b>.\u003c/p>\u003cp>\u003cb>Fråga:\u003c/b> Skriv om avståndet till meter. Rita en kraftpil på varje partikel.\u003c/p>\u003c/article>\u003c/div>\u003cp class=\"note\">Skriv själv. Jämför sedan med en kamrat. Motivera \u003cem>varför\u003c/em> ditt första steg är rimligt.\u003c/p>","side":"\u003cfigure class=\"lesson-figure \">\u003csvg viewBox=\"0 0 560 270\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Proton och elektron utan inritade kraftpilar\">\u003ctitle>Proton och elektron utan inritade kraftpilar\u003c/title>\u003cdesc>Proton till vänster, elektron till höger, avstånd 0,051 nanometer. Eleverna ska själva förutsäga krafternas riktning.\u003c/desc>\u003ccircle cx=\"125\" cy=\"140\" r=\"27\" fill=\"#bc634c\"/>\u003ctext x=\"125\" y=\"150\" fill=\"white\" text-anchor=\"middle\" font-size=\"34\">+\u003c/text>\n\u003ccircle cx=\"435\" cy=\"140\" r=\"27\" fill=\"#147992\"/>\u003ctext x=\"435\" y=\"150\" fill=\"white\" text-anchor=\"middle\" font-size=\"34\">−\u003c/text>\n\u003cpath d=\"M125 196 V207 H435 V196\" stroke=\"#75949e\" stroke-width=\"2\" fill=\"none\"/>\u003ctext x=\"280\" y=\"233\" text-anchor=\"middle\" fill=\"#355966\" font-size=\"20\">r = 0,051 nm\u003c/text>\n\u003ctext x=\"125\" y=\"94\" text-anchor=\"middle\" fill=\"#315564\" font-size=\"19\">proton\u003c/text>\u003ctext x=\"435\" y=\"94\" text-anchor=\"middle\" fill=\"#315564\" font-size=\"19\">elektron\u003c/text>\u003c/svg>\u003cfigcaption>Fråga 2: rita två kraftpilar. Pilarna saknas avsiktligt – det är du som ska sätta ut dem.\u003c/figcaption>\u003c/figure>","teacher":"Två originaluppgifter före gemensamt genomarbetade lösningar. De får inte försvinna när lektionen överförs. Låt eleverna svara båda själv och förklara en var i par."},{"title":"Exempel 1 · Hur många elektroner?","label":"Genomarbetat exempel · stegvis","source":"6","body":"\u003cp>Ett metallklot har laddningen \u003cb>+2,5 nC\u003c/b>. Hur många elektroner måste tillföras för att det ska bli neutralt?\u003c/p>\u003cdiv class=\"question\">Föreslå först: varför ska elektroner \u003cem>tillföras\u003c/em>?\u003c/div>\u003cdiv class=\"step\">\u003cp>\u003cb>1 · Modell:\u003c/b> Positivt klot har elektronunderskott. Varje tillförd elektron ger laddningsändringen −e, där e = 1,602 · 10⁻¹⁹ C.\u003c/p>\u003c/div>\u003cdiv class=\"step\">\u003cp>\u003cb>2 · SI-enhet:\u003c/b> Q = +2,5 · 10⁻⁹ C.\u003c/p>\u003c/div>\u003cdiv class=\"step\">\u003cp>\u003cb>3 · Samband:\u003c/b> Klotet är neutralt när slutladdningen är noll.\u003c/p>\u003cdiv class=\"fy1-36-math-steps\">\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>Q\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi>N\u003c/mi>\u003cmi>e\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/math>\u003c/div>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>N\u003c/mi>\u003cmi>e\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>Q\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>N\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>e\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"step\">\u003cdiv class=\"fy1-36-math-steps\">\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>N\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2,5\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>9\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.18em\"/>\u003cmtext>C\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>1,602\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>19\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.18em\"/>\u003cmtext>C\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>N\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2,5\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmn>1,602\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>10\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>N\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>1,56\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>10\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>N\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>1,6\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>10\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"step\">\u003cp class=\"answer\">\u003cb>Svar:\u003c/b> Cirka \u003cb>16 miljarder elektroner\u003c/b> behöver tillföras. \u003cb>Kontroll:\u003c/b> Q − Ne ≈ 0 C.\u003c/p>\u003c/div>","side":"\u003cfigure class=\"lesson-figure \">\u003csvg viewBox=\"0 0 600 270\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Ett positivt metallklot tillförs elektroner\">\u003ctitle>Ett positivt metallklot tillförs elektroner\u003c/title>\u003cdesc>Positivt klot på 2,5 nanocoulomb och negativa elektroner som förs mot klotet. Symboler är schematiska och visar inte det verkliga elektronantalet.\u003c/desc>\u003ccircle cx=\"175\" cy=\"145\" r=\"70\" fill=\"#edf4f6\" stroke=\"#b85b45\" stroke-width=\"6\"/>\n\u003ctext x=\"175\" y=\"135\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"750\" fill=\"#ae5743\">+\u003c/text>\n\u003ctext x=\"175\" y=\"169\" text-anchor=\"middle\" font-size=\"17\" fill=\"#345766\">2,5 nC\u003c/text>\n\u003cpath d=\"M430 145 H295\" stroke=\"#13849d\" stroke-width=\"5\" fill=\"none\"/>\u003cpath d=\"M312 135 L294 145 L312 155\" stroke=\"#13849d\" stroke-width=\"4\" fill=\"none\"/>\n\u003ccircle cx=\"452\" cy=\"118\" r=\"18\" fill=\"#147992\"/>\u003ctext x=\"452\" y=\"126\" text-anchor=\"middle\" font-size=\"24\" fill=\"white\">−\u003c/text>\n\u003ccircle cx=\"487\" cy=\"150\" r=\"18\" fill=\"#147992\"/>\u003ctext x=\"487\" y=\"158\" text-anchor=\"middle\" font-size=\"24\" fill=\"white\">−\u003c/text>\n\u003ccircle cx=\"450\" cy=\"183\" r=\"18\" fill=\"#147992\"/>\u003ctext x=\"450\" y=\"191\" text-anchor=\"middle\" font-size=\"24\" fill=\"white\">−\u003c/text>\n\u003ctext x=\"350\" y=\"222\" text-anchor=\"middle\" font-size=\"18\" fill=\"#345766\">Elektroner måste tillföras\u003c/text>\u003c/svg>\u003cfigcaption>Klotet är positivt från början. Minustecknen symboliserar elektroner som tillförs; endast tre är ritade, inte det verkliga antalet.\u003c/figcaption>\u003c/figure>","teacher":"Stoppa efter steg 2 och låt eleverna välja samband. Överarbeta inte att 2,5 nC och e inte ger exakt heltal vid angiven precision. Stäm av enhet C/C och kontrollera att svaret är positivt antal."},{"title":"Exempel 2 · Kraften mellan proton och elektron","label":"Genomarbetat exempel · stegvis","source":"7","body":"\u003cp>En proton och en elektron befinner sig på avståndet \u003cb>0,051 nm\u003c/b>. Bestäm kraften i den klassiska punktladdningsmodellen.\u003c/p>\u003cdiv class=\"question\">Rita krafterna på partiklarna. Är växelverkan attraktiv eller repulsiv?\u003c/div>\u003cdiv class=\"step\">\u003cp>\u003cb>1 · Riktning:\u003c/b> Olika laddningstecken → attraktion. Krafterna är lika stora men motriktade.\u003c/p>\u003cfigure class=\"lesson-figure \">\u003csvg viewBox=\"0 0 560 260\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Proton och elektron med attraktiva kraftpilar\">\u003ctitle>Proton och elektron med attraktiva kraftpilar\u003c/title>\u003cdesc>Kraften på protonen pekar åt höger mot elektronen och kraften på elektronen åt vänster mot protonen. Krafterna är lika stora och motriktade.\u003c/desc>\u003ccircle cx=\"125\" cy=\"135\" r=\"27\" fill=\"#bc634c\"/>\u003ctext x=\"125\" y=\"145\" fill=\"white\" text-anchor=\"middle\" font-size=\"34\">+\u003c/text>\n\u003ccircle cx=\"435\" cy=\"135\" r=\"27\" fill=\"#147992\"/>\u003ctext x=\"435\" y=\"145\" fill=\"white\" text-anchor=\"middle\" font-size=\"34\">−\u003c/text>\n\u003cpath d=\"M163 135 H230\" stroke=\"#217a6d\" stroke-width=\"5\"/>\u003cpath d=\"M214 125 L232 135 L214 145\" stroke=\"#217a6d\" stroke-width=\"4\" fill=\"none\"/>\n\u003cpath d=\"M397 135 H330\" stroke=\"#217a6d\" stroke-width=\"5\"/>\u003cpath d=\"M346 125 L328 135 L346 145\" stroke=\"#217a6d\" stroke-width=\"4\" fill=\"none\"/>\n\u003ctext x=\"280\" y=\"95\" text-anchor=\"middle\" fill=\"#1c665f\" font-size=\"19\" font-weight=\"650\">Lika stora, motriktade krafter\u003c/text>\n\u003cpath d=\"M125 189 V200 H435 V189\" stroke=\"#75949e\" stroke-width=\"2\" fill=\"none\"/>\u003ctext x=\"280\" y=\"230\" text-anchor=\"middle\" fill=\"#355966\" font-size=\"20\">r = 0,051 nm\u003c/text>\u003c/svg>\u003cfigcaption>Kraften på protonen pekar mot elektronen och omvänt. Pilarna visar riktning, inte storlek.\u003c/figcaption>\u003c/figure>\u003c/div>\u003cdiv class=\"step\">\u003cp>\u003cb>2 · SI-enheter:\u003c/b> Omvandla först längden. Skriv sedan laddningarna separat.\u003c/p>\u003cdiv class=\"fy1-36-math-steps\">\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>r\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0,051\u003c/mn>\u003cmspace width=\"0.18em\"/>\u003cmtext>nm\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>r\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0,051\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>9\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.18em\"/>\u003cmtext>m\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>r\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>5,1\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>11\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.18em\"/>\u003cmtext>m\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>+\u003c/mo>\u003cmn>1,602\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>19\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.18em\"/>\u003cmtext>C\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>1,602\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>19\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.18em\"/>\u003cmtext>C\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"step\">\u003cp>\u003cb>3 · Insättning:\u003c/b>\u003c/p>\u003cdiv class=\"fy1-36-math-steps\">\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://w display=\"block\">\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmn>2,601\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>21\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.18em\"/>\u003cmtext>m²\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>k\u003c/mi>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>≈\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>2,307\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>28\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.18em\"/>\u003cmtext>N·m²\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>F\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2,307\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmn>2,601\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>7\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.18em\"/>\u003cmtext>N\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"step\">\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>F\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>8,87\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>8\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.18em\"/>\u003cmtext>N\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>F\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>8,9\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>8\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmtext> N\u003c/mtext>\u003c/math>\u003c/div>\u003cp>\u003cb>Svar:\u003c/b> Attraktion. Kraftens storlek på \u003cem>var och en\u003c/em> är 8,9 · 10⁻⁸ N. Minustecknet anger attraktion enligt vår konvention, inte vänster/höger.\u003c/p>\u003c/div>","side":"\u003cfigure class=\"lesson-figure \">\u003csvg viewBox=\"0 0 560 270\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Proton och elektron utan inritade kraftpilar\">\u003ctitle>Proton och elektron utan inritade kraftpilar\u003c/title>\u003cdesc>Proton till vänster, elektron till höger, avstånd 0,051 nanometer. Eleverna ska själva förutsäga krafternas riktning.\u003c/desc>\u003ccircle cx=\"125\" cy=\"140\" r=\"27\" fill=\"#bc634c\"/>\u003ctext x=\"125\" y=\"150\" fill=\"white\" text-anchor=\"middle\" font-size=\"34\">+\u003c/text>\n\u003ccircle cx=\"435\" cy=\"140\" r=\"27\" fill=\"#147992\"/>\u003ctext x=\"435\" y=\"150\" fill=\"white\" text-anchor=\"middle\" font-size=\"34\">−\u003c/text>\n\u003cpath d=\"M125 196 V207 H435 V196\" stroke=\"#75949e\" stroke-width=\"2\" fill=\"none\"/>\u003ctext x=\"280\" y=\"233\" text-anchor=\"middle\" fill=\"#355966\" font-size=\"20\">r = 0,051 nm\u003c/text>\n\u003ctext x=\"125\" y=\"94\" text-anchor=\"middle\" fill=\"#315564\" font-size=\"19\">proton\u003c/text>\u003ctext x=\"435\" y=\"94\" text-anchor=\"middle\" fill=\"#315564\" font-size=\"19\">elektron\u003c/text>\u003c/svg>\u003cfigcaption>Börja med att själv markera riktningarna. Det är en klassisk kraftmodell vid givet avstånd, inte en bild av elektronens kvantmekaniska tillstånd i en väteatom.\u003c/figcaption>\u003c/figure>","teacher":"Be eleverna först rita två lika stora, motsatta kraftpilar. Matematikledens SI-omvandling och enhet måste vara synliga. Förklara att väteatomens elektron i verkligheten beskrivs kvantmekaniskt; här används den förenklade Coulombmodellen vid angivet r."},{"title":"Socrative → tillsammans → boken","label":"Träna och återkoppla","source":"8","time":"Eget bokarbete prioriteras","body":"\u003cdiv class=\"work-grid\">\u003cdiv class=\"socrative\">\u003cdiv class=\"mini-label\">Befintlig Socrative\u003c/div>\u003cstrong>Fy1 · 901. Laddning\u003c/strong>\u003cp>Quiz-ID: \u003ccode>SOC-36980496\u003c/code>\u003c/p>\u003cp>Rum: \u003cstrong>LRJ\u003c/strong>\u003c/p>\u003col class=\"tight\">\u003cli>Svara själv.\u003c/li>\u003cli>Jämför en förklaring med en kamrat.\u003c/li>\u003cli>Lyft de frågor som behöver gemensam återkoppling.\u003c/li>\u003c/ol>\u003c/div>\u003cdiv class=\"bookbox\">\u003cdiv class=\"mini-label\">Bokens uppgifter\u003c/div>\u003cstrong>801–811\u003c/strong>\u003cp>Arbeta i boken. Visa figur, samband, enheter och fysikalisk tolkning.\u003c/p>\u003cp>\u003cb>Efter behov:\u003c/b> gå tillbaka till de två genomarbetade exemplen för stöd.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"note\">Socrative är en befintlig aktivitet från originallektionen. Webbsidans korta frågor ersätter den inte.\u003c/p>","teacher":"Säkerställ tid till boken, eftersom Fy1 saknar särskild räknestuga. Hoppa över ytterligare gemensam repetition om arbetsfasen blir kort. Originalets Quiz-ID och rumsnamn bevarade."},{"title":"Visa vad du har förstått","label":"Avslut · återkoppla till mål","source":"9","time":"Svara själv först","body":"\u003cdiv class=\"exit-grid\">\u003cdiv>\u003ch2>1 · Förklara laddning\u003c/h2>\u003cp>Ett klot är positivt laddat. Vad betyder det för antalet elektroner jämfört med protoner?\u003c/p>\u003c/div>\u003cdiv>\u003ch2>2 · Använd Coulombs lag\u003c/h2>\u003cp>Avståndet mellan två oförändrade laddningar halveras. Hur ändras kraftens storlek? Visa varför.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"step\">\u003cp>\u003cb>1:\u003c/b> Elektronunderskott. Klotet har färre elektroner än protonernas totala positiva laddning motsvarar.\u003c/p>\u003c/div>\u003cdiv class=\"step\">\u003cp>\u003cb>2:\u003c/b> Halvt avstånd ger fyra gånger större kraft: (r/2)² = r²/4.\u003c/p>\u003c/div>\u003cdiv class=\"endbook\">\u003cdiv>\u003cb>Arbete och läxa\u003c/b>\u003cp>Gör klart \u003cb>801–811\u003c/b> till nästa lektion.\u003c/p>\u003cp>\u003cb>Inför 8.2:\u003c/b> Läs s. 270–280. Läs särskilt de \u003cb>gröna rutorna\u003c/b> noggrant och försök förstå begreppen, sambanden och formlerna.\u003c/p>\u003c/div>\u003cdiv>\u003cb>Dagens tre mål\u003c/b>\u003cp>Förklara laddning · Rita krafter · Beräkna med Coulombs lag\u003c/p>\u003c/div>\u003c/div>","teacher":"Låt eleverna svara på egen hand och självvärdera mot de tre målen. Dölj facit tills de hunnit skriva. Ingen ny Socrative införs."}]}</script><script src="../../gemensamt/models.js"></script><script src="coulomb-model.js?v=revision1"></script><script src="../../gemensamt/app.js"></script><script src="../../gemensamt/sjalvtest.js?v=papper1" defer></script><script src="../../gemensamt/matematik-typografi.js?v=1" defer></script></body></html>
