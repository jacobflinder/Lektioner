<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Coulombs lag · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"><link rel="stylesheet" href="coulomb.css?v=revision1"><link rel="stylesheet" href="../../gemensamt/sjalvtest.css?v=2"></head><body data-fy1-lesson="coulombs-lag"><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Coulombs lag</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Coulombs lag","subject":"Fysik nivå 1","chapter":"8.1 · Elektrisk laddning","source":"261102 Coulombs lag Fy1.pdf","goals":["Förklara hur elektroner kan flyttas och varför den totala laddningen bevaras.","Rita elektriska kraftpilar samt förutsäga hur Coulombkraften ändras med laddning och avstånd.","Beräkna elektrisk kraft och elektronantal med tydliga enheter och rimlighetskontroll."],"pages":[{"title":"Elektroner flyttas – laddning bevaras","label":"Startfråga · förutsäg","source":"1","time":"Enskilt → par","body":"<div class=\"question\">En elektron flyttas från ett neutralt föremål A till ett neutralt föremål B. Vad får A och B för laddning? Vad händer med den totala laddningen?<\/div><p><b>Först:<\/b> Rita laddningstecken och förklara för en kamrat. Använd figuren som stöd.<\/p><div class=\"step\"><p><b>Återkoppling:<\/b> A förlorar en elektron och får elektronunderskott, alltså positiv nettoladdning. B får elektronöverskott, alltså negativ nettoladdning. Protonerna flyttas inte mellan föremålen.<\/p><figure class=\"lesson-figure \"><svg viewBox=\"0 0 650 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Efter elektronförflyttningen blir A positivt och B negativt\"><title>Efter elektronförflyttningen blir A positivt och B negativt<\/title><desc>A har elektronunderskott och B elektronöverskott. Totala nettoladdningen är fortfarande noll.<\/desc><g><rect x=\"22\" y=\"30\" width=\"260\" height=\"160\" rx=\"15\" fill=\"#ecf5f7\" stroke=\"#bfdbe1\"/><text x=\"152\" y=\"61\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"750\" fill=\"#244b59\">A · positiv<\/text><circle cx=\"67\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/><text x=\"67\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"122\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/><text x=\"122\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"177\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/><text x=\"177\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"232\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/><text x=\"232\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"67\" cy=\"150\" r=\"15\" fill=\"#147993\"/><text x=\"67\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><circle cx=\"110\" cy=\"150\" r=\"15\" fill=\"#147993\"/><text x=\"110\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><circle cx=\"153\" cy=\"150\" r=\"15\" fill=\"#147993\"/><text x=\"153\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><\/g><g><rect x=\"365\" y=\"30\" width=\"260\" height=\"160\" rx=\"15\" fill=\"#ecf5f7\" stroke=\"#bfdbe1\"/><text x=\"495\" y=\"61\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"750\" fill=\"#244b59\">B · negativ<\/text><circle cx=\"410\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/><text x=\"410\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"465\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/><text x=\"465\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"520\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/><text x=\"520\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"575\" cy=\"102\" r=\"15\" fill=\"#b85b45\"/><text x=\"575\" y=\"108\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"410\" cy=\"150\" r=\"15\" fill=\"#147993\"/><text x=\"410\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><circle cx=\"453\" cy=\"150\" r=\"15\" fill=\"#147993\"/><text x=\"453\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><circle cx=\"496\" cy=\"150\" r=\"15\" fill=\"#147993\"/><text x=\"496\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><circle cx=\"539\" cy=\"150\" r=\"15\" fill=\"#147993\"/><text x=\"539\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><circle cx=\"582\" cy=\"150\" r=\"15\" fill=\"#147993\"/><text x=\"582\" y=\"156\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><\/g><text x=\"325\" y=\"246\" font-size=\"19\" text-anchor=\"middle\" fill=\"#214956\">+e + (−e) = 0 · totala laddningen bevaras<\/text><\/svg><figcaption>Schematisk laddningsbokföring efter elektronförflyttningen. Varje symbol står för samma laddningsstorlek.<\/figcaption><\/figure><\/div><div class=\"step\"><p><b>Laddning bevaras:<\/b> Det A förlorar får B. Lika tecken repellerar, olika tecken attraherar.<\/p><div class=\"goals-min\"><strong>Efter lektionen ska du kunna<\/strong><span>förklara laddning<\/span><span>rita krafter<\/span><span>använda Coulombs lag<\/span><\/div><\/div>","side":"<figure class=\"lesson-figure \"><svg viewBox=\"0 0 650 300\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Två neutrala föremål: en elektron förs från A till B\"><title>Två neutrala föremål: en elektron förs från A till B<\/title><desc>A och B har lika många plus och minus från början. En elektron går från A till B. Eleverna ska förutsäga nettoladdningarna.<\/desc><g><rect x=\"22\" y=\"36\" width=\"260\" height=\"160\" rx=\"15\" fill=\"#ecf5f7\" stroke=\"#bfdbe1\"/><text x=\"152\" y=\"67\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"750\" fill=\"#244b59\">A · från början neutral<\/text><circle cx=\"67\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/><text x=\"67\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"122\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/><text x=\"122\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"177\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/><text x=\"177\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"232\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/><text x=\"232\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"67\" cy=\"156\" r=\"15\" fill=\"#147993\"/><text x=\"67\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><circle cx=\"110\" cy=\"156\" r=\"15\" fill=\"#147993\"/><text x=\"110\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><circle cx=\"153\" cy=\"156\" r=\"15\" fill=\"#147993\"/><text x=\"153\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><circle cx=\"196\" cy=\"156\" r=\"15\" fill=\"#147993\"/><text x=\"196\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><\/g><g><rect x=\"365\" y=\"36\" width=\"260\" height=\"160\" rx=\"15\" fill=\"#ecf5f7\" stroke=\"#bfdbe1\"/><text x=\"495\" y=\"67\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"750\" fill=\"#244b59\">B · från början neutral<\/text><circle cx=\"410\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/><text x=\"410\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"465\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/><text x=\"465\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"520\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/><text x=\"520\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"575\" cy=\"108\" r=\"15\" fill=\"#b85b45\"/><text x=\"575\" y=\"114\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">+<\/text><circle cx=\"410\" cy=\"156\" r=\"15\" fill=\"#147993\"/><text x=\"410\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><circle cx=\"453\" cy=\"156\" r=\"15\" fill=\"#147993\"/><text x=\"453\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><circle cx=\"496\" cy=\"156\" r=\"15\" fill=\"#147993\"/><text x=\"496\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><circle cx=\"539\" cy=\"156\" r=\"15\" fill=\"#147993\"/><text x=\"539\" y=\"162\" fill=\"white\" font-size=\"22\" text-anchor=\"middle\">−<\/text><\/g><path d=\"M292 132 H350\" stroke=\"#127d96\" stroke-width=\"5\" fill=\"none\"/><path d=\"M337 122 L352 132 L337 142\" stroke=\"#127d96\" stroke-width=\"4\" fill=\"none\"/><text x=\"322\" y=\"96\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\" fill=\"#166981\">en elektron<\/text><text x=\"325\" y=\"254\" text-anchor=\"middle\" font-size=\"19\" fill=\"#345766\">Vad händer med nettoladdningarna?<\/text><\/svg><figcaption>Före förflyttningen är båda föremålen neutrala. Nettoladdningarna går att förutsäga utan att räkna verkliga partiklar.<\/figcaption><\/figure>","quiz":{"prompt":"Elektroner flyttas från A till B. Vilket föremål blir positivt?","options":["A","B","Båda"],"correct":0,"why":"A förlorar elektroner och får positiv nettoladdning. B får motsvarande negativ laddning. Den totala laddningen bevaras."},"teacher":"Låt eleverna bestämma tecken innan de ser återkopplingen. Plus-symbolerna föreställer bunden positiv laddning, minus-symbolerna elektroner."},{"title":"Vad händer i elektroskopet?","label":"Verklig demonstration · observera","source":"2","time":"Rita → observera → förklara","body":"<div class=\"question\">Elektroskopet är från början neutralt. Det tillförs elektroner genom kontakt. Hur rör sig visaren? Rita före demonstrationen.<\/div><ol class=\"tight\"><li><b>Före:<\/b> Rita en förutsägelse på egen hand.<\/li><li><b>Under:<\/b> Observera lärarens verkliga elektroskop.<\/li><li><b>Efter:<\/b> Markera laddningarna på stång och visare. Förklara.<\/li><\/ol><div class=\"step\"><p><b>Förklaring:<\/b> Stång och visare får laddning med samma tecken. De elektriska krafterna mellan dem gör att visaren slår ut.<\/p><figure class=\"lesson-figure \"><svg viewBox=\"0 0 540 315\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Elektroskop efter tillförsel av elektroner\"><title>Elektroskop efter tillförsel av elektroner<\/title><desc>Stången och visaren har negativ laddning. Visaren har slagit ut. Vinkeln är schematisk.<\/desc><circle cx=\"270\" cy=\"157\" r=\"121\" stroke=\"#8aa1ac\" stroke-width=\"3\" fill=\"#f9fcfd\"/>\n<path d=\"M218 43 H322 M270 43 V234\" stroke=\"#20495a\" stroke-width=\"5\"/>\n<path d=\"M270 160 L345 221\" stroke=\"#bd7548\" stroke-width=\"5\"/>\n<text x=\"255\" y=\"130\" font-size=\"22\" text-anchor=\"middle\" fill=\"#137a96\">−<\/text>\n<text x=\"322\" y=\"209\" font-size=\"22\" text-anchor=\"middle\" fill=\"#137a96\">−<\/text>\n<text x=\"270\" y=\"295\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"#225562\">Lika tecken → repulsion<\/text><\/svg><figcaption>Efter tillförsel av elektroner: båda delarna är negativt laddade och stöter bort varandra.<\/figcaption><\/figure><\/div><div class=\"step\"><p><b>Kontrollfråga:<\/b> Kan ett utslag ensamt avslöja om elektroskopet har positiv eller negativ nettoladdning? <b>Nej.<\/b> Både positiv och negativ laddning kan ge ett utslag.<\/p><\/div>","side":"<figure class=\"lesson-figure \"><svg viewBox=\"0 0 540 310\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Elektroskop innan laddning\"><title>Elektroskop innan laddning<\/title><desc>Schema av ett elektroskop med lodrät metallstång och en visare som hänger nedåt.<\/desc><path d=\"M270 52 V75 M217 52 H323 M270 75 V236\" stroke=\"#234f60\" stroke-width=\"6\" fill=\"none\"/>\n<circle cx=\"270\" cy=\"165\" r=\"122\" stroke=\"#8aa1ac\" stroke-width=\"3\" fill=\"#f9fcfd\" opacity=\"0.35\"/>\n<path d=\"M270 78 V238\" stroke=\"#20495a\" stroke-width=\"5\"/><path d=\"M270 165 L270 244\" stroke=\"#bf7549\" stroke-width=\"5\"/>\n<text x=\"270\" y=\"285\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\" fill=\"#355c68\">Före: visaren hänger nedåt<\/text><\/svg><figcaption>Före den verkliga demonstrationen. Den schematiska bilden är inte en ersättning för observationen.<\/figcaption><\/figure>","teacher":"Utför originalets elektroskopdemonstration fysiskt. Begär ritning innan du laddar elektroskopet. Förutsätt i förklaringen laddning via kontakt, inte enbart induktion."},{"title":"Längre avstånd – hur ändras kraften?","label":"Förutsäg → pröva","source":"3","time":"Enskilt → par → modell","body":"<p>Samma två punktladdningar, men olika avstånd. Bara avståndet ändras.<\/p><div class=\"question\">Om kraftens storlek vid <i>r<\/i> är F₀: vad händer vid <i>2r<\/i> och <i>3r<\/i>?<\/div><p>Välj ett svar och <b>motivera först<\/b>. Jämför sedan i par. Använd modellen: ändra endast <i>r<\/i> och låt laddningarna vara oförändrade.<\/p><div class=\"step\"><p><b>Överför:<\/b> Halverar vi avståndet blir kraftens storlek fyra gånger större. Vilken del av sambandet ger det resultatet?<\/p><\/div>","model":"coulomb","quiz":{"prompt":"Vid dubbla avståndet (oförändrade, icke-noll laddningar) blir kraften …","options":["hälften","en fjärdedel","dubbelt","oförändrad"],"correct":1,"why":"Avståndet ingår i kvadrat: (2r)² = 4r², så kraftens storlek blir F₀/4."},"teacher":"Använd originalets r, 2r och 3r. Visa inte modellens värde förrän eleverna har valt och motiverat. Kraftpilarna i modellen visar bara riktning; det numeriska kraftbeloppet har separat skala."},{"title":"Coulombs lag förklarar förändringen","label":"Härled · kontrollera","source":"4","body":"<p>Laddningarnas tecken avgör <b>attraktion eller repulsion<\/b>. Avståndet avgör hur stor kraften blir.<\/p><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>F<\/mi><mo>=<\/mo><mi>k<\/mi><mfrac><mrow><msub><mi>Q<\/mi><mn>1<\/mn><\/msub><msub><mi>Q<\/mi><mn>2<\/mn><\/msub><\/mrow><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/math><\/div><p><b>k<\/b> = 8,99 · 10<sup>9<\/sup> N·m²/C², laddning i C och avstånd i m.<\/p><p class=\"note\"><b>Teckenkonvention i den här lektionen:<\/b> Positivt värde av <i>F<\/i> betecknar <b>repulsion<\/b>, negativt <b>attraktion<\/b>. Detta tecken är <em>inte<\/em> en x-komponent av kraften. Kraftens riktning måste visas med separata pilar.<\/p><div class=\"step\"><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>F<\/mi><mo>∼<\/mo><mfrac><mn>1<\/mn><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/mfrac><\/math><\/div><p>Vid <b>2r<\/b> blir kraftens storlek en fjärdedel.<\/p><\/div><div class=\"step\"><p>Vid <b>3r<\/b> blir den en niondel. Om en laddning fördubblas vid oförändrat avstånd blir kraftens storlek dubbelt så stor.<\/p><\/div>","side":"<figure class=\"lesson-figure \"><svg viewBox=\"0 0 670 350\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Tre lika laddningspar med avstånd r, 2r och 3r\"><title>Tre lika laddningspar med avstånd r, 2r och 3r<\/title><desc>Laddningarna har samma storlek i alla tre fallen. Avstånden är ritade i proportion. Kraftstorleken är F noll, F noll delat med fyra och F noll delat med nio.<\/desc><circle cx=\"100\" cy=\"76\" r=\"19\" fill=\"#b85b45\"/><circle cx=\"215\" cy=\"76\" r=\"19\" fill=\"#b85b45\"/><text x=\"100\" y=\"83\" font-size=\"24\" text-anchor=\"middle\" fill=\"white\">+<\/text><text x=\"215\" y=\"83\" font-size=\"24\" text-anchor=\"middle\" fill=\"white\">+<\/text><path d=\"M100 108 V116 H215 V108\" fill=\"none\" stroke=\"#658894\" stroke-width=\"2\"/><text x=\"157.5\" y=\"135\" text-anchor=\"middle\" font-size=\"18\" fill=\"#315562\">r<\/text><path d=\"M72 76 h-25 m10 -10 l-10 10 l10 10\" fill=\"none\" stroke=\"#26816f\" stroke-width=\"3\"/><path d=\"M243 76 h25 m-10 -10 l10 10 l-10 10\" fill=\"none\" stroke=\"#26816f\" stroke-width=\"3\"/><text x=\"535\" y=\"84\" font-size=\"25\" fill=\"#1c596b\" font-weight=\"760\">F₀<\/text><circle cx=\"100\" cy=\"171\" r=\"19\" fill=\"#b85b45\"/><circle cx=\"330\" cy=\"171\" r=\"19\" fill=\"#b85b45\"/><text x=\"100\" y=\"178\" font-size=\"24\" text-anchor=\"middle\" fill=\"white\">+<\/text><text x=\"330\" y=\"178\" font-size=\"24\" text-anchor=\"middle\" fill=\"white\">+<\/text><path d=\"M100 203 V211 H330 V203\" fill=\"none\" stroke=\"#658894\" stroke-width=\"2\"/><text x=\"215.0\" y=\"230\" text-anchor=\"middle\" font-size=\"18\" fill=\"#315562\">2r<\/text><path d=\"M72 171 h-25 m10 -10 l-10 10 l10 10\" fill=\"none\" stroke=\"#26816f\" stroke-width=\"3\"/><path d=\"M358 171 h25 m-10 -10 l10 10 l-10 10\" fill=\"none\" stroke=\"#26816f\" stroke-width=\"3\"/><text x=\"535\" y=\"179\" font-size=\"25\" fill=\"#1c596b\" font-weight=\"760\">F₀/4<\/text><circle cx=\"100\" cy=\"266\" r=\"19\" fill=\"#b85b45\"/><circle cx=\"445\" cy=\"266\" r=\"19\" fill=\"#b85b45\"/><text x=\"100\" y=\"273\" font-size=\"24\" text-anchor=\"middle\" fill=\"white\">+<\/text><text x=\"445\" y=\"273\" font-size=\"24\" text-anchor=\"middle\" fill=\"white\">+<\/text><path d=\"M100 298 V306 H445 V298\" fill=\"none\" stroke=\"#658894\" stroke-width=\"2\"/><text x=\"272.5\" y=\"325\" text-anchor=\"middle\" font-size=\"18\" fill=\"#315562\">3r<\/text><path d=\"M72 266 h-25 m10 -10 l-10 10 l10 10\" fill=\"none\" stroke=\"#26816f\" stroke-width=\"3\"/><path d=\"M473 266 h25 m-10 -10 l10 10 l-10 10\" fill=\"none\" stroke=\"#26816f\" stroke-width=\"3\"/><text x=\"535\" y=\"274\" font-size=\"25\" fill=\"#1c596b\" font-weight=\"760\">F₀/9<\/text><\/svg><figcaption>Avstånd och laddningar är ritade konsekvent. Kraftens storlek anges som uttryck, inte genom pilarnas längd.<\/figcaption><\/figure>","teacher":"Visa Newtons tredje lag: de två laddningarna påverkar varandra med lika stora och motsatt riktade krafter. Krafternas riktning avgörs av positionen och laddningstecknen; F:s tecken ovan är en särskilt definierad samspelskonvention."},{"title":"Förbered exemplen – välj modell först","label":"Eget första steg","source":"5","time":"Skriv först · jämför i par","body":"<div class=\"task-grid\"><article class=\"mini-card\"><h2>1 · Metallklot<\/h2><p>Ett metallklot har laddningen <b>+2,5 nC<\/b> och ska bli neutralt.<\/p><p><b>Fråga:<\/b> Ska elektroner tillföras eller tas bort? Omvandla nC till C.<\/p><\/article><article class=\"mini-card\"><h2>2 · Proton och elektron<\/h2><p>Avståndet är <b>0,051 nm<\/b>.<\/p><p><b>Fråga:<\/b> Skriv om avståndet till meter. Rita en kraftpil på varje partikel.<\/p><\/article><\/div><p class=\"note\">Skriv själv. Jämför sedan med en kamrat. Motivera <em>varför<\/em> ditt första steg är rimligt.<\/p>","side":"<figure class=\"lesson-figure \"><svg viewBox=\"0 0 560 270\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Proton och elektron utan inritade kraftpilar\"><title>Proton och elektron utan inritade kraftpilar<\/title><desc>Proton till vänster, elektron till höger, avstånd 0,051 nanometer. Eleverna ska själva förutsäga krafternas riktning.<\/desc><circle cx=\"125\" cy=\"140\" r=\"27\" fill=\"#bc634c\"/><text x=\"125\" y=\"150\" fill=\"white\" text-anchor=\"middle\" font-size=\"34\">+<\/text>\n<circle cx=\"435\" cy=\"140\" r=\"27\" fill=\"#147992\"/><text x=\"435\" y=\"150\" fill=\"white\" text-anchor=\"middle\" font-size=\"34\">−<\/text>\n<path d=\"M125 196 V207 H435 V196\" stroke=\"#75949e\" stroke-width=\"2\" fill=\"none\"/><text x=\"280\" y=\"233\" text-anchor=\"middle\" fill=\"#355966\" font-size=\"20\">r = 0,051 nm<\/text>\n<text x=\"125\" y=\"94\" text-anchor=\"middle\" fill=\"#315564\" font-size=\"19\">proton<\/text><text x=\"435\" y=\"94\" text-anchor=\"middle\" fill=\"#315564\" font-size=\"19\">elektron<\/text><\/svg><figcaption>Fråga 2: rita två kraftpilar. Pilarna saknas avsiktligt – det är du som ska sätta ut dem.<\/figcaption><\/figure>","teacher":"Två originaluppgifter före gemensamt genomarbetade lösningar. De får inte försvinna när lektionen överförs. Låt eleverna svara båda själv och förklara en var i par."},{"title":"Exempel 1 · Hur många elektroner?","label":"Genomarbetat exempel · stegvis","source":"6","body":"<p>Ett metallklot har laddningen <b>+2,5 nC<\/b>. Hur många elektroner måste tillföras för att det ska bli neutralt?<\/p><div class=\"question\">Föreslå först: varför ska elektroner <em>tillföras<\/em>?<\/div><div class=\"step\"><p><b>1 · Modell:<\/b> Positivt klot har elektronunderskott. Varje tillförd elektron ger laddningsändringen −e, där e = 1,602 · 10<sup>−19<\/sup> C.<\/p><\/div><div class=\"step\"><p><b>2 · SI-enhet:<\/b> Q = +2,5 · 10<sup>−9<\/sup> C.<\/p><\/div><div class=\"step\"><p><b>3 · Samband:<\/b> Klotet är neutralt när slutladdningen är noll.<\/p><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>Q<\/mi><mo>−<\/mo><mi>N<\/mi><mi>e<\/mi><mo>=<\/mo><mn>0<\/mn><mo>⇒<\/mo><mi>N<\/mi><mo>=<\/mo><mfrac><mi>Q<\/mi><mi>e<\/mi><\/mfrac><\/math><\/div><\/div><div class=\"step\"><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>N<\/mi><mo>=<\/mo><mfrac><mrow><mn>2,5<\/mn><mo>·<\/mo><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>9<\/mn><\/mrow><\/msup><mtext> C<\/mtext><\/mrow><mrow><mn>1,602<\/mn><mo>·<\/mo><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>19<\/mn><\/mrow><\/msup><mtext> C<\/mtext><\/mrow><\/mfrac><mo>≈<\/mo><mn>1,6<\/mn><mo>·<\/mo><msup><mn>10<\/mn><mn>10<\/mn><\/msup><\/math><\/div><\/div><div class=\"step\"><p class=\"answer\"><b>Svar:<\/b> Cirka <b>16 miljarder elektroner<\/b> behöver tillföras. <b>Kontroll:<\/b> Q − Ne ≈ 0 C.<\/p><\/div>","side":"<figure class=\"lesson-figure \"><svg viewBox=\"0 0 600 270\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Ett positivt metallklot tillförs elektroner\"><title>Ett positivt metallklot tillförs elektroner<\/title><desc>Positivt klot på 2,5 nanocoulomb och negativa elektroner som förs mot klotet. Symboler är schematiska och visar inte det verkliga elektronantalet.<\/desc><circle cx=\"175\" cy=\"145\" r=\"70\" fill=\"#edf4f6\" stroke=\"#b85b45\" stroke-width=\"6\"/>\n<text x=\"175\" y=\"135\" text-anchor=\"middle\" font-size=\"36\" font-weight=\"750\" fill=\"#ae5743\">+<\/text>\n<text x=\"175\" y=\"169\" text-anchor=\"middle\" font-size=\"17\" fill=\"#345766\">2,5 nC<\/text>\n<path d=\"M430 145 H295\" stroke=\"#13849d\" stroke-width=\"5\" fill=\"none\"/><path d=\"M312 135 L294 145 L312 155\" stroke=\"#13849d\" stroke-width=\"4\" fill=\"none\"/>\n<circle cx=\"452\" cy=\"118\" r=\"18\" fill=\"#147992\"/><text x=\"452\" y=\"126\" text-anchor=\"middle\" font-size=\"24\" fill=\"white\">−<\/text>\n<circle cx=\"487\" cy=\"150\" r=\"18\" fill=\"#147992\"/><text x=\"487\" y=\"158\" text-anchor=\"middle\" font-size=\"24\" fill=\"white\">−<\/text>\n<circle cx=\"450\" cy=\"183\" r=\"18\" fill=\"#147992\"/><text x=\"450\" y=\"191\" text-anchor=\"middle\" font-size=\"24\" fill=\"white\">−<\/text>\n<text x=\"350\" y=\"222\" text-anchor=\"middle\" font-size=\"18\" fill=\"#345766\">Elektroner måste tillföras<\/text><\/svg><figcaption>Klotet är positivt från början. Minustecknen symboliserar elektroner som tillförs; endast tre är ritade, inte det verkliga antalet.<\/figcaption><\/figure>","teacher":"Stoppa efter steg 2 och låt eleverna välja samband. Överarbeta inte att 2,5 nC och e inte ger exakt heltal vid angiven precision. Stäm av enhet C/C och kontrollera att svaret är positivt antal."},{"title":"Exempel 2 · Kraften mellan proton och elektron","label":"Genomarbetat exempel · stegvis","source":"7","body":"<p>En proton och en elektron befinner sig på avståndet <b>0,051 nm<\/b>. Bestäm kraften i den klassiska punktladdningsmodellen.<\/p><div class=\"question\">Rita krafterna på partiklarna. Är växelverkan attraktiv eller repulsiv?<\/div><div class=\"step\"><p><b>1 · Riktning:<\/b> Olika laddningstecken → attraktion. Krafterna är lika stora men motriktade.<\/p><figure class=\"lesson-figure \"><svg viewBox=\"0 0 560 260\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Proton och elektron med attraktiva kraftpilar\"><title>Proton och elektron med attraktiva kraftpilar<\/title><desc>Kraften på protonen pekar åt höger mot elektronen och kraften på elektronen åt vänster mot protonen. Krafterna är lika stora och motriktade.<\/desc><circle cx=\"125\" cy=\"135\" r=\"27\" fill=\"#bc634c\"/><text x=\"125\" y=\"145\" fill=\"white\" text-anchor=\"middle\" font-size=\"34\">+<\/text>\n<circle cx=\"435\" cy=\"135\" r=\"27\" fill=\"#147992\"/><text x=\"435\" y=\"145\" fill=\"white\" text-anchor=\"middle\" font-size=\"34\">−<\/text>\n<path d=\"M163 135 H230\" stroke=\"#217a6d\" stroke-width=\"5\"/><path d=\"M214 125 L232 135 L214 145\" stroke=\"#217a6d\" stroke-width=\"4\" fill=\"none\"/>\n<path d=\"M397 135 H330\" stroke=\"#217a6d\" stroke-width=\"5\"/><path d=\"M346 125 L328 135 L346 145\" stroke=\"#217a6d\" stroke-width=\"4\" fill=\"none\"/>\n<text x=\"280\" y=\"95\" text-anchor=\"middle\" fill=\"#1c665f\" font-size=\"19\" font-weight=\"650\">Lika stora, motriktade krafter<\/text>\n<path d=\"M125 189 V200 H435 V189\" stroke=\"#75949e\" stroke-width=\"2\" fill=\"none\"/><text x=\"280\" y=\"230\" text-anchor=\"middle\" fill=\"#355966\" font-size=\"20\">r = 0,051 nm<\/text><\/svg><figcaption>Kraften på protonen pekar mot elektronen och omvänt. Pilarna visar riktning, inte storlek.<\/figcaption><\/figure><\/div><div class=\"step\"><p><b>2 · SI-enheter:<\/b> r = 0,051 · 10<sup>−9<\/sup> m = 5,1 · 10<sup>−11<\/sup> m.<\/p><p>Q₁ = +1,602 · 10<sup>−19<\/sup> C, Q₂ = −1,602 · 10<sup>−19<\/sup> C.<\/p><\/div><div class=\"step\"><p><b>3 · Insättning:<\/b><\/p><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>F<\/mi><mo>=<\/mo><mfrac><mrow><mn>8,99<\/mn><mo>·<\/mo><msup><mn>10<\/mn><mn>9<\/mn><\/msup><mo>·<\/mo><mo>(<\/mo><mo>+<\/mo><mn>1,602<\/mn><mo>·<\/mo><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>19<\/mn><\/mrow><\/msup><mo>)<\/mo><mo>·<\/mo><mo>(<\/mo><mo>−<\/mo><mn>1,602<\/mn><mo>·<\/mo><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>19<\/mn><\/mrow><\/msup><mo>)<\/mo><\/mrow><msup><mrow><mo>(<\/mo><mn>5,1<\/mn><mo>·<\/mo><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>11<\/mn><\/mrow><\/msup><mo>)<\/mo><\/mrow><mn>2<\/mn><\/msup><\/mfrac><mtext> N<\/mtext><\/math><\/div><\/div><div class=\"step\"><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>F<\/mi><mo>≈<\/mo><mo>−<\/mo><mn>8,9<\/mn><mo>·<\/mo><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>8<\/mn><\/mrow><\/msup><mtext> N<\/mtext><\/math><\/div><p><b>Svar:<\/b> Attraktion. Kraftens storlek på <em>var och en<\/em> är 8,9 · 10<sup>−8<\/sup> N. Minustecknet anger attraktion enligt vår konvention, inte vänster/höger.<\/p><\/div>","side":"<figure class=\"lesson-figure \"><svg viewBox=\"0 0 560 270\" role=\"img\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Proton och elektron utan inritade kraftpilar\"><title>Proton och elektron utan inritade kraftpilar<\/title><desc>Proton till vänster, elektron till höger, avstånd 0,051 nanometer. Eleverna ska själva förutsäga krafternas riktning.<\/desc><circle cx=\"125\" cy=\"140\" r=\"27\" fill=\"#bc634c\"/><text x=\"125\" y=\"150\" fill=\"white\" text-anchor=\"middle\" font-size=\"34\">+<\/text>\n<circle cx=\"435\" cy=\"140\" r=\"27\" fill=\"#147992\"/><text x=\"435\" y=\"150\" fill=\"white\" text-anchor=\"middle\" font-size=\"34\">−<\/text>\n<path d=\"M125 196 V207 H435 V196\" stroke=\"#75949e\" stroke-width=\"2\" fill=\"none\"/><text x=\"280\" y=\"233\" text-anchor=\"middle\" fill=\"#355966\" font-size=\"20\">r = 0,051 nm<\/text>\n<text x=\"125\" y=\"94\" text-anchor=\"middle\" fill=\"#315564\" font-size=\"19\">proton<\/text><text x=\"435\" y=\"94\" text-anchor=\"middle\" fill=\"#315564\" font-size=\"19\">elektron<\/text><\/svg><figcaption>Börja med att själv markera riktningarna. Det är en klassisk kraftmodell vid givet avstånd, inte en bild av elektronens kvantmekaniska tillstånd i en väteatom.<\/figcaption><\/figure>","teacher":"Be eleverna först rita två lika stora, motsatta kraftpilar. Matematikledens SI-omvandling och enhet måste vara synliga. Förklara att väteatomens elektron i verkligheten beskrivs kvantmekaniskt; här används den förenklade Coulombmodellen vid angivet r."},{"title":"Socrative → tillsammans → boken","label":"Träna och återkoppla","source":"8","time":"Eget bokarbete prioriteras","body":"<div class=\"work-grid\"><div class=\"socrative\"><div class=\"mini-label\">Befintlig Socrative<\/div><strong>Fy1 · 901. Laddning<\/strong><p>Quiz-ID: <code>SOC-36980496<\/code><\/p><p>Rum: <strong>LRJ<\/strong><\/p><ol class=\"tight\"><li>Svara själv.<\/li><li>Jämför en förklaring med en kamrat.<\/li><li>Lyft de frågor som behöver gemensam återkoppling.<\/li><\/ol><\/div><div class=\"bookbox\"><div class=\"mini-label\">Bokens uppgifter<\/div><strong>801–811<\/strong><p>Arbeta i boken. Visa figur, samband, enheter och fysikalisk tolkning.<\/p><p><b>Efter behov:<\/b> gå tillbaka till de två genomarbetade exemplen för stöd.<\/p><\/div><\/div><p class=\"note\">Socrative är en befintlig aktivitet från originallektionen. Webbsidans korta frågor ersätter den inte.<\/p>","teacher":"Säkerställ tid till boken, eftersom Fy1 saknar särskild räknestuga. Hoppa över ytterligare gemensam repetition om arbetsfasen blir kort. Originalets Quiz-ID och rumsnamn bevarade."},{"title":"Visa vad du har förstått","label":"Avslut · återkoppla till mål","source":"9","time":"Svara själv först","body":"<div class=\"exit-grid\"><div><h2>1 · Förklara laddning<\/h2><p>Ett klot är positivt laddat. Vad betyder det för antalet elektroner jämfört med protoner?<\/p><\/div><div><h2>2 · Använd Coulombs lag<\/h2><p>Avståndet mellan två oförändrade laddningar halveras. Hur ändras kraftens storlek? Visa varför.<\/p><\/div><\/div><div class=\"step\"><p><b>1:<\/b> Elektronunderskott. Klotet har färre elektroner än protonernas totala positiva laddning motsvarar.<\/p><\/div><div class=\"step\"><p><b>2:<\/b> Halvt avstånd ger fyra gånger större kraft: (r/2)² = r²/4.<\/p><\/div><div class=\"endbook\"><div><b>Arbete och läxa<\/b><p>Gör klart <b>801–811<\/b> till nästa lektion.<\/p><p><b>Inför 8.2:<\/b> Läs s. 270–280. Läs särskilt de <b>gröna rutorna<\/b> noggrant och försök förstå begreppen, sambanden och formlerna.<\/p><\/div><div><b>Dagens tre mål<\/b><p>Förklara laddning · Rita krafter · Beräkna med Coulombs lag<\/p><\/div><\/div>","teacher":"Låt eleverna svara på egen hand och självvärdera mot de tre målen. Dölj facit tills de hunnit skriva. Ingen ny Socrative införs."}]}</script><script src="../../gemensamt/models.js"></script><script src="coulomb-model.js?v=revision1"></script><script src="../../gemensamt/app.js"></script><script src="../../gemensamt/sjalvtest.js?v=2" defer></script><script src="../../gemensamt/resonemang-81-82.js?v=1" defer></script></body></html>
