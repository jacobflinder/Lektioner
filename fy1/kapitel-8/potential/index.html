<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Potential · Fysik nivå 1</title><link rel="stylesheet" href="../../_gemensamt/lektion.css"></head><body><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Potential</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Potential","subject":"Fysik nivå 1","chapter":"8.6 · Potential","source":"Fy1_Potential.pdf","goals":["Skilja potential i en punkt från spänning mellan två punkter.","Bestämma potentialer genom en vandring i en krets.","Förklara vad vald nollnivå ändrar och vad som är oförändrat."],"pages":[{"title":"Potential: var är vi – vad skiljer två punkter?","body":"<div class=\"question\">A har potentialen 12 V och B 8 V. Vad är potentialskillnaden?<\/div><p>Syftet är att förstå spänningsmätning och energibalans i elektriska kretsar.<\/p><div class=\"goals\"><article><b>1<\/b> Potential i en punkt och spänning mellan två.<\/article><article><b>2<\/b> Potentialvandring med tecken.<\/article><article><b>3<\/b> Välja nollnivå.<\/article><\/div>","source":"1","teacher":"Börja med startfrågan och elevernas egna resonemang, inte färdig formel."},{"title":"Från kateder till bänk: nivå eller skillnad?","body":"<p>Gör den verkliga demonstrationen med kateder, lägre bänk och golv.<\/p><ul><li>Kateder: motsvarar 12 V.<\/li><li>Bänk: motsvarar 8 V.<\/li><li>Golv: vald nollnivå 0 V.<\/li><\/ul><div class=\"question\">Vad motsvarar nivå, respektive nivåskillnad? Vilket steg är störst: 12 → 8 eller 8 → 0?<\/div><div class=\"note\">Höjden är en <b>analogi<\/b>; riktiga bänkhöjder motsvarar inte uppmätta volt. Rita gärna motstånd som potentialfall när analogin kopplas till kretsen.<\/div>","source":"2","steps":["<p>Nivå → potential. Nivåskillnad → spänning. Från 12 V till 8 V är skillnaden 4 V; från 8 V till 0 V är den 8 V.<\/p>"],"teacher":"Utför demonstrationen fysiskt och rita två resistorer i kretsschemat för att anknyta de två fallen till fysik.","side":"<figure class=\"graph static-graph\"><svg role=\"img\" aria-label=\"Höjd representerar potential och höjdskillnad representerar spänning – endast en analogi.\" viewBox=\"0 0 535 320\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M60 280H485\" stroke=\"#6f8893\" stroke-width=\"3\"/><rect x=\"80\" y=\"78\" width=\"132\" height=\"202\" fill=\"#deebe9\" stroke=\"#8ab0a8\" stroke-width=\"3\"/><rect x=\"265\" y=\"144\" width=\"120\" height=\"136\" fill=\"#deebe9\" stroke=\"#8ab0a8\" stroke-width=\"3\"/><text x=\"146\" y=\"56\" fill=\"#214956\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">Kateder · 12 V<\/text><text x=\"327\" y=\"124\" fill=\"#214956\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">Bänk · 8 V<\/text><text x=\"415\" y=\"304\" fill=\"#214956\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">Golv · 0 V<\/text><path d=\"M237 95V146M231 139L237 147L243 139\" fill=\"none\" stroke=\"#c66d4c\" stroke-width=\"3\"/><text x=\"247\" y=\"119\" fill=\"#b76b46\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">4 V<\/text><\/svg><figcaption class=\"figcap\">Höjd representerar potential och höjdskillnad representerar spänning – endast en analogi.<\/figcaption><\/figure>"},{"title":"Mätordningen bestämmer tecknet","body":"<p>Röd voltmeterledning i A, svart i B ger U<sub>AB<\/sub> = V<sub>A<\/sub> − V<sub>B<\/sub>.<\/p><div class=\"question\">A = −3 V, B = +2 V. Vad är U<sub>AB<\/sub>?<\/div>","source":"3","steps":["<div class=\"mathrow\">U<sub>AB<\/sub> = 12 − 8 = +4 V<\/div>","<div class=\"mathrow\">U<sub>BA<\/sub> = 8 − 12 = −4 V<\/div>","<div class=\"mathrow\">Din tur: U<sub>AB<\/sub> = (−3) − (+2) = −5 V<\/div>","<p>Tecknet anger mätordningen; byt voltmeterledningarna så byter utslaget tecken.<\/p>"],"teacher":"Skilj spänning mellan specificerade punkter från spänningens positiva storlek."},{"title":"Fältet pekar mot lägre potential","body":"<p>En positiv vänsterplatta har potentialen +100 V och högerplattan 0 V. Det elektriska fältet pekar åt höger.<\/p><div class=\"question\">Släpp en positiv laddning och en elektron från vila. Vilken riktning får deras kraft och acceleration?<\/div><div class=\"mathrow\">Eₚ = qV<\/div>","source":"4","steps":["<p>Positiv laddning rör sig i fältets riktning, åt höger.<\/p>","<p>En elektron påverkas motsatt fältet, åt vänster.<\/p>","<p>Båda kan minska sin potentiella energi, eftersom q har olika tecken.<\/p>"],"teacher":"Relatera till fältlektionens riktade kraft och förklara varför elektronens rörelse sker mot högre V."},{"title":"Din tur: riktning och nollnivå","body":"<p>Samma två plattor har +100 V och 0 V.<\/p><div class=\"question\">1. Åt vilket håll rör sig en elektron från vila?<\/div><div class=\"question\">2. Vi anger nu samma punkter som 0 V och −100 V. Ändras spänningen, fältet eller elektronens rörelse?<\/div>","source":"5","teacher":"Eleverna behöver förklara och visa en differens, inte bara svara ja/nej."},{"title":"Ny nollnivå – samma fysik","body":"<p>Elektronen rör sig mot högre potential, åt vänster. Vi sänker båda angivna potentialer med 100 V utan att förändra den fysiska kopplingen.<\/p>","source":"6","steps":["<div class=\"mathrow\">(100 − 0) V = (0 − (−100)) V = 100 V<\/div>","<p>Spänningen är oförändrad. Därmed är fält och kraft oförändrade om geometrin är densamma.<\/p>","<p>Att välja potentialens nollnivå förändrar inte batteri, laddningar eller fysiska förbindelser.<\/p>"],"teacher":"Noll potential betyder inte noll laddning."},{"title":"Potentialvandring: följ en hel slinga","body":"<p>Ett idealt batteri på 12 V driver en seriekrets med 2 Ω och 4 Ω. Strömmen är 2 A.<\/p><div class=\"question\">Vi börjar med A som vald nollnivå: V<sub>A<\/sub> = 0 V. Bestäm V<sub>B<\/sub>, V<sub>C<\/sub> och V<sub>D<\/sub>. Vad blir potentialen tillbaka i A?<\/div><p>Vandra A → B → C → D → A. Reglaget markerar var du befinner dig. Markören är en läsordning, inte en elektron. Referensbytet är matematiskt och innebär ingen extra ledning.<\/p>","source":"7–9","model":"potential","steps":["<p>A → B: upp genom batteriet ger +12 V.<\/p>","<p>B → C: ned över 2 Ω ger −RI = −2 Ω·2 A = −4 V.<\/p>","<p>C → D: ned över 4 Ω ger −8 V.<\/p>","<p>D → A: ideal ledning ger 0 V. Tillbaka på 0 V.<\/p>"],"teacher":"Knyt nivåanalogi till verkligt kretsschema med tydligt ritade resistorer; använd samma exempel som originalet."},{"title":"Varje steg får ett motiverat tecken","body":"<p>Ohms lag: U = RI. Samma ström genom båda resistorerna. Dubbelt R ger dubbelt spänningsfall.<\/p><p>Batteri − till +: <b>+U<\/b>. Resistor i strömmens riktning: <b>−RI<\/b>. Vandra motsatt riktning och tecknet byts.<\/p>","source":"10","steps":["<div class=\"mathrow\">V<sub>B<\/sub> = 0 + 12 = 12 V<\/div>","<div class=\"mathrow\">V<sub>C<\/sub> = 12 − 2·2 = 8 V<\/div>","<div class=\"mathrow\">V<sub>D<\/sub> = 8 − 4·2 = 0 V<\/div>","<div class=\"mathrow\">Kirchhoffs andra lag: +12 − 4 − 8 = 0 V<\/div>"],"teacher":"Låt eleverna motivera tecken med vandringsriktningen i stället för att bara memorera regler."},{"title":"Din tur: byt referens till C","body":"<p>Vi behåller samma krets och samma ström, men väljer nu V<sub>C<\/sub> = 0 V.<\/p><div class=\"question\">1. Bestäm V<sub>A<\/sub>, V<sub>B<\/sub> och V<sub>D<\/sub>.<\/div><div class=\"question\">2. Beräkna U<sub>BC<\/sub>. Har spänningen över 2 Ω ändrats?<\/div><p>Använd nollnivå-reglaget i modellen och kontrollera.<\/p>","source":"11","steps":["<p>Potentialerna minskar med 8 V: V<sub>A<\/sub> = −8 V, V<sub>B<\/sub> = +4 V, V<sub>C<\/sub> = 0 V, V<sub>D<\/sub> = −8 V.<\/p>","<p>U<sub>BC<\/sub> = 4 V; potentialskillnaden och strömmen är oförändrade.<\/p>"],"teacher":"Först egen beräkning, sedan modellens återkoppling."},{"title":"Negativ potential är lägre än vald nollnivå","body":"<p>Att byta matematisk referens betyder inte att vi drar en ny fysisk ledning.<\/p><div class=\"panel\"><b>Skilj två handlingar<\/b><ol><li>Välja att beskriva en punkt som 0 V: endast referensbyte.<\/li><li>Fysiskt förbinda två punkter med en ledning: kan ändra kopplingen och skapa kortslutning.<\/li><\/ol><\/div>","source":"12","steps":["<div class=\"mathrow\">V<sub>A<\/sub> = −8 V, V<sub>B<\/sub> = +4 V, V<sub>C<\/sub> = 0 V, V<sub>D<\/sub> = −8 V<\/div>","<div class=\"mathrow\">U<sub>BC<\/sub> = 4 − 0 = 4 V<\/div>","<p>Spänningarna är oförändrade även om alla potentialvärden förskjuts lika mycket.<\/p>"],"teacher":"Diskutera ordet \"jord\" – 0 V i ett schema är en referens, fysisk förbindelse kräver en faktisk ledare."},{"title":"Två batterier: låt polariteten styra","body":"<p>En 10 V-källa driver mot en 6 V-källa i en krets vars resistans är 2 Ω.<\/p><div class=\"question\">Förutsäg strömriktningen. Vänd därefter 6 V-batteriet – vilken ström ger samma modell?<\/div>","source":"13","steps":["<div class=\"mathrow\">+10 V − 6 V − 2 Ω · I = 0<\/div>","<div class=\"mathrow\">I = (10 − 6)/2 = 2 A<\/div>","<p>Om 6 V-källan vänds samverkar källorna:<\/p>","<div class=\"mathrow\">I = (10 + 6)/2 = 8 A<\/div>","<p>Den första kopplingen driver ström in i 6 V-källans pluspol.<\/p>"],"teacher":"Använd polaritetsmarkeringar; dessa tal följer originalets ideala källmodell."},{"title":"Socrative · elfält och potential","body":"<div class=\"socrative\"><h2>Socrative · Fy1 · 905. Elfält och potential<\/h2><p>Quiz-ID: <code>SOC-37397534<\/code><\/p><ol><li>Svara enskilt.<\/li><li>Jämför och förklara i par.<\/li><li>Gemensam återkoppling: motivera med fysik.<\/li><\/ol><\/div><p>Motivera med fältriktning, potentialskillnad och potentialvandring.<\/p>","source":"14","teacher":"Befintlig Socrative; den ska inte ersättas med webbsidans korta repetitionsfrågor."},{"title":"Bokens uppgifter · visa vad du kan","body":"<div class=\"bookbox\"><strong>Bokens uppgifter: 861–870<\/strong><p>s. 313–314.<\/p><p><b>Lässtöd:<\/b> avsnitt 8.6, s. 309–312.<\/p><p>Börja själv. Jämför sedan resonemang och kontrollera en hel slinga.<\/p><\/div><div class=\"question\">Exit: A ligger på +5 V och B på −1 V. 1) Beräkna U<sub>AB<\/sub>. 2) Välj A = 0 V: vad blir V<sub>B<\/sub>? 3) Vad ändras och vad ändras inte?<\/div>","source":"15","time":"Bokarbete + exit","steps":["<p>U<sub>AB<\/sub> = 5 − (−1) = +6 V.<\/p>","<p>Med A som nollnivå blir V<sub>B<\/sub> = −6 V. Spänningen mellan punkterna förblir +6 V.<\/p>"],"teacher":"Håll exitfrågan kort för att skydda bokarbetet."},{"title":"Fördjupning: två grenar matar samma resistor","body":"<p>En fördjupningskrets innehåller två källgrenar (10 V och 8 V) samt en belastningsresistor på 4 Ω. Grenresistanserna är 2 Ω och 4 Ω.<\/p><div class=\"question\">Sätt den gemensamma övre nodens potential till V. Bestäm V via Kirchhoffs första lag.<\/div>","source":"16","steps":["<div class=\"mathrow\">I₁ = (10 − V)/2; &nbsp; I₂ = (8 − V)/4; &nbsp; I = V/4<\/div>","<div class=\"mathrow\">I₁ + I₂ = I<\/div>","<div class=\"mathrow\">2(10 − V) + (8 − V) = V<\/div>","<div class=\"mathrow\">V = 7 V<\/div>","<div class=\"mathrow\">I₁ = 1,5 A; &nbsp; I₂ = 0,25 A; &nbsp; I = 1,75 A<\/div>","<p>Kontroll: 1,5 + 0,25 = 1,75 A. Negativ beräknad grenström hade betytt motsatt riktning.<\/p>"],"teacher":"Frivilligt stöd för elever som är klara med boken. Inte en extra kärngenomgång."}]}</script><script src="../../_gemensamt/models.js"></script><script src="../../_gemensamt/app.js"></script></body></html>
