<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medicinska metoder – interaktivt bildlaboratorium</title>
<style>:root{font:16px/1.5 system-ui,-apple-system,sans-serif;background:#eff6f8;color:#153d4b}*{box-sizing:border-box}body{padding:9px;margin:0}.shell{max-width:1080px;margin:auto}.card{border-radius:14px;background:#fff;border:1px solid #c4dde4;padding:15px;margin:11px 0}.switch{display:flex;gap:7px;flex-wrap:wrap}button{font:inherit;color:#184b5c;background:white;border:1px solid #a6c5cd;padding:9px 12px;border-radius:9px;cursor:pointer}button[aria-pressed=true],button.primary{background:#116d80;color:#fff;border-color:#116d80}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #e6ad4b;outline-offset:3px}.layout{display:grid;grid-template-columns:minmax(245px,340px) minmax(0,1fr);gap:12px}h1{font-size:1.34rem;margin:0 0 7px}h2{font-size:1.06rem;margin:0 0 8px}p{margin:6px 0 10px}.muted{color:#55727c;font-size:.88rem}.switch button{flex:1;white-space:nowrap}.choices{display:grid;gap:7px}.choices button{text-align:left}.visual{background:#112c3c;border-radius:13px;overflow:hidden}.visual svg{width:100%;height:auto;display:block}.visual .lbl{font:16px system-ui;fill:#ecf8fc}.visual .small{font:13px system-ui;fill:#d1eff6}.correct{background:#ebf7ee;border-left:4px solid #2c936d;padding:11px;border-radius:8px}.reading{background:#eaf4f7;border-left:4px solid #398fa2;padding:10px;border-radius:8px;margin:12px 0}#feedback{display:none}#step{font-weight:800;margin-top:10px}#caption{min-height:2.8em}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}@media(max-width:760px){.layout{grid-template-columns:1fr}.switch button{flex:1 1 30%}.card{padding:11px}body{padding:5px}}</style></head><body>
<div class="shell"><div class="card"><h1>Fem medicinska bildmetoder – vilken fysik ger bilden?</h1><p class="muted">Principmodeller, inte verkliga patientbilder eller medicinsk diagnostik. Välj metod, gör en förutsägelse och visa förloppet stegvis.</p><div class="switch" id="modes"><button data-mode="xray" aria-pressed="true">Röntgen</button><button data-mode="ct">Datortomografi</button><button data-mode="mri">Magnetkamera</button><button data-mode="pet">PET</button><button data-mode="gamma">Gammakamera</button></div></div>
<div class="layout"><section class="card"><h2 id="title">Röntgen</h2><p id="description"></p><div class="reading"><b id="question"></b></div><div class="choices" id="answers"></div><div class="controls"><button id="run" class="primary" disabled>Visa första steget</button><button id="reset">Nollställ</button></div><p id="status" class="muted" aria-live="polite">Gör ett val före återkopplingen.</p><p class="correct" id="feedback" aria-live="polite"></p></section><section class="card"><div class="visual"><svg role="img" aria-label="Visuell principmodell över vald medicinsk bildmetod" viewBox="0 0 680 350" id="svg"><g id="layer"></g></svg></div><p id="caption">Välj först vad metoden bygger på.</p><p id="step">Steg 0 av 3</p><div class="reading" id="compare"></div></section></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';let mode='xray',selection=null,stage=0;
const data={
xray:{title:'Röntgen',description:'En röntgenkälla sänder fotoner genom kroppen mot en detektor. Olika vävnader dämpar fotonerna olika mycket.',q:'Vad mäter detektorn framför allt?',opts:['Hur mycket röntgenstrålning som har passerat','Radiovågor från vätekärnor','Gammastrålning från ett injicerat ämne'],correct:0,feed:['Rätt. Detektorn mäter kvarvarande röntgenfotoner efter olika dämpning i vävnaderna. Resultatet är en projektion i två dimensioner.','Nej. Radiovågssignaler från vätekärnor används i MR, inte vanlig röntgen.','Nej. Det beskriver nuklearmedicinska metoder. Röntgenfotonerna kommer från apparaten.'],steps:['En röntgenkälla skickar in fotoner.','Tätare vävnad som ben dämpar strålen mer.','Detektorn visar en 2D-projektionsbild: benet framträder annorlunda än mjukvävnaden.'],compare:'Använder joniserande röntgenstrålning. Bilden visar främst anatomisk dämpning.'},
ct:{title:'Datortomografi (CT/DT)',description:'Röntgenkälla och detektor mäter från flera vinklar. Datorn bygger snittbilder, som kan kombineras till en 3D-bild.',q:'Varför kan CT visa snitt av kroppen?',opts:['Flera röntgenprojektioner tas från olika riktningar','En enda vanlig röntgenbild förstoras','Bara magnetfält används'],correct:0,feed:['Rätt. Många projektioner från flera vinklar rekonstrueras till tvärsnitt.','Nej. En enda projektion innehåller inte tillräcklig information för att beräkna separata snitt.','Nej. CT använder röntgenfotoner, alltså joniserande strålning, till skillnad från MR.'],steps:['Röntgenkälla och detektor roterar kring patienten.','Många projektioner registreras från olika vinklar.','Datorn rekonstruerar tvärsnitt och vid behov en volymbild.'],compare:'Använder joniserande röntgenstrålning; skiljer sig från en enda 2D-röntgenbild genom de många vinklarna.'},
mri:{title:'Magnetkamera (MR)',description:'Starka magnetfält och radiovågspulser påverkar vätekärnornas magnetiska egenskaper. Signaler används för att skapa bilder.',q:'Vilket påstående stämmer om MR?',opts:['MR bygger på röntgenfotoner','MR använder magnetfält och radiovågor','MR kräver en radioaktiv spårsubstans'],correct:1,feed:['Nej. MR använder inte röntgenfotoner och bygger inte på joniserande strålning.','Rätt. MR använder magnetfält och radiovågor för att registrera signaler från bland annat vätekärnor.','Nej. Radioaktiva spårämnen används vid PET/gammakamera, inte vid en vanlig MR-undersökning.'],steps:['Ett starkt magnetfält påverkar vätekärnornas magnetiska moment.','Radiovågspulser påverkar kärnorna; deras svar ger signaler.','Signalernas läge och egenskaper används för en bild, ofta med hög mjukdelskontrast.'],compare:'Använder inte joniserande strålning för själva avbildningen.'},
pet:{title:'PET – positronemissionstomografi',description:'Ett radioaktivt spårämne avger positroner. Positroner möter elektroner och ger två gammafotoner som registreras i motsatta riktningar.',q:'Vilken händelse gör att PET-ringen kan lokalisera en händelse?',opts:['Två gammafotoner registreras ungefär samtidigt i motsatta riktningar','En röntgenkälla roterar runt patienten','Vätekärnor avger en radiosignal utan radioaktivt ämne'],correct:0,feed:['Rätt. Samtidig registrering av två annihilationsfotoner anger en linje genom händelsen; många händelser ger en aktivitetsbild.','Nej. Rotation av en röntgenkälla beskriver CT, inte PET:s koincidensregistrering.','Nej. Det beskriver signalprincipen i MR. PET använder radioaktivt spårämne.'],steps:['En positron från spårämnet bromsas och möter en elektron.','De annihilerar och ger två gammafotoner åt nästan motsatta håll.','Detektorringen registrerar samtidiga träffar och rekonstruerar fördelningen av spårämnet.'],compare:'Använder joniserande strålning från spårämnet. PET kombineras ofta med CT för att koppla funktion till anatomi.'},
gamma:{title:'Gammakamera (skintigrafi)',description:'Ett radioaktivt ämne inne i kroppen avger gammafotoner direkt. En kollimator och detektor mäter varifrån fotonerna kommer.',q:'Vad skiljer gammakamera från PET i dessa modeller?',opts:['Gammakameran mäter oftast enskilda gammafotoner genom kollimator','Gammakameran mäter alltid två annihilationsfotoner i koincidens','Gammakameran använder enbart radiovågor'],correct:0,feed:['Rätt. Gammakameran mäter gammafotoner med hjälp av en kollimator som begränsar riktningarna.','Nej. Det är typiskt för PET; gammakamera använder kollimation och detektion av gammafotoner.','Nej. Det är MR som använder radiovågor. Gammakameran registrerar gammafotoner.'],steps:['En radioaktiv spårsubstans fördelas i kroppen och sänder ut gammafotoner.','Kollimatorn släpper främst igenom fotoner från utvalda riktningar.','Detektorn bygger en bild av spårämnets utbredning, till exempel i skelettet.'],compare:'Använder joniserande strålning från spårämne, men inte PET:s typiska parvisa annihilationsdetektion.'}
};
function put(kind,attr,txt){const n=document.createElementNS(ns,kind);for(const [k,v] of Object.entries(attr||{}))n.setAttribute(k,v);if(txt!==undefined)n.textContent=txt;$('layer').append(n);return n}
function text(x,y,str,size=16){put('text',{x,y,fill:'#edf9fa','font-size':size,'font-family':'system-ui','text-anchor':'middle'},str)}
function line(x1,y1,x2,y2,color='#e4ca7f',width=4,dashed=false){put('line',{x1,y1,x2,y2,stroke:color,'stroke-width':width,...(dashed?{'stroke-dasharray':'9 7'}:{})})}
function circle(x,y,r,color){put('circle',{cx:x,cy:y,r,fill:color})}
function rect(x,y,w,h,color,rx=8){put('rect',{x,y,width:w,height:h,rx,fill:color})}
function patient(){put('ellipse',{cx:350,cy:165,rx:105,ry:113,fill:'#507787',stroke:'#a6c9d4','stroke-width':3});text(350,312,'kropp · förenklad',15)}
function draw(){while($('layer').firstChild)$('layer').firstChild.remove();if(mode==='xray'){patient();rect(35,130,80,70,'#b7e0e8');text(75,170,'källa',16);rect(563,81,56,162,'#9ee0ce');text(591,271,'detektor',14);if(stage>=1)for(let i=0;i<6;i++)line(120,144+i*9,553,108+i*24,'#e7c776',1.8);if(stage>=2){rect(332,122,35,96,'#e3f2de');text(352,110,'ben',16)}if(stage>=3){rect(566,112,48,104,'#225567',4);rect(578,128,23,72,'#d6f9f2',2);text(591,304,'2D',16)}}
else if(mode==='ct'){patient();put('circle',{cx:350,cy:164,r:144,stroke:'#aed7e0','stroke-width':15,fill:'none'});rect(485,140,48,54,'#f4cb7f');text(514,128,'röntgen',14);if(stage>=1){line(481,166,235,166);line(350,20,350,309);text(320,31,'roterar',14)}if(stage>=2){for(let v=0;v<8;v++){const theta=v*Math.PI/4;const x1=350+140*Math.cos(theta),y1=165+140*Math.sin(theta),x2=350-140*Math.cos(theta),y2=165-140*Math.sin(theta);line(x1,y1,x2,y2,'#efbd6c',2,true)}}if(stage>=3){rect(299,115,102,102,'#1a4f5c');circle(350,165,28,'#b2d9d7');circle(343,155,9,'#f6c179');text(350,244,'snittbild',15)}}
else if(mode==='mri'){patient();put('ellipse',{cx:350,cy:165,rx:152,ry:133,stroke:'#7dd0e1','stroke-width':12,fill:'none'});text(351,28,'starkt magnetfält',18);if(stage>=1){for(let j=-2;j<=2;j++)line(215,95+j*20,480,95+j*20,'#9de6ef',2,true);}if(stage>=2){for(let x=292;x<=415;x+=20)put('path',{d:'M'+x+' 125 Q'+(x+15)+' 160 '+x+' 195',stroke:'#edc37a','stroke-width':2,fill:'none'});text(345,223,'RF-signal',17)}if(stage>=3){rect(296,108,108,107,'#234b62');circle(352,160,31,'#a5c7cc');circle(352,160,12,'#d7edf2');text(351,240,'MR-bild',15)}}
else if(mode==='pet'){patient();put('circle',{cx:350,cy:165,r:146,stroke:'#8cc9d6','stroke-width':13,fill:'none'});circle(351,155,12,'#e8bd73');if(stage>=1){text(351,141,'e⁺ + e⁻',16)}if(stage>=2){line(351,155,496,62,'#f2d27e',4);line(351,155,204,249,'#f2d27e',4);circle(496,62,10,'#f3e59e');circle(204,249,10,'#f3e59e')}if(stage>=3){rect(304,125,94,76,'#214f5f');circle(343,148,13,'#f5b45e');circle(359,168,10,'#f5b45e');text(352,244,'aktivitetsbild',15)}}
else{patient();rect(514,101,115,146,'#9bd6cd');text(570,281,'gammakamera',16);circle(344,165,11,'#f1c47d');if(stage>=1){for(const y of [128,153,176,200])line(360,y,508,y+9,'#f2cb80',2,true)}if(stage>=2){for(let y=112;y<241;y+=18)line(506,y,506,y+10,'#224c60',7);text(475,95,'kollimator',14)}if(stage>=3){rect(530,121,82,100,'#214a5f');circle(572,170,29,'#e2bc75');circle(568,162,10,'#a2ced0');text(570,308,'scintigrafi',16)}}
}
function reset(){stage=0;selection=null;$('feedback').style.display='none';$('feedback').textContent='';$('run').disabled=true;$('run').textContent='Visa första steget';$('status').textContent='Gör ett val före återkopplingen.';$('caption').textContent='Välj först vad metoden bygger på.';$('step').textContent='Steg 0 av 3';document.querySelectorAll('#answers button').forEach(x=>x.setAttribute('aria-pressed','false'));draw();}
function setup(){document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));const d=data[mode];$('title').textContent=d.title;$('description').textContent=d.description;$('question').textContent=d.q;$('compare').textContent=d.compare;$('answers').innerHTML=d.opts.map((s,i)=>'<button type="button" data-choice="'+i+'" aria-pressed="false">'+s+'</button>').join('');document.querySelectorAll('#answers button').forEach(b=>b.onclick=()=>{selection=Number(b.dataset.choice);stage=0;$('feedback').style.display='none';$('run').disabled=false;$('run').textContent='Visa första steget';document.querySelectorAll('#answers button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();$('status').textContent='Valt. Visa nu förloppet.'});reset()}
function run(){if(selection===null||stage>=3)return;const d=data[mode];stage++;draw();$('caption').textContent=d.steps[stage-1];$('step').textContent='Steg '+stage+' av 3';if(stage===1){$('feedback').style.display='block';$('feedback').textContent=d.feed[selection];$('status').textContent=selection===d.correct?'Rätt. Följ nu nästa steg i bilden.':'Pröva att förklara varför valet inte stämmer. Följ nästa steg i bilden.'}if(stage===3){$('run').disabled=true;$('run').textContent='Alla tre steg visade'}else $('run').textContent='Visa nästa steg';}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;setup()});$('run').onclick=run;$('reset').onclick=reset;setup();
})();</script><script>
/* Send intrinsic content height to the same-origin lesson view; no nested scrolling. */
(()=>{
  let last=0;
  const send=()=>{
    const height=Math.ceil(document.body.getBoundingClientRect().height)+20;
    if(Math.abs(height-last)<2)return;
    last=height;
    window.parent.postMessage({type:'fy1-embedded-demo-height',height},location.origin);
  };
  if('ResizeObserver' in window)new ResizeObserver(send).observe(document.body);
  window.addEventListener('load',send);
  requestAnimationFrame(send);
})();
</script></body></html>
