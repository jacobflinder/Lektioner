<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Elektrisk effekt · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"><link rel="stylesheet" href="effekt.css?v=rev84b"><link rel="stylesheet" href="../../gemensamt/sjalvtest.css?v=2"></head><body data-fy1-lesson="effekt"><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Elektrisk effekt</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Elektrisk effekt","subject":"Fysik nivå 1","chapter":"8.4 · Elektrisk effekt","source":"Fy1_Effekt.pdf","goals":["Förklara skillnaden mellan effekt och energi.","Beräkna effekt, energi och ström i en resistor.","Förklara uppvärmning och batteriets inre resistans."],"pages":[{"title":"Vad betyder 500 watt?","body":"<div class=\"question\">En doppvärmare är märkt <strong>500 W<\/strong>. Vad betyder siffran? Är det en energimängd eller en hastighet för energiomvandling?<\/div><div class=\"goallocal\"><b>Efter lektionen ska du kunna<\/b><ol><li>Förklara skillnaden mellan <b>effekt<\/b> och <b>energi<\/b>.<\/li><li>Beräkna <i>P<\/i>, <i>E<\/i> och <i>I<\/i> i en resistor.<\/li><li>Förklara uppvärmning och batteriets <b>inre resistans<\/b>.<\/li><\/ol><\/div><p class=\"lesson-route\">Verklig demonstration → undersökning → samband → beräkningar → Socrative → bokarbete.<\/p>","source":"1","side":"<figure class=\"effect-figure\"><svg viewBox=\"0 0 550 348\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Principbild av doppvärmare i vattenkärl, märkt 500 watt\"><rect x=\"153\" y=\"100\" width=\"246\" height=\"160\" rx=\"14\" fill=\"#edf7fb\" stroke=\"#8bbac9\" stroke-width=\"3\"/><path d=\"M160 160 Q202 148 244 160 T327 160 T396 160\" fill=\"none\" stroke=\"#63b1cb\" stroke-width=\"3\"/><path d=\"M238 70 V206 h77 V70\" fill=\"none\" stroke=\"#bd6d3e\" stroke-width=\"10\" stroke-linecap=\"round\" /><path d=\"M238 70 V31 H356\" fill=\"none\" stroke=\"#355c69\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"355\" cy=\"31\" r=\"8\" fill=\"#355c69\" /><text x=\"280\" y=\"288\" text-anchor=\"middle\" fill=\"#1c6b83\" font-size=\"21\" font-family=\"system-ui\" font-weight=\"650\">Doppvärmare · 500 W<\/text><text x=\"282\" y=\"324\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"15\" font-family=\"system-ui\" font-weight=\"650\">Verklig demonstration i klassrummet<\/text><\/svg><figcaption>Bilden är en principillustration. Observera den verkliga doppvärmaren innan modellen visas.<\/figcaption><\/figure>","teacher":"Låt eleverna skriva ett eget svar före begreppen. Själva doppvärmaren demonstreras på nästa bild.","time":"Startfråga","label":"Start och mål"},{"title":"Doppvärmaren · tänk före","body":"<div class=\"question\">Vad betyder märkningen 500 W? Hur mycket energi överförs under 10 s?<\/div><p><strong>Förutsäg:<\/strong> En apparat på 500 W och en på 1 000 W körs lika länge. Vem omvandlar mest energi? <i>Hur mycket mer<\/i> under 10 s?<\/p><p><b>Enskilt 30 s → par 30 s → observera.<\/b> Skilj mellan det ni <em>ser<\/em> och det ni <em>förklarar<\/em> med en energimodell.<\/p><div class=\"safety-small\">Läraren sköter den verkliga demonstrationen och säkerheten. Eleverna ska inte själva koppla utrustning till nätspänning.<\/div>","source":"2","side":"<figure class=\"effect-figure\"><svg viewBox=\"0 0 550 348\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Principbild av doppvärmare i vattenkärl, märkt 500 watt\"><rect x=\"153\" y=\"100\" width=\"246\" height=\"160\" rx=\"14\" fill=\"#edf7fb\" stroke=\"#8bbac9\" stroke-width=\"3\"/><path d=\"M160 160 Q202 148 244 160 T327 160 T396 160\" fill=\"none\" stroke=\"#63b1cb\" stroke-width=\"3\"/><path d=\"M238 70 V206 h77 V70\" fill=\"none\" stroke=\"#bd6d3e\" stroke-width=\"10\" stroke-linecap=\"round\" /><path d=\"M238 70 V31 H356\" fill=\"none\" stroke=\"#355c69\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"355\" cy=\"31\" r=\"8\" fill=\"#355c69\" /><text x=\"280\" y=\"288\" text-anchor=\"middle\" fill=\"#1c6b83\" font-size=\"21\" font-family=\"system-ui\" font-weight=\"650\">Doppvärmare · 500 W<\/text><text x=\"282\" y=\"324\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"15\" font-family=\"system-ui\" font-weight=\"650\">Verklig demonstration i klassrummet<\/text><\/svg><figcaption>Bilden är en principillustration. Observera den verkliga doppvärmaren innan modellen visas.<\/figcaption><\/figure>","teacher":"Bevara originalets verkliga demonstration av 500 W-doppvärmaren. Ha vatten och lämplig säker utrustning. Fråga vad 500 W betyder före försöket.","time":"Demo och förutsägelse"},{"title":"Effekt är energi per sekund","body":"<p>Först: bestäm energin efter 10 s för <b>500 W<\/b> och <b>1 000 W<\/b>. Skriv två svar innan du visar dem.<\/p><div class=\"question\">Vad händer med omvandlad energi om tiden fördubblas medan effekten är konstant?<\/div><div class=\"equation\"><math display=\"inline\"><mi>P<\/mi><mo>=<\/mo><mfrac><mrow><mi>E<\/mi><\/mrow><mrow><mi>t<\/mi><\/mrow><\/mfrac><mspace width=\"1em\"/><mo>⇒<\/mo><mspace width=\".6em\"/><mi>E<\/mi><mo>=<\/mo><mi>P<\/mi><mi>t<\/mi><\/math><\/div><p>Ändra <b>tid<\/b> och <b>effekt<\/b> efter din förutsägelse. Visa resultat och pröva ett nytt värde.<\/p>","source":"3–4","steps":["<div class=\"worked\"><b>Gemensam beräkning<\/b><div class=\"equation\">E₁ = (500 J/s) · 10 s = <b>5 000 J<\/b><\/div><\/div>","<div class=\"worked\"><b>Jämför<\/b><div class=\"equation\">E₂ = (1 000 J/s) · 10 s = <b>10 000 J<\/b><\/div><\/div>","<p><b>Tolkning:<\/b> Dubbla effekten under samma tid ger dubbla energin. Staplarna visar energi, inte temperatur.<\/p>"],"model":"effektpower","teacher":"Originalets animationsförlopp 500 W respektive 1 000 W över 10 s är nu styrbart. Både blankt förutsägelseläge och en exakt skala 0–45 kJ.","time":"Modell · förutsäg först"},{"title":"Från laddning till effekt","body":"<p>Utgå från redan kända samband: <b>E = UQ<\/b> och <b>I = Q/t<\/b>. Vilket matematiskt steg visar att P = UI?<\/p><div class=\"question\">Varför måste <i>U<\/i> och <i>I<\/i> höra till samma komponent när vi beräknar dess effekt?<\/div><p>Ohms lag: <b>U = RI<\/b>. Välj det uttryck som passar de två storheter du vet.<\/p>","source":"5","side":"<figure class=\"effect-figure\"><svg viewBox=\"0 0 550 294\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Batterikrets med resistor och markerad spänning över samt ström genom resistorn\"><path d=\"M65 120V55H485V224H65V154\" fill=\"none\" stroke=\"#355969\" stroke-width=\"3.2\"/><rect x=\"52\" y=\"103\" width=\"26\" height=\"88\" fill=\"#f5fbfc\"/><path d=\"M44 129h42 M53 161h24\" stroke=\"#bd6a46\" stroke-width=\"4\" /><text x=\"31\" y=\"123\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">+<\/text><text x=\"31\" y=\"175\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">−<\/text><rect x=\"236\" y=\"42\" width=\"88\" height=\"26\" fill=\"#fff\" stroke=\"#18778c\" stroke-width=\"3\" rx=\"2\" /><text x=\"280.0\" y=\"32\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">Resistor R<\/text><path d=\"M199 15 H357\" stroke=\"#b9693d\" stroke-width=\"3\" fill=\"none\"/><text x=\"278\" y=\"12\" text-anchor=\"middle\" fill=\"#b9693d\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">U över R<\/text><path d=\"M343 54l42 0m-12-9 12 9-12 9\" fill=\"none\" stroke=\"#23816c\" stroke-width=\"3\"/><text x=\"412\" y=\"48\" text-anchor=\"middle\" fill=\"#237e6a\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">I genom R<\/text><text x=\"274\" y=\"270\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"19\" font-family=\"system-ui\" font-weight=\"650\">Samma komponent i P = UI<\/text><\/svg><figcaption>Spänningen U mäts över den resistor som genomflyts av strömmen I.<\/figcaption><\/figure>","steps":["<div class=\"worked\"><b>1 · Definition<\/b><div class=\"equation\"><math display=\"inline\"><mi>P<\/mi><mo>=<\/mo><mfrac><mrow><mi>E<\/mi><\/mrow><mrow><mi>t<\/mi><\/mrow><\/mfrac><\/math><\/div><\/div>","<div class=\"worked\"><b>2 · Sätt in E = UQ<\/b><div class=\"equation\"><math display=\"inline\"><mi>P<\/mi><mo>=<\/mo><mfrac><mrow><mi>U<\/mi><mi>Q<\/mi><\/mrow><mrow><mi>t<\/mi><\/mrow><\/mfrac><mo>=<\/mo><mi>U<\/mi><mi>I<\/mi><\/math><\/div><\/div>","<div class=\"worked\"><b>3 · Med Ohms lag U = RI<\/b><div class=\"equation\">P = UI = (RI)I = <strong>RI²<\/strong><\/div><\/div>","<div class=\"worked\"><b>4 · Med I = U/R<\/b><div class=\"equation\"><math display=\"inline\"><mi>P<\/mi><mo>=<\/mo><mi>U<\/mi><mfrac><mrow><mi>U<\/mi><\/mrow><mrow><mi>R<\/mi><\/mrow><\/mfrac><mo>=<\/mo><mfrac><mrow><msup><mi>U<\/mi><mn>2<\/mn><\/msup><\/mrow><mrow><mi>R<\/mi><\/mrow><\/mfrac><\/math><\/div><\/div>","<p><b>Enhetskontroll:<\/b> 1 W = 1 J/s = 1 V·A.<\/p>"],"quiz":{"prompt":"Strömmen genom en resistor fördubblas medan R är konstant. Hur ändras effekten?","options":["Den fördubblas","Den fyrdubblas","Den är oförändrad"],"correct":1,"why":"P = RI². Om I → 2I blir P → R(2I)² = 4RI²."},"teacher":"Fråga eleverna vilket mellanled som kommer härnäst. Betona att vi använder U över och I genom samma resistor.","time":"Härledning och omprövning"},{"title":"Stor ström ger stor värmeeffekt","body":"<p><b>Påståendet:<\/b> större ström kan ge större värmeeffekt. I en ohmsk resistor med konstant R ökar effekten med <i>strömmen i kvadrat<\/i>.<\/p><div class=\"question\">En 500 W-apparat är ansluten till 230 V. Beräkna strömmen.<\/div><p><b>Din tur:<\/b> två rent resistiva apparater på 1 500 W och 1 200 W används samtidigt på samma 230 V-grupp. Föreslå hur totalströmmen ska beräknas.<\/p>","source":"6","side":"<figure class=\"effect-figure\"><svg viewBox=\"0 0 550 293\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Relativa effektstaplar med en och fyra gånger effekt när strömmen fördubblas vid konstant resistans\"><path d=\"M70 53H485\" stroke=\"#d0e1e6\" stroke-width=\"2\"/><text x=\"280\" y=\"37\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"21\" font-family=\"system-ui\" font-weight=\"650\">Effekt och ström – proportioner<\/text><rect x=\"105\" y=\"94\" width=\"105\" height=\"28\" rx=\"5\" fill=\"#187b95\"/><text x=\"65\" y=\"115\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"650\">I<\/text><text x=\"285\" y=\"161\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\">P = RI²<\/text><rect x=\"105\" y=\"182\" width=\"420\" height=\"28\" rx=\"5\" fill=\"#c77643\"/><text x=\"65\" y=\"203\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"650\">2I<\/text><text x=\"285\" y=\"249\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\">4P = R(2I)²<\/text><text x=\"285\" y=\"267\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">Dubbel ström vid oförändrat R → fyrdubbel effekt<\/text><\/svg><figcaption>Jämför effekt vid samma resistans. Staplarna representerar relativ värmeeffekt, inte temperatur.<\/figcaption><\/figure>","steps":["<div class=\"worked\"><b>1 · Fyra gånger effekt<\/b><div class=\"equation\">P<sub>ny<\/sub> = R(2I)² = <b>4RI² = 4P<\/b><\/div><\/div>","<div class=\"worked\"><b>2 · Bestäm strömmen<\/b><div class=\"equation\">I = P/U = (500 W)/(230 V) ≈ <b>2,17 A<\/b><\/div><\/div>","<p><b>Rimlighet:<\/b> 500 W vid 230 V motsvarar några ampere, inte hundratals. Beräkningarna förutsätter resistiv belastning vid angiven spänning.<\/p>"],"teacher":"Nätspänning är ett teoretiskt beräkningsexempel, inte en elevlaboration. Koppla tillbaka till energibegreppet och P = RI².","time":"Beräkning · din tur"},{"title":"Ryms båda apparaterna inom 10 A?","body":"<div class=\"question\">En 1 500 W-apparat och en 1 200 W-apparat är parallellt anslutna till 230 V. Bestäm sammanlagd effekt och ström. Jämför med 10 A.<\/div><p>Skriv beräkningen själv → jämför i par → visa mellanled.<\/p><p class=\"safety-small\">Vid märkström 10 A är den beräknade kontinuerliga belastningen för hög. Verklig säkringsutlösning beror också på ström och tid. Gör inga elevförsök med 230 V.<\/p>","source":"7","side":"<figure class=\"effect-figure\"><svg viewBox=\"0 0 550 337\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Två parallellkopplade belastningar märkta 1500 och 1200 watt till 230 volt\"><path d=\"M74 130V60H369 M74 166V268H369 M240 60V96 M240 195V268 M369 60V96 M369 195V268\" fill=\"none\" stroke=\"#355969\" stroke-width=\"3\" /><rect x=\"61\" y=\"109\" width=\"26\" height=\"88\" fill=\"#f5fbfc\"/><path d=\"M53 135h42 M62 167h24\" stroke=\"#bd6a46\" stroke-width=\"4\" /><text x=\"40\" y=\"129\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">+<\/text><text x=\"40\" y=\"181\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">−<\/text><rect x=\"220\" y=\"96\" width=\"40\" height=\"99\" fill=\"#fff\" stroke=\"#18758f\" stroke-width=\"3\" rx=\"2\" /><text x=\"240.0\" y=\"86\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">1 500 W<\/text><rect x=\"349\" y=\"96\" width=\"40\" height=\"99\" fill=\"#fff\" stroke=\"#ad6a44\" stroke-width=\"3\" rx=\"2\" /><text x=\"369.0\" y=\"86\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">1 200 W<\/text><text x=\"112\" y=\"292\" text-anchor=\"middle\" fill=\"#a65e40\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">230 V<\/text><text x=\"311\" y=\"47\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"19\" font-family=\"system-ui\" font-weight=\"650\">Två apparater parallellt<\/text><text x=\"275\" y=\"318\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">Iₜₒₜ = I₁ + I₂<\/text><\/svg><figcaption>Idealiserad parallellanslutning av två resistiva apparater till 230 V. Ingen övning med nätspänning.<\/figcaption><\/figure>","steps":["<div class=\"worked\"><b>1 · Total effekt<\/b><div class=\"equation\">P<sub>tot<\/sub> = (1 500 + 1 200) W = <b>2 700 W<\/b><\/div><\/div>","<div class=\"worked\"><b>2 · Total ström<\/b><div class=\"equation\">I<sub>tot<\/sub> = P<sub>tot<\/sub>/U = (2 700 W)/(230 V) ≈ <b>11,7 A<\/b><\/div><\/div>","<p><b>Bedömning:<\/b> 11,7 A är större än 10 A. Minska den samtidiga belastningen. Säkringen skyddar framför allt ledningarna mot överström och för hög uppvärmning.<\/p>"],"quiz":{"prompt":"Två resistiva laster på 1 500 W och 1 200 W ansluts parallellt till 230 V. Vilket alternativ stämmer?","options":["Totalströmmen är cirka 5 A","Totalströmmen är cirka 11,7 A","Strömmen är densamma genom båda apparaterna"],"correct":1,"why":"Ptot = 2700 W och I = P/U = 2700/230 ≈ 11,7 A. Grenströmmarna behöver inte vara lika."},"teacher":"Säkringens märkström är inte en knivskarp momentan utlösningströskel. Diskutera endast principen.","time":"Tillämpning och återkoppling"},{"title":"Även batteriet har resistans","body":"<p>En verklig spänningskälla kan modelleras som en ideal ems <b>ℰ<\/b> med en inre resistans <b>r<\/b> i serie med den yttre resistansen <b>R<\/b>.<\/p><div class=\"question\">Om strömmen ökar och ℰ och r är konstanta: vad händer med polspänningen U? Var försvinner spänningen?<\/div><p>Följ <b>en och samma ström<\/b> genom batteriets inre och yttre resistans.<\/p>","source":"8","side":"<figure class=\"effect-figure\"><svg viewBox=\"0 0 550 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Batteri med elektromotorisk spänning, inre resistans i serie med yttre resistans och voltmeter parallellt över yttre kretsen\"><path d=\"M92 150V74H470V239H92V175\" stroke=\"#355969\" stroke-width=\"3.2\" fill=\"none\"/><rect x=\"79\" y=\"119\" width=\"26\" height=\"88\" fill=\"#f5fbfc\"/><path d=\"M71 145h42 M80 177h24\" stroke=\"#bd6a46\" stroke-width=\"4\" /><text x=\"58\" y=\"139\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">+<\/text><text x=\"58\" y=\"191\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">−<\/text><rect x=\"267\" y=\"61\" width=\"75\" height=\"26\" fill=\"#fff\" stroke=\"#c27443\" stroke-width=\"3\" rx=\"2\" /><text x=\"304.5\" y=\"51\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">r = 1,0 Ω<\/text><rect x=\"266\" y=\"226\" width=\"80\" height=\"26\" fill=\"#fff\" stroke=\"#19758c\" stroke-width=\"3\" rx=\"2\" /><text x=\"306.0\" y=\"216\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">R = 5,0 Ω<\/text><path d=\"M215 239 V188 H274 M330 188 H395 V239\" stroke=\"#397080\" stroke-width=\"2.6\" fill=\"none\"/><circle cx=\"302\" cy=\"188\" r=\"28\" fill=\"#ffffff\" stroke=\"#397080\" stroke-width=\"2.6\"/><text x=\"302\" y=\"195\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\">V<\/text><text x=\"110\" y=\"281\" text-anchor=\"middle\" fill=\"#9d6343\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">ℰ = 6,0 V<\/text><text x=\"421\" y=\"185\" text-anchor=\"middle\" fill=\"#16758b\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">U<\/text><\/svg><figcaption>Riktigt kretsschema för batterimodellen. Den ideala voltmetern har mycket hög resistans och mäter polspänningen U.<\/figcaption><\/figure>","steps":["<div class=\"worked\"><b>Modell för urladdning<\/b><div class=\"equation\">ℰ = U + rI  ⇒  <b>U = ℰ − rI<\/b><\/div><\/div>","<p><b>Förklaring:<\/b> när I ökar, ökar spänningsfallet rI inne i batteriet. Därför sjunker polspänningen U i denna modell.<\/p>"],"teacher":"Undersök om eleverna säger att den inre resistansen ligger parallellt med belastningen; rätta med det riktiga seriekopplingsschemat. Ingen fysisk batterimätning krävs av originalet.","time":"Modell och förutsägelse"},{"title":"Vad händer när belastningen ökar?","body":"<p>Originalets två jämförelselägen har samma ems <b>6,0 V<\/b> och inre resistans <b>1,0 Ω<\/b>:<\/p><div class=\"question\">Först R = 5,0 Ω, sedan R = 2,0 Ω. Vad händer med strömmen, polspänningen och uppvärmningen inne i batteriet?<\/div><p>Använd reglaget för den yttre resistansen. Pröva först 5,0 Ω, därefter 2,0 Ω, och jämför hur samma 6 V fördelas.<\/p>","source":"9–10","steps":["<div class=\"worked\"><b>Originalets första fall<\/b><div class=\"equation\">I = 6,0 V/(1,0 Ω + 5,0 Ω) = <b>1,0 A<\/b>; U = 5,0 V<\/div><\/div>","<div class=\"worked\"><b>Ökad belastning: R = 2,0 Ω<\/b><div class=\"equation\">I = 6,0 V/(1,0 Ω + 2,0 Ω) = <b>2,0 A<\/b>; U = 4,0 V<\/div><\/div>","<div class=\"worked\"><b>Värmeeffekt inne i batteriet<\/b><div class=\"equation\">P<sub>inre<\/sub> = rI²: vid 1 A → 1 W, vid 2 A → <b>4 W<\/b><\/div><\/div>","<p><b>Kontroll:<\/b> i båda fallen är rI + U = 6,0 V. En större ström ger större inre effektförlust.<\/p>"],"model":"effektinternal","teacher":"Visa inte voltandelarna i förutsägelseläget. Efter första avslöjandet ska alla tal och färgsegment fortsätta uppdateras. Originalets jämförelse 1 A→2 A måste visas korrekt.","time":"Styrbar batterimodell"},{"title":"Hur bestämmer vi strömmen?","body":"<p>Givet ett batteri som levererar <b>ℰ = 6,0 V<\/b>, har <b>r = 1,0 Ω<\/b> och matar <b>R = 5,0 Ω<\/b>.<\/p><div class=\"question\">Hur kan vi bestämma strömmen <i>I<\/i> och polspänningen <i>U<\/i>? Föreslå första steget innan du visar lösningen.<\/div>","source":"11","side":"<figure class=\"effect-figure\"><svg viewBox=\"0 0 550 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Batteri med elektromotorisk spänning, inre resistans i serie med yttre resistans och voltmeter parallellt över yttre kretsen\"><path d=\"M92 150V74H470V239H92V175\" stroke=\"#355969\" stroke-width=\"3.2\" fill=\"none\"/><rect x=\"79\" y=\"119\" width=\"26\" height=\"88\" fill=\"#f5fbfc\"/><path d=\"M71 145h42 M80 177h24\" stroke=\"#bd6a46\" stroke-width=\"4\" /><text x=\"58\" y=\"139\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">+<\/text><text x=\"58\" y=\"191\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">−<\/text><rect x=\"267\" y=\"61\" width=\"75\" height=\"26\" fill=\"#fff\" stroke=\"#c27443\" stroke-width=\"3\" rx=\"2\" /><text x=\"304.5\" y=\"51\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">r = 1,0 Ω<\/text><rect x=\"266\" y=\"226\" width=\"80\" height=\"26\" fill=\"#fff\" stroke=\"#19758c\" stroke-width=\"3\" rx=\"2\" /><text x=\"306.0\" y=\"216\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">R = 5,0 Ω<\/text><path d=\"M215 239 V188 H274 M330 188 H395 V239\" stroke=\"#397080\" stroke-width=\"2.6\" fill=\"none\"/><circle cx=\"302\" cy=\"188\" r=\"28\" fill=\"#ffffff\" stroke=\"#397080\" stroke-width=\"2.6\"/><text x=\"302\" y=\"195\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\">V<\/text><text x=\"110\" y=\"281\" text-anchor=\"middle\" fill=\"#9d6343\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">ℰ = 6,0 V<\/text><text x=\"421\" y=\"185\" text-anchor=\"middle\" fill=\"#16758b\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">U<\/text><\/svg><figcaption>Riktigt kretsschema för batterimodellen. Den ideala voltmetern har mycket hög resistans och mäter polspänningen U.<\/figcaption><\/figure>","steps":["<div class=\"worked\"><b>1 · Två samband<\/b><div class=\"equation\">ℰ = U + rI    och    U = RI<\/div><\/div>","<div class=\"worked\"><b>2 · Ersätt U med RI<\/b><div class=\"equation\">ℰ = RI + rI = (R + r)I<\/div><\/div>","<div class=\"worked\"><b>3 · Lös ut I<\/b><div class=\"equation\"><math display=\"inline\"><mi>I<\/mi><mo>=<\/mo><mfrac><mrow><mi>ℰ<\/mi><\/mrow><mrow><mi>R<\/mi><mo>+<\/mo><mi>r<\/mi><\/mrow><\/mfrac><\/math> = 6,0 V/(5,0 Ω + 1,0 Ω) = <b>1,0 A<\/b><\/div><\/div>","<div class=\"worked\"><b>4 · Polspänningen<\/b><div class=\"equation\">U = RI = (5,0 Ω)(1,0 A) = <b>5,0 V<\/b><\/div><\/div>","<p><b>Rimlighet:<\/b> U = 5,0 V är lägre än ems 6,0 V, eftersom 1,0 V faller internt.<\/p>"],"teacher":"Eleven ska själv se att U kan ersättas med RI. Använd samma figur genom mellanleden för att minska splittrad uppmärksamhet.","time":"Genomarbetat exempel"},{"title":"Din tur · återkoppling och Socrative","body":"<div class=\"question\">Ändra nu yttre resistansen till <b>R = 3,0 Ω<\/b> (ℰ = 6,0 V och r = 1,0 Ω). Bestäm I och U innan lösningen visas.<\/div><p>Skriv eget svar → jämför i par → gemensam återkoppling.<\/p><div class=\"socrative\"><b>Originalets Socrative · Effekt i resistor<\/b><p><code>SOC-37285324<\/code><\/p><p>Diskutera särskilt frågan: <b>Vilken spänning? Vilken ström? Vilken komponent?<\/b><\/p><\/div>","source":"12","side":"<figure class=\"effect-figure\"><svg viewBox=\"0 0 550 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Batteri med elektromotorisk spänning, inre resistans i serie med yttre resistans och voltmeter parallellt över yttre kretsen\"><path d=\"M92 150V74H470V239H92V175\" stroke=\"#355969\" stroke-width=\"3.2\" fill=\"none\"/><rect x=\"79\" y=\"119\" width=\"26\" height=\"88\" fill=\"#f5fbfc\"/><path d=\"M71 145h42 M80 177h24\" stroke=\"#bd6a46\" stroke-width=\"4\" /><text x=\"58\" y=\"139\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">+<\/text><text x=\"58\" y=\"191\" text-anchor=\"middle\" fill=\"#ae683f\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\">−<\/text><rect x=\"267\" y=\"61\" width=\"75\" height=\"26\" fill=\"#fff\" stroke=\"#c27443\" stroke-width=\"3\" rx=\"2\" /><text x=\"304.5\" y=\"51\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">r = 1,0 Ω<\/text><rect x=\"266\" y=\"226\" width=\"80\" height=\"26\" fill=\"#fff\" stroke=\"#19758c\" stroke-width=\"3\" rx=\"2\" /><text x=\"306.0\" y=\"216\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"16\" font-family=\"system-ui\" font-weight=\"650\">R = 3,0 Ω<\/text><path d=\"M215 239 V188 H274 M330 188 H395 V239\" stroke=\"#397080\" stroke-width=\"2.6\" fill=\"none\"/><circle cx=\"302\" cy=\"188\" r=\"28\" fill=\"#ffffff\" stroke=\"#397080\" stroke-width=\"2.6\"/><text x=\"302\" y=\"195\" text-anchor=\"middle\" fill=\"#234f5c\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\">V<\/text><text x=\"110\" y=\"281\" text-anchor=\"middle\" fill=\"#9d6343\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">ℰ = 6,0 V<\/text><text x=\"421\" y=\"185\" text-anchor=\"middle\" fill=\"#16758b\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\">U<\/text><\/svg><figcaption>Riktigt kretsschema för batterimodellen. Den ideala voltmetern har mycket hög resistans och mäter polspänningen U.<\/figcaption><\/figure>","steps":["<div class=\"worked\"><b>1 · Ström genom samma seriekrets<\/b><div class=\"equation\">I = 6,0 V/(3,0 Ω + 1,0 Ω) = <b>1,5 A<\/b><\/div><\/div>","<div class=\"worked\"><b>2 · Spänning över yttre R<\/b><div class=\"equation\">U = RI = (3,0 Ω)(1,5 A) = <b>4,5 V<\/b><\/div><\/div>","<div class=\"worked\"><b>3 · Kontroll<\/b><div class=\"equation\">ℰ − rI = 6,0 V − (1,0 Ω)(1,5 A) = <b>4,5 V<\/b><\/div><\/div>"],"teacher":"Befintlig Socrative, inget nykonstruerat quiz. Låt eleverna skilja r från R. Om tiden är knapp, följ upp bara svaret med störst osäkerhet.","time":"Öva och återkoppla"},{"title":"Träna · visa vad du kan","body":"<div class=\"book-main\"><h2>Bokens uppgifter 839–850 · avsnitt 8.4<\/h2><p><b>Uppgifter:<\/b> s. 298–299. <b>Lässtöd:<\/b> s. 294–297, särskilt de <b>gröna rutorna<\/b>.<\/p><p><b>Läxa:<\/b> gör klart bokens uppgifter 839–850. Arbeta först själv och jämför sedan metod med en kamrat.<\/p><\/div><div class=\"question\"><b>Exit – svara själv utan bok:<\/b> 12 V över en resistor där I = 0,50 A. Beräkna P och E under 20 s. Förklara skillnaden mellan energi och effekt. Varför ökar värmeeffekten med I² om R är konstant? Varför sjunker batteriets U när I ökar?<\/div><div class=\"goallocal\"><b>Återvänd till dagens mål<\/b><ol><li>Skilja effekt från energi.<\/li><li>Beräkna effekt, energi och ström.<\/li><li>Förklara uppvärmning och inre resistans.<\/li><\/ol><\/div>","source":"13","steps":["<div class=\"worked\"><b>Kontroll av beräkningar<\/b><div class=\"equation\">P = UI = (12 V)(0,50 A) = <b>6,0 W<\/b><\/div><\/div>","<div class=\"worked\"><b>Energi under 20 s<\/b><div class=\"equation\">E = Pt = (6,0 W)(20 s) = <b>120 J<\/b><\/div><\/div>","<p><b>Fördjupad förklaring:<\/b> P = RI² om R är konstant. I batterimodellen gäller U = ℰ − rI, så större I ger större inre spänningsfall.<\/p>"],"teacher":"Skydda en lång sammanhängande bokarbetsfas. Vid tidsbrist görs exit muntligt eller som kort skriftlig fråga; innehållet på denna sida är inte ett extra helt föreläsningsmoment.","time":"Bokarbete · avslut"}]}</script><script src="../../gemensamt/models.js"></script><script src="effekt-models.js?v=rev84b"></script><script src="../../gemensamt/app.js"></script><script src="effekt-ui.js?v=rev84b"></script><script src="../../gemensamt/sjalvtest.js?v=2" defer></script></body></html>
