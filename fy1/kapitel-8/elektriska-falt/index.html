<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Elektriska fält · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"><link rel="stylesheet" href="falt.css?v=rev85a"><link rel="stylesheet" href="../../gemensamt/sjalvtest.css?v=papper2"><link rel="stylesheet" href="../../gemensamt/matematik-typografi.css?v=3"></head><body data-fy1-lesson="elektriska-falt"><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Elektriska fält</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Elektriska fält","subject":"Fysik nivå 1","chapter":"8.5 · Elektriska fält","source":"Fy1_Elektriska_falt.pdf","goals":["Rita fältriktning och kraft på positiva och negativa laddningar.","Beräkna fältstyrka, elektrisk kraft och partikelacceleration.","Förklara elektrisk skärmning med laddningarnas omfördelning."],"pages":[{"title":"Hur kan en kraft verka utan kontakt?","body":"\u003cdiv class=\"question\">En positiv och en negativ kula påverkar varandra utan kontakt. Rita kraftpilarna på båda kulorna. Vad avgör riktningen?\u003c/div>\u003cdiv class=\"goal-card\">\u003cb>Efter lektionen ska du kunna\u003c/b>\u003col>\u003cli>Rita elektriska fält och krafter på positiva och negativa laddningar.\u003c/li>\u003cli>Beräkna E, F och acceleration med rätt tecken och enheter.\u003c/li>\u003cli>Förklara elektrisk skärmning genom fria laddningars omfördelning.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"small-context\">\u003cb>Fördjupande PhET från originalet:\u003c/b> \u003ca href=\"https://phet.colorado.edu/sims/html/charges-and-fields/latest/charges-and-fields_all.html\" target=\"_blank\" rel=\"noopener noreferrer\">Charges and Fields\u003c/a>. Använd som ett undersökande komplement.\u003c/p>","source":"1","teacher":"Enskilt 30 s → par 30 s → klass. Låt eleverna rita två lika långa motriktade attraktionspilar före facit. PhET finns i originalet och ska inte ersätta en gemensam fysikförklaring.","side":"\u003cfigure class=\"field-figure\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 330\" role=\"img\" aria-label=\"Två laddningar, en positiv till vänster och en negativ till höger, utan färdigritade kraftpilar. Eleverna ska rita kraft på vardera laddningen.\">\u003cdefs>\u003cmarker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"160\" y=\"42\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Laddning A\u003c/text>\u003ctext x=\"405\" y=\"42\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Laddning B\u003c/text>\u003ccircle cx=\"160\" cy=\"156\" r=\"27\" fill=\"#c16e42\"/>\u003ctext x=\"160\" y=\"164\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"405\" cy=\"156\" r=\"27\" fill=\"#177b99\"/>\u003ctext x=\"405\" y=\"164\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−\u003c/text>\u003cline x1=\"195\" y1=\"155\" x2=\"370\" y2=\"155\" stroke=\"#aec6d0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 7\"/>\u003ctext x=\"280\" y=\"218\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Vilka krafter ska du rita?\u003c/text>\u003ctext x=\"160\" y=\"266\" font-family=\"system-ui\" font-size=\"17\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">F på A: ?\u003c/text>\u003ctext x=\"405\" y=\"266\" font-family=\"system-ui\" font-size=\"17\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">F på B: ?\u003c/text>\u003c/svg>\u003cfigcaption>Rita själv två kraftpilar innan deras riktningar diskuteras.\u003c/figcaption>\u003c/figure>","tag":"Obligatorisk kärna"},{"title":"Fältet beskriver platsen","body":"\u003cdiv class=\"question\">Åt vilket håll skulle kraften verka på en mycket liten \u003cb>positiv\u003c/b> testladdning nära de två källorna?\u003c/div>\u003cp>Fältets riktning i en punkt definieras som riktningen på kraften på en liten positiv testladdning. Fältlinjer går \u003cb>ut från +\u003c/b> och \u003cb>in mot −\u003c/b>.\u003c/p>\u003cp>I en konsekvent fältbild betyder tätare linjer större fältstyrka. Linjerna är en modell – inte något som ligger fysiskt i rummet.\u003c/p>","source":"2","quiz":{"prompt":"En negativ testladdning placeras i ett elektriskt fält åt höger. Åt vilket håll verkar kraften?","options":["Åt höger","Åt vänster","Ingen kraft"],"correct":1,"why":"Fältets riktning definieras med positiv testladdning. För negativ q gäller F = qE, så kraften är motsatt fältet.","hint":""},"teacher":"Förklara att fältlinjer är en representation, inte fysiska strängar.","side":"\u003cfigure class=\"field-figure\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 335\" role=\"img\" aria-label=\"Fältlinjer pekar radiellt utåt från positiv punktladdning och inåt mot negativ punktladdning.\">\u003cdefs>\u003cmarker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/>\u003c/marker>\u003c/defs>\u003ccircle cx=\"150\" cy=\"174\" r=\"22\" fill=\"#c16e42\"/>\u003ctext x=\"150\" y=\"182\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">+\u003c/text>\u003cline x1=\"185.0\" y1=\"174.0\" x2=\"260.0\" y2=\"174.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"260.0,174.0 249.0,180.5 249.0,167.5\" fill=\"#177b99\"/>\u003cline x1=\"174.7\" y1=\"198.7\" x2=\"227.8\" y2=\"251.8\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"227.8,251.8 215.42563132923542,248.61801948466055 224.61801948466055,239.42563132923542\" fill=\"#177b99\"/>\u003cline x1=\"150.0\" y1=\"209.0\" x2=\"150.0\" y2=\"284.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"150.0,284.0 143.5,273.0 156.5,273.0\" fill=\"#177b99\"/>\u003cline x1=\"125.3\" y1=\"198.7\" x2=\"72.2\" y2=\"251.8\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"72.2,251.8 75.38198051533946,239.42563132923542 84.57436867076457,248.61801948466055\" fill=\"#177b99\"/>\u003cline x1=\"115.0\" y1=\"174.0\" x2=\"40.0\" y2=\"174.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"40.0,174.0 51.0,167.5 51.0,180.5\" fill=\"#177b99\"/>\u003cline x1=\"125.3\" y1=\"149.3\" x2=\"72.2\" y2=\"96.2\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"72.2,96.2 84.57436867076457,99.38198051533948 75.38198051533946,108.57436867076458\" fill=\"#177b99\"/>\u003cline x1=\"150.0\" y1=\"139.0\" x2=\"150.0\" y2=\"64.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"150.0,64.0 156.5,75.0 143.5,75.0\" fill=\"#177b99\"/>\u003cline x1=\"174.7\" y1=\"149.3\" x2=\"227.8\" y2=\"96.2\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"227.8,96.2 224.61801948466055,108.57436867076457 215.42563132923542,99.38198051533946\" fill=\"#177b99\"/>\u003ccircle cx=\"414\" cy=\"174\" r=\"22\" fill=\"#177b99\"/>\u003ctext x=\"414\" y=\"182\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−\u003c/text>\u003cline x1=\"524.0\" y1=\"174.0\" x2=\"449.0\" y2=\"174.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"449.0,174.0 460.0,167.5 460.0,180.5\" fill=\"#177b99\"/>\u003cline x1=\"491.8\" y1=\"251.8\" x2=\"438.7\" y2=\"198.7\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"438.7,198.7 451.07436867076456,201.88198051533945 441.8819805153395,211.07436867076458\" fill=\"#177b99\"/>\u003cline x1=\"414.0\" y1=\"284.0\" x2=\"414.0\" y2=\"209.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"414.0,209.0 420.5,220.0 407.5,220.0\" fill=\"#177b99\"/>\u003cline x1=\"336.2\" y1=\"251.8\" x2=\"389.3\" y2=\"198.7\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"389.3,198.7 386.1180194846605,211.07436867076458 376.92563132923544,201.88198051533945\" fill=\"#177b99\"/>\u003cline x1=\"304.0\" y1=\"174.0\" x2=\"379.0\" y2=\"174.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"379.0,174.0 368.0,180.5 368.0,167.5\" fill=\"#177b99\"/>\u003cline x1=\"336.2\" y1=\"96.2\" x2=\"389.3\" y2=\"149.3\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"389.3,149.3 376.92563132923544,146.11801948466055 386.1180194846605,136.92563132923542\" fill=\"#177b99\"/>\u003cline x1=\"414.0\" y1=\"64.0\" x2=\"414.0\" y2=\"139.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"414.0,139.0 407.5,128.0 420.5,128.0\" fill=\"#177b99\"/>\u003cline x1=\"491.8\" y1=\"96.2\" x2=\"438.7\" y2=\"149.3\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003cpolygon points=\"438.7,149.3 441.8819805153395,136.92563132923542 451.07436867076456,146.11801948466055\" fill=\"#177b99\"/>\u003ctext x=\"150\" y=\"37\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Positiv källa\u003c/text>\u003ctext x=\"414\" y=\"37\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Negativ källa\u003c/text>\u003ctext x=\"282\" y=\"311\" font-family=\"system-ui\" font-size=\"15\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Fältriktning: kraften på positiv testladdning\u003c/text>\u003c/svg>\u003cfigcaption>Fältlinjer är ritade modeller – inte strängar i rummet.\u003c/figcaption>\u003c/figure>","steps":["\u003cp>Startfrågan: \u003cb>olika laddningar attraherar\u003c/b>. Krafterna är lika stora och motriktade enligt Newtons tredje lag.\u003c/p>"],"tag":"Obligatorisk kärna"},{"title":"Samma fält – olika testladdningar","body":"\u003cdiv class=\"question\">Samma fält, tre olika provladdningar: +q₀, −q₀ och +2q₀. Rita kraftpilarna. Ändras \u003ci>E\u003c/i> när provladdningen byts?\u003c/div>\u003cp>Undersök först med positivt fält. Ändra sedan fältets tecken och provladdningens storlek. \u003cb>Välj Visa resultat\u003c/b> först efter förutsägelsen.\u003c/p>","source":"3–5","model":"field85","steps":["\u003cdiv class=\"field-math-stack\">\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>F\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>q\u003c/mi>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003c/math>\u003c/div>\u003c/div>","\u003cp>+q₀: kraft med fältet. −q₀: kraft mot fältet. +2q₀: dubbla kraften, med fältet.\u003c/p>","\u003cp>Testladdningen ändrar inte det pålagda fältet i idealmodellen.\u003c/p>"],"teacher":"Modellen visar tre separata försök i samma fält. Förväntat: +q₀ med E, −q₀ mot E, +2q₀ dubbla kraften. Testladdningarna antas så små att de inte ändrar källfältet.","tag":"Obligatorisk kärna"},{"title":"Fältstyrka och kraft: tecknet visar riktningen","body":"\u003cdiv class=\"question\">En laddning q = −3,0 nC ligger i fältet Eₓ = +2,0 kN/C. Vilket tecken får kraftens x-komponent? Rita kraftpilen.\u003c/div>\u003cp>Vi har valt \u003cb>höger som positiv riktning\u003c/b>. Här använder vi det \u003cem>riktade\u003c/em> sambandet Fₓ = qEₓ. Minustecknet ger riktningen.\u003c/p>","source":"6","steps":["\u003cdiv class=\"field-math\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>q\u003c/mi>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003c/math>\u003c/div>","\u003cdiv class=\"field-math\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\">\u003csemantics>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmo>(\u003c/mo>\u003cmrow>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmrow>\u003cmrow>\u003cmn>3,0\u003c/mn>\u003c/mrow>\u003cmo>·\u003c/mo>\u003cmrow>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>9\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/mrow>\u003c/mrow>\u003cmspace width=\"0.2em\"/>\u003cmtext>C\u003c/mtext>\u003c/mrow>\u003cmo>)\u003c/mo>\u003c/mrow>\u003cmo>·\u003c/mo>\u003cmrow>\u003cmo>(\u003c/mo>\u003cmrow>\u003cmrow>\u003cmo>+\u003c/mo>\u003cmrow>\u003cmrow>\u003cmn>2,0\u003c/mn>\u003c/mrow>\u003cmo>·\u003c/mo>\u003cmrow>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>3\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mrow>\u003c/mrow>\u003cmspace width=\"0.2em\"/>\u003cmtext>N/C\u003c/mtext>\u003c/mrow>\u003cmo>)\u003c/mo>\u003c/mrow>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"text/plain\">Fₓ = (−3,0 · 10⁻⁹ C) · (+2,0 · 10³ N/C)\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/div>","\u003cdiv class=\"field-math\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\">\u003csemantics>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmrow>\u003cmrow>\u003cmn>6,0\u003c/mn>\u003c/mrow>\u003cmo>·\u003c/mo>\u003cmrow>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>6\u003c/mn>\u003c/mrow>\u003c/msup>\u003c/mrow>\u003c/mrow>\u003c/mrow>\u003cmspace width=\"0.2em\"/>\u003cmtext>N\u003c/mtext>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmrow>\u003cmn>6,0\u003c/mn>\u003c/mrow>\u003c/mrow>\u003cmspace width=\"0.2em\"/>\u003cmtext>µN\u003c/mtext>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"text/plain\">Fₓ = −6,0 · 10⁻⁶ N = −6,0 µN\u003c/annotation>\u003c/semantics>\u003c/math>. Kraften verkar åt vänster.\u003c/div>","\u003cp>\u003cb>Din tur:\u003c/b> Byt till +6,0 nC i samma fält. Då blir Fₓ = +12 µN, åt höger.\u003c/p>"],"teacher":"Använd konsekvent teckenriktning; undvik dubbel bokföring med belopp och tecken.","side":"\u003cfigure class=\"field-figure\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 340\" role=\"img\" aria-label=\"Ett elektriskt fält pekar åt höger över en negativ testladdning. Eleverna förutsäger kraftens riktning.\">\u003cdefs>\u003cmarker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"277\" y=\"35\" font-family=\"system-ui\" font-size=\"19\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Välj +x åt höger\u003c/text>\u003cline x1=\"95\" y1=\"99\" x2=\"457\" y2=\"99\" stroke=\"#177b99\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cpolygon points=\"457,99 446.0,105.5 446.0,92.5\" fill=\"#177b99\"/>\u003ctext x=\"280\" y=\"78\" font-family=\"system-ui\" font-size=\"19\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">E = +2,0 kN/C\u003c/text>\u003ccircle cx=\"280\" cy=\"187\" r=\"29\" fill=\"#177b99\"/>\u003ctext x=\"280\" y=\"195\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−\u003c/text>\u003ctext x=\"281\" y=\"250\" font-family=\"system-ui\" font-size=\"19\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">q = −3,0 nC\u003c/text>\u003ctext x=\"282\" y=\"298\" font-family=\"system-ui\" font-size=\"15\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Rita kraftpilen innan du ser tecknet\u003c/text>\u003c/svg>\u003cfigcaption>Fältet bestäms av källorna; laddningens tecken avgör kraftens riktning.\u003c/figcaption>\u003c/figure>","quiz":{"prompt":"En positiv provladdning dubbleras vid oförändrat E. Då blir kraftens storlek …","options":["oförändrad","dubbel","fyra gånger så stor"],"correct":1,"why":"F = qE. Vid samma fält ger dubbelt laddningsvärde dubbel kraft.","hint":""},"tag":"Obligatorisk kärna"},{"title":"Flera laddningar: addera fältens pilar","body":"\u003cdiv class=\"question\">P ligger mitt emellan \u003cb>+Q till vänster\u003c/b> och \u003cb>−2Q till höger\u003c/b>, på samma avstånd r. Rita E₁ och E₂ i P. Vänd sedan den högra laddningens tecken. Vad händer med summan?\u003c/div>\u003cp>Superpositionsprincipen: beräkna varje källas fält i P och \u003cb>addera med tecken\u003c/b> längs x-axeln.\u003c/p>\u003cp class=\"small-context\">Den styrbara modellen använder Q = 1,0 nC som ett \u003cem>illustrativt\u003c/em> värde; ursprungsfrågan är symbolisk.\u003c/p>","source":"7","steps":["\u003cdiv class=\"field-math-stack\">\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>1x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"field-math-stack\">\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>2x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>k\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>tot,x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>1x\u003c/mtext>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>2x\u003c/mtext>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>tot,x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>3\u003c/mn>\u003cmi>k\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"field-math-stack\">\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>2x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>k\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>tot,x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>1x\u003c/mtext>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>2x\u003c/mtext>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>tot,x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>k\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsup>\u003cmi>r\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003c/div>\u003cp>Summan har negativ x-komponent och pekar åt vänster.\u003c/p>"],"teacher":"Visa först bara figur med laddningarna. E är en vektor; använd x-komponenter och låt tecknen avgöra riktning, inte beloppstecken. Modellen har likstora r på båda sidor och Q-värdet är ett tillagt, tydligt markerat demonstrationsvärde.","model":"superposition85","tag":"Obligatorisk kärna"},{"title":"Mellan plattor: ett nästan jämnt fält","body":"\u003cdiv class=\"question\">100 V mellan plattor, 2,0 cm isär. Hur stor och hur riktad är fältstyrkan? Vad händer vid dubbelt avstånd och samma spänning?\u003c/div>\u003cp>Bort från kanterna är fältet nästan homogent. Mellan plattorna pekar \u003ci>E\u003c/i> från den positiva till den negativa plattan.\u003c/p>","source":"8","steps":["\u003cdiv class=\"field-math\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\">\u003csemantics>\u003cmrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmn>2,0\u003c/mn>\u003c/mrow>\u003cmspace width=\"0.2em\"/>\u003cmtext>cm\u003c/mtext>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmn>0,020\u003c/mn>\u003c/mrow>\u003cmspace width=\"0.2em\"/>\u003cmtext>m\u003c/mtext>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"text/plain\">d = 2,0 cm = 0,020 m\u003c/annotation>\u003c/semantics>\u003c/math>.\u003c/div>","\u003cdiv class=\"field-math\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmi>d\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>100\u003c/mn>\u003cmtext> V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>0,020\u003c/mn>\u003cmtext> m\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>","\u003cdiv class=\"field-math\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\">\u003csemantics>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmrow>\u003cmn>5,0\u003c/mn>\u003c/mrow>\u003c/mrow>\u003cmspace width=\"0.2em\"/>\u003cmtext>kV/m\u003c/mtext>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"text/plain\">Eₓ = −5,0 kV/m\u003c/annotation>\u003c/semantics>\u003c/math>. Negativt tecken betyder åt vänster.\u003c/div>","\u003cp>Dubbla d vid oförändrad spänning → halva fältstyrkans storlek.\u003c/p>"],"teacher":"Visa att U här är en positiv storlek för spänningsskillnaden och riktningen ligger i minustecknet.","side":"\u003cfigure class=\"field-figure\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 345\" role=\"img\" aria-label=\"Två parallella plattor: vänster negativ, höger positiv. Tre lika långa fältpilar pekar åt vänster. Spänning 100 V och avstånd 2 cm.\">\u003cdefs>\u003cmarker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/>\u003c/marker>\u003c/defs>\u003crect x=\"78\" y=\"58\" width=\"12\" height=\"228\" rx=\"2\" fill=\"#197b99\" stroke=\"#197b99\" stroke-width=\"0\"/>\u003crect x=\"469\" y=\"58\" width=\"12\" height=\"228\" rx=\"2\" fill=\"#c16e42\" stroke=\"#c16e42\" stroke-width=\"0\"/>\u003ctext x=\"84\" y=\"44\" font-family=\"system-ui\" font-size=\"26\" font-weight=\"650\" fill=\"#177b99\" text-anchor=\"middle\">−\u003c/text>\u003ctext x=\"473\" y=\"44\" font-family=\"system-ui\" font-size=\"26\" font-weight=\"650\" fill=\"#c16e42\" text-anchor=\"middle\">+\u003c/text>\u003cline x1=\"435\" y1=\"104\" x2=\"121\" y2=\"104\" stroke=\"#177b99\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cpolygon points=\"121,104 132.0,97.5 132.0,110.5\" fill=\"#177b99\"/>\u003cline x1=\"435\" y1=\"160\" x2=\"121\" y2=\"160\" stroke=\"#177b99\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cpolygon points=\"121,160 132.0,153.5 132.0,166.5\" fill=\"#177b99\"/>\u003cline x1=\"435\" y1=\"216\" x2=\"121\" y2=\"216\" stroke=\"#177b99\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cpolygon points=\"121,216 132.0,209.5 132.0,222.5\" fill=\"#177b99\"/>\u003ctext x=\"280\" y=\"314\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">d = 2,0 cm   ·   U = 100 V\u003c/text>\u003c/svg>\u003cfigcaption>Idealisering: nästan homogent fält långt från plattornas kanter.\u003c/figcaption>\u003c/figure>","quiz":{"prompt":"Spänningen är oförändrad men plattavståndet dubblas. Fältstyrkans storlek blir …","options":["dubbel","hälften","oförändrad"],"correct":1,"why":"För ett homogent plattfält gäller fältstyrkans storlek U/d. Dubbel d ger halva värdet.","hint":""},"tag":"Obligatorisk kärna"},{"title":"Ett starkt fält behöver inte ge ökande kraft","body":"\u003cdiv class=\"question\">En elektron släpps från vila vid minusplattan i ett fält åt vänster. Rör den sig mot plus? Är kraften konstant? Hur förändras hastigheten?\u003c/div>\u003cp>Ändra spänning, plattavstånd och tid i modellen. Förutsäg innan du visar elektronens rörelse och resultat.\u003c/p>\u003cp class=\"small-context\">Modellen är icke-relativistisk och försummar tyngdkraft, kollisioner och kanteffekter. Elektronen stannar vid plusplattan.\u003c/p>","source":"9–11","model":"electron85","steps":["\u003cp>Eftersom q = −e och Eₓ är negativt blir \u003cb>Fₓ positiv\u003c/b>: elektronen accelererar åt höger.\u003c/p>","\u003cp>I homogent fält är kraft och acceleration konstanta \u003cem>under färden\u003c/em>. Hastigheten ökar i lika stora tidssteg.\u003c/p>","\u003cp>Efter kollision med plusplattan gäller inte längre modellen för fri partikelrörelse mellan plattorna.\u003c/p>"],"teacher":"Originalets sidor 9–11 har före/animation/efter. Modellen ger samma fysik med styrbart tidsläge och avbryts vid träff. Visa att lika tidsintervall ger ökande sträckor. Använd faktisk demonstrerad tid för att inte misstolka animationens längd.","tag":"Obligatorisk kärna"},{"title":"Från elektriskt fält till acceleration","body":"\u003cdiv class=\"question\">Eₓ = −5,0 kV/m och q = −e. Vad blir elektronens kraft och acceleration med höger som positiv riktning?\u003c/div>\u003cp>Elektronens massa: mₑ = 9,11 · 10⁻³¹ kg. Elementarladdning: e = 1,602 · 10⁻¹⁹ C.\u003c/p>","source":"12","steps":["\u003cdiv class=\"field-math-stack\">\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>1,602\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>19\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>C\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>5,0\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>+\u003c/mo>\u003cmn>3\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>N/C\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"field-math-stack\">\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>F\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>q\u003c/mi>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>F\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmo>(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>1,602\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>19\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>C\u003c/mtext>\u003cmo>)\u003c/mo>\u003c/mrow>\u003cmo>·\u003c/mo>\u003cmrow>\u003cmo>(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>5,0\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>+\u003c/mo>\u003cmn>3\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>N/C\u003c/mtext>\u003cmo>)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"field-math-stack\">\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>F\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>+\u003c/mo>\u003cmn>8,01\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>16\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>N\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"field-math-stack\">\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>a\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmtext>e\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>a\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmo>+\u003c/mo>\u003cmn>8,01\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>16\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>N\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>9,11\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>31\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>kg\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>a\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003cmo>≈\u003c/mo>\u003cmo>+\u003c/mo>\u003cmn>8,8\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>+\u003c/mo>\u003cmn>14\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>m/s²\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cp>\u003cb>Rimlighet:\u003c/b> den mycket lilla massan ger stor acceleration. Halva fältstyrkan ger halva kraften och accelerationen.\u003c/p>"],"teacher":"Varning: mycket stor acceleration i mikroskopisk skala är rimlig för liten elektronmassa.","side":"\u003cfigure class=\"field-figure\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 330\" role=\"img\" aria-label=\"En elektron i ett elektriskt fält som pekar åt vänster. Fältstyrkan är minus 5 kilovolt per meter och positiv x-riktning är åt höger.\">\u003cdefs>\u003cmarker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"277\" y=\"43\" font-family=\"system-ui\" font-size=\"17\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Positiv x-riktning åt höger\u003c/text>\u003cline x1=\"438\" y1=\"112\" x2=\"122\" y2=\"112\" stroke=\"#177b99\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cpolygon points=\"122,112 133.0,105.5 133.0,118.5\" fill=\"#177b99\"/>\u003ctext x=\"276\" y=\"92\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">E = −5,0 kV/m\u003c/text>\u003ccircle cx=\"280\" cy=\"184\" r=\"24\" fill=\"#177b99\"/>\u003ctext x=\"280\" y=\"192\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−\u003c/text>\u003ctext x=\"280\" y=\"247\" font-family=\"system-ui\" font-size=\"19\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">F = qE   →   a = F/mₑ\u003c/text>\u003ctext x=\"280\" y=\"298\" font-family=\"system-ui\" font-size=\"15\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Rita kraft- och accelerationsriktning\u003c/text>\u003c/svg>\u003cfigcaption>Skilj E (fältet) från F (kraften) och a (accelerationen).\u003c/figcaption>\u003c/figure>","tag":"Obligatorisk kärna"},{"title":"Spänningen ger elektronen rörelseenergi","body":"\u003cdiv class=\"question\">En elektron startar från vila och accelereras genom spänningen U = 100 V. Hur mycket rörelseenergi får den och vilken slutfart ger modellen?\u003c/div>\u003cp>Elektriskt arbete omvandlas till rörelseenergi. Här är \u003ci>e\u003c/i> den \u003cb>positiva\u003c/b> elementarladdningen; förflyttningen är åt höger liksom kraften.\u003c/p>","source":"13","steps":["\u003cdiv class=\"field-math-stack\">\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>W\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>e\u003c/mi>\u003cmi>U\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>W\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmo>(\u003c/mo>\u003cmn>1,602\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>19\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>C\u003c/mtext>\u003cmo>)\u003c/mo>\u003c/mrow>\u003cmo>·\u003c/mo>\u003cmrow>\u003cmo>(\u003c/mo>\u003cmn>100\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>)\u003c/mo>\u003c/mrow>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>W\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>1,602\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>17\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>J\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"field-math-stack\">\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmtext>e\u003c/mtext>\u003c/msub>\u003cmsup>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmi>e\u003c/mi>\u003cmi>U\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsup>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>e\u003c/mi>\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmtext>e\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"field-math-stack\">\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>e\u003c/mi>\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmtext>e\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/msqrt>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsqrt>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmo>·\u003c/mo>\u003cmn>1,602\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>17\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>J\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>9,11\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>31\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>kg\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/msqrt>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>v\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>5,9\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>+\u003c/mo>\u003cmn>6\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>m/s\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cp>Fyrdubbel U → fyra gånger rörelseenergin men \u003cb>dubbel slutfart\u003c/b>, eftersom v ∝ √U.\u003c/p>","\u003cp>\u003cb>Rimlighet:\u003c/b> 5,9 · 10⁶ m/s är ungefär 2 % av ljushastigheten, så den icke-relativistiska approximationen fungerar här.\u003c/p>"],"teacher":"Inom givna hastigheter fungerar icke-relativistisk modell bra.","side":"\u003cfigure class=\"field-figure\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 345\" role=\"img\" aria-label=\"Elektron släpps nära vänstra negativa plattan, förflyttning och kraft pekar mot den högra positiva plattan.\">\u003cdefs>\u003cmarker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/>\u003c/marker>\u003c/defs>\u003crect x=\"70\" y=\"60\" width=\"12\" height=\"207\" rx=\"1\" fill=\"#187b99\" stroke=\"#187b99\" stroke-width=\"0\"/>\u003crect x=\"475\" y=\"60\" width=\"12\" height=\"207\" rx=\"1\" fill=\"#c16e42\" stroke=\"#c16e42\" stroke-width=\"0\"/>\u003ctext x=\"76\" y=\"42\" font-family=\"system-ui\" font-size=\"24\" font-weight=\"650\" fill=\"#177b99\" text-anchor=\"middle\">−\u003c/text>\u003ctext x=\"478\" y=\"42\" font-family=\"system-ui\" font-size=\"24\" font-weight=\"650\" fill=\"#c16e42\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"139\" cy=\"155\" r=\"18\" fill=\"#177b99\"/>\u003ctext x=\"139\" y=\"163\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−\u003c/text>\u003cline x1=\"174\" y1=\"154\" x2=\"403\" y2=\"154\" stroke=\"#258569\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cpolygon points=\"403,154 392.0,160.5 392.0,147.5\" fill=\"#258569\"/>\u003ctext x=\"290\" y=\"127\" font-family=\"system-ui\" font-size=\"17\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Förflyttning s åt höger\u003c/text>\u003ctext x=\"290\" y=\"309\" font-family=\"system-ui\" font-size=\"16\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Energi från elektriskt arbete → rörelseenergi\u003c/text>\u003c/svg>\u003cfigcaption>Betrakta fältet som homogent och försumma gravitation och relativistiska effekter.\u003c/figcaption>\u003c/figure>","tag":"Obligatorisk kärna"},{"title":"Faradays bur: varför skyddas insidan?","body":"\u003cdiv class=\"question\">Ett slutet ledande metallskal får extra elektroner. Ingen laddning finns i hålrummet. Var hamnar överskottsladdningen, och vilket fält finns i hålrummet vid elektrostatisk jämvikt?\u003c/div>\u003cp>Rita din förutsägelse innan nästa bild. Motivera med vad fria elektroner skulle göra om ett elektriskt fält fanns kvar i själva metallen.\u003c/p>","source":"14","teacher":"Undvik att avslöja svaret före nästa bild. Skilj det ledande materialet från det tomma hålrummet; avgränsa uttryckligen till elektrostatisk jämvikt.","side":"\u003cfigure class=\"field-figure\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 345\" role=\"img\" aria-label=\"Slutet metallskal som ring utan markerade överskottsladdningar. Fråga om fältet i det tomma hålrummet.\">\u003cdefs>\u003cmarker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/>\u003c/marker>\u003c/defs>\u003ccircle cx=\"280\" cy=\"165\" r=\"116\" fill=\"#edf5f7\" stroke=\"#6e8790\" stroke-width=\"18\"/>\u003ccircle cx=\"280\" cy=\"165\" r=\"96\" fill=\"#fff\" stroke=\"none\"/>\u003ctext x=\"280\" y=\"155\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Hålrummet\u003c/text>\u003ctext x=\"280\" y=\"187\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">E = ?\u003c/text>\u003ctext x=\"280\" y=\"308\" font-family=\"system-ui\" font-size=\"17\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Var hamnar extra elektroner?\u003c/text>\u003c/svg>\u003cfigcaption>Förutsäg var laddningarna samlas och vad som gäller för fältet inne i hålrummet.\u003c/figcaption>\u003c/figure>","tag":"Obligatorisk kärna"},{"title":"Laddningarna flyttar sig tills jämvikt nås","body":"\u003cp>I en metall kan fria elektroner röra sig. Om det fanns kvar ett elektriskt fält \u003cem>i ledarmaterialet\u003c/em> skulle laddningarna fortsätta att förflyttas.\u003c/p>\u003cdiv class=\"goal-card\">\u003cb>Elektrostatisk jämvikt\u003c/b>\u003cp>Fältet i ledarmaterialet är \u003cb>noll\u003c/b>. Extra laddning på ett slutet ledande skal utan laddningar i hålrummet finns på \u003cb>utsidan\u003c/b>. Fältet är också \u003cb>noll i det tomma hålrummet\u003c/b>.\u003c/p>\u003c/div>\u003cp>Ett yttre statiskt fält skärmas genom omfördelning av fria laddningar. Starka elektriska fält kan dessutom orsaka överslag genom luft.\u003c/p>","source":"15","teacher":"Poängtera att ett öppet skal, tidsvarierande fält och inre laddningar är andra fall.","side":"\u003cfigure class=\"field-figure\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 345\" role=\"img\" aria-label=\"Slutet metallskal i elektrostatisk jämvikt. Överskott av negativa laddningar på utsidan; fältet i tomt hålrum är noll.\">\u003cdefs>\u003cmarker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/>\u003c/marker>\u003c/defs>\u003ccircle cx=\"280\" cy=\"165\" r=\"111\" fill=\"#d9e8ee\" stroke=\"#829aa4\" stroke-width=\"19\"/>\u003ccircle cx=\"280\" cy=\"165\" r=\"91\" fill=\"white\"/>\u003ccircle cx=\"401.0\" cy=\"165.0\" r=\"13\" fill=\"#177b99\"/>\u003ctext x=\"401.0\" y=\"173.0\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"365.6\" cy=\"250.6\" r=\"13\" fill=\"#177b99\"/>\u003ctext x=\"365.6\" y=\"258.6\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"280.0\" cy=\"286.0\" r=\"13\" fill=\"#177b99\"/>\u003ctext x=\"280.0\" y=\"294.0\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"194.4\" cy=\"250.6\" r=\"13\" fill=\"#177b99\"/>\u003ctext x=\"194.4\" y=\"258.6\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"159.0\" cy=\"165.0\" r=\"13\" fill=\"#177b99\"/>\u003ctext x=\"159.0\" y=\"173.0\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"194.4\" cy=\"79.4\" r=\"13\" fill=\"#177b99\"/>\u003ctext x=\"194.4\" y=\"87.4\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"280.0\" cy=\"44.0\" r=\"13\" fill=\"#177b99\"/>\u003ctext x=\"280.0\" y=\"52.0\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−\u003c/text>\u003ccircle cx=\"365.6\" cy=\"79.4\" r=\"13\" fill=\"#177b99\"/>\u003ctext x=\"365.6\" y=\"87.4\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−\u003c/text>\u003ctext x=\"280\" y=\"154\" font-family=\"system-ui\" font-size=\"27\" font-weight=\"650\" fill=\"#258569\" text-anchor=\"middle\">E = 0\u003c/text>\u003ctext x=\"280\" y=\"186\" font-family=\"system-ui\" font-size=\"16\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">tomt hålrum\u003c/text>\u003ctext x=\"280\" y=\"323\" font-family=\"system-ui\" font-size=\"16\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Överskottsladdning: yttre ytan\u003c/text>\u003c/svg>\u003cfigcaption>Gäller i elektrostatisk jämvikt när hålrummet saknar laddningar.\u003c/figcaption>\u003c/figure>","steps":["\u003cp>Avgränsning: ett öppet skal, tidsvarierande fält eller laddningar inne i hålrummet kräver en annan analys.\u003c/p>"],"tag":"Obligatorisk kärna"},{"title":"Tre snabba frågor före boken","body":"\u003cdiv class=\"question\">Svara \u003cb>enskilt\u003c/b> och motivera kort. Jämför sedan förklaringar i par.\u003c/div>\u003col>\u003cli>Fältet pekar nedåt. Åt vilket håll verkar kraften på en elektron?\u003c/li>\u003cli>Mellan plattor: U = 60 V och d = 3,0 cm, fält åt vänster. Beräkna E med tecken.\u003c/li>\u003cli>Varför skärmar ett slutet metallskal ett yttre statiskt elektriskt fält?\u003c/li>\u003c/ol>\u003cp>Visa inte återkopplingen förrän alla har försökt.\u003c/p>","source":"16","teacher":"Diagnostisk egenkontroll före bokarbetet.","side":"\u003cfigure class=\"field-figure\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 342\" role=\"img\" aria-label=\"Ett fält som pekar nedåt, en uppgift med 60 volt över 3 centimeter och en fråga om ett metallskal.\">\u003cdefs>\u003cmarker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"273\" y=\"44\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Tre olika förklaringar\u003c/text>\u003cline x1=\"80\" y1=\"109\" x2=\"80\" y2=\"192\" stroke=\"#177b99\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cpolygon points=\"80,192 73.5,181.0 86.5,181.0\" fill=\"#177b99\"/>\u003ctext x=\"120\" y=\"156\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"start\">E nedåt: elektronens F ?\u003c/text>\u003cline x1=\"35\" y1=\"222\" x2=\"525\" y2=\"222\" stroke=\"#c4d8df\" stroke-width=\"2\" stroke-linecap=\"round\"/>\u003ctext x=\"54\" y=\"268\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#c16e42\" text-anchor=\"start\">U = 60 V\u003c/text>\u003ctext x=\"54\" y=\"299\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"start\">d = 3,0 cm\u003c/text>\u003ctext x=\"324\" y=\"265\" font-family=\"system-ui\" font-size=\"16\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"start\">Metallskal: E i hålrum?\u003c/text>\u003c/svg>\u003cfigcaption>Skriv själv, motivera och kontrollera sedan med en annan färg.\u003c/figcaption>\u003c/figure>","tag":"Kort egenkontroll"},{"title":"Kontrollera och förbättra ditt svar","body":"\u003cdiv class=\"question\">Jämför dina tre svar med förklaringarna. Rätta med en annan färg och skriv \u003cb>varför\u003c/b>.\u003c/div>\u003cp>Öppna ett steg i taget först efter elevernas försök.\u003c/p>","source":"17","steps":["\u003cp>\u003cb>1.\u003c/b> Kraften pekar \u003cb>uppåt\u003c/b> eftersom elektronens laddning är negativ och F = qE.\u003c/p>","\u003cdiv class=\"field-math-stack\">\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>d\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>3,0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>cm\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>d\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0,030\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>m\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>d\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>60\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>0,030\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>m\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>2 000\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V/m\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"field-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>x\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>2,0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>kV/m\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cp>\u003cb>3.\u003c/b> Fria laddningar omfördelas tills fältet i ledarmaterialet är noll. Ett slutet skal med tomt hålrum har också nollfält inne i hålrummet i elektrostatisk jämvikt.\u003c/p>"],"teacher":"Låt eleverna synliggöra omprövning, inte bara bocka rätt/fel.","side":"\u003cfigure class=\"field-figure\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 315\" role=\"img\" aria-label=\"Kraften på elektron pekar uppåt när fältet pekar nedåt. Fältstyrka 60 volt delat med 3 centimeter är 2 kilovolt per meter åt vänster.\">\u003cdefs>\u003cmarker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/>\u003c/marker>\u003c/defs>\u003ctext x=\"280\" y=\"49\" font-family=\"system-ui\" font-size=\"19\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Korrigera – förklara – kontrollera\u003c/text>\u003cline x1=\"142\" y1=\"155\" x2=\"142\" y2=\"95\" stroke=\"#258569\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cpolygon points=\"142,95 148.5,106.0 135.5,106.0\" fill=\"#258569\"/>\u003ctext x=\"178\" y=\"127\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"start\">Elektronens F uppåt\u003c/text>\u003crect x=\"54\" y=\"212\" width=\"454\" height=\"65\" rx=\"10\" fill=\"#e9f6f0\" stroke=\"#a6cfb6\" stroke-width=\"1\"/>\u003ctext x=\"280\" y=\"250\" font-family=\"system-ui\" font-size=\"21\" font-weight=\"650\" fill=\"#258569\" text-anchor=\"middle\">Eₓ = −2,0 kV/m\u003c/text>\u003c/svg>\u003cfigcaption>Förklara också hur skärmen omfördelar fria laddningar.\u003c/figcaption>\u003c/figure>","tag":"Kort egenkontroll"},{"title":"Nu använder du modellen själv","body":"\u003cdiv class=\"book-main\">\u003cb>Bokarbete och läxa: uppgift 851–860, s. 307–308\u003c/b>\u003cp>Lässtöd: avsnitt 8.5, s. 300–307. Börja själv och jämför sedan metod och riktningar med en kamrat.\u003c/p>\u003c/div>\u003cdiv class=\"question\">Exit: Ett oförändrat fält verkar på −q₀. Vi byter till −2q₀. Vad händer med E och F? Förklara med ett samband.\u003c/div>\u003cp>\u003cb>Dagens mål:\u003c/b> rita fält och kraft · beräkna E, F och a · förklara skärmning.\u003c/p>\u003cp>\u003cb>Inför nästa lektion:\u003c/b> läs s. 309–314, särskilt de \u003cb>gröna rutorna\u003c/b>.\u003c/p>","source":"18","time":"Bokarbete + exit","steps":["\u003cp>\u003cb>Kontroll:\u003c/b> F = qE. När q byts från −q₀ till −2q₀ blir kraftens storlek dubbelt så stor och riktningen densamma. Själva fältet E ändras inte i testladdningsmodellen.\u003c/p>"],"teacher":"Bevara uppgiftsintervall och läsanvisning från originalet. Ingen Socrative finns i denna originallektion.","quiz":{"prompt":"Vid samma E byts −q₀ till −2q₀. Vad händer med kraften?","options":["Samma kraft","Dubbla kraftens storlek, samma riktning","Dubbla kraftens storlek, motsatt riktning"],"correct":1,"why":"F = qE. Negativt tecken kvarstår, så riktningen är oförändrad; två gånger laddningsstorleken ger två gånger kraftens storlek. E bestäms av källorna och ändras inte.","hint":""},"tag":"Obligatorisk kärna"}]}</script><script src="../../gemensamt/models.js"></script><script src="falt-models.js?v=rev85a"></script><script src="../../gemensamt/app.js"></script><script src="falt-ui.js?v=rev85a"></script><script src="../../gemensamt/sjalvtest.js?v=papper2" defer></script><script src="../../gemensamt/matematik-typografi.js?v=3" defer></script></body></html>
