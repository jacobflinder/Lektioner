name: Ma4 kapitel 1 browser QA

on:
  push:
    paths:
      - 'ma4/index.html'
      - 'ma4/kapitel-1/**'
      - '.github/workflows/ma4-kapitel-1-browser-qa.yml'
  pull_request:
    paths:
      - 'ma4/index.html'
      - 'ma4/kapitel-1/**'
      - '.github/workflows/ma4-kapitel-1-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kapitel-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start lesson site
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/ma4-http.log 2>&1 &
          curl --fail --retry 12 --retry-connrefused --retry-delay 1 http://127.0.0.1:8123/ma4/kapitel-1/ > /dev/null
      - name: Verify trigonometry lesson in Chromium
        run: |
          node ma4/kapitel-1/qa/trigonometri-och-trianglar.cjs
          node ma4/kapitel-1/qa/enhetscirkeln.cjs
          node ma4/kapitel-1/qa/trigonometriska-ekvationer.cjs
          node ma4/kapitel-1/qa/enhetscirkeln-symmetrier.cjs
          node ma4/kapitel-1/qa/trigonometriska-ettan.cjs
          node ma4/kapitel-1/qa/additions-och-subtraktionsformler.cjs
          node ma4/kapitel-1/qa/formler-for-dubbla-vinkeln.cjs
          node ma4/kapitel-1/qa/ekvationer-och-formler.cjs
          node ma4/kapitel-1/qa/sinus-och-cosinusfunktioner.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ma4-kapitel-1-screenshots
          path: |
            /tmp/ma4-trianglar-qa
            /tmp/ma4-enhetscirkeln-qa
            /tmp/ma4-trigekv-qa
            /tmp/ma4-symmetri-qa
            /tmp/ma4-ettan-qa
            /tmp/ma4-add-qa
            /tmp/ma4-dubbel-qa
            /tmp/ma4-omforma-qa
            /tmp/ma4-graf-qa
