<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Potential · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"><link rel="stylesheet" href="potential.css?v=rev86a"><link rel="stylesheet" href="../../gemensamt/sjalvtest.css?v=papper2"><link rel="stylesheet" href="../../gemensamt/matematik-typografi.css?v=3"></head><body data-fy1-lesson="potential"><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Potential</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Potential","subject":"Fysik nivå 1","chapter":"8.6 · Potential","source":"Fy1_Potential.pdf","goals":["Skilja potential i en punkt från spänning mellan två punkter.","Bestämma potentialer genom en vandring i en krets.","Förklara vad vald nollnivå ändrar och vad som är oförändrat."],"pages":[{"title":"Potential: var är vi – vad skiljer två punkter?","body":"\u003cdiv class=\"question\">Punkt A har potentialen \u003cb>12 V\u003c/b> och punkt B \u003cb>8 V\u003c/b>. Vad skiljer punkterna åt – och vilket tecken får U\u003csub>AB\u003c/sub>?\u003c/div>\u003cp>Förklara med ord innan någon formel visas. \u003cb>Potential\u003c/b> beskriver en punkt relativt en vald referens. \u003cb>Spänning\u003c/b> är potentialskillnaden mellan två punkter.\u003c/p>\u003cdiv class=\"goal-card\">\u003cb>Efter lektionen ska du kunna\u003c/b>\u003col>\u003cli>Skilja potential från spänning.\u003c/li>\u003cli>Bestämma potentialer genom en vandring i en krets.\u003c/li>\u003cli>Förklara vad en vald nollnivå ändrar – och inte ändrar.\u003c/li>\u003c/ol>\u003c/div>","source":"1","teacher":"Enskilt → par → klass. Börja med frågan och låt eleverna säga att potential i en punkt inte är samma sak som spänning mellan punkter.","side":"\u003cfigure class=\"potential-figure\">\u003csvg role=\"img\" aria-label=\"Två punkter A och B med potentialerna 12 V och 8 V. En linje binder dem utan att ange en fysisk ledning. Frågan är potentialskillnaden.\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\">\u003ctext x=\"280\" y=\"40\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"22\" font-weight=\"650\" text-anchor=\"middle\">Två punkter – en skillnad\u003c/text>\u003ccircle cx=\"130\" cy=\"155\" r=\"18\" fill=\"#c46e42\"/>\u003ccircle cx=\"426\" cy=\"155\" r=\"18\" fill=\"#147a99\"/>\u003ctext x=\"130\" y=\"162\" font-family=\"system-ui\" fill=\"white\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"426\" y=\"162\" font-family=\"system-ui\" fill=\"white\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"130\" y=\"204\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">Vₐ = 12 V\u003c/text>\u003ctext x=\"426\" y=\"204\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">Vᵦ = 8 V\u003c/text>\u003cpath d=\"M154 155H400\" fill=\"none\" stroke=\"#789ba8\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"7 9\"/>\u003ctext x=\"280\" y=\"134\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"22\" font-weight=\"650\" text-anchor=\"middle\">Uₐᵦ = ?\u003c/text>\u003ctext x=\"280\" y=\"253\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">Vilka två värden jämförs?\u003c/text>\u003c/svg>\u003cfigcaption>Punkterna är inte förbundna av en ritad metalltråd; den streckade linjen visar bara jämförelsen.\u003c/figcaption>\u003c/figure>","steps":["\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>A\u003c/mtext>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>8\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>+\u003c/mo>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>"],"tag":"Kärninnehåll"},{"title":"Från kateder till bänk: nivå eller skillnad?","body":"\u003cdiv class=\"question\">Läraren visar en \u003cb>verklig kateder, en lägre bänk och golvet\u003c/b>. Vilka är nivåerna och vilka är skillnaderna? Vilket steg är störst: 12 → 8 eller 8 → 0?\u003c/div>\u003cp>\u003cb>Analogin:\u003c/b> höjd motsvarar potential; höjdskillnad motsvarar spänning. Men möblernas faktiska höjder mäts inte i volt.\u003c/p>\u003cp class=\"small-context\">När vi lämnar analogin ska vi rita hur resistorer i en riktig krets ger potentialfall.\u003c/p>","source":"2","steps":["\u003cp>\u003cb>12 − 8 = 4 V\u003c/b> mellan katedern och bänken; \u003cb>8 − 0 = 8 V\u003c/b> mellan bänken och golvet. Den senare skillnaden är större.\u003c/p>"],"teacher":"Utför demonstrationen fysiskt. Låt gärna eleverna stå/sitta på nivåerna, om säkert. Höjd är en analogi för potential och ingen mekanisk orsak till elström. Rita senare resistorer in i kretsen.","side":"\u003cfigure class=\"potential-figure\">\u003csvg role=\"img\" aria-label=\"Höjdmodell med kateder 12 V, lägre bänk 8 V och golv noll volt. Kateder minus bänk är 4 V.\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M40 275H518\" fill=\"none\" stroke=\"#789ba8\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003crect x=\"70\" y=\"52\" width=\"120\" height=\"13\" rx=\"4\" fill=\"#b7d7ca\" stroke=\"#9bb6aa\" stroke-width=\"1\"/>\u003cpath d=\"M82 65V275 M178 65V275\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"130.0\" y=\"38\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">Kateder · 12 V\u003c/text>\u003crect x=\"265\" y=\"132\" width=\"124\" height=\"13\" rx=\"4\" fill=\"#b7d7ca\" stroke=\"#9bb6aa\" stroke-width=\"1\"/>\u003cpath d=\"M277 145V275 M377 145V275\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"327.0\" y=\"118\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">Bänk · 8 V\u003c/text>\u003cpath d=\"M215 65 L215 143\" fill=\"none\" stroke=\"#c46e42\" stroke-width=\"2.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpolygon points=\"215,143 209.5,132.0 220.5,132.0\" fill=\"#c46e42\"/>\u003ctext x=\"233\" y=\"112\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"19\" font-weight=\"650\" text-anchor=\"start\">4 V\u003c/text>\u003ctext x=\"95\" y=\"298\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">Golv: 0 V\u003c/text>\u003c/svg>\u003cfigcaption>Analogi som också visas med riktiga möbler. Våra faktiska möbelhöjder är inte mätta i volt.\u003c/figcaption>\u003c/figure>","tag":"Kärninnehåll"},{"title":"Mätordningen bestämmer tecknet","body":"\u003cdiv class=\"question\">En voltmeters röda mätledning sitter i A (12 V) och den svarta i B (8 V). Vilket värde visar mätaren? Vad händer om vi byter proberna?\u003c/div>\u003cp>Föreslå tecknet innan du räknar. \u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\">\u003csemantics>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>A\u003c/mtext>\u003c/msub>\u003c/mrow>\u003cmo>−\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/mrow>\u003c/mrow>\u003cannotation encoding=\"text/plain\">U_AB = V_A − V_B\u003c/annotation>\u003c/semantics>\u003c/math> är en riktad potentialskillnad enligt vald ordning.\u003c/p>\u003cp>\u003cb>Din tur:\u003c/b> A ligger på −3 V och B på +2 V. Bestäm U\u003csub>AB\u003c/sub>.\u003c/p>","source":"3","steps":["\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>A\u003c/mtext>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>8\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>+\u003c/mo>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>BA\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>A\u003c/mtext>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>BA\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>8\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>BA\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>3\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmo>(\u003c/mo>\u003cmo>+\u003c/mo>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>)\u003c/mo>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>5\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003cp>Den svarta mätledningen sitter på högre potential.\u003c/p>"],"teacher":"Skilj tecknet i U_AB från spänningens positiva storlek. Låt eleven välja mätordning. Var noga med att röd mätledning är första potentialen.","side":"\u003cfigure class=\"potential-figure\">\u003csvg role=\"img\" aria-label=\"Voltmeter med röd prob ansluten till A på 12 V och svart prob vid B på 8 V. Mätningen är 12 minus 8 volt.\" viewBox=\"0 0 560 285\" xmlns=\"http://www.w3.org/2000/svg\">\u003ctext x=\"130\" y=\"46\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">Punkt A\u003c/text>\u003ctext x=\"433\" y=\"46\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">Punkt B\u003c/text>\u003ccircle cx=\"130\" cy=\"125\" r=\"17\" fill=\"#c46e42\"/>\u003ccircle cx=\"433\" cy=\"125\" r=\"17\" fill=\"#147a99\"/>\u003ctext x=\"130\" y=\"132\" font-family=\"system-ui\" fill=\"white\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"433\" y=\"132\" font-family=\"system-ui\" fill=\"white\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"130\" y=\"166\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"20\" font-weight=\"650\" text-anchor=\"middle\">12 V\u003c/text>\u003ctext x=\"433\" y=\"166\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"20\" font-weight=\"650\" text-anchor=\"middle\">8 V\u003c/text>\u003cpath d=\"M130 142V205H225 M433 142V205H339\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ccircle cx=\"282\" cy=\"205\" r=\"52\" fill=\"white\"/>\u003ccircle cx=\"282\" cy=\"205\" r=\"52\" fill=\"none\" stroke=\"#5f8390\" stroke-width=\"3\"/>\u003ctext x=\"282\" y=\"214\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"29\" font-weight=\"650\" text-anchor=\"middle\">V\u003c/text>\u003ctext x=\"213\" y=\"246\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">röd\u003c/text>\u003ctext x=\"366\" y=\"246\" font-family=\"system-ui\" fill=\"#147a99\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">svart\u003c/text>\u003c/svg>\u003cfigcaption>Röd prob anger första punkten i Uₐᵦ. Vid byte av prober blir det motsatt tecken.\u003c/figcaption>\u003c/figure>","quiz":{"prompt":"Röd prob i A = −3 V, svart i B = +2 V. Vilket Uₐᵦ visar mätaren?","options":["+5 V","−5 V","−1 V"],"correct":1,"why":"Uₐᵦ = Vₐ − Vᵦ = −3 V − (+2 V) = −5 V. Byte av prober vänder tecknet.","hint":""},"tag":"Kärninnehåll"},{"title":"Fältet pekar mot lägre potential","body":"\u003cdiv class=\"question\">Vänster platta har +100 V, höger 0 V. Vilken riktning har fältet? Vilken riktning får kraften på en positiv laddning respektive en elektron som släpps från vila?\u003c/div>\u003cp>Fältet går från \u003cb>högre till lägre potential\u003c/b>. En positiv laddning påverkas längs fältet, en elektron i motsatt riktning.\u003c/p>","source":"4","steps":["\u003cp>Fältet \u003cb>E pekar åt höger\u003c/b>. På en positiv laddning verkar kraften åt höger, på en elektron åt vänster.\u003c/p>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>p\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>q\u003c/mi>\u003cmi>V\u003c/mi>\u003c/math>\u003c/div>\u003c/div>\u003cp>Om potentialens nollnivå byts, ändras också nollnivån för potentiell energi. Det är \u003cb>energiändringen\u003c/b> som ger ett fysikaliskt mätbart resultat.\u003c/p>","\u003cp>Eftersom elektronens laddning är negativ kan dess potentiella energi minska när den går mot högre potential.\u003c/p>"],"teacher":"Fråga först om fältriktning, sedan kraft. Elektronens laddning är negativ; undvik att säga att alla partiklar ”rullar nedåt” i potential.","side":"\u003cfigure class=\"potential-figure\">\u003csvg role=\"img\" aria-label=\"Två plattor, vänster plus 100 V och höger 0 V. Elektriska fältpilar åt höger. Positiv testladdnings kraft åt höger och elektronens åt vänster.\" viewBox=\"0 0 560 355\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"74\" y=\"65\" width=\"13\" height=\"210\" rx=\"4\" fill=\"#c46e42\" stroke=\"#c46e42\" stroke-width=\"1\"/>\u003crect x=\"466\" y=\"65\" width=\"13\" height=\"210\" rx=\"4\" fill=\"#147a99\" stroke=\"#147a99\" stroke-width=\"1\"/>\u003ctext x=\"81\" y=\"45\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"20\" font-weight=\"650\" text-anchor=\"middle\">+100 V\u003c/text>\u003ctext x=\"475\" y=\"45\" font-family=\"system-ui\" fill=\"#147a99\" font-size=\"20\" font-weight=\"650\" text-anchor=\"middle\">0 V\u003c/text>\u003ctext x=\"280\" y=\"45\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">+x →\u003c/text>\u003cpath d=\"M115 102 L433 102\" fill=\"none\" stroke=\"#147a99\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpolygon points=\"433,102 422.0,107.5 422.0,96.5\" fill=\"#147a99\"/>\u003cpath d=\"M115 148 L433 148\" fill=\"none\" stroke=\"#147a99\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpolygon points=\"433,148 422.0,153.5 422.0,142.5\" fill=\"#147a99\"/>\u003cpath d=\"M115 194 L433 194\" fill=\"none\" stroke=\"#147a99\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpolygon points=\"433,194 422.0,199.5 422.0,188.5\" fill=\"#147a99\"/>\u003cpath d=\"M115 240 L433 240\" fill=\"none\" stroke=\"#147a99\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpolygon points=\"433,240 422.0,245.5 422.0,234.5\" fill=\"#147a99\"/>\u003ccircle cx=\"172\" cy=\"306\" r=\"20\" fill=\"#c46e42\"/>\u003ctext x=\"172\" y=\"314\" font-family=\"system-ui\" fill=\"white\" font-size=\"23\" font-weight=\"650\" text-anchor=\"middle\">+\u003c/text>\u003ccircle cx=\"385\" cy=\"306\" r=\"20\" fill=\"#147a99\"/>\u003ctext x=\"385\" y=\"314\" font-family=\"system-ui\" fill=\"white\" font-size=\"23\" font-weight=\"650\" text-anchor=\"middle\">−\u003c/text>\u003cpath d=\"M207 306 L265 306\" fill=\"none\" stroke=\"#207b61\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpolygon points=\"265,306 254.0,311.5 254.0,300.5\" fill=\"#207b61\"/>\u003cpath d=\"M351 306 L293 306\" fill=\"none\" stroke=\"#207b61\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpolygon points=\"293,306 304.0,300.5 304.0,311.5\" fill=\"#207b61\"/>\u003c/svg>\u003cfigcaption>Fältet pekar mot lägre potential. Elektronens kraft är motsatt fältets riktning.\u003c/figcaption>\u003c/figure>","tag":"Kärninnehåll"},{"title":"Din tur: riktning och nollnivå","body":"\u003cdiv class=\"question\">Samma två plattor som nyss: +100 V och 0 V. \u003cb>Flytta nu potentialernas gemensamma nollnivå\u003c/b> så att de blir 0 V och −100 V. Förändras spänningen, elektriska fältet eller elektronens rörelse?\u003c/div>\u003cp>Ändra referensförskjutningen i modellen. Förutsäg först och visa resultatet när du har förklarat för en kamrat.\u003c/p>","source":"5","teacher":"Öppen förutsägelse. Låt först eleverna räkna skillnaden. Ändra endast referensförskjutningen och återställ innan nästa elevgrupp.","model":"potentialplates86","steps":["\u003cp>Det är \u003cb>fortfarande 100 V mellan plattorna\u003c/b>. Fältet pekar åt höger och elektronens kraft åt vänster.\u003c/p>"],"tag":"Kärninnehåll"},{"title":"Ny nollnivå – samma fysik","body":"\u003cp>Vi sänker båda angivna potentialer med samma värde utan att röra plattor eller laddningar. Från +100 och 0 V till 0 och −100 V.\u003c/p>\u003cdiv class=\"question\">Visa med en differens varför både spänningen och fältets riktning är oförändrade.\u003c/div>","source":"6","steps":["\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>(\u003c/mo>\u003cmo>+\u003c/mo>\u003cmn>100\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmo>(\u003c/mo>\u003cmn>0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>)\u003c/mo>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>100\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>(\u003c/mo>\u003cmn>0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmo>(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>100\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>)\u003c/mo>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>100\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cp>Samma potentialskillnad och samma geometri ger samma elektriska fält och samma kraft. \u003cb>0 V betyder inte att laddningen är noll.\u003c/b>\u003c/p>"],"teacher":"Ny potentialreferens är en koordinatförändring. Yttre fält och laddningarnas rörelse påverkas inte; inom den idealiserade situationen förblir U konstant.","side":"\u003cfigure class=\"potential-figure\">\u003csvg role=\"img\" aria-label=\"Samma två fysiska plattor beskrivs med potentialerna plus 100 och 0 volt eller 0 och minus 100 volt. I båda fallen pekar E åt höger.\" viewBox=\"0 0 560 290\" xmlns=\"http://www.w3.org/2000/svg\">\u003ctext x=\"150\" y=\"49\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"21\" font-weight=\"650\" text-anchor=\"middle\">Referens 1\u003c/text>\u003ctext x=\"405\" y=\"49\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"21\" font-weight=\"650\" text-anchor=\"middle\">Referens 2\u003c/text>\u003crect x=\"80\" y=\"80\" width=\"9\" height=\"134\" rx=\"4\" fill=\"#c46e42\" stroke=\"#c46e42\" stroke-width=\"1\"/>\u003crect x=\"210\" y=\"80\" width=\"9\" height=\"134\" rx=\"4\" fill=\"#147a99\" stroke=\"#147a99\" stroke-width=\"1\"/>\u003ctext x=\"82\" y=\"68\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">+100 V\u003c/text>\u003ctext x=\"215\" y=\"68\" font-family=\"system-ui\" fill=\"#147a99\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">0 V\u003c/text>\u003cpath d=\"M102 147 L198 147\" fill=\"none\" stroke=\"#147a99\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpolygon points=\"198,147 187.0,152.5 187.0,141.5\" fill=\"#147a99\"/>\u003crect x=\"335\" y=\"80\" width=\"9\" height=\"134\" rx=\"4\" fill=\"#c46e42\" stroke=\"#c46e42\" stroke-width=\"1\"/>\u003crect x=\"465\" y=\"80\" width=\"9\" height=\"134\" rx=\"4\" fill=\"#147a99\" stroke=\"#147a99\" stroke-width=\"1\"/>\u003ctext x=\"337\" y=\"68\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">0 V\u003c/text>\u003ctext x=\"470\" y=\"68\" font-family=\"system-ui\" fill=\"#147a99\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">−100 V\u003c/text>\u003cpath d=\"M357 147 L453 147\" fill=\"none\" stroke=\"#147a99\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpolygon points=\"453,147 442.0,152.5 442.0,141.5\" fill=\"#147a99\"/>\u003ctext x=\"275\" y=\"258\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">Båda har samma ΔV = 100 V\u003c/text>\u003c/svg>\u003cfigcaption>En gemensam förskjutning av potentialerna ändrar inte skillnaden.\u003c/figcaption>\u003c/figure>","tag":"Kärninnehåll"},{"title":"Potentialvandring: följ en hel slinga","body":"\u003cdiv class=\"question\">Ett idealt \u003cb>12 V-batteri\u003c/b> driver två seriekopplade resistorer på \u003cb>2 Ω och 4 Ω\u003c/b>. Strömmen är \u003cb>2 A\u003c/b>. Vi väljer V\u003csub>A\u003c/sub> = 0 V. Förutsäg potentialen i B, C och D när du vandrar \u003cb>A → B → C → D → A\u003c/b>.\u003c/div>\u003cp>Börja vid steg 0. Flytta ett steg i taget, låt eleverna säga nästa potential \u003cem>innan\u003c/em> du väljer Visa resultat. Byt sedan referens från A till C och prova igen.\u003c/p>\u003cp class=\"small-context\">Markören visar var vi läser av potentialen, inte en elektron som färdas.\u003c/p>","source":"7–9","model":"potentialwalk86","steps":["\u003cp>Från A till B över batteriet: potentialen \u003cb>ökar med 12 V\u003c/b>.\u003c/p>\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>A\u003c/mtext>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cp>Genom 2 Ω-resistorn i strömriktningen blir potentialfallet negativt:\u003c/p>\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>C\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>C\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>C\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>8\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cp>Genom 4 Ω-resistorn är spänningsfallet 8 V:\u003c/p>\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>D\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>C\u003c/mtext>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>D\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>8\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>8\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>D\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cp>Från D tillbaka till A genom ideal ledning sker inget potentialfall:\u003c/p>\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>A\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>D\u003c/mtext>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>A\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>"],"teacher":"Högprioriterad aktivitet. Modellen visar bara vandringssteg fram till vald position efter facit. Gör gärna två elevgrupper: A = 0 och C = 0. Kontrollera att varje steg visas efter deras förutsägelse.","tag":"Kärninnehåll"},{"title":"Varje steg får ett motiverat tecken","body":"\u003cdiv class=\"question\">Varför blir den ena resistorpotentialens fall −4 V och den andra −8 V när strömmen är 2 A?\u003c/div>\u003cp>Vandringen sker \u003cb>med strömriktningen\u003c/b> genom resistorerna. Över batteriet från minus till plus ökar potentialen. Om du vandrar åt andra hållet byts tecknen.\u003c/p>","source":"10","steps":["\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>tot\u003c/mtext>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>tot\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003cmo>+\u003c/mo>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>6\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>A\u003c/mtext>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>C\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>1\u003c/mtext>\u003c/msub>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>C\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>C\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>8\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>D\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>C\u003c/mtext>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>2\u003c/mtext>\u003c/msub>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>D\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>8\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>D\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cp>Kirchhoffs spänningslag. Varje komplett slinga har sammanlagt noll potentialändring:\u003c/p>\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmo>+\u003c/mo>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>8\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>"],"teacher":"Håll kretsschemat synligt bredvid alla mellanled. Den negativa termen beskriver potentialfall i den valda vandringsriktningen, inte ”negativ resistans”.","side":"\u003cfigure class=\"potential-figure\">\u003csvg role=\"img\" aria-label=\"Seriekrets med 12 V-batteri och två resistorer 2 respektive 4 ohm, utan förbikopplingar, markerade punkter A B C D och ström 2 A.\" viewBox=\"0 0 560 325\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M86 95H167 M231 95H318 M382 95H431V260H86V178 M86 153V95\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003crect x=\"167\" y=\"81\" width=\"64\" height=\"28\" rx=\"4\" fill=\"white\" stroke=\"#c46e42\" stroke-width=\"3\"/>\u003crect x=\"318\" y=\"81\" width=\"64\" height=\"28\" rx=\"4\" fill=\"white\" stroke=\"#147a99\" stroke-width=\"3\"/>\u003cpath d=\"M68 153H104 M78 178H94\" fill=\"none\" stroke=\"#c46e42\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"58\" y=\"153\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">+\u003c/text>\u003ctext x=\"58\" y=\"185\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">−\u003c/text>\u003ctext x=\"130\" y=\"191\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">12 V\u003c/text>\u003ctext x=\"199\" y=\"72\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">2 Ω\u003c/text>\u003ctext x=\"350\" y=\"72\" font-family=\"system-ui\" fill=\"#147a99\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">4 Ω\u003c/text>\u003cpath d=\"M326 264 L226 264\" fill=\"none\" stroke=\"#207b61\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpolygon points=\"226,264 237.0,258.5 237.0,269.5\" fill=\"#207b61\"/>\u003ctext x=\"294\" y=\"292\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">I = 2 A\u003c/text>\u003ccircle cx=\"86\" cy=\"260\" r=\"5\" fill=\"#244e5e\"/>\u003ctext x=\"97\" y=\"289\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">A\u003c/text>\u003ccircle cx=\"121\" cy=\"95\" r=\"5\" fill=\"#244e5e\"/>\u003ctext x=\"132\" y=\"82\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">B\u003c/text>\u003ccircle cx=\"270\" cy=\"95\" r=\"5\" fill=\"#244e5e\"/>\u003ctext x=\"281\" y=\"82\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">C\u003c/text>\u003ccircle cx=\"431\" cy=\"95\" r=\"5\" fill=\"#244e5e\"/>\u003ctext x=\"434\" y=\"82\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">D\u003c/text>\u003ctext x=\"94\" y=\"242\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">0 V\u003c/text>\u003ctext x=\"129\" y=\"123\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">+12 V\u003c/text>\u003ctext x=\"275\" y=\"123\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">+8 V\u003c/text>\u003ctext x=\"436\" y=\"123\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">0 V\u003c/text>\u003c/svg>\u003cfigcaption>Ideal seriekrets. A–B: batteriet lyfter 12 V; B–C: −4 V; C–D: −8 V; D–A: ideal ledning.\u003c/figcaption>\u003c/figure>","tag":"Kärninnehåll"},{"title":"Din tur: byt referens till C","body":"\u003cdiv class=\"question\">Samma krets med \u003cb>C som vald nollnivå\u003c/b>: V\u003csub>C\u003c/sub> = 0 V. Vad blir V\u003csub>A\u003c/sub>, V\u003csub>B\u003c/sub> och V\u003csub>D\u003c/sub>? Har U\u003csub>BC\u003c/sub> ändrats?\u003c/div>\u003cp>Rita först potentialvärdena för dig själv. Pröva sedan samma referensändring i potentialvandringsmodellen på bild 7.\u003c/p>","source":"11","steps":["\u003cp>Alla potentialer minskar med 8 V. Därför är \u003cb>V\u003csub>A\u003c/sub> = −8 V\u003c/b>, \u003cb>V\u003csub>B\u003c/sub> = +4 V\u003c/b>, \u003cb>V\u003csub>C\u003c/sub> = 0 V\u003c/b> och \u003cb>V\u003csub>D\u003c/sub> = −8 V\u003c/b>.\u003c/p>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>BC\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>C\u003c/mtext>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>BC\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>BC\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>+\u003c/mo>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003cp>Spänningen över resistorn är densamma som före referensbytet.\u003c/p>"],"teacher":"Behåll C = 0 V som explicit valt referensvärde. Det är inte automatiskt en fysisk jordledning dragen genom resistorn.","side":"\u003cfigure class=\"potential-figure\">\u003csvg role=\"img\" aria-label=\"Seriekrets med 12 V-batteri och två resistorer 2 respektive 4 ohm, utan förbikopplingar, markerade punkter A B C D och ström 2 A.\" viewBox=\"0 0 560 325\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M86 95H167 M231 95H318 M382 95H431V260H86V178 M86 153V95\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003crect x=\"167\" y=\"81\" width=\"64\" height=\"28\" rx=\"4\" fill=\"white\" stroke=\"#c46e42\" stroke-width=\"3\"/>\u003crect x=\"318\" y=\"81\" width=\"64\" height=\"28\" rx=\"4\" fill=\"white\" stroke=\"#147a99\" stroke-width=\"3\"/>\u003cpath d=\"M68 153H104 M78 178H94\" fill=\"none\" stroke=\"#c46e42\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"58\" y=\"153\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">+\u003c/text>\u003ctext x=\"58\" y=\"185\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">−\u003c/text>\u003ctext x=\"130\" y=\"191\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">12 V\u003c/text>\u003ctext x=\"199\" y=\"72\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">2 Ω\u003c/text>\u003ctext x=\"350\" y=\"72\" font-family=\"system-ui\" fill=\"#147a99\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">4 Ω\u003c/text>\u003cpath d=\"M326 264 L226 264\" fill=\"none\" stroke=\"#207b61\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpolygon points=\"226,264 237.0,258.5 237.0,269.5\" fill=\"#207b61\"/>\u003ctext x=\"294\" y=\"292\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">I = 2 A\u003c/text>\u003ccircle cx=\"86\" cy=\"260\" r=\"5\" fill=\"#244e5e\"/>\u003ctext x=\"97\" y=\"289\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">A\u003c/text>\u003ccircle cx=\"121\" cy=\"95\" r=\"5\" fill=\"#244e5e\"/>\u003ctext x=\"132\" y=\"82\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">B\u003c/text>\u003ccircle cx=\"270\" cy=\"95\" r=\"5\" fill=\"#244e5e\"/>\u003ctext x=\"281\" y=\"82\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">C\u003c/text>\u003ccircle cx=\"431\" cy=\"95\" r=\"5\" fill=\"#244e5e\"/>\u003ctext x=\"434\" y=\"82\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">D\u003c/text>\u003ctext x=\"94\" y=\"242\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">-8 V\u003c/text>\u003ctext x=\"129\" y=\"123\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">+4 V\u003c/text>\u003ctext x=\"275\" y=\"123\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">0 V\u003c/text>\u003ctext x=\"436\" y=\"123\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">-8 V\u003c/text>\u003c/svg>\u003cfigcaption>Ideal seriekrets. A–B: batteriet lyfter 12 V; B–C: −4 V; C–D: −8 V; D–A: ideal ledning.\u003c/figcaption>\u003c/figure>","quiz":{"prompt":"När referensen flyttas från A till C, vad händer med spänningen över 2 Ω?","options":["Den minskar med 8 V","Den ökar med 8 V","Den är fortfarande 4 V"],"correct":2,"why":"Alla angivna nodpotentialer flyttas lika mycket. Skillnaden V_B−V_C är fortfarande 4 V och strömmen i kretsen oförändrad.","hint":""},"tag":"Kärninnehåll"},{"title":"Negativ potential är lägre än vald nollnivå","body":"\u003cdiv class=\"question\">Två olika handlingar: (1) Vi väljer att \u003cb>skriva V\u003csub>C\u003c/sub> = 0 V\u003c/b>. (2) Vi drar en \u003cb>verklig ledning\u003c/b> mellan tidigare separata punkter. Vilken handling kan ändra strömmen?\u003c/div>\u003cp>En vald nollnivå är matematik. Att förbinda två punkter kan förändra kretsens topologi och ibland skapa kortslutning.\u003c/p>\u003cp>Två jord-symboler som uttryckligen avser samma elektriska nod representerar en gemensam förbindelse. Men att välja en punkt som referens i en uträkning är \u003cb>inte\u003c/b> en ny kabel.\u003c/p>","source":"12","steps":["\u003cp>Referensval: \u003cb>ingen fysisk ändring\u003c/b> och därmed samma strömmar och potentialskillnader.\u003c/p>","\u003cp>Ny fysisk kabel mellan punkter med olika potential: \u003cb>kretsen kan ändras\u003c/b>; med ideal ledning kan en komponent bli kortsluten.\u003c/p>","\u003cp>V\u003csub>A\u003c/sub> = −8 V när C = 0 V är fullt möjligt. Negativ potential betyder lägre än den valda referensnivån.\u003c/p>"],"teacher":"Här finns en viktig missuppfattning: referensbyte är inte jordningskabel. Visa schematiskt, men koppla aldrig medvetet kortslutning med riktiga batterier utan säker kontroll.","side":"\u003cfigure class=\"potential-figure\">\u003csvg role=\"img\" aria-label=\"Vänster: punkt A får referensen noll volt utan kabel till B. Höger: en fysisk kabel förbinder punkterna A och B.\" viewBox=\"0 0 560 270\" xmlns=\"http://www.w3.org/2000/svg\">\u003ctext x=\"140\" y=\"38\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"21\" font-weight=\"650\" text-anchor=\"middle\">Välj referens\u003c/text>\u003ctext x=\"418\" y=\"38\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"21\" font-weight=\"650\" text-anchor=\"middle\">Förbind med kabel\u003c/text>\u003ccircle cx=\"106\" cy=\"147\" r=\"17\" fill=\"#147a99\"/>\u003ccircle cx=\"218\" cy=\"147\" r=\"17\" fill=\"#147a99\"/>\u003ctext x=\"106\" y=\"154\" font-family=\"system-ui\" fill=\"white\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"218\" y=\"154\" font-family=\"system-ui\" fill=\"white\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">B\u003c/text>\u003ctext x=\"162\" y=\"100\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">0 V är ett valt tal\u003c/text>\u003cpath d=\"M130 147H194\" fill=\"none\" stroke=\"#a9c2ca\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"5 7\"/>\u003ccircle cx=\"364\" cy=\"147\" r=\"17\" fill=\"#147a99\"/>\u003ccircle cx=\"476\" cy=\"147\" r=\"17\" fill=\"#147a99\"/>\u003ctext x=\"364\" y=\"154\" font-family=\"system-ui\" fill=\"white\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">A\u003c/text>\u003ctext x=\"476\" y=\"154\" font-family=\"system-ui\" fill=\"white\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">B\u003c/text>\u003cpath d=\"M381 147H459\" fill=\"none\" stroke=\"#c46e42\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"420\" y=\"103\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">Verklig ledning\u003c/text>\u003ctext x=\"162\" y=\"227\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">Inget fysiskt ändras\u003c/text>\u003ctext x=\"420\" y=\"227\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">Kretsen kan ändras\u003c/text>\u003c/svg>\u003cfigcaption>Att skriva Vₐ = 0 V innebär inte att A kopplas med en ledning till någon annan punkt.\u003c/figcaption>\u003c/figure>","tag":"Kärninnehåll"},{"title":"Två batterier: låt polariteten styra","body":"\u003cdiv class=\"question\">Två ideala batterier ligger i samma slinga: \u003cb>10 V\u003c/b> och \u003cb>6 V\u003c/b>, med en total resistans på \u003cb>2 Ω\u003c/b>. När de motverkar varandra, vilken ström fås? Vad händer om du vänder 6 V-batteriet?\u003c/div>\u003cp>Föreslå tecknen i den valda vandringsriktningen innan du ändrar modellens batteripolaritet. Detta är en fördjupning som kan kortas i klassrumsläget om bokarbetet behöver mer tid.\u003c/p>","source":"13","steps":["\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmo>+\u003c/mo>\u003cmn>10\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>6\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>10\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>6\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cp>Strömmen går in i 6 V-källans pluspol i motverkande fallet; den källan laddas i idealmodellen.\u003c/p>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>10\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>+\u003c/mo>\u003cmn>6\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>8\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003cp>Strömriktningen är densamma, men strömbeloppet blir fyra gånger större.\u003c/p>"],"teacher":"Vänd sexvoltskällan med reglaget, inte med en ritad ”extra kabel”. Verkliga källor har inre resistans och tål inte nödvändigtvis dessa strömmar; idealiserad räkneuppgift, inte praktisk kopplingsinstruktion.","model":"potentialbattery86","tag":"Fördjupning / stöd"},{"title":"Socrative · elfält och potential","body":"\u003cdiv class=\"socrative\">\u003cb>Originalets Socrative: Fy1 · 905. Elfält och potential\u003c/b>\u003cp>Quiz-ID: \u003ccode>SOC-37397534\u003c/code>\u003c/p>\u003col>\u003cli>Svara \u003cb>enskilt\u003c/b>.\u003c/li>\u003cli>Jämför med en kamrat och förklara.\u003c/li>\u003cli>Ompröva svaret och följ upp gemensamt.\u003c/li>\u003c/ol>\u003cp>Motivera med fältriktning, potentialskillnad och potentialvandring.\u003c/p>\u003c/div>\u003cp class=\"small-context\">Detta är originalets frågebatteri, inte en ny webbquiz. De övriga webbfrågorna är separata självkontroller.\u003c/p>","source":"14","teacher":"Socrative 905, SOC-37397534 är verifierat i originalet. Låt klassen arbeta enskilt → par → klass. Behöver du tid: välj ut den fråga som visar störst skillnader i resonemang.","tag":"Kärninnehåll"},{"title":"Bokens uppgifter · visa vad du kan","body":"\u003cdiv class=\"book-main\">\u003cb>Bokens uppgifter och läxa: 861–870, s. 313–314\u003c/b>\u003cp>Stöd: avsnitt 8.6, s. 309–312, inklusive bokens \u003cb>gröna rutor\u003c/b>. Börja enskilt och jämför sedan metod och tecken med en kamrat.\u003c/p>\u003c/div>\u003cdiv class=\"question\">Exit: A ligger på +5 V och B på −1 V. (1) Beräkna U\u003csub>AB\u003c/sub>. (2) Välj A = 0 V – vad får B för potential? (3) Vad ändras och vad ändras inte?\u003c/div>\u003cp>\u003cb>Dagens mål:\u003c/b> skilja potential från spänning · vandra i krets med tecken · förklara nollnivå.\u003c/p>","source":"15","time":"Bokarbete + exit","steps":["\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>A\u003c/mtext>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>(\u003c/mo>\u003cmo>+\u003c/mo>\u003cmn>5\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmo>(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>)\u003c/mo>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>AB\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>+\u003c/mo>\u003cmn>6\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>A\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>(\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>)\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>5\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>V\u003c/mi>\u003cmtext>B\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmo>−\u003c/mo>\u003cmn>6\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003cp>Alla nodpotentialer ändras lika mycket. Potentialskillnaderna förblir oförändrade.\u003c/p>","\u003cp>Alla potentialer byter tal med samma belopp. \u003cb>Spänning, fält och den fysiska kopplingen ändras inte.\u003c/b>\u003c/p>"],"teacher":"Låt eleverna göra bokens uppgifter innan exit. Webbsidans quiz är endast självkontroll, inte ytterligare Socrative. Den sista målanknutna frågan kan tas på papper.","quiz":{"prompt":"A ligger på +5 V och B på −1 V. Välj sedan A = 0 V. Vad blir Vᵦ?","options":["−6 V","+6 V","0 V"],"correct":0,"why":"B ligger 6 V lägre än A. Referensbyte med −5 V ger V_B = −1 − 5 = −6 V; U_AB förblir +6 V.","hint":""},"tag":"Självständigt arbete"},{"title":"Fördjupning: två grenar matar samma resistor","body":"\u003cp>\u003cb>Frivilligt stöd vid bokarbetet.\u003c/b> Två källgrenar med \u003cb>10 V och 2 Ω\u003c/b> respektive \u003cb>8 V och 4 Ω\u003c/b> matar en belastning på \u003cb>4 Ω\u003c/b>. Den gemensamma övre noden har potential V och den nedre 0 V.\u003c/p>\u003cdiv class=\"question\">Välj strömriktningar och bestäm V med Kirchhoffs första lag. Vad betyder det om en beräknad grenström blir negativ?\u003c/div>","source":"16","steps":["\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>1\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>10\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmi>V\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>2\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>8\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmi>V\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>V\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003c/div>","\u003cp>Kirchhoffs första lag för den gemensamma övre noden:\u003c/p>\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>1\u003c/mtext>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>2\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003c/div>","\u003cdiv class=\"potential-math-steps\">\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmrow>\u003cmn>10\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmi>V\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>8\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmi>V\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>V\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>4\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmn>2\u003c/mn>\u003cmo>(\u003c/mo>\u003cmn>10\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>+\u003c/mo>\u003cmo>(\u003c/mo>\u003cmn>8\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo>)\u003c/mo>\u003cmo>=\u003c/mo>\u003cmi>V\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"potential-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"b
