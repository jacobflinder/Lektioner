<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Elektriska fält · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"><link rel="stylesheet" href="falt.css?v=rev85a"><link rel="stylesheet" href="../../gemensamt/sjalvtest.css?v=papper2"><link rel="stylesheet" href="../../gemensamt/matematik-typografi.css?v=3"></head><body data-fy1-lesson="elektriska-falt"><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Elektriska fält</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Elektriska fält","subject":"Fysik nivå 1","chapter":"8.5 · Elektriska fält","source":"Fy1_Elektriska_falt.pdf","goals":["Rita fältriktning och kraft på positiva och negativa laddningar.","Beräkna fältstyrka, elektrisk kraft och partikelacceleration.","Förklara elektrisk skärmning med laddningarnas omfördelning."],"pages":[{"title":"Hur kan en kraft verka utan kontakt?","body":"<div class=\"question\">En positiv och en negativ kula påverkar varandra utan kontakt. Rita kraftpilarna på båda kulorna. Vad avgör riktningen?<\/div><div class=\"goal-card\"><b>Efter lektionen ska du kunna<\/b><ol><li>Rita elektriska fält och krafter på positiva och negativa laddningar.<\/li><li>Beräkna E, F och acceleration med rätt tecken och enheter.<\/li><li>Förklara elektrisk skärmning genom fria laddningars omfördelning.<\/li><\/ol><\/div><p class=\"small-context\"><b>Fördjupande PhET från originalet:<\/b> <a href=\"https://phet.colorado.edu/sims/html/charges-and-fields/latest/charges-and-fields_all.html\" target=\"_blank\" rel=\"noopener noreferrer\">Charges and Fields<\/a>. Använd som ett undersökande komplement.<\/p>","source":"1","teacher":"Enskilt 30 s → par 30 s → klass. Låt eleverna rita två lika långa motriktade attraktionspilar före facit. PhET finns i originalet och ska inte ersätta en gemensam fysikförklaring.","side":"<figure class=\"field-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 330\" role=\"img\" aria-label=\"Två laddningar, en positiv till vänster och en negativ till höger, utan färdigritade kraftpilar. Eleverna ska rita kraft på vardera laddningen.\"><defs><marker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/><\/marker><\/defs><text x=\"160\" y=\"42\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Laddning A<\/text><text x=\"405\" y=\"42\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Laddning B<\/text><circle cx=\"160\" cy=\"156\" r=\"27\" fill=\"#c16e42\"/><text x=\"160\" y=\"164\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">+<\/text><circle cx=\"405\" cy=\"156\" r=\"27\" fill=\"#177b99\"/><text x=\"405\" y=\"164\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−<\/text><line x1=\"195\" y1=\"155\" x2=\"370\" y2=\"155\" stroke=\"#aec6d0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-dasharray=\"6 7\"/><text x=\"280\" y=\"218\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Vilka krafter ska du rita?<\/text><text x=\"160\" y=\"266\" font-family=\"system-ui\" font-size=\"17\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">F på A: ?<\/text><text x=\"405\" y=\"266\" font-family=\"system-ui\" font-size=\"17\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">F på B: ?<\/text><\/svg><figcaption>Rita själv två kraftpilar innan deras riktningar diskuteras.<\/figcaption><\/figure>","tag":"Obligatorisk kärna"},{"title":"Fältet beskriver platsen","body":"<div class=\"question\">Åt vilket håll skulle kraften verka på en mycket liten <b>positiv<\/b> testladdning nära de två källorna?<\/div><p>Fältets riktning i en punkt definieras som riktningen på kraften på en liten positiv testladdning. Fältlinjer går <b>ut från +<\/b> och <b>in mot −<\/b>.<\/p><p>I en konsekvent fältbild betyder tätare linjer större fältstyrka. Linjerna är en modell – inte något som ligger fysiskt i rummet.<\/p>","source":"2","quiz":{"prompt":"En negativ testladdning placeras i ett elektriskt fält åt höger. Åt vilket håll verkar kraften?","options":["Åt höger","Åt vänster","Ingen kraft"],"correct":1,"why":"Fältets riktning definieras med positiv testladdning. För negativ q gäller F = qE, så kraften är motsatt fältet.","hint":""},"teacher":"Förklara att fältlinjer är en representation, inte fysiska strängar.","side":"<figure class=\"field-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 335\" role=\"img\" aria-label=\"Fältlinjer pekar radiellt utåt från positiv punktladdning och inåt mot negativ punktladdning.\"><defs><marker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/><\/marker><\/defs><circle cx=\"150\" cy=\"174\" r=\"22\" fill=\"#c16e42\"/><text x=\"150\" y=\"182\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">+<\/text><line x1=\"185.0\" y1=\"174.0\" x2=\"260.0\" y2=\"174.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"260.0,174.0 249.0,180.5 249.0,167.5\" fill=\"#177b99\"/><line x1=\"174.7\" y1=\"198.7\" x2=\"227.8\" y2=\"251.8\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"227.8,251.8 215.42563132923542,248.61801948466055 224.61801948466055,239.42563132923542\" fill=\"#177b99\"/><line x1=\"150.0\" y1=\"209.0\" x2=\"150.0\" y2=\"284.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"150.0,284.0 143.5,273.0 156.5,273.0\" fill=\"#177b99\"/><line x1=\"125.3\" y1=\"198.7\" x2=\"72.2\" y2=\"251.8\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"72.2,251.8 75.38198051533946,239.42563132923542 84.57436867076457,248.61801948466055\" fill=\"#177b99\"/><line x1=\"115.0\" y1=\"174.0\" x2=\"40.0\" y2=\"174.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"40.0,174.0 51.0,167.5 51.0,180.5\" fill=\"#177b99\"/><line x1=\"125.3\" y1=\"149.3\" x2=\"72.2\" y2=\"96.2\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"72.2,96.2 84.57436867076457,99.38198051533948 75.38198051533946,108.57436867076458\" fill=\"#177b99\"/><line x1=\"150.0\" y1=\"139.0\" x2=\"150.0\" y2=\"64.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"150.0,64.0 156.5,75.0 143.5,75.0\" fill=\"#177b99\"/><line x1=\"174.7\" y1=\"149.3\" x2=\"227.8\" y2=\"96.2\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"227.8,96.2 224.61801948466055,108.57436867076457 215.42563132923542,99.38198051533946\" fill=\"#177b99\"/><circle cx=\"414\" cy=\"174\" r=\"22\" fill=\"#177b99\"/><text x=\"414\" y=\"182\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−<\/text><line x1=\"524.0\" y1=\"174.0\" x2=\"449.0\" y2=\"174.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"449.0,174.0 460.0,167.5 460.0,180.5\" fill=\"#177b99\"/><line x1=\"491.8\" y1=\"251.8\" x2=\"438.7\" y2=\"198.7\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"438.7,198.7 451.07436867076456,201.88198051533945 441.8819805153395,211.07436867076458\" fill=\"#177b99\"/><line x1=\"414.0\" y1=\"284.0\" x2=\"414.0\" y2=\"209.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"414.0,209.0 420.5,220.0 407.5,220.0\" fill=\"#177b99\"/><line x1=\"336.2\" y1=\"251.8\" x2=\"389.3\" y2=\"198.7\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"389.3,198.7 386.1180194846605,211.07436867076458 376.92563132923544,201.88198051533945\" fill=\"#177b99\"/><line x1=\"304.0\" y1=\"174.0\" x2=\"379.0\" y2=\"174.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"379.0,174.0 368.0,180.5 368.0,167.5\" fill=\"#177b99\"/><line x1=\"336.2\" y1=\"96.2\" x2=\"389.3\" y2=\"149.3\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"389.3,149.3 376.92563132923544,146.11801948466055 386.1180194846605,136.92563132923542\" fill=\"#177b99\"/><line x1=\"414.0\" y1=\"64.0\" x2=\"414.0\" y2=\"139.0\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"414.0,139.0 407.5,128.0 420.5,128.0\" fill=\"#177b99\"/><line x1=\"491.8\" y1=\"96.2\" x2=\"438.7\" y2=\"149.3\" stroke=\"#177b99\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"438.7,149.3 441.8819805153395,136.92563132923542 451.07436867076456,146.11801948466055\" fill=\"#177b99\"/><text x=\"150\" y=\"37\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Positiv källa<\/text><text x=\"414\" y=\"37\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Negativ källa<\/text><text x=\"282\" y=\"311\" font-family=\"system-ui\" font-size=\"15\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Fältriktning: kraften på positiv testladdning<\/text><\/svg><figcaption>Fältlinjer är ritade modeller – inte strängar i rummet.<\/figcaption><\/figure>","steps":["<p>Startfrågan: <b>olika laddningar attraherar<\/b>. Krafterna är lika stora och motriktade enligt Newtons tredje lag.<\/p>"],"tag":"Obligatorisk kärna"},{"title":"Samma fält – olika testladdningar","body":"<div class=\"question\">Samma fält, tre olika provladdningar: +q₀, −q₀ och +2q₀. Rita kraftpilarna. Ändras <i>E<\/i> när provladdningen byts?<\/div><p>Undersök först med positivt fält. Ändra sedan fältets tecken och provladdningens storlek. <b>Välj Visa resultat<\/b> först efter förutsägelsen.<\/p>","source":"3–5","model":"field85","steps":["<div class=\"mathrow\">F = qE<\/div>","<p>+q₀: kraft med fältet. −q₀: kraft mot fältet. +2q₀: dubbla kraften, med fältet.<\/p>","<p>Testladdningen ändrar inte det pålagda fältet i idealmodellen.<\/p>"],"teacher":"Modellen visar tre separata försök i samma fält. Förväntat: +q₀ med E, −q₀ mot E, +2q₀ dubbla kraften. Testladdningarna antas så små att de inte ändrar källfältet.","tag":"Obligatorisk kärna"},{"title":"Fältstyrka och kraft: tecknet visar riktningen","body":"<div class=\"question\">En laddning q = −3,0 nC ligger i fältet Eₓ = +2,0 kN/C. Vilket tecken får kraftens x-komponent? Rita kraftpilen.<\/div><p>Vi har valt <b>höger som positiv riktning<\/b>. Här använder vi det <em>riktade<\/em> sambandet Fₓ = qEₓ. Minustecknet ger riktningen.<\/p>","source":"6","steps":["<div class=\"field-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><msub><mi>F<\/mi><mi>x<\/mi><\/msub><mo>=<\/mo><mi>q<\/mi><msub><mi>E<\/mi><mi>x<\/mi><\/msub><\/math><\/div>","<div class=\"field-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\"><semantics><mrow><mrow><msub><mi>F<\/mi><mtext>x<\/mtext><\/msub><\/mrow><mo>=<\/mo><mrow><mrow><mo>(<\/mo><mrow><mrow><mo>−<\/mo><mrow><mrow><mn>3,0<\/mn><\/mrow><mo>·<\/mo><mrow><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>9<\/mn><\/mrow><\/msup><\/mrow><\/mrow><\/mrow><mspace width=\"0.2em\"/><mtext>C<\/mtext><\/mrow><mo>)<\/mo><\/mrow><mo>·<\/mo><mrow><mo>(<\/mo><mrow><mrow><mo>+<\/mo><mrow><mrow><mn>2,0<\/mn><\/mrow><mo>·<\/mo><mrow><msup><mn>10<\/mn><mn>3<\/mn><\/msup><\/mrow><\/mrow><\/mrow><mspace width=\"0.2em\"/><mtext>N/C<\/mtext><\/mrow><mo>)<\/mo><\/mrow><\/mrow><\/mrow><annotation encoding=\"text/plain\">Fₓ = (−3,0 · 10⁻⁹ C) · (+2,0 · 10³ N/C)<\/annotation><\/semantics><\/math><\/div>","<div class=\"field-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\"><semantics><mrow><mrow><msub><mi>F<\/mi><mtext>x<\/mtext><\/msub><\/mrow><mo>=<\/mo><mrow><mrow><mo>−<\/mo><mrow><mrow><mn>6,0<\/mn><\/mrow><mo>·<\/mo><mrow><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>6<\/mn><\/mrow><\/msup><\/mrow><\/mrow><\/mrow><mspace width=\"0.2em\"/><mtext>N<\/mtext><\/mrow><mo>=<\/mo><mrow><mrow><mo>−<\/mo><mrow><mn>6,0<\/mn><\/mrow><\/mrow><mspace width=\"0.2em\"/><mtext>µN<\/mtext><\/mrow><\/mrow><annotation encoding=\"text/plain\">Fₓ = −6,0 · 10⁻⁶ N = −6,0 µN<\/annotation><\/semantics><\/math>. Kraften verkar åt vänster.<\/div>","<p><b>Din tur:<\/b> Byt till +6,0 nC i samma fält. Då blir Fₓ = +12 µN, åt höger.<\/p>"],"teacher":"Använd konsekvent teckenriktning; undvik dubbel bokföring med belopp och tecken.","side":"<figure class=\"field-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 340\" role=\"img\" aria-label=\"Ett elektriskt fält pekar åt höger över en negativ testladdning. Eleverna förutsäger kraftens riktning.\"><defs><marker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/><\/marker><\/defs><text x=\"277\" y=\"35\" font-family=\"system-ui\" font-size=\"19\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Välj +x åt höger<\/text><line x1=\"95\" y1=\"99\" x2=\"457\" y2=\"99\" stroke=\"#177b99\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"457,99 446.0,105.5 446.0,92.5\" fill=\"#177b99\"/><text x=\"280\" y=\"78\" font-family=\"system-ui\" font-size=\"19\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">E = +2,0 kN/C<\/text><circle cx=\"280\" cy=\"187\" r=\"29\" fill=\"#177b99\"/><text x=\"280\" y=\"195\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−<\/text><text x=\"281\" y=\"250\" font-family=\"system-ui\" font-size=\"19\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">q = −3,0 nC<\/text><text x=\"282\" y=\"298\" font-family=\"system-ui\" font-size=\"15\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Rita kraftpilen innan du ser tecknet<\/text><\/svg><figcaption>Fältet bestäms av källorna; laddningens tecken avgör kraftens riktning.<\/figcaption><\/figure>","quiz":{"prompt":"En positiv provladdning dubbleras vid oförändrat E. Då blir kraftens storlek …","options":["oförändrad","dubbel","fyra gånger så stor"],"correct":1,"why":"F = qE. Vid samma fält ger dubbelt laddningsvärde dubbel kraft.","hint":""},"tag":"Obligatorisk kärna"},{"title":"Flera laddningar: addera fältens pilar","body":"<div class=\"question\">P ligger mitt emellan <b>+Q till vänster<\/b> och <b>−2Q till höger<\/b>, på samma avstånd r. Rita E₁ och E₂ i P. Vänd sedan den högra laddningens tecken. Vad händer med summan?<\/div><p>Superpositionsprincipen: beräkna varje källas fält i P och <b>addera med tecken<\/b> längs x-axeln.<\/p><p class=\"small-context\">Den styrbara modellen använder Q = 1,0 nC som ett <em>illustrativt<\/em> värde; ursprungsfrågan är symbolisk.<\/p>","source":"7","steps":["<div class=\"field-math\">Med +Q till vänster: E₁ = +kQ/r² i P.<\/div>","<div class=\"field-math\">Med −2Q till höger: E₂ = +2kQ/r² → Eₜₒₜ = +3kQ/r².<\/div>","<div class=\"field-math\">Med <b>+2Q<\/b> till höger: E₂ = −2kQ/r² → Eₜₒₜ = −kQ/r² (åt vänster).<\/div>"],"teacher":"Visa först bara figur med laddningarna. E är en vektor; använd x-komponenter och låt tecknen avgöra riktning, inte beloppstecken. Modellen har likstora r på båda sidor och Q-värdet är ett tillagt, tydligt markerat demonstrationsvärde.","model":"superposition85","tag":"Obligatorisk kärna"},{"title":"Mellan plattor: ett nästan jämnt fält","body":"<div class=\"question\">100 V mellan plattor, 2,0 cm isär. Hur stor och hur riktad är fältstyrkan? Vad händer vid dubbelt avstånd och samma spänning?<\/div><p>Bort från kanterna är fältet nästan homogent. Mellan plattorna pekar <i>E<\/i> från den positiva till den negativa plattan.<\/p>","source":"8","steps":["<div class=\"field-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\"><semantics><mrow><mrow><mi>d<\/mi><\/mrow><mo>=<\/mo><mrow><mrow><mn>2,0<\/mn><\/mrow><mspace width=\"0.2em\"/><mtext>cm<\/mtext><\/mrow><mo>=<\/mo><mrow><mrow><mn>0,020<\/mn><\/mrow><mspace width=\"0.2em\"/><mtext>m<\/mtext><\/mrow><\/mrow><annotation encoding=\"text/plain\">d = 2,0 cm = 0,020 m<\/annotation><\/semantics><\/math>.<\/div>","<div class=\"field-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><msub><mi>E<\/mi><mi>x<\/mi><\/msub><mo>=<\/mo><mo>−<\/mo><mfrac><mi>U<\/mi><mi>d<\/mi><\/mfrac><mo>=<\/mo><mo>−<\/mo><mfrac><mrow><mn>100<\/mn><mtext> V<\/mtext><\/mrow><mrow><mn>0,020<\/mn><mtext> m<\/mtext><\/mrow><\/mfrac><\/math><\/div>","<div class=\"field-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\"><semantics><mrow><mrow><msub><mi>E<\/mi><mtext>x<\/mtext><\/msub><\/mrow><mo>=<\/mo><mrow><mrow><mo>−<\/mo><mrow><mn>5,0<\/mn><\/mrow><\/mrow><mspace width=\"0.2em\"/><mtext>kV/m<\/mtext><\/mrow><\/mrow><annotation encoding=\"text/plain\">Eₓ = −5,0 kV/m<\/annotation><\/semantics><\/math>. Negativt tecken betyder åt vänster.<\/div>","<p>Dubbla d vid oförändrad spänning → halva fältstyrkans storlek.<\/p>"],"teacher":"Visa att U här är en positiv storlek för spänningsskillnaden och riktningen ligger i minustecknet.","side":"<figure class=\"field-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 345\" role=\"img\" aria-label=\"Två parallella plattor: vänster negativ, höger positiv. Tre lika långa fältpilar pekar åt vänster. Spänning 100 V och avstånd 2 cm.\"><defs><marker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/><\/marker><\/defs><rect x=\"78\" y=\"58\" width=\"12\" height=\"228\" rx=\"2\" fill=\"#197b99\" stroke=\"#197b99\" stroke-width=\"0\"/><rect x=\"469\" y=\"58\" width=\"12\" height=\"228\" rx=\"2\" fill=\"#c16e42\" stroke=\"#c16e42\" stroke-width=\"0\"/><text x=\"84\" y=\"44\" font-family=\"system-ui\" font-size=\"26\" font-weight=\"650\" fill=\"#177b99\" text-anchor=\"middle\">−<\/text><text x=\"473\" y=\"44\" font-family=\"system-ui\" font-size=\"26\" font-weight=\"650\" fill=\"#c16e42\" text-anchor=\"middle\">+<\/text><line x1=\"435\" y1=\"104\" x2=\"121\" y2=\"104\" stroke=\"#177b99\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"121,104 132.0,97.5 132.0,110.5\" fill=\"#177b99\"/><line x1=\"435\" y1=\"160\" x2=\"121\" y2=\"160\" stroke=\"#177b99\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"121,160 132.0,153.5 132.0,166.5\" fill=\"#177b99\"/><line x1=\"435\" y1=\"216\" x2=\"121\" y2=\"216\" stroke=\"#177b99\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"121,216 132.0,209.5 132.0,222.5\" fill=\"#177b99\"/><text x=\"280\" y=\"314\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">d = 2,0 cm   ·   U = 100 V<\/text><\/svg><figcaption>Idealisering: nästan homogent fält långt från plattornas kanter.<\/figcaption><\/figure>","quiz":{"prompt":"Spänningen är oförändrad men plattavståndet dubblas. Fältstyrkans storlek blir …","options":["dubbel","hälften","oförändrad"],"correct":1,"why":"För ett homogent plattfält gäller fältstyrkans storlek U/d. Dubbel d ger halva värdet.","hint":""},"tag":"Obligatorisk kärna"},{"title":"Ett starkt fält behöver inte ge ökande kraft","body":"<div class=\"question\">En elektron släpps från vila vid minusplattan i ett fält åt vänster. Rör den sig mot plus? Är kraften konstant? Hur förändras hastigheten?<\/div><p>Ändra spänning, plattavstånd och tid i modellen. Förutsäg innan du visar elektronens rörelse och resultat.<\/p><p class=\"small-context\">Modellen är icke-relativistisk och försummar tyngdkraft, kollisioner och kanteffekter. Elektronen stannar vid plusplattan.<\/p>","source":"9–11","model":"electron85","steps":["<p>Eftersom q = −e och Eₓ är negativt blir <b>Fₓ positiv<\/b>: elektronen accelererar åt höger.<\/p>","<p>I homogent fält är kraft och acceleration konstanta <em>under färden<\/em>. Hastigheten ökar i lika stora tidssteg.<\/p>","<p>Efter kollision med plusplattan gäller inte längre modellen för fri partikelrörelse mellan plattorna.<\/p>"],"teacher":"Originalets sidor 9–11 har före/animation/efter. Modellen ger samma fysik med styrbart tidsläge och avbryts vid träff. Visa att lika tidsintervall ger ökande sträckor. Använd faktisk demonstrerad tid för att inte misstolka animationens längd.","tag":"Obligatorisk kärna"},{"title":"Från elektriskt fält till acceleration","body":"<div class=\"question\">Eₓ = −5,0 kV/m och q = −e. Vad blir elektronens kraft och acceleration med höger som positiv riktning?<\/div><p>Elektronens massa: mₑ = 9,11 · 10⁻³¹ kg. Elementarladdning: e = 1,602 · 10⁻¹⁹ C.<\/p>","source":"12","steps":["<div class=\"field-math\">q = −1,602 · 10⁻¹⁹ C, &nbsp; Eₓ = −5,0 · 10³ N/C<\/div>","<div class=\"field-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\"><semantics><mrow><mrow><msub><mi>F<\/mi><mtext>x<\/mtext><\/msub><\/mrow><mo>=<\/mo><mrow><mi>q<\/mi><msub><mi>E<\/mi><mtext>x<\/mtext><\/msub><\/mrow><mo>=<\/mo><mrow><mo>(<\/mo><mo>−<\/mo><mn>1,602<\/mn><mo>·<\/mo><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>19<\/mn><\/mrow><\/msup><mo>)<\/mo><mo>(<\/mo><mo>−<\/mo><mn>5,0<\/mn><mo>·<\/mo><msup><mn>10<\/mn><mn>3<\/mn><\/msup><mo>)<\/mo><mspace width=\"0.17em\"/><mtext>N<\/mtext><\/mrow><\/mrow><annotation encoding=\"text/plain\">Fₓ = qEₓ = (−1,602 · 10⁻¹⁹)(−5,0 · 10³) N<\/annotation><\/semantics><\/math><\/div>","<div class=\"field-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\"><semantics><mrow><mrow><msub><mi>F<\/mi><mtext>x<\/mtext><\/msub><\/mrow><mo>=<\/mo><mrow><mrow><mo>+<\/mo><mrow><mrow><mn>8,01<\/mn><\/mrow><mo>·<\/mo><mrow><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>16<\/mn><\/mrow><\/msup><\/mrow><\/mrow><\/mrow><mspace width=\"0.2em\"/><mtext>N<\/mtext><\/mrow><\/mrow><annotation encoding=\"text/plain\">Fₓ = +8,01 · 10⁻¹⁶ N<\/annotation><\/semantics><\/math>.<\/div>","<div class=\"field-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><msub><mi>a<\/mi><mi>x<\/mi><\/msub><mo>=<\/mo><mfrac><msub><mi>F<\/mi><mi>x<\/mi><\/msub><msub><mi>m<\/mi><mi>e<\/mi><\/msub><\/mfrac><mo>≈<\/mo><mn>+8,8<\/mn><mo>·<\/mo><msup><mn>10<\/mn><mn>14<\/mn><\/msup><mtext> m/s²<\/mtext><\/math><\/div>","<p><b>Rimlighet:<\/b> den mycket lilla massan ger stor acceleration. Halva fältstyrkan ger halva kraften och accelerationen.<\/p>"],"teacher":"Varning: mycket stor acceleration i mikroskopisk skala är rimlig för liten elektronmassa.","side":"<figure class=\"field-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 330\" role=\"img\" aria-label=\"En elektron i ett elektriskt fält som pekar åt vänster. Fältstyrkan är minus 5 kilovolt per meter och positiv x-riktning är åt höger.\"><defs><marker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/><\/marker><\/defs><text x=\"277\" y=\"43\" font-family=\"system-ui\" font-size=\"17\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Positiv x-riktning åt höger<\/text><line x1=\"438\" y1=\"112\" x2=\"122\" y2=\"112\" stroke=\"#177b99\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"122,112 133.0,105.5 133.0,118.5\" fill=\"#177b99\"/><text x=\"276\" y=\"92\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">E = −5,0 kV/m<\/text><circle cx=\"280\" cy=\"184\" r=\"24\" fill=\"#177b99\"/><text x=\"280\" y=\"192\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−<\/text><text x=\"280\" y=\"247\" font-family=\"system-ui\" font-size=\"19\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">F = qE   →   a = F/mₑ<\/text><text x=\"280\" y=\"298\" font-family=\"system-ui\" font-size=\"15\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Rita kraft- och accelerationsriktning<\/text><\/svg><figcaption>Skilj E (fältet) från F (kraften) och a (accelerationen).<\/figcaption><\/figure>","tag":"Obligatorisk kärna"},{"title":"Spänningen ger elektronen rörelseenergi","body":"<div class=\"question\">En elektron startar från vila och accelereras genom spänningen U = 100 V. Hur mycket rörelseenergi får den och vilken slutfart ger modellen?<\/div><p>Elektriskt arbete omvandlas till rörelseenergi. Här är <i>e<\/i> den <b>positiva<\/b> elementarladdningen; förflyttningen är åt höger liksom kraften.<\/p>","source":"13","steps":["<div class=\"field-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\"><semantics><mrow><mrow><mi>W<\/mi><\/mrow><mo>=<\/mo><mrow><mi>e<\/mi><mi>U<\/mi><\/mrow><mo>=<\/mo><mrow><mo>(<\/mo><mn>1,602<\/mn><mo>·<\/mo><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>19<\/mn><\/mrow><\/msup><mspace width=\"0.17em\"/><mtext>C<\/mtext><mo>)<\/mo><mo>(<\/mo><mn>100<\/mn><mspace width=\"0.17em\"/><mtext>V<\/mtext><mo>)<\/mo><\/mrow><mo>=<\/mo><mrow><mrow><mrow><mn>1,602<\/mn><\/mrow><mo>·<\/mo><mrow><msup><mn>10<\/mn><mrow><mo>−<\/mo><mn>17<\/mn><\/mrow><\/msup><\/mrow><\/mrow><mspace width=\"0.2em\"/><mtext>J<\/mtext><\/mrow><\/mrow><annotation encoding=\"text/plain\">W = eU = (1,602 · 10⁻¹⁹ C)(100 V) = 1,602 · 10⁻¹⁷ J<\/annotation><\/semantics><\/math><\/div>","<div class=\"field-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mfrac><mrow><msub><mi>m<\/mi><mi>e<\/mi><\/msub><msup><mi>v<\/mi><mn>2<\/mn><\/msup><\/mrow><mn>2<\/mn><\/mfrac><mo>=<\/mo><mi>e<\/mi><mi>U<\/mi><\/math><\/div>","<div class=\"field-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>v<\/mi><mo>=<\/mo><msqrt><mfrac><mrow><mn>2<\/mn><mi>e<\/mi><mi>U<\/mi><\/mrow><msub><mi>m<\/mi><mi>e<\/mi><\/msub><\/mfrac><\/msqrt><mo>≈<\/mo><mn>5,9<\/mn><mo>·<\/mo><msup><mn>10<\/mn><mn>6<\/mn><\/msup><mtext> m/s<\/mtext><\/math><\/div>","<p>Fyrdubbel U → fyra gånger rörelseenergin men <b>dubbel slutfart<\/b>, eftersom v ∝ √U.<\/p>","<p><b>Rimlighet:<\/b> 5,9 · 10⁶ m/s är ungefär 2 % av ljushastigheten, så den icke-relativistiska approximationen fungerar här.<\/p>"],"teacher":"Inom givna hastigheter fungerar icke-relativistisk modell bra.","side":"<figure class=\"field-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 345\" role=\"img\" aria-label=\"Elektron släpps nära vänstra negativa plattan, förflyttning och kraft pekar mot den högra positiva plattan.\"><defs><marker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/><\/marker><\/defs><rect x=\"70\" y=\"60\" width=\"12\" height=\"207\" rx=\"1\" fill=\"#187b99\" stroke=\"#187b99\" stroke-width=\"0\"/><rect x=\"475\" y=\"60\" width=\"12\" height=\"207\" rx=\"1\" fill=\"#c16e42\" stroke=\"#c16e42\" stroke-width=\"0\"/><text x=\"76\" y=\"42\" font-family=\"system-ui\" font-size=\"24\" font-weight=\"650\" fill=\"#177b99\" text-anchor=\"middle\">−<\/text><text x=\"478\" y=\"42\" font-family=\"system-ui\" font-size=\"24\" font-weight=\"650\" fill=\"#c16e42\" text-anchor=\"middle\">+<\/text><circle cx=\"139\" cy=\"155\" r=\"18\" fill=\"#177b99\"/><text x=\"139\" y=\"163\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−<\/text><line x1=\"174\" y1=\"154\" x2=\"403\" y2=\"154\" stroke=\"#258569\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"403,154 392.0,160.5 392.0,147.5\" fill=\"#258569\"/><text x=\"290\" y=\"127\" font-family=\"system-ui\" font-size=\"17\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Förflyttning s åt höger<\/text><text x=\"290\" y=\"309\" font-family=\"system-ui\" font-size=\"16\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Energi från elektriskt arbete → rörelseenergi<\/text><\/svg><figcaption>Betrakta fältet som homogent och försumma gravitation och relativistiska effekter.<\/figcaption><\/figure>","tag":"Obligatorisk kärna"},{"title":"Faradays bur: varför skyddas insidan?","body":"<div class=\"question\">Ett slutet ledande metallskal får extra elektroner. Ingen laddning finns i hålrummet. Var hamnar överskottsladdningen, och vilket fält finns i hålrummet vid elektrostatisk jämvikt?<\/div><p>Rita din förutsägelse innan nästa bild. Motivera med vad fria elektroner skulle göra om ett elektriskt fält fanns kvar i själva metallen.<\/p>","source":"14","teacher":"Undvik att avslöja svaret före nästa bild. Skilj det ledande materialet från det tomma hålrummet; avgränsa uttryckligen till elektrostatisk jämvikt.","side":"<figure class=\"field-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 345\" role=\"img\" aria-label=\"Slutet metallskal som ring utan markerade överskottsladdningar. Fråga om fältet i det tomma hålrummet.\"><defs><marker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/><\/marker><\/defs><circle cx=\"280\" cy=\"165\" r=\"116\" fill=\"#edf5f7\" stroke=\"#6e8790\" stroke-width=\"18\"/><circle cx=\"280\" cy=\"165\" r=\"96\" fill=\"#fff\" stroke=\"none\"/><text x=\"280\" y=\"155\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Hålrummet<\/text><text x=\"280\" y=\"187\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">E = ?<\/text><text x=\"280\" y=\"308\" font-family=\"system-ui\" font-size=\"17\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Var hamnar extra elektroner?<\/text><\/svg><figcaption>Förutsäg var laddningarna samlas och vad som gäller för fältet inne i hålrummet.<\/figcaption><\/figure>","tag":"Obligatorisk kärna"},{"title":"Laddningarna flyttar sig tills jämvikt nås","body":"<p>I en metall kan fria elektroner röra sig. Om det fanns kvar ett elektriskt fält <em>i ledarmaterialet<\/em> skulle laddningarna fortsätta att förflyttas.<\/p><div class=\"goal-card\"><b>Elektrostatisk jämvikt<\/b><p>Fältet i ledarmaterialet är <b>noll<\/b>. Extra laddning på ett slutet ledande skal utan laddningar i hålrummet finns på <b>utsidan<\/b>. Fältet är också <b>noll i det tomma hålrummet<\/b>.<\/p><\/div><p>Ett yttre statiskt fält skärmas genom omfördelning av fria laddningar. Starka elektriska fält kan dessutom orsaka överslag genom luft.<\/p>","source":"15","teacher":"Poängtera att ett öppet skal, tidsvarierande fält och inre laddningar är andra fall.","side":"<figure class=\"field-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 345\" role=\"img\" aria-label=\"Slutet metallskal i elektrostatisk jämvikt. Överskott av negativa laddningar på utsidan; fältet i tomt hålrum är noll.\"><defs><marker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/><\/marker><\/defs><circle cx=\"280\" cy=\"165\" r=\"111\" fill=\"#d9e8ee\" stroke=\"#829aa4\" stroke-width=\"19\"/><circle cx=\"280\" cy=\"165\" r=\"91\" fill=\"white\"/><circle cx=\"401.0\" cy=\"165.0\" r=\"13\" fill=\"#177b99\"/><text x=\"401.0\" y=\"173.0\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−<\/text><circle cx=\"365.6\" cy=\"250.6\" r=\"13\" fill=\"#177b99\"/><text x=\"365.6\" y=\"258.6\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−<\/text><circle cx=\"280.0\" cy=\"286.0\" r=\"13\" fill=\"#177b99\"/><text x=\"280.0\" y=\"294.0\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−<\/text><circle cx=\"194.4\" cy=\"250.6\" r=\"13\" fill=\"#177b99\"/><text x=\"194.4\" y=\"258.6\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−<\/text><circle cx=\"159.0\" cy=\"165.0\" r=\"13\" fill=\"#177b99\"/><text x=\"159.0\" y=\"173.0\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−<\/text><circle cx=\"194.4\" cy=\"79.4\" r=\"13\" fill=\"#177b99\"/><text x=\"194.4\" y=\"87.4\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−<\/text><circle cx=\"280.0\" cy=\"44.0\" r=\"13\" fill=\"#177b99\"/><text x=\"280.0\" y=\"52.0\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−<\/text><circle cx=\"365.6\" cy=\"79.4\" r=\"13\" fill=\"#177b99\"/><text x=\"365.6\" y=\"87.4\" font-family=\"system-ui\" font-size=\"25\" font-weight=\"650\" fill=\"#ffffff\" text-anchor=\"middle\">−<\/text><text x=\"280\" y=\"154\" font-family=\"system-ui\" font-size=\"27\" font-weight=\"650\" fill=\"#258569\" text-anchor=\"middle\">E = 0<\/text><text x=\"280\" y=\"186\" font-family=\"system-ui\" font-size=\"16\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">tomt hålrum<\/text><text x=\"280\" y=\"323\" font-family=\"system-ui\" font-size=\"16\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Överskottsladdning: yttre ytan<\/text><\/svg><figcaption>Gäller i elektrostatisk jämvikt när hålrummet saknar laddningar.<\/figcaption><\/figure>","steps":["<p>Avgränsning: ett öppet skal, tidsvarierande fält eller laddningar inne i hålrummet kräver en annan analys.<\/p>"],"tag":"Obligatorisk kärna"},{"title":"Tre snabba frågor före boken","body":"<div class=\"question\">Svara <b>enskilt<\/b> och motivera kort. Jämför sedan förklaringar i par.<\/div><ol><li>Fältet pekar nedåt. Åt vilket håll verkar kraften på en elektron?<\/li><li>Mellan plattor: U = 60 V och d = 3,0 cm, fält åt vänster. Beräkna E med tecken.<\/li><li>Varför skärmar ett slutet metallskal ett yttre statiskt elektriskt fält?<\/li><\/ol><p>Visa inte återkopplingen förrän alla har försökt.<\/p>","source":"16","teacher":"Diagnostisk egenkontroll före bokarbetet.","side":"<figure class=\"field-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 342\" role=\"img\" aria-label=\"Ett fält som pekar nedåt, en uppgift med 60 volt över 3 centimeter och en fråga om ett metallskal.\"><defs><marker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/><\/marker><\/defs><text x=\"273\" y=\"44\" font-family=\"system-ui\" font-size=\"20\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Tre olika förklaringar<\/text><line x1=\"80\" y1=\"109\" x2=\"80\" y2=\"192\" stroke=\"#177b99\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"80,192 73.5,181.0 86.5,181.0\" fill=\"#177b99\"/><text x=\"120\" y=\"156\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"start\">E nedåt: elektronens F ?<\/text><line x1=\"35\" y1=\"222\" x2=\"525\" y2=\"222\" stroke=\"#c4d8df\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"54\" y=\"268\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#c16e42\" text-anchor=\"start\">U = 60 V<\/text><text x=\"54\" y=\"299\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"start\">d = 3,0 cm<\/text><text x=\"324\" y=\"265\" font-family=\"system-ui\" font-size=\"16\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"start\">Metallskal: E i hålrum?<\/text><\/svg><figcaption>Skriv själv, motivera och kontrollera sedan med en annan färg.<\/figcaption><\/figure>","tag":"Kort egenkontroll"},{"title":"Kontrollera och förbättra ditt svar","body":"<div class=\"question\">Jämför dina tre svar med förklaringarna. Rätta med en annan färg och skriv <b>varför<\/b>.<\/div><p>Öppna ett steg i taget först efter elevernas försök.<\/p>","source":"17","steps":["<p><b>1.<\/b> Kraften pekar <b>uppåt<\/b> eftersom elektronens laddning är negativ och F = qE.<\/p>","<div class=\"field-math\">2. <math xmlns=\"http://www.w3.org/1998/Math/MathML\" class=\"fy1-typeset\" display=\"inline\"><semantics><mrow><mrow><msub><mi>E<\/mi><mtext>x<\/mtext><\/msub><\/mrow><mo>=<\/mo><mrow><mo>−<\/mo><mfrac><mrow><mrow><mi>U<\/mi><\/mrow><\/mrow><mrow><mrow><mi>d<\/mi><\/mrow><\/mrow><\/mfrac><\/mrow><mo>=<\/mo><mrow><mo>−<\/mo><mfrac><mrow><mrow><mrow><mn>60<\/mn><\/mrow><mspace width=\"0.2em\"/><mtext>V<\/mtext><\/mrow><\/mrow><mrow><mrow><mrow><mn>0,030<\/mn><\/mrow><mspace width=\"0.2em\"/><mtext>m<\/mtext><\/mrow><\/mrow><\/mfrac><\/mrow><mo>=<\/mo><mrow><mrow><mo>−<\/mo><mrow><mn>2,0<\/mn><\/mrow><\/mrow><mspace width=\"0.2em\"/><mtext>kV/m<\/mtext><\/mrow><\/mrow><annotation encoding=\"text/plain\">Eₓ = −U/d = −60 V / 0,030 m = −2,0 kV/m<\/annotation><\/semantics><\/math>.<\/div>","<p><b>3.<\/b> Fria laddningar omfördelas tills fältet i ledarmaterialet är noll. Ett slutet skal med tomt hålrum har också nollfält inne i hålrummet i elektrostatisk jämvikt.<\/p>"],"teacher":"Låt eleverna synliggöra omprövning, inte bara bocka rätt/fel.","side":"<figure class=\"field-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 315\" role=\"img\" aria-label=\"Kraften på elektron pekar uppåt när fältet pekar nedåt. Fältstyrka 60 volt delat med 3 centimeter är 2 kilovolt per meter åt vänster.\"><defs><marker id=\"arr85\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#177b99\"/><\/marker><\/defs><text x=\"280\" y=\"49\" font-family=\"system-ui\" font-size=\"19\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"middle\">Korrigera – förklara – kontrollera<\/text><line x1=\"142\" y1=\"155\" x2=\"142\" y2=\"95\" stroke=\"#258569\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"142,95 148.5,106.0 135.5,106.0\" fill=\"#258569\"/><text x=\"178\" y=\"127\" font-family=\"system-ui\" font-size=\"18\" font-weight=\"650\" fill=\"#214a5c\" text-anchor=\"start\">Elektronens F uppåt<\/text><rect x=\"54\" y=\"212\" width=\"454\" height=\"65\" rx=\"10\" fill=\"#e9f6f0\" stroke=\"#a6cfb6\" stroke-width=\"1\"/><text x=\"280\" y=\"250\" font-family=\"system-ui\" font-size=\"21\" font-weight=\"650\" fill=\"#258569\" text-anchor=\"middle\">Eₓ = −2,0 kV/m<\/text><\/svg><figcaption>Förklara också hur skärmen omfördelar fria laddningar.<\/figcaption><\/figure>","tag":"Kort egenkontroll"},{"title":"Nu använder du modellen själv","body":"<div class=\"book-main\"><b>Bokarbete och läxa: uppgift 851–860, s. 307–308<\/b><p>Lässtöd: avsnitt 8.5, s. 300–307. Börja själv och jämför sedan metod och riktningar med en kamrat.<\/p><\/div><div class=\"question\">Exit: Ett oförändrat fält verkar på −q₀. Vi byter till −2q₀. Vad händer med E och F? Förklara med ett samband.<\/div><p><b>Dagens mål:<\/b> rita fält och kraft · beräkna E, F och a · förklara skärmning.<\/p><p><b>Inför nästa lektion:<\/b> läs s. 309–314, särskilt de <b>gröna rutorna<\/b>.<\/p>","source":"18","time":"Bokarbete + exit","steps":["<p><b>Kontroll:<\/b> F = qE. När q byts från −q₀ till −2q₀ blir kraftens storlek dubbelt så stor och riktningen densamma. Själva fältet E ändras inte i testladdningsmodellen.<\/p>"],"teacher":"Bevara uppgiftsintervall och läsanvisning från originalet. Ingen Socrative finns i denna originallektion.","quiz":{"prompt":"Vid samma E byts −q₀ till −2q₀. Vad händer med kraften?","options":["Samma kraft","Dubbla kraftens storlek, samma riktning","Dubbla kraftens storlek, motsatt riktning"],"correct":1,"why":"F = qE. Negativt tecken kvarstår, så riktningen är oförändrad; två gånger laddningsstorleken ger två gånger kraftens storlek. E bestäms av källorna och ändras inte.","hint":""},"tag":"Obligatorisk kärna"}]}</script><script src="../../gemensamt/models.js"></script><script src="falt-models.js?v=rev85a"></script><script src="../../gemensamt/app.js"></script><script src="falt-ui.js?v=rev85a"></script><script src="../../gemensamt/sjalvtest.js?v=papper2" defer></script><script src="../../gemensamt/matematik-typografi.js?v=3" defer></script></body></html>
