<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Potential · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"><link rel="stylesheet" href="potential.css?v=rev86a"><link rel="stylesheet" href="potential.css?v=rev86a"><link rel="stylesheet" href="potential.css?v=rev86a"></head><body><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Potential</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Potential","subject":"Fysik nivå 1","chapter":"8.6 · Potential","source":"Fy1_Potential.pdf","goals":["Skilja potential i en punkt från spänning mellan två punkter.","Bestämma potentialer genom en vandring i en krets.","Förklara vad vald nollnivå ändrar och vad som är oförändrat."],"pages":[{"title":"Potential: var är vi – vad skiljer två punkter?","body":"<div class=\"question\">Punkt A har potentialen <b>12 V<\/b> och punkt B <b>8 V<\/b>. Vad skiljer punkterna åt – och vilket tecken får U<sub>AB<\/sub>?<\/div><p>Förklara med ord innan någon formel visas. <b>Potential<\/b> beskriver en punkt relativt en vald referens. <b>Spänning<\/b> är potentialskillnaden mellan två punkter.<\/p><div class=\"goal-card\"><b>Efter lektionen ska du kunna<\/b><ol><li>Skilja potential från spänning.<\/li><li>Bestämma potentialer genom en vandring i en krets.<\/li><li>Förklara vad en vald nollnivå ändrar – och inte ändrar.<\/li><\/ol><\/div>","source":"1","teacher":"Enskilt → par → klass. Börja med frågan och låt eleverna säga att potential i en punkt inte är samma sak som spänning mellan punkter.","side":"<figure class=\"potential-figure\"><svg role=\"img\" aria-label=\"Två punkter A och B med potentialerna 12 V och 8 V. En linje binder dem utan att ange en fysisk ledning. Frågan är potentialskillnaden.\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"280\" y=\"40\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"22\" font-weight=\"650\" text-anchor=\"middle\">Två punkter – en skillnad<\/text><circle cx=\"130\" cy=\"155\" r=\"18\" fill=\"#c46e42\"/><circle cx=\"426\" cy=\"155\" r=\"18\" fill=\"#147a99\"/><text x=\"130\" y=\"162\" font-family=\"system-ui\" fill=\"white\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">A<\/text><text x=\"426\" y=\"162\" font-family=\"system-ui\" fill=\"white\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">B<\/text><text x=\"130\" y=\"204\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">Vₐ = 12 V<\/text><text x=\"426\" y=\"204\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">Vᵦ = 8 V<\/text><path d=\"M154 155H400\" fill=\"none\" stroke=\"#789ba8\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"7 9\"/><text x=\"280\" y=\"134\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"22\" font-weight=\"650\" text-anchor=\"middle\">Uₐᵦ = ?<\/text><text x=\"280\" y=\"253\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">Vilka två värden jämförs?<\/text><\/svg><figcaption>Punkterna är inte förbundna av en ritad metalltråd; den streckade linjen visar bara jämförelsen.<\/figcaption><\/figure>","steps":["<div class=\"potential-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><msub><mi>U<\/mi><mrow><mi>A<\/mi><mi>B<\/mi><\/mrow><\/msub><mo>=<\/mo><msub><mi>V<\/mi><mi>A<\/mi><\/msub><mo>−<\/mo><msub><mi>V<\/mi><mi>B<\/mi><\/msub><mo>=<\/mo><mn>12<\/mn><mtext> V<\/mtext><mo>−<\/mo><mn>8<\/mn><mtext> V<\/mtext><mo>=<\/mo><mn>4<\/mn><mtext> V<\/mtext><\/math><\/div>"],"tag":"Kärninnehåll"},{"title":"Från kateder till bänk: nivå eller skillnad?","body":"<div class=\"question\">Läraren visar en <b>verklig kateder, en lägre bänk och golvet<\/b>. Vilka är nivåerna och vilka är skillnaderna? Vilket steg är störst: 12 → 8 eller 8 → 0?<\/div><p><b>Analogin:<\/b> höjd motsvarar potential; höjdskillnad motsvarar spänning. Men möblernas faktiska höjder mäts inte i volt.<\/p><p class=\"small-context\">När vi lämnar analogin ska vi rita hur resistorer i en riktig krets ger potentialfall.<\/p>","source":"2","steps":["<p><b>12 − 8 = 4 V<\/b> mellan katedern och bänken; <b>8 − 0 = 8 V<\/b> mellan bänken och golvet. Den senare skillnaden är större.<\/p>"],"teacher":"Utför demonstrationen fysiskt. Låt gärna eleverna stå/sitta på nivåerna, om säkert. Höjd är en analogi för potential och ingen mekanisk orsak till elström. Rita senare resistorer in i kretsen.","side":"<figure class=\"potential-figure\"><svg role=\"img\" aria-label=\"Höjdmodell med kateder 12 V, lägre bänk 8 V och golv noll volt. Kateder minus bänk är 4 V.\" viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M40 275H518\" fill=\"none\" stroke=\"#789ba8\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"70\" y=\"52\" width=\"120\" height=\"13\" rx=\"4\" fill=\"#b7d7ca\" stroke=\"#9bb6aa\" stroke-width=\"1\"/><path d=\"M82 65V275 M178 65V275\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"130.0\" y=\"38\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">Kateder · 12 V<\/text><rect x=\"265\" y=\"132\" width=\"124\" height=\"13\" rx=\"4\" fill=\"#b7d7ca\" stroke=\"#9bb6aa\" stroke-width=\"1\"/><path d=\"M277 145V275 M377 145V275\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"327.0\" y=\"118\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">Bänk · 8 V<\/text><path d=\"M215 65 L215 143\" fill=\"none\" stroke=\"#c46e42\" stroke-width=\"2.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"215,143 209.5,132.0 220.5,132.0\" fill=\"#c46e42\"/><text x=\"233\" y=\"112\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"19\" font-weight=\"650\" text-anchor=\"start\">4 V<\/text><text x=\"95\" y=\"298\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">Golv: 0 V<\/text><\/svg><figcaption>Analogi som också visas med riktiga möbler. Våra faktiska möbelhöjder är inte mätta i volt.<\/figcaption><\/figure>","tag":"Kärninnehåll"},{"title":"Mätordningen bestämmer tecknet","body":"<div class=\"question\">En voltmeters röda mätledning sitter i A (12 V) och den svarta i B (8 V). Vilket värde visar mätaren? Vad händer om vi byter proberna?<\/div><p>Föreslå tecknet innan du räknar. <b>U<sub>AB<\/sub> = V<sub>A<\/sub> − V<sub>B<\/sub><\/b> är en riktad potentialskillnad enligt vald ordning.<\/p><p><b>Din tur:<\/b> A ligger på −3 V och B på +2 V. Bestäm U<sub>AB<\/sub>.<\/p>","source":"3","steps":["<div class=\"potential-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><msub><mi>U<\/mi><mrow><mi>A<\/mi><mi>B<\/mi><\/mrow><\/msub><mo>=<\/mo><mn>12<\/mn><mo>−<\/mo><mn>8<\/mn><mo>=<\/mo><mo>+<\/mo><mn>4<\/mn><mtext> V<\/mtext><\/math><\/div>","<div class=\"potential-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><msub><mi>U<\/mi><mrow><mi>B<\/mi><mi>A<\/mi><\/mrow><\/msub><mo>=<\/mo><mn>8<\/mn><mo>−<\/mo><mn>12<\/mn><mo>=<\/mo><mo>−<\/mo><mn>4<\/mn><mtext> V<\/mtext><\/math><\/div>","<p><b>Din tur:<\/b> U<sub>AB<\/sub> = −3 − (+2) = <b>−5 V<\/b>. Den svarta mätledningen ligger på högre potential.<\/p>"],"teacher":"Skilj tecknet i U_AB från spänningens positiva storlek. Låt eleven välja mätordning. Var noga med att röd mätledning är första potentialen.","side":"<figure class=\"potential-figure\"><svg role=\"img\" aria-label=\"Voltmeter med röd prob ansluten till A på 12 V och svart prob vid B på 8 V. Mätningen är 12 minus 8 volt.\" viewBox=\"0 0 560 285\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"130\" y=\"46\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">Punkt A<\/text><text x=\"433\" y=\"46\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">Punkt B<\/text><circle cx=\"130\" cy=\"125\" r=\"17\" fill=\"#c46e42\"/><circle cx=\"433\" cy=\"125\" r=\"17\" fill=\"#147a99\"/><text x=\"130\" y=\"132\" font-family=\"system-ui\" fill=\"white\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">A<\/text><text x=\"433\" y=\"132\" font-family=\"system-ui\" fill=\"white\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">B<\/text><text x=\"130\" y=\"166\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"20\" font-weight=\"650\" text-anchor=\"middle\">12 V<\/text><text x=\"433\" y=\"166\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"20\" font-weight=\"650\" text-anchor=\"middle\">8 V<\/text><path d=\"M130 142V205H225 M433 142V205H339\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"282\" cy=\"205\" r=\"52\" fill=\"white\"/><circle cx=\"282\" cy=\"205\" r=\"52\" fill=\"none\" stroke=\"#5f8390\" stroke-width=\"3\"/><text x=\"282\" y=\"214\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"29\" font-weight=\"650\" text-anchor=\"middle\">V<\/text><text x=\"213\" y=\"246\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">röd<\/text><text x=\"366\" y=\"246\" font-family=\"system-ui\" fill=\"#147a99\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">svart<\/text><\/svg><figcaption>Röd prob anger första punkten i Uₐᵦ. Vid byte av prober blir det motsatt tecken.<\/figcaption><\/figure>","quiz":{"prompt":"Röd prob i A = −3 V, svart i B = +2 V. Vilket Uₐᵦ visar mätaren?","options":["+5 V","−5 V","−1 V"],"correct":1,"why":"Uₐᵦ = Vₐ − Vᵦ = −3 V − (+2 V) = −5 V. Byte av prober vänder tecknet.","hint":""},"tag":"Kärninnehåll"},{"title":"Fältet pekar mot lägre potential","body":"<div class=\"question\">Vänster platta har +100 V, höger 0 V. Vilken riktning har fältet? Vilken riktning får kraften på en positiv laddning respektive en elektron som släpps från vila?<\/div><p>Fältet går från <b>högre till lägre potential<\/b>. En positiv laddning påverkas längs fältet, en elektron i motsatt riktning.<\/p>","source":"4","steps":["<p>Fältet <b>E pekar åt höger<\/b>. På en positiv laddning verkar kraften åt höger, på en elektron åt vänster.<\/p>","<div class=\"potential-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><msub><mi>E<\/mi><mi>p<\/mi><\/msub><mo>=<\/mo><mi>q<\/mi><mi>V<\/mi><\/math><\/div>","<p>Eftersom elektronens laddning är negativ kan dess potentiella energi minska när den går mot högre potential.<\/p>"],"teacher":"Fråga först om fältriktning, sedan kraft. Elektronens laddning är negativ; undvik att säga att alla partiklar ”rullar nedåt” i potential.","side":"<figure class=\"potential-figure\"><svg role=\"img\" aria-label=\"Två plattor, vänster plus 100 V och höger 0 V. Elektriska fältpilar åt höger. Positiv testladdnings kraft åt höger och elektronens åt vänster.\" viewBox=\"0 0 560 355\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"74\" y=\"65\" width=\"13\" height=\"210\" rx=\"4\" fill=\"#c46e42\" stroke=\"#c46e42\" stroke-width=\"1\"/><rect x=\"466\" y=\"65\" width=\"13\" height=\"210\" rx=\"4\" fill=\"#147a99\" stroke=\"#147a99\" stroke-width=\"1\"/><text x=\"81\" y=\"45\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"20\" font-weight=\"650\" text-anchor=\"middle\">+100 V<\/text><text x=\"475\" y=\"45\" font-family=\"system-ui\" fill=\"#147a99\" font-size=\"20\" font-weight=\"650\" text-anchor=\"middle\">0 V<\/text><text x=\"280\" y=\"45\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">+x →<\/text><path d=\"M115 102 L433 102\" fill=\"none\" stroke=\"#147a99\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"433,102 422.0,107.5 422.0,96.5\" fill=\"#147a99\"/><path d=\"M115 148 L433 148\" fill=\"none\" stroke=\"#147a99\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"433,148 422.0,153.5 422.0,142.5\" fill=\"#147a99\"/><path d=\"M115 194 L433 194\" fill=\"none\" stroke=\"#147a99\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"433,194 422.0,199.5 422.0,188.5\" fill=\"#147a99\"/><path d=\"M115 240 L433 240\" fill=\"none\" stroke=\"#147a99\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"433,240 422.0,245.5 422.0,234.5\" fill=\"#147a99\"/><circle cx=\"172\" cy=\"306\" r=\"20\" fill=\"#c46e42\"/><text x=\"172\" y=\"314\" font-family=\"system-ui\" fill=\"white\" font-size=\"23\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"385\" cy=\"306\" r=\"20\" fill=\"#147a99\"/><text x=\"385\" y=\"314\" font-family=\"system-ui\" fill=\"white\" font-size=\"23\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><path d=\"M207 306 L265 306\" fill=\"none\" stroke=\"#207b61\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"265,306 254.0,311.5 254.0,300.5\" fill=\"#207b61\"/><path d=\"M351 306 L293 306\" fill=\"none\" stroke=\"#207b61\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"293,306 304.0,300.5 304.0,311.5\" fill=\"#207b61\"/><\/svg><figcaption>Fältet pekar mot lägre potential. Elektronens kraft är motsatt fältets riktning.<\/figcaption><\/figure>","tag":"Kärninnehåll"},{"title":"Din tur: riktning och nollnivå","body":"<div class=\"question\">Samma två plattor som nyss: +100 V och 0 V. <b>Flytta nu potentialernas gemensamma nollnivå<\/b> så att de blir 0 V och −100 V. Förändras spänningen, elektriska fältet eller elektronens rörelse?<\/div><p>Ändra referensförskjutningen i modellen. Förutsäg först och visa resultatet när du har förklarat för en kamrat.<\/p>","source":"5","teacher":"Öppen förutsägelse. Låt först eleverna räkna skillnaden. Ändra endast referensförskjutningen och återställ innan nästa elevgrupp.","model":"potentialplates86","steps":["<p>Det är <b>fortfarande 100 V mellan plattorna<\/b>. Fältet pekar åt höger och elektronens kraft åt vänster.<\/p>"],"tag":"Kärninnehåll"},{"title":"Ny nollnivå – samma fysik","body":"<p>Vi sänker båda angivna potentialer med samma värde utan att röra plattor eller laddningar. Från +100 och 0 V till 0 och −100 V.<\/p><div class=\"question\">Visa med en differens varför både spänningen och fältets riktning är oförändrade.<\/div>","source":"6","steps":["<div class=\"potential-math\">(+100 V) − (0 V) = <b>100 V<\/b><\/div>","<div class=\"potential-math\">(0 V) − (−100 V) = <b>100 V<\/b><\/div>","<p>Samma potentialskillnad och samma geometri ger samma elektriska fält och samma kraft. <b>0 V betyder inte att laddningen är noll.<\/b><\/p>"],"teacher":"Ny potentialreferens är en koordinatförändring. Yttre fält och laddningarnas rörelse påverkas inte; inom den idealiserade situationen förblir U konstant.","side":"<figure class=\"potential-figure\"><svg role=\"img\" aria-label=\"Samma två fysiska plattor beskrivs med potentialerna plus 100 och 0 volt eller 0 och minus 100 volt. I båda fallen pekar E åt höger.\" viewBox=\"0 0 560 290\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"150\" y=\"49\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"21\" font-weight=\"650\" text-anchor=\"middle\">Referens 1<\/text><text x=\"405\" y=\"49\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"21\" font-weight=\"650\" text-anchor=\"middle\">Referens 2<\/text><rect x=\"80\" y=\"80\" width=\"9\" height=\"134\" rx=\"4\" fill=\"#c46e42\" stroke=\"#c46e42\" stroke-width=\"1\"/><rect x=\"210\" y=\"80\" width=\"9\" height=\"134\" rx=\"4\" fill=\"#147a99\" stroke=\"#147a99\" stroke-width=\"1\"/><text x=\"82\" y=\"68\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">+100 V<\/text><text x=\"215\" y=\"68\" font-family=\"system-ui\" fill=\"#147a99\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">0 V<\/text><path d=\"M102 147 L198 147\" fill=\"none\" stroke=\"#147a99\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"198,147 187.0,152.5 187.0,141.5\" fill=\"#147a99\"/><rect x=\"335\" y=\"80\" width=\"9\" height=\"134\" rx=\"4\" fill=\"#c46e42\" stroke=\"#c46e42\" stroke-width=\"1\"/><rect x=\"465\" y=\"80\" width=\"9\" height=\"134\" rx=\"4\" fill=\"#147a99\" stroke=\"#147a99\" stroke-width=\"1\"/><text x=\"337\" y=\"68\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">0 V<\/text><text x=\"470\" y=\"68\" font-family=\"system-ui\" fill=\"#147a99\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">−100 V<\/text><path d=\"M357 147 L453 147\" fill=\"none\" stroke=\"#147a99\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"453,147 442.0,152.5 442.0,141.5\" fill=\"#147a99\"/><text x=\"275\" y=\"258\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">Båda har samma ΔV = 100 V<\/text><\/svg><figcaption>En gemensam förskjutning av potentialerna ändrar inte skillnaden.<\/figcaption><\/figure>","tag":"Kärninnehåll"},{"title":"Potentialvandring: följ en hel slinga","body":"<div class=\"question\">Ett idealt <b>12 V-batteri<\/b> driver två seriekopplade resistorer på <b>2 Ω och 4 Ω<\/b>. Strömmen är <b>2 A<\/b>. Vi väljer V<sub>A<\/sub> = 0 V. Förutsäg potentialen i B, C och D när du vandrar <b>A → B → C → D → A<\/b>.<\/div><p>Börja vid steg 0. Flytta ett steg i taget, låt eleverna säga nästa potential <em>innan<\/em> du väljer Visa resultat. Byt sedan referens från A till C och prova igen.<\/p><p class=\"small-context\">Markören visar var vi läser av potentialen, inte en elektron som färdas.<\/p>","source":"7–9","model":"potentialwalk86","steps":["<p>A → B över batteriet: <b>+12 V<\/b>.<\/p>","<p>B → C över 2 Ω: <b>−RI = −4 V<\/b>, alltså V<sub>C<\/sub> = 8 V.<\/p>","<p>C → D över 4 Ω: <b>−8 V<\/b>, alltså V<sub>D<\/sub> = 0 V.<\/p>","<p>D → A via ideal ledning: <b>0 V<\/b>. En full slinga slutar på startpotentialen.<\/p>"],"teacher":"Högprioriterad aktivitet. Modellen visar bara vandringssteg fram till vald position efter facit. Gör gärna två elevgrupper: A = 0 och C = 0. Kontrollera att varje steg visas efter deras förutsägelse.","tag":"Kärninnehåll"},{"title":"Varje steg får ett motiverat tecken","body":"<div class=\"question\">Varför blir den ena resistorpotentialens fall −4 V och den andra −8 V när strömmen är 2 A?<\/div><p>Vandringen sker <b>med strömriktningen<\/b> genom resistorerna. Över batteriet från minus till plus ökar potentialen. Om du vandrar åt andra hållet byts tecknen.<\/p>","source":"10","steps":["<div class=\"potential-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>I<\/mi><mo>=<\/mo><mfrac><mrow><mn>12<\/mn><mtext> V<\/mtext><\/mrow><mrow><mn>2<\/mn><mtext> Ω<\/mtext><mo>+<\/mo><mn>4<\/mn><mtext> Ω<\/mtext><\/mrow><\/mfrac><mo>=<\/mo><mn>2<\/mn><mtext> A<\/mtext><\/math><\/div>","<div class=\"potential-math\">V<sub>B<\/sub> = 0 + 12 = <b>12 V<\/b><\/div>","<div class=\"potential-math\">V<sub>C<\/sub> = 12 − (2 Ω)(2 A) = <b>8 V<\/b><\/div>","<div class=\"potential-math\">V<sub>D<\/sub> = 8 − (4 Ω)(2 A) = <b>0 V<\/b><\/div>","<p>Kirchhoffs andra lag: <b>+12 − 4 − 8 = 0 V<\/b>. En hel slinga ger ingen nettoskillnad.<\/p>"],"teacher":"Håll kretsschemat synligt bredvid alla mellanled. Den negativa termen beskriver potentialfall i den valda vandringsriktningen, inte ”negativ resistans”.","side":"<figure class=\"potential-figure\"><svg role=\"img\" aria-label=\"Seriekrets med 12 V-batteri och två resistorer 2 respektive 4 ohm, utan förbikopplingar, markerade punkter A B C D och ström 2 A.\" viewBox=\"0 0 560 325\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M86 95H167 M231 95H318 M382 95H431V260H86V178 M86 153V95\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"167\" y=\"81\" width=\"64\" height=\"28\" rx=\"4\" fill=\"white\" stroke=\"#c46e42\" stroke-width=\"3\"/><rect x=\"318\" y=\"81\" width=\"64\" height=\"28\" rx=\"4\" fill=\"white\" stroke=\"#147a99\" stroke-width=\"3\"/><path d=\"M68 153H104 M78 178H94\" fill=\"none\" stroke=\"#c46e42\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"58\" y=\"153\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><text x=\"58\" y=\"185\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><text x=\"130\" y=\"191\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">12 V<\/text><text x=\"199\" y=\"72\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">2 Ω<\/text><text x=\"350\" y=\"72\" font-family=\"system-ui\" fill=\"#147a99\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">4 Ω<\/text><path d=\"M326 264 L226 264\" fill=\"none\" stroke=\"#207b61\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"226,264 237.0,258.5 237.0,269.5\" fill=\"#207b61\"/><text x=\"294\" y=\"292\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">I = 2 A<\/text><circle cx=\"86\" cy=\"260\" r=\"5\" fill=\"#244e5e\"/><text x=\"97\" y=\"289\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">A<\/text><circle cx=\"121\" cy=\"95\" r=\"5\" fill=\"#244e5e\"/><text x=\"132\" y=\"82\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">B<\/text><circle cx=\"270\" cy=\"95\" r=\"5\" fill=\"#244e5e\"/><text x=\"281\" y=\"82\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">C<\/text><circle cx=\"431\" cy=\"95\" r=\"5\" fill=\"#244e5e\"/><text x=\"434\" y=\"82\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">D<\/text><text x=\"94\" y=\"242\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">0 V<\/text><text x=\"129\" y=\"123\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">+12 V<\/text><text x=\"275\" y=\"123\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">+8 V<\/text><text x=\"436\" y=\"123\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">0 V<\/text><\/svg><figcaption>Ideal seriekrets. A–B: batteriet lyfter 12 V; B–C: −4 V; C–D: −8 V; D–A: ideal ledning.<\/figcaption><\/figure>","tag":"Kärninnehåll"},{"title":"Din tur: byt referens till C","body":"<div class=\"question\">Samma krets med <b>C som vald nollnivå<\/b>: V<sub>C<\/sub> = 0 V. Vad blir V<sub>A<\/sub>, V<sub>B<\/sub> och V<sub>D<\/sub>? Har U<sub>BC<\/sub> ändrats?<\/div><p>Rita först potentialvärdena för dig själv. Pröva sedan samma referensändring i potentialvandringsmodellen på bild 7.<\/p>","source":"11","steps":["<p>Alla potentialer minskar med 8 V. Därför är <b>V<sub>A<\/sub> = −8 V<\/b>, <b>V<sub>B<\/sub> = +4 V<\/b>, <b>V<sub>C<\/sub> = 0 V<\/b> och <b>V<sub>D<\/sub> = −8 V<\/b>.<\/p>","<div class=\"potential-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><msub><mi>U<\/mi><mrow><mi>B<\/mi><mi>C<\/mi><\/mrow><\/msub><mo>=<\/mo><msub><mi>V<\/mi><mi>B<\/mi><\/msub><mo>−<\/mo><msub><mi>V<\/mi><mi>C<\/mi><\/msub><mo>=<\/mo><mn>4<\/mn><mtext> V<\/mtext><mo>−<\/mo><mn>0<\/mn><mtext> V<\/mtext><mo>=<\/mo><mn>4<\/mn><mtext> V<\/mtext><\/math><\/div>"],"teacher":"Behåll C = 0 V som explicit valt referensvärde. Det är inte automatiskt en fysisk jordledning dragen genom resistorn.","side":"<figure class=\"potential-figure\"><svg role=\"img\" aria-label=\"Seriekrets med 12 V-batteri och två resistorer 2 respektive 4 ohm, utan förbikopplingar, markerade punkter A B C D och ström 2 A.\" viewBox=\"0 0 560 325\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M86 95H167 M231 95H318 M382 95H431V260H86V178 M86 153V95\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"167\" y=\"81\" width=\"64\" height=\"28\" rx=\"4\" fill=\"white\" stroke=\"#c46e42\" stroke-width=\"3\"/><rect x=\"318\" y=\"81\" width=\"64\" height=\"28\" rx=\"4\" fill=\"white\" stroke=\"#147a99\" stroke-width=\"3\"/><path d=\"M68 153H104 M78 178H94\" fill=\"none\" stroke=\"#c46e42\" stroke-width=\"3.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"58\" y=\"153\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><text x=\"58\" y=\"185\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><text x=\"130\" y=\"191\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">12 V<\/text><text x=\"199\" y=\"72\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">2 Ω<\/text><text x=\"350\" y=\"72\" font-family=\"system-ui\" fill=\"#147a99\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">4 Ω<\/text><path d=\"M326 264 L226 264\" fill=\"none\" stroke=\"#207b61\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"226,264 237.0,258.5 237.0,269.5\" fill=\"#207b61\"/><text x=\"294\" y=\"292\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">I = 2 A<\/text><circle cx=\"86\" cy=\"260\" r=\"5\" fill=\"#244e5e\"/><text x=\"97\" y=\"289\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">A<\/text><circle cx=\"121\" cy=\"95\" r=\"5\" fill=\"#244e5e\"/><text x=\"132\" y=\"82\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">B<\/text><circle cx=\"270\" cy=\"95\" r=\"5\" fill=\"#244e5e\"/><text x=\"281\" y=\"82\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">C<\/text><circle cx=\"431\" cy=\"95\" r=\"5\" fill=\"#244e5e\"/><text x=\"434\" y=\"82\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">D<\/text><text x=\"94\" y=\"242\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">-8 V<\/text><text x=\"129\" y=\"123\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">+4 V<\/text><text x=\"275\" y=\"123\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">0 V<\/text><text x=\"436\" y=\"123\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">-8 V<\/text><\/svg><figcaption>Ideal seriekrets. A–B: batteriet lyfter 12 V; B–C: −4 V; C–D: −8 V; D–A: ideal ledning.<\/figcaption><\/figure>","quiz":{"prompt":"När referensen flyttas från A till C, vad händer med spänningen över 2 Ω?","options":["Den minskar med 8 V","Den ökar med 8 V","Den är fortfarande 4 V"],"correct":2,"why":"Alla angivna nodpotentialer flyttas lika mycket. Skillnaden V_B−V_C är fortfarande 4 V och strömmen i kretsen oförändrad.","hint":""},"tag":"Kärninnehåll"},{"title":"Negativ potential är lägre än vald nollnivå","body":"<div class=\"question\">Två olika handlingar: (1) Vi väljer att <b>skriva V<sub>C<\/sub> = 0 V<\/b>. (2) Vi drar en <b>verklig ledning<\/b> mellan tidigare separata punkter. Vilken handling kan ändra strömmen?<\/div><p>En vald nollnivå är matematik. Att förbinda två punkter kan förändra kretsens topologi och ibland skapa kortslutning.<\/p><p>Två jord-symboler som uttryckligen avser samma elektriska nod representerar en gemensam förbindelse. Men att välja en punkt som referens i en uträkning är <b>inte<\/b> en ny kabel.<\/p>","source":"12","steps":["<p>Referensval: <b>ingen fysisk ändring<\/b> och därmed samma strömmar och potentialskillnader.<\/p>","<p>Ny fysisk kabel mellan punkter med olika potential: <b>kretsen kan ändras<\/b>; med ideal ledning kan en komponent bli kortsluten.<\/p>","<p>V<sub>A<\/sub> = −8 V när C = 0 V är fullt möjligt. Negativ potential betyder lägre än den valda referensnivån.<\/p>"],"teacher":"Här finns en viktig missuppfattning: referensbyte är inte jordningskabel. Visa schematiskt, men koppla aldrig medvetet kortslutning med riktiga batterier utan säker kontroll.","side":"<figure class=\"potential-figure\"><svg role=\"img\" aria-label=\"Vänster: punkt A får referensen noll volt utan kabel till B. Höger: en fysisk kabel förbinder punkterna A och B.\" viewBox=\"0 0 560 270\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"140\" y=\"38\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"21\" font-weight=\"650\" text-anchor=\"middle\">Välj referens<\/text><text x=\"418\" y=\"38\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"21\" font-weight=\"650\" text-anchor=\"middle\">Förbind med kabel<\/text><circle cx=\"106\" cy=\"147\" r=\"17\" fill=\"#147a99\"/><circle cx=\"218\" cy=\"147\" r=\"17\" fill=\"#147a99\"/><text x=\"106\" y=\"154\" font-family=\"system-ui\" fill=\"white\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">A<\/text><text x=\"218\" y=\"154\" font-family=\"system-ui\" fill=\"white\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">B<\/text><text x=\"162\" y=\"100\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">0 V är ett valt tal<\/text><path d=\"M130 147H194\" fill=\"none\" stroke=\"#a9c2ca\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"5 7\"/><circle cx=\"364\" cy=\"147\" r=\"17\" fill=\"#147a99\"/><circle cx=\"476\" cy=\"147\" r=\"17\" fill=\"#147a99\"/><text x=\"364\" y=\"154\" font-family=\"system-ui\" fill=\"white\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">A<\/text><text x=\"476\" y=\"154\" font-family=\"system-ui\" fill=\"white\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">B<\/text><path d=\"M381 147H459\" fill=\"none\" stroke=\"#c46e42\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"420\" y=\"103\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"15\" font-weight=\"650\" text-anchor=\"middle\">Verklig ledning<\/text><text x=\"162\" y=\"227\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">Inget fysiskt ändras<\/text><text x=\"420\" y=\"227\" font-family=\"system-ui\" fill=\"#c46e42\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">Kretsen kan ändras<\/text><\/svg><figcaption>Att skriva Vₐ = 0 V innebär inte att A kopplas med en ledning till någon annan punkt.<\/figcaption><\/figure>","tag":"Kärninnehåll"},{"title":"Två batterier: låt polariteten styra","body":"<div class=\"question\">Två ideala batterier ligger i samma slinga: <b>10 V<\/b> och <b>6 V<\/b>, med en total resistans på <b>2 Ω<\/b>. När de motverkar varandra, vilken ström fås? Vad händer om du vänder 6 V-batteriet?<\/div><p>Föreslå tecknen i den valda vandringsriktningen innan du ändrar modellens batteripolaritet. Detta är en fördjupning som kan kortas i klassrumsläget om bokarbetet behöver mer tid.<\/p>","source":"13","steps":["<div class=\"potential-math\">+10 V − 6 V − 2 Ω · I = 0<\/div>","<div class=\"potential-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>I<\/mi><mo>=<\/mo><mfrac><mrow><mn>10<\/mn><mo>−<\/mo><mn>6<\/mn><\/mrow><mn>2<\/mn><\/mfrac><mtext> A<\/mtext><mo>=<\/mo><mn>2<\/mn><mtext> A<\/mtext><\/math><\/div>","<p>Strömmen går in i 6 V-källans pluspol i motverkande fallet; den källan laddas i idealmodellen.<\/p>","<div class=\"potential-math\">Om källorna samverkar: I = (10 + 6)/2 = <b>8 A<\/b>.<\/div>"],"teacher":"Vänd sexvoltskällan med reglaget, inte med en ritad ”extra kabel”. Verkliga källor har inre resistans och tål inte nödvändigtvis dessa strömmar; idealiserad räkneuppgift, inte praktisk kopplingsinstruktion.","model":"potentialbattery86","tag":"Fördjupning / stöd"},{"title":"Socrative · elfält och potential","body":"<div class=\"socrative\"><b>Originalets Socrative: Fy1 · 905. Elfält och potential<\/b><p>Quiz-ID: <code>SOC-37397534<\/code><\/p><ol><li>Svara <b>enskilt<\/b>.<\/li><li>Jämför med en kamrat och förklara.<\/li><li>Ompröva svaret och följ upp gemensamt.<\/li><\/ol><p>Motivera med fältriktning, potentialskillnad och potentialvandring.<\/p><\/div><p class=\"small-context\">Detta är originalets frågebatteri, inte en ny webbquiz. De övriga webbfrågorna är separata självkontroller.<\/p>","source":"14","teacher":"Socrative 905, SOC-37397534 är verifierat i originalet. Låt klassen arbeta enskilt → par → klass. Behöver du tid: välj ut den fråga som visar störst skillnader i resonemang.","tag":"Kärninnehåll"},{"title":"Bokens uppgifter · visa vad du kan","body":"<div class=\"book-main\"><b>Bokens uppgifter och läxa: 861–870, s. 313–314<\/b><p>Stöd: avsnitt 8.6, s. 309–312, inklusive bokens <b>gröna rutor<\/b>. Börja enskilt och jämför sedan metod och tecken med en kamrat.<\/p><\/div><div class=\"question\">Exit: A ligger på +5 V och B på −1 V. (1) Beräkna U<sub>AB<\/sub>. (2) Välj A = 0 V – vad får B för potential? (3) Vad ändras och vad ändras inte?<\/div><p><b>Dagens mål:<\/b> skilja potential från spänning · vandra i krets med tecken · förklara nollnivå.<\/p>","source":"15","time":"Bokarbete + exit","steps":["<div class=\"potential-math\">U<sub>AB<\/sub> = (+5) − (−1) = <b>+6 V<\/b><\/div>","<p>Om A väljs till 0 V minskar båda potentialer med 5 V. Då blir <b>V<sub>B<\/sub> = −6 V<\/b>.<\/p>","<p>Alla potentialer byter tal med samma belopp. <b>Spänning, fält och den fysiska kopplingen ändras inte.<\/b><\/p>"],"teacher":"Låt eleverna göra bokens uppgifter innan exit. Webbsidans quiz är endast självkontroll, inte ytterligare Socrative. Den sista målanknutna frågan kan tas på papper.","quiz":{"prompt":"A ligger på +5 V och B på −1 V. Välj sedan A = 0 V. Vad blir Vᵦ?","options":["−6 V","+6 V","0 V"],"correct":0,"why":"B ligger 6 V lägre än A. Referensbyte med −5 V ger V_B = −1 − 5 = −6 V; U_AB förblir +6 V.","hint":""},"tag":"Självständigt arbete"},{"title":"Fördjupning: två grenar matar samma resistor","body":"<p><b>Frivilligt stöd vid bokarbetet.<\/b> Två källgrenar med <b>10 V och 2 Ω<\/b> respektive <b>8 V och 4 Ω<\/b> matar en belastning på <b>4 Ω<\/b>. Den gemensamma övre noden har potential V och den nedre 0 V.<\/p><div class=\"question\">Välj strömriktningar och bestäm V med Kirchhoffs första lag. Vad betyder det om en beräknad grenström blir negativ?<\/div>","source":"16","steps":["<div class=\"potential-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><msub><mi>I<\/mi><mn>1<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><mn>10<\/mn><mo>−<\/mo><mi>V<\/mi><\/mrow><mn>2<\/mn><\/mfrac><mtext> A<\/mtext><\/math><\/div>","<div class=\"potential-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><msub><mi>I<\/mi><mn>2<\/mn><\/msub><mo>=<\/mo><mfrac><mrow><mn>8<\/mn><mo>−<\/mo><mi>V<\/mi><\/mrow><mn>4<\/mn><\/mfrac><mtext> A<\/mtext><\/math><\/div>","<div class=\"potential-math\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>I<\/mi><mo>=<\/mo><mfrac><mi>V<\/mi><mn>4<\/mn><\/mfrac><mtext> A<\/mtext><\/math><\/div>","<p>Kirchhoffs första lag: I₁ + I₂ = I.<\/p>","<div class=\"potential-math\">2(10 − V) + (8 − V) = V &nbsp; ⇒ &nbsp; <b>V = 7 V<\/b><\/div>","<p>I₁ = 1,5 A, I₂ = 0,25 A och I = 1,75 A. Kontroll: 1,5 + 0,25 = 1,75 A. Ett negativt resultat skulle betyda motsatt riktning.<\/p>"],"teacher":"För klara elever/elever som behöver extra stöd. Inte obligatorisk gemensam genomgång. Kontrollera att eleven tolkar strömtecken som riktning och att de tre grenarna är parallella mellan samma noder.","side":"<figure class=\"potential-figure\"><svg role=\"img\" aria-label=\"Två parallella källgrenar: 10 V och 2 ohm till vänster, 8 V och 4 ohm i mitten, belastning 4 ohm till höger. Övre nod V och nedre nod 0 V. Grenströmmar I1 och I2 uppåt, lastström I nedåt.\" viewBox=\"0 0 560 350\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M80 72H490 M80 288H490\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M126 72V116 M126 141V185 M126 225V288\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M104 116H148 M114 141H138\" fill=\"none\" stroke=\"#c46e42\" stroke-width=\"3.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"111\" y=\"185\" width=\"30\" height=\"40\" rx=\"4\" fill=\"white\" stroke=\"#c46e42\" stroke-width=\"3\"/><text x=\"174\" y=\"124\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">10 V<\/text><text x=\"175\" y=\"213\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">2 Ω<\/text><path d=\"M102 265 L102 235\" fill=\"none\" stroke=\"#207b61\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"102,235 107.5,246.0 96.5,246.0\" fill=\"#207b61\"/><text x=\"100\" y=\"231\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">I₁<\/text><path d=\"M280 72V116 M280 141V185 M280 225V288\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M258 116H302 M268 141H292\" fill=\"none\" stroke=\"#147a99\" stroke-width=\"3.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"265\" y=\"185\" width=\"30\" height=\"40\" rx=\"4\" fill=\"white\" stroke=\"#147a99\" stroke-width=\"3\"/><text x=\"328\" y=\"124\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">8 V<\/text><text x=\"329\" y=\"213\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">4 Ω<\/text><path d=\"M256 265 L256 235\" fill=\"none\" stroke=\"#207b61\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"256,235 261.5,246.0 250.5,246.0\" fill=\"#207b61\"/><text x=\"254\" y=\"231\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"16\" font-weight=\"650\" text-anchor=\"middle\">I₂<\/text><path d=\"M440 72V162 M440 206V288\" fill=\"none\" stroke=\"#244e5e\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"425\" y=\"162\" width=\"30\" height=\"44\" rx=\"4\" fill=\"white\" stroke=\"#207b61\" stroke-width=\"3\"/><text x=\"478\" y=\"190\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"17\" font-weight=\"650\" text-anchor=\"middle\">4 Ω<\/text><path d=\"M464 106 L464 144\" fill=\"none\" stroke=\"#207b61\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polygon points=\"464,144 458.5,133.0 469.5,133.0\" fill=\"#207b61\"/><text x=\"478\" y=\"94\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">I<\/text><circle cx=\"280\" cy=\"72\" r=\"5\" fill=\"#244e5e\"/><text x=\"280\" y=\"46\" font-family=\"system-ui\" fill=\"#207b61\" font-size=\"19\" font-weight=\"650\" text-anchor=\"middle\">V<\/text><circle cx=\"280\" cy=\"288\" r=\"5\" fill=\"#244e5e\"/><text x=\"280\" y=\"318\" font-family=\"system-ui\" fill=\"#244e5e\" font-size=\"18\" font-weight=\"650\" text-anchor=\"middle\">0 V<\/text><\/svg><figcaption>Fördjupning med KCL. Grenarna har komponenter i serie, men ingen förbikopplande tråd.<\/figcaption><\/figure>","tag":"Fördjupning / stöd"}]}</script><script src="../../gemensamt/models.js"></script><script src="potential-models.js?v=rev86a"></script><script src="../../gemensamt/app.js"></script><script src="potential-ui.js?v=rev86a"></script></body></html>
