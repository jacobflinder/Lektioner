<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Serie- och parallellkoppling · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"><link rel="stylesheet" href="serie-parallell.css?v=rev1"></head><body><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Serie- och parallellkoppling</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Serie- och parallellkoppling","subject":"Fysik nivå 1","chapter":"8.3 · Serie- och parallellkoppling","source":"261116 8.3 Seriekoppling och parallellkoppling.pdf","goals":["Känna igen serie- och parallellkoppling samt placera mätinstrument korrekt.","Förklara ström och spänning i respektive koppling.","Beräkna ersättningsresistans och strömmar i kretsar med två resistorer."],"pages":[{"title":"En extra resistor – större eller mindre ström?","body":"<div class=\"question\">Vi har 12 V över en resistor på 100 Ω. En resistor på 200 Ω tillkommer. Hur ändras strömmen från batteriet?<\/div><div class=\"predict-cards\"><div><b>A · Serie<\/b><span>Ökar, minskar eller oförändrad?<\/span><\/div><div><b>B · Parallellt<\/b><span>Ökar, minskar eller oförändrad?<\/span><\/div><\/div><p><strong>Gör först en förutsägelse.<\/strong> Rita de båda kopplingarna och förklara för en kamrat varför du tror att strömmen ändras.<\/p><div class=\"goalcard\"><b>Efter lektionen ska du kunna<\/b><ol><li>Känna igen serie- och parallellkoppling och koppla A/V rätt.<\/li><li>Förklara strömmar och spänningar med bevarande av laddning.<\/li><li>Beräkna ersättningsresistans och strömmar.<\/li><\/ol><\/div>","source":"1","quiz":{"prompt":"Jämfört med en ensam resistor på 100 Ω blir batteriets ström ...","options":["Mindre i serie, större i parallellt","Större i serie, mindre i parallellt","Oförändrad i båda fallen"],"correct":0,"why":"Seriekoppling ger större total resistans och mindre ström. En extra parallell strömväg ger mindre ersättningsresistans och större totalström."},"teacher":"Start 6 min: låt eleverna förutsäga båda kopplingarna, gärna enskilt → par. Den här nya webbfrågan är inte originalets Socrative. Förhandsavslöja inte svaret genom modellen.","side":"<figure class=\"circuit-figure\"><svg role=\"img\" aria-label=\"Startkrets: idealt batteri 12 V och en resistor 100 Ω\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 335\"><title>Startkrets: idealt batteri 12 V och en resistor 100 Ω<\/title><desc>Rita först hur en extra resistor kan kopplas i serie respektive parallellt.<\/desc><path d=\"M88 156V77H497V267H88V156\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"70\" y=\"140\" width=\"36\" height=\"90\" fill=\"white\"/><line x1=\"67\" y1=\"177\" x2=\"109\" y2=\"177\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"76\" y1=\"198\" x2=\"100\" y2=\"198\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"48\" y=\"150\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">+<\/text><text x=\"48\" y=\"220\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"22\">−<\/text><rect x=\"262.5\" y=\"63\" width=\"75\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/><text x=\"300\" y=\"45\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">100 Ω<\/text><text x=\"121\" y=\"296\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\">12 V<\/text><\/svg><figcaption>Rita först hur en extra resistor kan kopplas i serie respektive parallellt.<\/figcaption><\/figure>","time":"Enskilt → par → klass"},{"title":"Samma batteri. Samma resistorer. Två kopplingar.","body":"<p>Samma ideala <b>12 V-batteri<\/b> och två resistorer: <b>100 Ω<\/b> respektive <b>200 Ω<\/b>.<\/p><div class=\"question\">Följ strömmens väg med pennan. Vilken koppling har förgreningar? Vad händer med batteriets ström när du byter koppling?<\/div><p>Rita båda kretsschemana. Byt sedan med <b>Serie / Parallellt<\/b> i modellen. <b>Förutsäg talvärdena innan du visar resultatet.<\/b><\/p><p>Jämför med en ensam resistor på 100 Ω: då blir batteriströmmen <b>0,120 A<\/b>.<\/p>","source":"2","model":"series","teacher":"Här gör klassen ett omkopplingsförsök i webben efter att eleverna ritat. Modellen håller U, R₁, R₂ samordnade med krets, strömmar, spänningar och R_ers. Laborationen i PhET är separat; denna bild är ingen ersättning för den.","time":"Förutsäg → pröva → förklara"},{"title":"Serie: samma ström genom båda","body":"<p>Två resistorer på <b>100 Ω<\/b> och <b>200 Ω<\/b> är kopplade i serie till <b>12 V<\/b>.<\/p><div class=\"question\">Vilken ström går genom var och en? Vilken resistor har störst spänningsfall? Föreslå beräkningsordningen.<\/div><p>En enda strömväg ger <b>samma ström genom båda<\/b>. Spänningsfallen tillsammans blir batterispänningen.<\/p>","source":"3","steps":["<div class=\"worked\"><b>1 · Ersättningsresistans<\/b><div class=\"equation\">R<sub>ers<\/sub> = R₁ + R₂ = 100 Ω + 200 Ω = <strong>300 Ω<\/strong><\/div><\/div>","<div class=\"worked\"><b>2 · Ström<\/b><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><msub><mi>R<\/mi><mtext>ers<\/mtext><\/msub><\/mfrac><mo>=<\/mo><mfrac><mrow><mn>12<\/mn><mspace width=\"0.2em\"/><mi mathvariant=\"normal\">V<\/mi><\/mrow><mrow><mn>300<\/mn><mspace width=\"0.2em\"/><mo>Ω<\/mo><\/mrow><\/mfrac><mo>=<\/mo><mn>0,040<\/mn><mspace width=\"0.2em\"/><mi mathvariant=\"normal\">A<\/mi><\/math><\/div><\/div>","<div class=\"worked\"><b>3 · Första resistorn<\/b><div class=\"equation\">U₁ = R₁I = 100 Ω · 0,040 A = <strong>4,0 V<\/strong><\/div><\/div>","<div class=\"worked\"><b>4 · Andra resistorn och kontroll<\/b><div class=\"equation\">U₂ = R₂I = 200 Ω · 0,040 A = <strong>8,0 V<\/strong><\/div><div class=\"equation\">4,0 V + 8,0 V = 12 V ✓<\/div><p>Dubbelt motstånd ger dubbelt spänningsfall när strömmen är densamma.<\/p><\/div>"],"teacher":"Cirka 7 min. Låt eleverna själva ange nästa steg innan varje avslöjande. Läs kretsschema och beräkning tillsammans; den större resistorn har större U i serie.","side":"<figure class=\"circuit-figure\"><svg role=\"img\" aria-label=\"Seriekrets 12 V med resistorerna 100 Ω och 200 Ω\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 335\"><title>Seriekrets 12 V med resistorerna 100 Ω och 200 Ω<\/title><desc>Samma ström går genom båda resistorerna. Föreslå U₁ och U₂ före lösningen.<\/desc><path d=\"M91 158V88H504V277H91V158\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"73\" y=\"144\" width=\"36\" height=\"90\" fill=\"white\"/><line x1=\"70\" y1=\"181\" x2=\"112\" y2=\"181\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"79\" y1=\"202\" x2=\"103\" y2=\"202\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"51\" y=\"154\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">+<\/text><text x=\"51\" y=\"224\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"22\">−<\/text><rect x=\"204.0\" y=\"74\" width=\"82\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/><rect x=\"350.0\" y=\"74\" width=\"82\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/><text x=\"245\" y=\"59\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"19\">100 Ω<\/text><text x=\"391\" y=\"59\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"19\">200 Ω<\/text><path d=\"M123 88L183 88M172.0 83.0L183 88L172.0 93.0\" stroke=\"#087f99\" stroke-width=\"3.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"150\" y=\"64\" fill=\"#087f99\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">I<\/text><text x=\"114\" y=\"313\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\">12 V<\/text><text x=\"310\" y=\"320\" fill=\"#177c91\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">U₁ + U₂ = 12 V<\/text><\/svg><figcaption>Samma ström går genom båda resistorerna. Föreslå U₁ och U₂ före lösningen.<\/figcaption><\/figure>"},{"title":"Parallellt: samma spänning över båda","body":"<p>Resistorerna <b>100 Ω<\/b> och <b>200 Ω<\/b> ligger parallellt över <b>12 V<\/b>.<\/p><div class=\"question\">Vilken gren har störst ström? Hur blir batteriets totalström? Motivera först med samma spänning över båda grenarna.<\/div><p>Parallellt gäller att <b>U₁ = U₂<\/b>, men strömmarna kan vara olika. Laddningen bevaras i förgreningen.<\/p>","source":"4","steps":["<div class=\"worked\"><b>1 · Grenarnas spänningar<\/b><div class=\"equation\">U₁ = U₂ = <strong>12 V<\/strong>, eftersom grenarna har samma två anslutningspunkter.<\/div><\/div>","<div class=\"worked\"><b>2 · Ström i 100 Ω<\/b><div class=\"equation\">I₁ = U/R₁ = 12 V/(100 Ω) = <strong>0,120 A<\/strong>.<\/div><\/div>","<div class=\"worked\"><b>3 · Ström i 200 Ω<\/b><div class=\"equation\">I₂ = U/R₂ = 12 V/(200 Ω) = <strong>0,060 A<\/strong>.<\/div><\/div>","<div class=\"worked\"><b>4 · Totalström från batteriet<\/b><div class=\"equation\">I = I₁ + I₂ = 0,120 A + 0,060 A = <strong>0,180 A<\/strong>.<\/div><\/div>","<p><b>Rimlighetskontroll:<\/b> grenen med hälften så stor resistans får dubbelt så stor ström. Totalströmmen är större än i någon enskild gren.<\/p>"],"teacher":"Cirka 7 min. Visa tydligt de två gemensamma noderna, inte bara två resistorer. Låt eleverna jämföra grenströmmarna före facit.","side":"<figure class=\"circuit-figure\"><svg role=\"img\" aria-label=\"Parallellkrets 12 V med en gren på 100 Ω och en gren på 200 Ω\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 335\"><title>Parallellkrets 12 V med en gren på 100 Ω och en gren på 200 Ω<\/title><desc>Båda grenarna har 12 V över sig. I₁ och I₂ kan vara olika.<\/desc><path d=\"M92 154V77H423V145 M423 221V276H92V154 M278 77V145 M278 221V276\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"74\" y=\"138\" width=\"36\" height=\"90\" fill=\"white\"/><line x1=\"71\" y1=\"175\" x2=\"113\" y2=\"175\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"80\" y1=\"196\" x2=\"104\" y2=\"196\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"52\" y=\"148\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">+<\/text><text x=\"52\" y=\"218\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"22\">−<\/text><rect x=\"264\" y=\"145.0\" width=\"28\" height=\"76\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/><rect x=\"409\" y=\"145.0\" width=\"28\" height=\"76\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/><text x=\"325\" y=\"195\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">100 Ω<\/text><text x=\"469\" y=\"195\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">200 Ω<\/text><path d=\"M278 97L278 137M283.0 126.0L278 137L273.0 126.0\" stroke=\"#087f99\" stroke-width=\"3.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M423 97L423 137M428.0 126.0L423 137L418.0 126.0\" stroke=\"#087f99\" stroke-width=\"3.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"254\" y=\"116\" fill=\"#087f99\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"17\">I₁<\/text><text x=\"399\" y=\"116\" fill=\"#087f99\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"17\">I₂<\/text><text x=\"118\" y=\"317\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"19\">12 V<\/text><text x=\"357\" y=\"313\" fill=\"#177c91\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">U₁ = U₂ = 12 V<\/text><\/svg><figcaption>Båda grenarna har 12 V över sig. I₁ och I₂ kan vara olika.<\/figcaption><\/figure>"},{"title":"Varför blir ersättningsresistansen mindre?","body":"<p><b>Ersättningsresistans<\/b> är den enda resistans som skulle ge <b>samma batteriström vid samma batterispänning<\/b>.<\/p><div class=\"question\">Varför kan ersättningsresistansen bli mindre än 100 Ω trots att båda grenresistanserna är större?<\/div><p>Förklara först med <b>en extra strömväg<\/b>, inte med en memorerad formel.<\/p>","source":"5","steps":["<div class=\"worked\"><b>1 · Samma totala ström<\/b><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>R<\/mi><mtext>ers<\/mtext><\/msub><mo>=<\/mo><mfrac><mi>U<\/mi><mi>I<\/mi><\/mfrac><mo>=<\/mo><mfrac><mrow><mn>12<\/mn><mspace width=\"0.15em\"/><mi mathvariant=\"normal\">V<\/mi><\/mrow><mrow><mn>0,180<\/mn><mspace width=\"0.15em\"/><mi mathvariant=\"normal\">A<\/mi><\/mrow><\/mfrac><mo>≈<\/mo><mn>66,7<\/mn><mspace width=\"0.15em\"/><mo>Ω<\/mo><\/math><\/div><\/div>","<div class=\"worked\"><b>2 · Från Kirchhoffs första lag<\/b><div class=\"equation\">I = I₁ + I₂ &nbsp; ⇒ &nbsp; U/R<sub>ers<\/sub> = U/R₁ + U/R₂<\/div><\/div>","<div class=\"worked\"><b>3 · Dividera med U ≠ 0<\/b><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1<\/mn><msub><mi>R<\/mi><mtext>ers<\/mtext><\/msub><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><msub><mi>R<\/mi><mn>1<\/mn><\/msub><\/mfrac><mo>+<\/mo><mfrac><mn>1<\/mn><msub><mi>R<\/mi><mn>2<\/mn><\/msub><\/mfrac><\/math><\/div><\/div>","<p><b>Rimlighetskontroll:<\/b> 66,7 Ω är mindre än den minsta grenresistansen (100 Ω), eftersom batteriet får fler vägar för ström.<\/p>"],"teacher":"Cirka 5 min. Prioritera den fysikaliska förklaringen till att R_ers blir mindre; visa algebra vid behov. Webbfrågan är ny och inte originalets Socrative.","side":"<figure class=\"circuit-figure\"><svg role=\"img\" aria-label=\"Ersättningskrets med 12 volt och ett enda motstånd som ger 0,180 ampere\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 335\"><title>Ersättningskrets med 12 volt och ett enda motstånd som ger 0,180 ampere<\/title><desc>Denna enda resistor ger samma totalström som två parallella resistorer på 100 Ω och 200 Ω.<\/desc><path d=\"M90 165V76H505V271H90V165\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"72\" y=\"137\" width=\"36\" height=\"90\" fill=\"white\"/><line x1=\"69\" y1=\"174\" x2=\"111\" y2=\"174\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"78\" y1=\"195\" x2=\"102\" y2=\"195\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"50\" y=\"147\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">+<\/text><text x=\"50\" y=\"217\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"22\">−<\/text><rect x=\"257.0\" y=\"62\" width=\"94\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/><text x=\"304\" y=\"48\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\">Rₑᵣₛ<\/text><path d=\"M150 76L218 76M207.0 71.0L218 76L207.0 81.0\" stroke=\"#087f99\" stroke-width=\"3.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"153\" y=\"316\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\">12 V<\/text><text x=\"385\" y=\"308\" fill=\"#087f99\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\">I = 0,180 A<\/text><\/svg><figcaption>Denna enda resistor ger samma totalström som två parallella resistorer på 100 Ω och 200 Ω.<\/figcaption><\/figure>","quiz":{"prompt":"Vilken ersättningsresistans är rimlig för 100 Ω och 200 Ω parallellt?","options":["66,7 Ω","150 Ω","300 Ω"],"correct":0,"why":"Parallellt blir ersättningsresistansen mindre än den minsta enskilda grenresistansen. Här Rₑᵣₛ ≈ 66,7 Ω."}},{"title":"Mät ström genom – spänning över","body":"<p><strong>Rita själv först:<\/strong> var ska du placera A och V för att mäta strömmen genom en resistor och spänningen över den?<\/p><div class=\"question\">Vad skulle kunna hända om amperemetern kopplas parallellt över resistorn?<\/div><div class=\"meter-points\"><p><b>Amperemeter:<\/b> i serie så att strömmen går genom instrumentet. Låg inre resistans.<\/p><p><b>Voltmeter:<\/b> parallellt mellan komponentens båda anslutningar. Hög inre resistans.<\/p><\/div><p class=\"safety-small\">Koppla inte en amperemeter direkt över en spänningskälla eller resistor i verkligheten: stor ström kan skada instrument eller krets.<\/p>","source":"6","steps":["<p><b>Kontroll:<\/b> amperemetern visar ström <em>genom<\/em>; voltmetern visar spänning <em>mellan<\/em> två punkter.<\/p>","<p><b>Felsökning:<\/b> att lägga en lågohmig amperemeter över resistorn ger en nästan kortslutande gren och kan orsaka hög ström.<\/p>"],"teacher":"Cirka 4 min. Rita först utan mätare på tavlan och låt eleverna placera A och V själva. Visa sedan denna figur. Kopplingslabben i PhET behålls separat.","side":"<figure class=\"circuit-figure\"><svg role=\"img\" aria-label=\"Krets med batteri på 6 volt, amperemeter i serie och voltmeter parallellt över R\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 335\"><title>Krets med batteri på 6 volt, amperemeter i serie och voltmeter parallellt över R<\/title><desc>Mätaren A ligger i huvudströmvägen. Voltmeter V har var sin anslutning på resistorns båda sidor.<\/desc><path d=\"M98 158V84H207 M263 84H345 M435 84H498V274H98V158 M345 84V171H363 M417 171H435V84\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"80\" y=\"149\" width=\"36\" height=\"90\" fill=\"white\"/><line x1=\"77\" y1=\"186\" x2=\"119\" y2=\"186\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"86\" y1=\"207\" x2=\"110\" y2=\"207\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"58\" y=\"159\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">+<\/text><text x=\"58\" y=\"229\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"22\">−<\/text><rect x=\"345.0\" y=\"70\" width=\"90\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/><circle cx=\"235\" cy=\"84\" r=\"28\" fill=\"white\" stroke=\"#0a8094\" stroke-width=\"3\"/><circle cx=\"390\" cy=\"171\" r=\"27\" fill=\"white\" stroke=\"#0a8094\" stroke-width=\"3\"/><text x=\"235\" y=\"92\" fill=\"#087d93\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"24\">A<\/text><text x=\"390\" y=\"180\" fill=\"#087d93\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"23\">V<\/text><text x=\"390\" y=\"46\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\">R<\/text><text x=\"116\" y=\"316\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">6 V<\/text><text x=\"301\" y=\"312\" fill=\"#56727e\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"16\">A i strömvägen · V över resistorn<\/text><\/svg><figcaption>Mätaren A ligger i huvudströmvägen. Voltmeter V har var sin anslutning på resistorns båda sidor.<\/figcaption><\/figure>","quiz":{"prompt":"Hur ska en ideal voltmeter kopplas för att mäta spänningen över R?","options":["Parallellt över R","I serie före R","Direkt över amperemetern"],"correct":0,"why":"En voltmeter har hög inre resistans och ansluts mellan de två punkter vars potentialskillnad ska mätas."}},{"title":"Batterier: samma ord, en annan fråga","body":"<p>Två likadana <b>1,5 V-celler<\/b>. Förutsäg batterispänningen när de kopplas i serie respektive parallellt med samma polaritet.<\/p><div class=\"question\">När får vi 3,0 V och när får vi 1,5 V? Två identiska parallellkopplade celler driver tillsammans 0,10 A: vilken ström ger varje cell i den idealiserade modellen?<\/div><p class=\"note\">Idealmodell med två identiska celler: serie adderar spänning; parallellt ger oförändrad spänning men kan ge större tillgänglig kapacitet. Koppla inte i praktiken ihop olika celler utan lämpligt skydd.<\/p>","source":"7","steps":["<p><b>Serie:<\/b> U = 1,5 V + 1,5 V = <b>3,0 V<\/b> om cellerna är likriktade.<\/p>","<p><b>Parallellt:<\/b> U = <b>1,5 V<\/b>. Lika ideala celler delar jämnt på strömmen: 0,10 A / 2 = <b>0,050 A per cell<\/b>.<\/p>"],"teacher":"Cirka 3 min. Markera antagandet identiska celler. Låt eleverna först rita polaritet och bara därefter avslöja 3,0/1,5 V. Webbfrågan är ett nytt övningsinslag, inte Socrative.","side":"<figure class=\"circuit-figure\"><svg role=\"img\" aria-label=\"Två identiska 1,5-voltsceller kopplade i serie och parallellt\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 275\"><title>Två identiska 1,5-voltsceller kopplade i serie och parallellt<\/title><desc>Två identiska celler, 1,5 V vardera. Förutsäg innan värdena visas stegvis.<\/desc><path d=\"M50 113V55H260V174H50V113\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"121.5\" y=\"160\" width=\"65\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/><text x=\"153\" y=\"202\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"16\">R<\/text><rect x=\"91\" y=\"44\" width=\"42\" height=\"21\" fill=\"white\"/><rect x=\"163\" y=\"44\" width=\"42\" height=\"21\" fill=\"white\"/><line x1=\"105\" y1=\"44\" x2=\"105\" y2=\"67\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><line x1=\"116\" y1=\"49\" x2=\"116\" y2=\"63\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><line x1=\"177\" y1=\"44\" x2=\"177\" y2=\"67\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><line x1=\"188\" y1=\"49\" x2=\"188\" y2=\"63\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><path d=\"M335 113V56H558V176H335V113 M335 110H558\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"414.5\" y=\"162\" width=\"67\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/><text x=\"446\" y=\"205\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"16\">R<\/text><rect x=\"414\" y=\"45\" width=\"54\" height=\"22\" fill=\"white\"/><rect x=\"414\" y=\"99\" width=\"54\" height=\"22\" fill=\"white\"/><line x1=\"429\" y1=\"44\" x2=\"429\" y2=\"68\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><line x1=\"441\" y1=\"49\" x2=\"441\" y2=\"63\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><line x1=\"429\" y1=\"98\" x2=\"429\" y2=\"122\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><line x1=\"441\" y1=\"103\" x2=\"441\" y2=\"117\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/><text x=\"153\" y=\"24\" fill=\"#087c93\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">SERIE · samma riktning<\/text><text x=\"446\" y=\"24\" fill=\"#087c93\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">PARALLELLT · lika poler ihop<\/text><text x=\"153\" y=\"248\" fill=\"#b56b45\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"24\">? V<\/text><text x=\"446\" y=\"248\" fill=\"#b56b45\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"24\">? V<\/text><\/svg><figcaption>Två identiska celler, 1,5 V vardera. Förutsäg innan värdena visas stegvis.<\/figcaption><\/figure>","quiz":{"prompt":"Två likadana 1,5 V-celler parallellt (lika poler ihop) ger idealiskt ...","options":["1,5 V","3,0 V","0 V"],"correct":0,"why":"Parallellkopplade identiska celler har samma polspänning som en cell; de kan tillsammans leverera större kapacitet."}},{"title":"Socrative: pröva din förklaring","body":"<div class=\"socrative\"><p><b>Originalets Socrative<\/b> · Fy1 … 903. Kopplingar<\/p><code>SOC-37285032<\/code><p>1. Svara först enskilt och motivera en osäker fråga.<br>2. Jämför med en kamrat: följ strömmens vägar och jämför potentialskillnaderna.<br>3. Ompröva svaret. Förklara varför.<\/p><\/div><div class=\"question\">Vilket resonemang i klassen behöver vi reda ut tillsammans? Målet är att förstå – inte bara få rätt alternativ.<\/div>","source":"8","time":"Enskilt → par → klass","teacher":"Befintlig Socrative Fy1 903, quiz-ID SOC-37285032 från originalet. Använd endast originalets aktiviteter; den får inte ersättas med nyskapad fråga. Föreslagen tidsram 6 min, anpassas till behovet."},{"title":"Nu använder du sambanden själv","body":"<div class=\"book-main\"><h2>Boken · s. 281–293<\/h2><p class=\"big-assignment\">Uppgifter / läxa <strong>829–838<\/strong><\/p><p><b>Börja med 834 och 835 (s. 293)<\/b> – jämför samma resistorer i två olika kopplingar.<\/p><\/div><div class=\"book-other\"><p><b>Fortsätt:<\/b> 833 (mätinstrument) och 829 (batterier).<\/p><p><b>Därefter:<\/b> 830–832 (lampor) och 836–838 (blandade kretsar).<\/p><\/div><div class=\"question\">För varje uppgift: rita och markera → välj samband → redovisa mellanled och enheter → rimlighetskontroll.<\/div><p><b>Arbeta själv först.<\/b> Jämför sedan resonemang med gruppen. Behöver du stöd för blandade kretsar finns sidan 11.<\/p><p>Alla uppgifter ska inte hinnas under lektionen. Skriv ner vilka du fortsätter med efteråt.<\/p>","source":"9","time":"Eget bokarbete · planera 20–25 min","teacher":"Bokarbetet är en obligatorisk arbetsfas, ingen restpost. Prioritera 834/835 med motivering och återkoppling; därefter 833 och 829. Avgränsa läxan utifrån elevernas faktiska arbete, inte automatiskt alla uppgifter."},{"title":"Visa vad du kan – på egen hand","body":"<p>Sista fem minuterna: <strong>svara enskilt utan bok<\/strong>. Skriv kort, men motivera.<\/p><div class=\"exit-items\"><section><b>1 · Serie eller parallellt?<\/b><p>Två resistorer sitter i serie. Vad är samma, I eller U? Vad gäller om de kopplas parallellt?<\/p><\/section><section><b>2 · Beräkning<\/b><p>6,0 V över två parallella resistorer på 300 Ω vardera. Beräkna totalström och ersättningsresistans.<\/p><\/section><section><b>3 · Mätning<\/b><p>Rita A och V för att mäta ström genom och spänning över en resistor.<\/p><\/section><\/div><div class=\"selfcheck\">Markera vilket av dagens lektionsmål du behöver träna mer på.<\/div><p><b>Inför nästa lektion:<\/b> Effekt, s. 294–299. Läs <b>de gröna rutorna<\/b> noggrant och försök förklara sambanden.<\/p>","source":"10","steps":["<p><b>1:<\/b> I är lika genom serieresistorer; U är lika över parallellgrenar (ideala kopplingar).<\/p>","<p><b>2:<\/b> Grenströmmarna är 6,0 V/300 Ω = 0,020 A vardera. I = 0,040 A och R<sub>ers<\/sub> = 6,0 V / 0,040 A = <b>150 Ω<\/b>.<\/p>","<p><b>3:<\/b> A kopplas i serie, V parallellt över den resistor vars spänning ska mätas.<\/p>"],"teacher":"Avsätt fem minuter för individuell exit. Repetitionsläge kan visa facit stegvis. Nästa gång 8.4 Effekt, s. 294–299 och gröna rutorna."},{"title":"Stöd: förenkla en del i taget","body":"<p><strong>Frivilligt stöd vid eget bokarbete.<\/strong> En resistor på 60 Ω ligger i serie med en parallellkoppling av 120 Ω och 240 Ω. Batteriet ger 14 V.<\/p><div class=\"question\">Vilka två resistorer ligger mellan samma knutpunkter? Börja med dem. Vad ligger sedan i serie med ersättningsresistansen?<\/div><p>Skriv en plan för din uträkning innan lösningen visas.<\/p>","source":"11","steps":["<div class=\"worked\"><b>1 · Parallellgrenar<\/b><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1<\/mn><msub><mi>R<\/mi><mi>p<\/mi><\/msub><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mrow><mn>120<\/mn><mo>Ω<\/mo><\/mrow><\/mfrac><mo>+<\/mo><mfrac><mn>1<\/mn><mrow><mn>240<\/mn><mo>Ω<\/mo><\/mrow><\/mfrac><mo>⇒<\/mo><msub><mi>R<\/mi><mi>p<\/mi><\/msub><mo>=<\/mo><mn>80<\/mn><mo>Ω<\/mo><\/math><\/div><\/div>","<p><b>2 · Serie med 60 Ω:<\/b> R<sub>ers<\/sub> = 60 Ω + 80 Ω = <b>140 Ω<\/b>.<\/p>","<p><b>3 · Totalström:<\/b> I = 14 V/(140 Ω) = <b>0,10 A<\/b>.<\/p>","<p><b>4 · Spänning över parallellgrenarna:<\/b> U<sub>p<\/sub> = 14 V − (60 Ω · 0,10 A) = <b>8,0 V<\/b>.<\/p>","<p><b>5 · Grenströmmar:<\/b> I₁ = 8,0 V/120 Ω ≈ <b>0,0667 A<\/b> och I₂ = 8,0 V/240 Ω ≈ <b>0,0333 A<\/b>.<\/p>","<p><b>Kontroll:<\/b> 0,0667 A + 0,0333 A ≈ <b>0,100 A<\/b>. Summeringen stämmer med Kirchhoffs första lag.<\/p>"],"teacher":"Gör inte denna till en extra obligatorisk gemensam genomgång. Ge frivilligt stegvis stöd när eleverna arbetar med 836–838 eller motsvarande.","side":"<figure class=\"circuit-figure\"><svg role=\"img\" aria-label=\"Blandad krets: 60 ohm i serie med parallellgrenarna 120 och 240 ohm över 14 volt\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 335\"><title>Blandad krets: 60 ohm i serie med parallellgrenarna 120 och 240 ohm över 14 volt<\/title><desc>Sök först den parallella grenens ersättningsresistans, sedan totalresistansen och strömmarna.<\/desc><path d=\"M90 155V78H196 M269 78H450V151 M450 223V290H90V155 M331 78V151 M331 223V290\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"72\" y=\"143\" width=\"36\" height=\"90\" fill=\"white\"/><line x1=\"69\" y1=\"180\" x2=\"111\" y2=\"180\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"78\" y1=\"201\" x2=\"102\" y2=\"201\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"50\" y=\"153\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">+<\/text><text x=\"50\" y=\"223\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"22\">−<\/text><rect x=\"196.5\" y=\"64\" width=\"73\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/><rect x=\"317\" y=\"151.0\" width=\"28\" height=\"72\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/><rect x=\"436\" y=\"151.0\" width=\"28\" height=\"72\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/><text x=\"233\" y=\"48\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"19\">60 Ω<\/text><text x=\"331\" y=\"133\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">120 Ω<\/text><text x=\"450\" y=\"133\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">240 Ω<\/text><text x=\"120\" y=\"324\" fill=\"#b46b4b\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\">14 V<\/text><text x=\"385\" y=\"321\" fill=\"#157d93\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"19\">I = ?<\/text><\/svg><figcaption>Sök först den parallella grenens ersättningsresistans, sedan totalresistansen och strömmarna.<\/figcaption><\/figure>"}]}</script><script src="../../gemensamt/models.js"></script><script src="serie-parallell-model.js?v=rev1"></script><script src="../../gemensamt/app.js"></script></body></html>
