<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Elektriska fält · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"></head><body><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Elektriska fält</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Elektriska fält","subject":"Fysik nivå 1","chapter":"8.5 · Elektriska fält","source":"Fy1_Elektriska_falt.pdf","goals":["Rita fältriktning och kraft på positiva och negativa laddningar.","Beräkna fältstyrka, elektrisk kraft och partikelacceleration.","Förklara elektrisk skärmning med laddningarnas omfördelning."],"pages":[{"title":"Hur kan en kraft verka utan kontakt?","body":"<div class=\"question\">En positiv och en negativ laddning möts. Rita en kraftpil på var och en. Vad avgör riktningen?<\/div><p>Undersök fält, skärmning och hur en elektrisk kraft kan styra partiklar.<\/p><p class=\"note\"><b>Mål:<\/b> rita fält och kraft, beräkna E, F och a samt förklara elektrisk skärmning.<\/p><p>PhET som ursprungsreferens: <a href=\"https://phet.colorado.edu/sims/html/charges-and-fields/latest/charges-and-fields_all.html\" target=\"_blank\" rel=\"noopener\">Charges and Fields<\/a>.<\/p>","source":"1","teacher":"Föreslagna PhET-aktiviteten är redan i originalet och ska finnas kvar, men ersätter inte genomgången.","side":"<figure class=\"graph static-graph\"><svg role=\"img\" aria-label=\"Rita två kraftpilar. Inga pilar är förtryckta för att bevara förutsägelsen.\" viewBox=\"0 0 535 245\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"148\" cy=\"150\" r=\"20\" fill=\"#c66d4c\"/><text x=\"148\" y=\"157\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><circle cx=\"380\" cy=\"150\" r=\"20\" fill=\"#176f8b\"/><text x=\"380\" y=\"157\" fill=\"white\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><text x=\"269\" y=\"215\" fill=\"#214956\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">Vilken riktning får krafterna?<\/text><text x=\"270\" y=\"62\" fill=\"#214956\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">Två olikladdade föremål<\/text><\/svg><figcaption class=\"figcap\">Rita två kraftpilar. Inga pilar är förtryckta för att bevara förutsägelsen.<\/figcaption><\/figure>"},{"title":"Fältet beskriver platsen","body":"<p>Fältet i en punkt definieras med kraften på en liten <b>positiv testladdning<\/b>.<\/p><ul><li>Fältlinjer går från positiva till negativa källor.<\/li><li>Större linjetäthet i en konsekvent figur betyder starkare fält.<\/li><li>En negativ laddning påverkas av en kraft motsatt fältets riktning.<\/li><\/ul><p>Startfrågans svar: de två laddningarna attraherar varandra med lika stora och motriktade krafter.<\/p>","source":"2","quiz":{"prompt":"En elektron placeras i ett fält riktat åt höger. Kraften på elektronen är…","options":["åt höger","åt vänster","noll"],"correct":1,"why":"Elektronen har negativ laddning och påverkas därför motsatt fältet.","hint":""},"teacher":"Förklara att fältlinjer är en representation, inte fysiska strängar."},{"title":"Samma fält – olika testladdningar","body":"<div class=\"question\">Rita kraftpilar för +q₀, −q₀ och +2q₀ i samma fält åt höger. Ändras själva fältet?<\/div><p>Välj höger som positiv riktning. Ändra testladdningens tecken eller storlek, sedan fältets riktning.<\/p>","source":"3–5","model":"field","steps":["<div class=\"mathrow\">F = qE<\/div>","<p>+q₀: kraft med fältet. −q₀: kraft mot fältet. +2q₀: dubbla kraften, med fältet.<\/p>","<p>Testladdningen ändrar inte det pålagda fältet i idealmodellen.<\/p>"],"teacher":"Följ originalets tre separata försök och låt par rita innan modellen avslöjar svar."},{"title":"Fältstyrka och kraft: tecknet visar riktningen","body":"<p>Välj höger som positiv riktning. Exempel: q = −3,0 nC i ett fält E = +2,0 kN/C.<\/p><div class=\"question\">Vilket tecken får kraften? Vad betyder det geometriskt?<\/div>","source":"6","steps":["<div class=\"mathrow\">F = qE = (−3,0 · 10<sup>−9<\/sup> C)(+2,0 · 10<sup>3<\/sup> N/C)<\/div>","<div class=\"mathrow\">F = −6,0 · 10<sup>−6<\/sup> N = −6,0 µN<\/div>","<p>Minustecknet visar kraft åt vänster. Din tur: +6,0 nC i samma fält ger +12 µN åt höger.<\/p>"],"teacher":"Använd konsekvent teckenriktning; undvik dubbel bokföring med belopp och tecken."},{"title":"Flera laddningar: addera fältens pilar","body":"<p>En punkt P ligger mellan +Q till vänster och −2Q till höger, lika långt från båda.<\/p><div class=\"question\">Rita E₁, E₂ och Eₜₒₜ i P. Byt −2Q mot +2Q: vad blir riktningen?<\/div><div class=\"mathrow\">E₁ = +kQ/r²; &nbsp; E₂ = +2kQ/r²<\/div><div class=\"mathrow\">Eₜₒₜ = E₁ + E₂<\/div>","source":"7","steps":["<p>I första fallet pekar båda fältbidragen åt höger.<\/p>","<p>Med +2Q till höger pekar dess fältbidrag i P åt vänster. Det är dubbelt så stort som bidraget från +Q; nettofältet pekar åt vänster.<\/p>"],"teacher":"Tecknen i skalärberäkningen kräver att x-riktningen först tydliggörs."},{"title":"Mellan plattor: ett nästan jämnt fält","body":"<p>Plattan till vänster är negativ, till höger positiv. Fältet pekar åt vänster, alltså E &lt; 0 om höger är positivt.<\/p><div class=\"question\">U = 100 V över d = 2,0 cm. Beräkna den riktade fältstyrkan. Vad händer om d fördubblas vid samma U?<\/div>","source":"8","steps":["<div class=\"mathrow\">d = 2,0 cm = 0,020 m<\/div>","<div class=\"mathrow\">E = −U/d = −100 V / 0,020 m = −5,0 kV/m<\/div>","<p>Dubbelt avstånd vid konstant U ger halva fältstyrkans storlek. Försumma kanteffekter.<\/p>"],"teacher":"Visa att U här är en positiv storlek för spänningsskillnaden och riktningen ligger i minustecknet."},{"title":"Ett starkt fält behöver inte ge ökande kraft","body":"<p>En elektron släpps från vila vid minusplattan i ett jämnt fält som pekar åt vänster.<\/p><div class=\"question\">Vilken riktning har accelerationen? Ändras kraften på vägen? Ökar hastigheten?<\/div><p>Ändra spänning, plattavstånd och tid i modellen. Partikelns läge och hastighet kommer från samma acceleration.<\/p>","source":"9–11","model":"electron","steps":["<p>Elektronen påverkas av en kraft åt höger, mot plusplattan.<\/p>","<p>I ett homogent fält är kraften och accelerationen konstanta innan elektronen når plattan.<\/p>","<p>Hastigheten ökar. Vid lika långa tidssteg blir förflyttningarna successivt större.<\/p>"],"teacher":"Förklara att modellen stoppar vid plattan; undvik att låta elektronen fortsätta genom metallen."},{"title":"Från elektriskt fält till acceleration","body":"<p>Höger positivt. E = −5,0 kV/m och q = −e. Elektronens massa mₑ ≈ 9,11 · 10⁻³¹ kg.<\/p><div class=\"question\">Vad händer med kraft och acceleration om fältstyrkan halveras?<\/div>","source":"12","steps":["<div class=\"mathrow\">F = qE = (−1,60 · 10<sup>−19<\/sup> C)(−5,0 · 10<sup>3<\/sup> N/C)<\/div>","<div class=\"mathrow\">F = +8,0 · 10<sup>−16<\/sup> N<\/div>","<div class=\"mathrow\">a = F/mₑ ≈ +8,8 · 10<sup>14<\/sup> m/s²<\/div>","<p>Om E halveras blir både F och a hälften så stora, eftersom q och m är konstanta.<\/p>"],"teacher":"Varning: mycket stor acceleration i mikroskopisk skala är rimlig för liten elektronmassa."},{"title":"Spänningen ger elektronen rörelseenergi","body":"<p>Elektronen startar från vila och rör sig i fältet mot den positiva plattan.<\/p><div class=\"question\">Om spänningen fyrdubblas, hur ändras elektronens slutenergi och slutfart?<\/div>","source":"13","steps":["<div class=\"mathrow\">W = Fd = eU = 1,60 · 10<sup>−19<\/sup> C · 100 V = 1,60 · 10<sup>−17<\/sup> J<\/div>","<div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mfrac><mrow><msub><mi>m<\/mi><mi>e<\/mi><\/msub><msup><mi>v<\/mi><mn>2<\/mn><\/msup><\/mrow><mn>2<\/mn><\/mfrac><mo>=<\/mo><mi>e<\/mi><mi>U<\/mi><\/math><\/div>","<div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>v<\/mi><mo>=<\/mo><msqrt><mfrac><mrow><mn>2<\/mn><mi>e<\/mi><mi>U<\/mi><\/mrow><msub><mi>m<\/mi><mi>e<\/mi><\/msub><\/mfrac><\/msqrt><\/math><\/div>","<div class=\"mathrow\">v ≈ 5,9 · 10<sup>6<\/sup> m/s<\/div>","<p>Fyra gånger spänningen ger fyra gånger rörelseenergin men bara dubbel slutfart.<\/p>"],"teacher":"Inom givna hastigheter fungerar icke-relativistisk modell bra."},{"title":"Faradays bur: varför skyddas insidan?","body":"<p>Ett slutet ledande skal får extra elektroner. Det finns inga laddningar i hålrummet.<\/p><div class=\"question\">Var hamnar överskottsladdningen? Vad händer med det elektriska fältet i hålrummet i elektrostatisk jämvikt?<\/div><p>Rita hur fria elektroner skulle röra sig om det fortfarande fanns fält i ledarmaterialet.<\/p>","source":"14","teacher":"Skilj ledarmaterial och hålrum. Avgränsa till elektrostatisk jämvikt och ett slutet skal."},{"title":"Laddningarna flyttar sig tills jämvikt nås","body":"<p>Fria elektroner omfördelas tills det elektriska fältet i ledarmaterialet är noll i elektrostatisk jämvikt.<\/p><div class=\"panel\"><b>Slutet ledande skal utan laddningar i hålrummet<\/b><p>Överskottsladdning ligger på utsidan. Fältet i hålrummet är noll. Ett yttre statiskt fält skärmas av genom omfördelning av ytladdningar.<\/p><\/div><p><b>Tillämpning:<\/b> starka fält kan ge överslag genom luft utan direkt kontakt.<\/p>","source":"15","teacher":"Poängtera att ett öppet skal, tidsvarierande fält och inre laddningar är andra fall."},{"title":"Tre snabba frågor före boken","body":"<div class=\"question\">1. Fältet pekar nedåt. Vilket håll verkar kraften på en elektron?<\/div><div class=\"question\">2. U = 60 V, d = 3,0 cm. Fält åt vänster. Beräkna E med tecken.<\/div><div class=\"question\">3. Varför skärmar ett slutet metallskal ett yttre statiskt fält?<\/div><p>Skriv svar enskilt och en kort motivering till varje.<\/p>","source":"16","teacher":"Diagnostisk egenkontroll före bokarbetet."},{"title":"Kontrollera och förbättra ditt svar","body":"<p>Jämför med dina egna svar. Rätta med en annan färg och skriv <b>varför<\/b>.<\/p>","source":"17","steps":["<p>1. Kraften är uppåt eftersom elektronens laddning är negativ.<\/p>","<p>2. E = −60 V / 0,030 m = −2,0 kV/m.<\/p>","<p>3. Fria laddningar omfördelas till elektrostatisk jämvikt; det slutna, tomma hålrummet får då inget elektrostatiskt fält.<\/p>"],"teacher":"Låt eleverna synliggöra omprövning, inte bara bocka rätt/fel."},{"title":"Nu använder du modellen själv","body":"<div class=\"bookbox\"><strong>Bokens uppgifter: 851–860<\/strong><p>s. 307–308.<\/p><p><b>Lässtöd:<\/b> avsnitt 8.5 s. 300–307.<\/p><p>Börja själv, jämför metod och riktningar med en kamrat. Läs s. 309–314 inför nästa gång, särskilt de gröna rutorna.<\/p><\/div><div class=\"question\">Exit: ett oförändrat fält verkar på −q₀. Byt till −2q₀. Vad händer med E och F?<\/div>","source":"18","time":"Bokarbete + exit","steps":["<p>E är oförändrat, medan kraften på testladdningen blir dubbelt så stor och pekar i samma riktning som tidigare.<\/p>"],"teacher":"Bevara uppgiftsintervall och läsanvisning från originalet. Ingen Socrative finns i denna originallektion."}]}</script><script src="../../gemensamt/models.js"></script><script src="../../gemensamt/app.js"></script></body></html>
