<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Elektriska kretsar · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"></head><body><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Elektriska kretsar</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Elektriska kretsar","subject":"Fysik nivå 1","chapter":"8.2 · Elektriska kretsar","source":"261104 8.2 Elektriska kretsar.pdf","goals":["Skilja ström från spänning och använda att laddning bevaras.","Beräkna ström, laddning, energi och elektronantal i en krets.","Förklara hur material, längd och tjocklek påverkar resistansen."],"pages":[{"title":"Förbrukas strömmen i resistorn?","body":"<p>Tänk dig en sluten krets med batteri och en resistor. Jämför punkterna A före resistorn och B efter den.<\/p><div class=\"question\">Är strömmen störst vid A, B eller lika stor? Vad överförs i resistorn?<\/div><p>Rita två strömpilar och skriv en motivering. Jämför sedan i par.<\/p><div class=\"panel\"><b>Efter lektionen ska du kunna<\/b><ol><li>Skilja mellan ström och spänning.<\/li><li>Använda samband för laddning och energi.<\/li><li>Beskriva och beräkna resistans i trådar.<\/li><\/ol><\/div>","source":"1","quiz":{"prompt":"I en enda sluten oförgrenad krets är strömmen…","options":["störst före resistorn","störst efter resistorn","lika stor överallt"],"correct":2,"why":"Laddning förbrukas inte i resistorn; elektrisk energi omvandlas till värme.","hint":""},"teacher":"Batteriet och ledningarna modelleras idealiskt. Startfrågan ska utmana uppfattningen att ström förbrukas.","side":"<figure class=\"graph static-graph\"><svg role=\"img\" aria-label=\"En idealiserad oförgrenad krets. Punkterna A och B ligger före respektive efter resistorn.\" viewBox=\"0 0 550 310\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M90 160 V70 H470 V256 H90 V160\" stroke=\"#214956\" stroke-width=\"4\" fill=\"none\"/><rect x=\"250\" y=\"57\" width=\"82\" height=\"27\" fill=\"#f4fafb\" stroke=\"#254a59\" stroke-width=\"3\"/><text x=\"291\" y=\"48\" fill=\"#214956\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">30 Ω<\/text><rect x=\"80\" y=\"154\" width=\"21\" height=\"66\" fill=\"#eff7f9\"/><line x1=\"69\" y1=\"165\" x2=\"110\" y2=\"165\" stroke=\"#bd6b40\" stroke-width=\"4\"/><line x1=\"82\" y1=\"194\" x2=\"98\" y2=\"194\" stroke=\"#bd6b40\" stroke-width=\"4\"/><text x=\"60\" y=\"149\" fill=\"#214956\" font-size=\"24\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><text x=\"60\" y=\"220\" fill=\"#214956\" font-size=\"24\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><text x=\"96\" y=\"293\" fill=\"#214956\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">6,0 V<\/text><text x=\"203\" y=\"51\" fill=\"#06768a\" font-size=\"19\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">A<\/text><text x=\"383\" y=\"51\" fill=\"#06768a\" font-size=\"19\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">B<\/text><\/svg><figcaption class=\"figcap\">En idealiserad oförgrenad krets. Punkterna A och B ligger före respektive efter resistorn.<\/figcaption><\/figure>"},{"title":"Laddning cirkulerar. Energi överförs.","body":"<p><b>Ström<\/b>: laddning som passerar per sekund. <b>Spänning<\/b>: överförd energi per laddning.<\/p><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>I<\/mi><mo>=<\/mo><mfrac><mi>Q<\/mi><mi>t<\/mi><\/mfrac><mspace width=\"1em\"/><mi>U<\/mi><mo>=<\/mo><mfrac><mi>E<\/mi><mi>Q<\/mi><\/mfrac><\/math><\/div><p>1 A = 1 C/s och 1 V = 1 J/C. Ström går <i>genom<\/i> en komponent, spänning finns <i>mellan<\/i> två punkter.<\/p><div class=\"question\">6,0 V över 30 Ω: beräkna strömmen. Vad händer om U halveras vid konstant R?<\/div>","source":"2","steps":["<div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>U<\/mi><mo>=<\/mo><mi>R<\/mi><mi>I<\/mi><mo>⇒<\/mo><mi>I<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mi>R<\/mi><\/mfrac><\/math><\/div>","<div class=\"mathrow\">I = 6,0 V / 30 Ω = 0,20 A<\/div>","<p>Vid halva spänningen blir strömmen 0,10 A i denna ohmska modell.<\/p>"],"teacher":"Ohms lag gäller vid konstant resistans, exempelvis ungefär konstant temperatur."},{"title":"Från ström till laddning, energi och elektroner","body":"<p>Samma krets: U = 6,0 V, I = 0,20 A. Vad passerar och överförs under 10 sekunder?<\/p><div class=\"question\">Förutsäg vad som händer med Q, E och antalet elektroner N när tiden fördubblas till 20 sekunder.<\/div>","source":"3","model":"current","steps":["<div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>Q<\/mi><mo>=<\/mo><mi>I<\/mi><mi>t<\/mi><mo>=<\/mo><mn>0,20<\/mn><mtext> A<\/mtext><mo>·<\/mo><mn>10<\/mn><mtext> s<\/mtext><mo>=<\/mo><mn>2,0<\/mn><mtext> C<\/mtext><\/math><\/div>","<div class=\"mathrow\">E = UQ = 6,0 V · 2,0 C = 12 J<\/div>","<div class=\"mathrow\">N = Q/e = 2,0/(1,602 · 10<sup>−19<\/sup>) ≈ 1,2 · 10<sup>19<\/sup> elektroner<\/div>"],"teacher":"Undvik att säga att samma elektron bär hela energiöverföringen. Ström och elektriskt fält etableras genom kretsen."},{"title":"Laddning försvinner inte vid en förgrening","body":"<p>0,50 A kommer in i en knutpunkt. 0,20 A lämnar via den övre grenen.<\/p><div class=\"question\">Bestäm strömmen i den nedre grenen. Rita även riktningen och förklara med laddningens bevarande.<\/div><p>Kirchhoffs första lag: summan av inkommande strömmar är summan av utgående.<\/p>","source":"4","steps":["<div class=\"mathrow\">0,50 A = 0,20 A + I<\/div>","<div class=\"mathrow\">I = 0,50 A − 0,20 A = 0,30 A<\/div>","<p>0,30 A går ut genom den nedre grenen. I stationärt tillstånd ansamlas ingen laddning i knutpunkten.<\/p>"],"teacher":"Använd en synlig förgreningsfigur som du ritar tillsammans med klassen; elevens pilar och ord är det viktiga."},{"title":"Vad gör en tråd till ett större motstånd?","body":"<p>Jämför A: ursprunglig tråd, B: dubbel längd och C: dubbel diameter. Samma material och temperatur.<\/p><div class=\"question\">Hur förändras resistansen i B och C? Motivera med geometrin innan du visar formeln.<\/div><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>R<\/mi><mo>=<\/mo><mi>ρ<\/mi><mfrac><mi>l<\/mi><mi>A<\/mi><\/mfrac><\/math><\/div><p>Här är ρ materialets resistivitet, l trådens längd och A tvärsnittsarea (inte mantelyta).<\/p><p class=\"note\">Originalets verkliga demo: Physics at School VI, försök 6.<\/p>","source":"5","model":"wire","steps":["<p>Dubbel längd → dubbel resistans (övriga storheter konstanta).<\/p>","<p>Dubbel diameter → fyra gånger tvärsnittsarean → en fjärdedel så stor resistans.<\/p>"],"teacher":"Genomför originaldemonstrationen och låt modellen användas efter elevernas förutsägelser."},{"title":"Exempel · En tråds resistans","body":"<p>Koppartråd: längd 10 m, diameter 0,50 mm. Beräkna resistansen vid den temperatur där ρ = 0,018 Ω·mm²/m.<\/p><div class=\"question\">Vad är tvärsnittsarean? Vilken enhet bör A ha för att passa ρ?<\/div>","source":"6","steps":["<div class=\"mathrow\">r = d/2 = 0,25 mm<\/div>","<div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>A<\/mi><mo>=<\/mo><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/math><\/div>","<div class=\"mathrow\">A = π(0,25 mm)² ≈ 0,196 mm²<\/div>","<div class=\"mathrow\">R = ρl/A = (0,018 Ω·mm²/m · 10 m)/(0,196 mm²) ≈ 0,92 Ω<\/div>","<p><b>Kontroll:<\/b> Enheter mm² tar ut varandra, kvar blir Ω.<\/p>"],"teacher":"Viktigt: r är radie och R är resistans, skriv olika tydligt."},{"title":"Nu övar du själv","body":"<p>Visa samband, mellanled, enheter och ett tydligt svar.<\/p><div class=\"bookbox\"><strong>Bokens uppgifter: 812–828<\/strong><p>s. 279–280. Börja med 814 → 819 → 822 → 824.<\/p><p><b>Lässtöd:<\/b> s. 270–278, särskilt gröna rutorna.<\/p><p>Om du behöver stöd: använd exemplen och den särskilda stödsidan. Fortsätt 817–818; fördjupning 823, 826–828. Alla uppgifter behöver inte hinnas under lektionen.<\/p><\/div>","source":"7","time":"Skyddad boktid","teacher":"Bokarbete är en planerad undervisningsdel, inte en reserv om webbsidorna blir klara."},{"title":"Visa vad du kan – utan bok","body":"<div class=\"question\">1. Vad betyder 1 A respektive 1 V? Varför är strömmen densamma före och efter en resistor?<\/div><div class=\"question\">2. I = 0,10 A, U = 4,0 V, t = 20 s. Beräkna Q och E.<\/div><div class=\"question\">3. Samma material och längd: radien fördubblas. Hur förändras R?<\/div>","source":"8","steps":["<p>1 A = 1 C/s och 1 V = 1 J/C. Laddningen bevaras.<\/p>","<p>Q = It = 2,0 C och E = UQ = 8,0 J.<\/p>","<p>Resistansen blir en fjärdedel eftersom arean fyrdubblas.<\/p>"],"teacher":"Återvänd till lektionsmålen och låt varje elev markera ett område att träna."},{"title":"Stöd · Inför labben","body":"<div class=\"panel\"><h2>Batteriladdning och tid<\/h2><p>1 Ah = 3600 C. Vid 0,30 A under 2,0 h fås Q = 0,60 Ah = 2160 C.<\/p><\/div><div class=\"panel\"><h2>Elektroner och strömriktning<\/h2><p>I metaller rör sig elektronerna motsatt konventionell ström. I yttre kretsen räknas I från + till −.<\/p><\/div><div class=\"panel\"><h2>Mätning<\/h2><p>Amperemeter i serie, voltmeter parallellt mellan komponentens två anslutningar.<\/p><\/div><div class=\"panel\"><h2>Material och temperatur<\/h2><p>Ledare, isolator, halvledare, supraledare. En glödlamps resistans ökar när den blir varm.<\/p><\/div><p class=\"note\">PhET-kopplingslabben görs separat i <a href=\"https://phet.colorado.edu/sims/html/circuit-construction-kit-dc-virtual-lab/latest/circuit-construction-kit-dc-virtual-lab_en.html\" target=\"_blank\" rel=\"noopener\">PhET Circuit Construction Kit: DC – Virtual Lab<\/a>.<\/p>","source":"9","teacher":"Detta är referensstöd för enskilt arbete och laboration, ingen extra obligatorisk genomgång."}]}</script><script src="../../gemensamt/models.js"></script><script src="../../gemensamt/app.js"></script></body></html>
