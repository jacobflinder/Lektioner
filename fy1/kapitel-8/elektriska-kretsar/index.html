<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Elektriska kretsar · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"><link rel="stylesheet" href="kretsar.css?v=rev2"><link rel="stylesheet" href="../../gemensamt/sjalvtest.css?v=papper1"><link rel="stylesheet" href="../../gemensamt/matematik-typografi.css?v=1"></head><body data-fy1-lesson="elektriska-kretsar"><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Elektriska kretsar</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Elektriska kretsar","subject":"Fysik nivå 1","chapter":"8.2 · Elektriska kretsar","source":"261104 8.2 Elektriska kretsar.pdf","goals":["Skilja ström från spänning och använda att laddning bevaras.","Beräkna ström, laddning, energi och elektronantal i en krets.","Förklara hur material, längd och tjocklek påverkar resistansen."],"pages":[{"title":"Förbrukas strömmen i resistorn?","body":"\u003cdiv class=\"question\">Förbrukas strömmen när laddningarna passerar resistorn?\u003c/div>\u003cp>En sluten krets med ett batteri och en resistor. Jämför punkterna \u003cb>A\u003c/b> och \u003cb>B\u003c/b>.\u003c/p>\u003cp>\u003cb>Förutsäg:\u003c/b> Är strömmen större i A, större i B eller lika stor? Vad överförs i resistorn?\u003c/p>\u003cp>Rita strömpilar i häftet och motivera för en kamrat.\u003c/p>\u003cdiv class=\"goalcard\">\u003cb>Efter lektionen ska du kunna\u003c/b>\u003col>\u003cli>Skilja ström från spänning och använda att laddning bevaras.\u003c/li>\u003cli>Beräkna I, Q och E samt elektronantal.\u003c/li>\u003cli>Förklara och beräkna trådens resistans.\u003c/li>\u003c/ol>\u003c/div>","source":"1","quiz":{"prompt":"I en enda sluten oförgrenad krets är strömmen…","options":["störst före resistorn","störst efter resistorn","lika stor överallt"],"correct":2,"why":"Samma laddning per sekund passerar A och B i stationärt tillstånd. Elektrisk energi överförs i resistorn, men laddning förbrukas inte.","hint":""},"teacher":"Var tyst efter frågan. Låt alla välja själva och förklara i par före klassens återkoppling. VIKTIGT: samma stationära ström genom en oförgrenad krets; elektrisk energi omvandlas men laddning förbrukas inte. Modell: ideala ledningar och ideal spänningskälla.","side":"\u003cfigure class=\"phys-figure\">\u003csvg viewBox=\"0 0 560 335\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"En sluten batterikrets med en resistor och punkterna A och B på var sin sida om resistorn.\">\u003ctitle>En sluten batterikrets med en resistor och punkterna A och B på var sin sida om resistorn.\u003c/title>\u003cdesc>Punkterna A och B ligger före respektive efter resistorn längs den konventionella strömriktningen. Rita din förutsägelse innan facit visas.\u003c/desc>\u003cpath d=\"M90 150V75H470V260H90V150\" stroke=\"#315464\" stroke-width=\"3.5\" fill=\"none\"/>\u003crect x=\"72\" y=\"141\" width=\"36\" height=\"78\" fill=\"#fff\"/>\u003cline x1=\"69\" y1=\"168\" x2=\"111\" y2=\"168\" stroke=\"#bf7450\" stroke-width=\"4\"/>\u003cline x1=\"79\" y1=\"189\" x2=\"101\" y2=\"189\" stroke=\"#bf7450\" stroke-width=\"4\"/>\u003crect x=\"237.0\" y=\"60\" width=\"94\" height=\"30\" fill=\"#fff\" stroke=\"#315464\" stroke-width=\"3\" rx=\"2\"/>\u003ctext x=\"284\" y=\"46\" text-anchor=\"middle\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#254d5d\">resistor\u003c/text>\u003ctext x=\"181\" y=\"57\" text-anchor=\"middle\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#0b7896\">A\u003c/text>\u003ctext x=\"388\" y=\"57\" text-anchor=\"middle\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#0b7896\">B\u003c/text>\u003ctext x=\"49\" y=\"132\" text-anchor=\"middle\" font-size=\"23\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#b76b47\">+\u003c/text>\u003ctext x=\"49\" y=\"222\" text-anchor=\"middle\" font-size=\"23\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#b76b47\">−\u003c/text>\u003ctext x=\"116\" y=\"285\" text-anchor=\"middle\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#546e79\">batteri\u003c/text>\u003c/svg>\u003cfigcaption>Punkterna A och B ligger före respektive efter resistorn längs den konventionella strömriktningen. Rita din förutsägelse innan facit visas.\u003c/figcaption>\u003c/figure>"},{"title":"Laddning cirkulerar. Energi överförs.","body":"\u003cdiv class=\"duo-concepts\">\u003cdiv>\u003cspan>STRÖM\u003c/span>\u003cdiv class=\"equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>Q\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003c/math>\u003c/div>\u003cp>\u003cb>1 A = 1 C/s.\u003c/b> Hur mycket laddning passerar per sekund?\u003c/p>\u003c/div>\u003cdiv>\u003cspan>SPÄNNING\u003c/span>\u003cdiv class=\"equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>E\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/mfrac>\u003c/math>\u003c/div>\u003cp>\u003cb>1 V = 1 J/C.\u003c/b> Hur mycket energi överförs per laddning?\u003c/p>\u003c/div>\u003c/div>\u003cp>\u003cb>Ström\u003c/b> går \u003cem>genom\u003c/em> en komponent. \u003cb>Spänning\u003c/b> anges \u003cem>mellan\u003c/em> två punkter.\u003c/p>\u003cdiv class=\"question\">6,0 V över 30 Ω: beräkna I. Vad händer med I om U halveras och R är konstant?\u003c/div>","source":"2","steps":["\u003cdiv class=\"worked\">\u003cb>Välj samband, lös ut I.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>R\u003c/mi>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>U\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>R\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>Sätt in med enheter.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>30\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0,20\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>Halva U, samma R.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>3,0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>30\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0,10\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003cp>Här förutsätter Ohms lag konstant resistans, exempelvis oförändrad temperatur.\u003c/p>\u003c/div>"],"teacher":"Ohms lag gäller vid konstant resistans, exempelvis ungefär konstant temperatur.","side":"\u003cfigure class=\"phys-figure\">\u003csvg viewBox=\"0 0 560 335\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ohms lags exempel: 6,0 volt över 30 ohm, lika stor ström på båda sidor.\">\u003ctitle>Ohms lags exempel: 6,0 volt över 30 ohm, lika stor ström på båda sidor.\u003c/title>\u003cdesc>Båda turkosa strömpilarna har samma längd. Batteriet ger 6,0 V över resistorn på 30 Ω.\u003c/desc>\u003cpath d=\"M90 145V70H460V248H90V145\" stroke=\"#315464\" stroke-width=\"3.5\" fill=\"none\"/>\u003crect x=\"72\" y=\"137\" width=\"36\" height=\"78\" fill=\"#fff\"/>\u003cline x1=\"69\" y1=\"164\" x2=\"111\" y2=\"164\" stroke=\"#bf7450\" stroke-width=\"4\"/>\u003cline x1=\"79\" y1=\"185\" x2=\"101\" y2=\"185\" stroke=\"#bf7450\" stroke-width=\"4\"/>\u003crect x=\"225.0\" y=\"55\" width=\"104\" height=\"30\" fill=\"#fff\" stroke=\"#315464\" stroke-width=\"3\" rx=\"2\"/>\u003ctext x=\"277\" y=\"48\" text-anchor=\"middle\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#254d5d\">30 Ω\u003c/text>\u003ctext x=\"90\" y=\"293\" text-anchor=\"middle\" font-size=\"19\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#b36a47\">6,0 V\u003c/text>\u003ctext x=\"173\" y=\"53\" text-anchor=\"middle\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#117e97\">I\u003c/text>\u003cpath d=\"M148 70 L215 70 M204.0 64.0 L215 70 L204.0 76.0\" stroke=\"#0a8297\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\" fill=\"none\"/>\u003cpath d=\"M358 70 L423 70 M412.0 64.0 L423 70 L412.0 76.0\" stroke=\"#0a8297\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\" fill=\"none\"/>\u003ctext x=\"285\" y=\"331\" text-anchor=\"middle\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#456e7d\">Samma ström före och efter resistorn\u003c/text>\u003c/svg>\u003cfigcaption>Båda turkosa strömpilarna har samma längd. Batteriet ger 6,0 V över resistorn på 30 Ω.\u003c/figcaption>\u003c/figure>"},{"title":"Från ström till laddning, energi och elektroner","body":"\u003cp>Samma ideala krets: \u003cb>U = 6,0 V\u003c/b>, \u003cb>I = 0,20 A\u003c/b>. Under \u003cb>10 s\u003c/b> passerar laddning genom ett valt tvärsnitt, och energi omvandlas i resistorn.\u003c/p>\u003cdiv class=\"question\">Förutsäg vad som händer med \u003cb>Q, E och N\u003c/b> när tiden fördubblas till 20 s. Fördubblas också strömmen?\u003c/div>\u003cp>Välj ett tidsintervall i modellen, gör en förutsägelse och visa sedan resultatet.\u003c/p>","source":"3","model":"current","steps":["\u003cdiv class=\"worked\">\u003cb>Laddning som passerar under tiden.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>I\u003c/mi>\u003cmi>t\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0,20\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>10\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>s\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>2,0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>C\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>Energi som omvandlas i resistorn.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>U\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>2,0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>C\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>J\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>Elektronantal: laddning dividerat med elementarladdning.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>N\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>Q\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>e\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>e\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>1,602\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>19\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>C\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>N\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2,0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>C\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>1,602\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmrow>\u003cmo>−\u003c/mo>\u003cmn>19\u003c/mn>\u003c/mrow>\u003c/msup>\u003cmspace width=\"0.17em\"/>\u003cmtext>C\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>N\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>1,25\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>19\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>N\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>1,2\u003c/mn>\u003cmo>·\u003c/mo>\u003cmsup>\u003cmn>10\u003c/mn>\u003cmn>19\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>Dubbel tid utan ändrad U eller R.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>Q\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>E\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>E\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>N\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>N\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003c/div>\u003cp>Strömmen är stationär; den förbrukas inte. Q, E och N är ackumulerade mängder.\u003c/p>\u003c/div>"],"teacher":"Låt eleverna förutsäga och räkna för 10 s innan modellen avslöjar tal. Dra därefter tiden till 20 s. Kontrollera särskilt att de inte påstår att strömmen ökar med tiden. N=Q/e beräknas med e positivt som laddningsbelopp.","quiz":{"prompt":"Med oförändrade U och R: tiden fördubblas. Vad händer med antalet elektroner som passerat?","options":["Det är oförändrat","Det blir dubbelt","Det blir fyra gånger så stort"],"correct":1,"why":"N=Q/e=It/e. När tiden fördubblas vid samma ström fördubblas Q och därmed N.","hint":"Skilj ström (per sekund) från totalt antal under tidsintervallet."}},{"title":"Laddning försvinner inte vid en förgrening","body":"\u003cdiv class=\"question\">0,50 A kommer in i en knutpunkt. 0,20 A går ut genom den övre grenen. Hur stor är den nedre strömmen – och åt vilket håll går den?\u003c/div>\u003cp>Rita riktningen själv. Förklara i par varför \u003cb>laddning inte ansamlas\u003c/b> i knutpunkten när strömmarna är stationära.\u003c/p>\u003cp>Det här är \u003cb>Kirchhoffs första lag\u003c/b>: summan av inkommande strömmar är summan av utgående.\u003c/p>","source":"4","steps":["\u003cdiv class=\"worked\">\u003cb>Laddningsbalans i stationär knutpunkt.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmn>0,50\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003cmo>=\u003c/mo>\u003cmn>0,20\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003cmo>+\u003c/mo>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>Okänd utgående grenström.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0,50\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003cmo>−\u003c/mo>\u003cmn>0,20\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0,30\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cp>\u003cb>Riktning:\u003c/b> 0,30 A lämnar knutpunkten genom den nedre grenen. Ingen nettoladdning ansamlas i stationärt tillstånd.\u003c/p>"],"teacher":"Använd en synlig förgreningsfigur som du ritar tillsammans med klassen; elevens pilar och ord är det viktiga.","side":"\u003cfigure class=\"phys-figure\">\u003csvg viewBox=\"0 0 560 335\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Förgrening där 0,50 ampere kommer in, 0,20 ampere går ut upptill och en okänd ström går i undre grenen.\">\u003ctitle>Förgrening där 0,50 ampere kommer in, 0,20 ampere går ut upptill och en okänd ström går i undre grenen.\u003c/title>\u003cdesc>Förutsäg storlek och riktning på den nedre grenströmmen innan du visar lösningen.\u003c/desc>\u003cpath d=\"M74 171H258 M258 171L423 85 M258 171L423 259\" stroke=\"#315464\" stroke-width=\"4\" fill=\"none\"/>\u003ccircle cx=\"258\" cy=\"171\" r=\"9\" fill=\"#315464\"/>\u003cpath d=\"M103 171 L205 171 M194.0 165.0 L205 171 L194.0 177.0\" stroke=\"#0a8297\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\" fill=\"none\"/>\u003cpath d=\"M316 137 L387 100 M374.5 99.8 L387 100 L380.0 110.4\" stroke=\"#0a8297\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\" fill=\"none\"/>\u003ctext x=\"151\" y=\"137\" text-anchor=\"middle\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#0a8297\">0,50 A\u003c/text>\u003ctext x=\"382\" y=\"60\" text-anchor=\"middle\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#0a8297\">0,20 A\u003c/text>\u003ctext x=\"389\" y=\"281\" text-anchor=\"middle\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#b06a43\">I = ?\u003c/text>\u003ctext x=\"285\" y=\"317\" text-anchor=\"middle\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#466e79\">Vilket håll går strömmen?\u003c/text>\u003c/svg>\u003cfigcaption>Förutsäg storlek och riktning på den nedre grenströmmen innan du visar lösningen.\u003c/figcaption>\u003c/figure>","quiz":{"prompt":"Hur stor ström går ut genom den nedre grenen?","options":["0,30 A ut","0,70 A ut","0,30 A in"],"correct":0,"why":"Kirchhoffs första lag: 0,50 A in = 0,20 A ut + 0,30 A ut.","hint":"Summan av utgående strömmar är lika stor som inkommande."}},{"title":"Vad gör en tråd till ett större motstånd?","body":"\u003cp>Tre koppartrådar vid \u003cb>samma temperatur\u003c/b>. Börja med A och förutsäg vad som händer med resistansen:\u003c/p>\u003cdiv class=\"compare-cases\">\u003cdiv>\u003cb>A · Ursprung\u003c/b>\u003cspan>l = 10 m, d = 0,50 mm\u003c/span>\u003c/div>\u003cdiv>\u003cb>B · Längre\u003c/b>\u003cspan>l = 20 m, d = 0,50 mm\u003c/span>\u003c/div>\u003cdiv>\u003cb>C · Tjockare\u003c/b>\u003cspan>l = 10 m, d = 1,00 mm\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"question\">Hur förändras R för B och C jämfört med A? Gör en förutsägelse före demonstrationen och modellen.\u003c/div>\u003cp>\u003cb>Verklig demonstration:\u003c/b> Physics at School VI, försök 6. Förutsäg → observera → förklara.\u003c/p>","source":"5","model":"wire","steps":["\u003cdiv class=\"worked\">\u003cb>Trådens cirkulära tvärsnittsarea, inte mantelytan.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>R\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmi>l\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>π\u003c/mi>\u003cmsup>\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>Dubbel längd vid samma tvärsnitt.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmn>2\u003c/mn>\u003cmi>l\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>2\u003c/mn>\u003cmi>R\u003c/mi>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>Dubbel diameter ger fyrdubbel tvärsnittsarea.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>A\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>π\u003c/mi>\u003cmsup>\u003cmrow>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>d\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>A\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>4\u003c/mn>\u003cmi>A\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>R\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>4\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003c/div>\u003c/div>"],"teacher":"Bevara verkliga demonstrationen Physics at School VI 6. Börja med två separata förutsägelser. Använd vid behov själva modellen först efter elevernas observation. Förklara skillnaden mellan radie, diameter, tvärsnittsarea och mantelyta. Undvik att ge intryck att trådens verkliga längd och diameter är i samma skala i bilden.","quiz":{"prompt":"Samma material, temperatur och längd: diametern fördubblas. Hur ändras R?","options":["Halveras","Blir en fjärdedel","Fördubblas"],"correct":1,"why":"Tvärsnittsarean är proportionell mot diametern i kvadrat. Dubbla diametern ger fyra gånger arean och R/4.","hint":"Tänk på att A=π(d/2)²."}},{"title":"Exempel · En tråds resistans","body":"\u003cp>\u003cb>Uppgift:\u003c/b> En koppartråd är 10 m lång och har diametern 0,50 mm. Beräkna resistansen vid en temperatur där\u003c/p>\u003cdiv class=\"mathrow\">ρ = 0,018 Ω·mm²/m.\u003c/div>\u003cdiv class=\"question\">Vad behöver du räkna ut innan du kan använda R = ρl/A? Vilka enheter ska du välja?\u003c/div>\u003cp>Föreslå första steget själv innan vi visar lösningen.\u003c/p>","source":"6","steps":["\u003cdiv class=\"worked\">\u003cb>1 · Radien är halva diametern.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>r\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>d\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>r\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>0,50\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>mm\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>2\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>r\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0,25\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>mm\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>2 · Tvärsnittet är cirkulärt.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>π\u003c/mi>\u003cmsup>\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>3 · Sätt in radien.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>π\u003c/mi>\u003cmsup>\u003cmrow>\u003cmo>(\u003c/mo>\u003cmn>0,25\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>mm\u003c/mtext>\u003cmo>)\u003c/mo>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>A\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>0,19635\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>mm²\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>A\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>0,196\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>mm²\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>4 · Resistans, enhet och numerisk kvot i egna led.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>R\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmi>l\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi>A\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>ρ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0,018\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω·mm²/m\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>R\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>0,018\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω·mm²/m\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>10\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>m\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>0,19635\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>mm²\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>R\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>0,180\u003c/mn>\u003c/mrow>\u003cmrow>\u003cmn>0,19635\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>R\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>0,917\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>R\u003c/mi>\u003cmo>≈\u003c/mo>\u003cmn>0,92\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>5 · Enhetskontroll och rimlighet.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmrow>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω·mm²/m\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmspace width=\"0.17em\"/>\u003cmtext>m\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmspace width=\"0.17em\"/>\u003cmtext>mm²\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmspace width=\"0.17em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003cp>Den långa men tunna koppartråden ger märkbar resistans, trots att materialet leder väl.\u003c/p>\u003c/div>"],"teacher":"Viktigt: r är radie och R är resistans, skriv olika tydligt.","side":"\u003cfigure class=\"phys-figure\">\u003csvg viewBox=\"0 0 560 335\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"En tio meter lång koppartråd med cirkulärt tvärsnitt och diameter 0,50 millimeter.\">\u003ctitle>En tio meter lång koppartråd med cirkulärt tvärsnitt och diameter 0,50 millimeter.\u003c/title>\u003cdesc>Längd och tvärsnitt ritas i varsin skala. Tvärsnittsarean är den cirkulära ändytan.\u003c/desc>\u003ctext x=\"278\" y=\"50\" font-family=\"system-ui\" font-size=\"19\" fill=\"#315c6a\" text-anchor=\"middle\">10 m koppartråd\u003c/text>\u003crect x=\"68\" y=\"78\" width=\"392\" height=\"34\" rx=\"2\" fill=\"#c88857\"/>\u003cline x1=\"69\" y1=\"130\" x2=\"459\" y2=\"130\" stroke=\"#557d88\" stroke-width=\"2\"/>\u003cpath d=\"M69 121V139 M459 121V139\" stroke=\"#557d88\" stroke-width=\"2\"/>\u003ctext x=\"264\" y=\"156\" text-anchor=\"middle\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#254d5d\">l = 10 m\u003c/text>\u003ccircle cx=\"275\" cy=\"245\" r=\"43\" fill=\"#f6ede3\" stroke=\"#b87743\" stroke-width=\"3\"/>\u003cpath d=\"M232 245H318\" stroke=\"#315464\" stroke-width=\"2.5\"/>\u003cpath d=\"M232 237V253 M318 237V253\" stroke=\"#315464\" stroke-width=\"2\"/>\u003ctext x=\"275\" y=\"316\" text-anchor=\"middle\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#254d5d\">d = 0,50 mm\u003c/text>\u003c/svg>\u003cfigcaption>Längd och tvärsnitt ritas i varsin skala. Tvärsnittsarean är den cirkulära ändytan.\u003c/figcaption>\u003c/figure>"},{"title":"Nu övar du själv","body":"\u003cdiv class=\"book-priority\">\u003cdiv class=\"book-primary\">\u003ch2>Boken · uppgifter 812–828, s. 279–280\u003c/h2>\u003cp>\u003cb>Börja med 814 → 819 → 822 → 824.\u003c/b>\u003c/p>\u003cp>Ohms lag → förgrening → trådresistans → elektronantal.\u003c/p>\u003c/div>\u003cdiv class=\"book-others\">\u003cp>\u003cb>När du är klar:\u003c/b> 817–818 knyter ihop laddning, energi och batteritid.\u003c/p>\u003cp>\u003cb>Fördjupning:\u003c/b> 823 och 826–828 kombinerar flera steg.\u003c/p>\u003c/div>\u003c/div>\u003cp>\u003cb>Arbeta själv först.\u003c/b> Jämför sedan ett resonemang med en kamrat. Skriv samband, mellanled, enheter och ett rimligt svar.\u003c/p>\u003cp>\u003cb>Stöd:\u003c/b> använd exempelbilderna 2–6 eller stödsidan 9. Alla uppgifter ska inte hinnas under lektionen.\u003c/p>\u003cp>\u003cb>Inför labben:\u003c/b> läs s. 270–278, särskilt de \u003cb>gröna rutorna\u003c/b> så noggrant som möjligt.\u003c/p>","source":"7","time":"Eget bokarbete • planera ca 25 min","teacher":"Detta är en verklig arbetsfas på ca 25 minuter i en 70-minuterslektion. Behåll de prioriterade uppgifterna. Förkorta i stället antalet gemensamma följdfrågor om klassen behöver mer tid. Ingen separat räknestuga finns."},{"title":"Visa vad du kan – utan bok","body":"\u003cp>Arbeta \u003cb>enskilt utan bok\u003c/b> och motivera dina svar. Jämför sedan med målen från första bilden.\u003c/p>\u003cdiv class=\"exit-items\">\u003cdiv>\u003cb>1 · Begrepp\u003c/b>\u003cp>Vad betyder 1 A respektive 1 V? Varför är strömmen lika stor före och efter en resistor?\u003c/p>\u003c/div>\u003cdiv>\u003cb>2 · Beräkning\u003c/b>\u003cp>I = 0,10 A, U = 4,0 V och t = 20 s. Beräkna Q och E.\u003c/p>\u003c/div>\u003cdiv>\u003cb>3 · Resonemang\u003c/b>\u003cp>Samma material och längd: radien fördubblas. Hur förändras R? Förklara med tvärsnittsarean.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"selfcheck\">Markera ett mål du kan förklara för en annan elev och ett du behöver öva mer på.\u003c/p>","source":"8","steps":["\u003cp>\u003cb>1 · Begrepp:\u003c/b> 1 A = 1 C/s; 1 V = 1 J/C. I en oförgrenad krets förbrukas ingen laddning, därför är den stationära strömmen lika stor vid varje tvärsnitt.\u003c/p>","\u003cdiv class=\"worked\">\u003cb>2 · Laddning och energi.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>I\u003c/mi>\u003cmi>t\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>0,10\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>A\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>20\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>s\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>2,0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>C\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>U\u003c/mi>\u003cmi>Q\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>4,0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>V\u003c/mtext>\u003cmo>·\u003c/mo>\u003cmn>2,0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>C\u003c/mtext>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmn>8,0\u003c/mn>\u003cmspace width=\"0.17em\"/>\u003cmtext>J\u003c/mtext>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>3 · Dubbla radien ger fyrdubbel area.\u003c/b>\u003cdiv class=\"circuit-math-stack\">\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>A\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>π\u003c/mi>\u003cmsup>\u003cmrow>\u003cmi>r\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>A\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>π\u003c/mi>\u003cmsup>\u003cmrow>\u003cmn>2\u003c/mn>\u003cmi>r\u003c/mi>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>A\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmn>4\u003c/mn>\u003cmi>A\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"circuit-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ny\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>R\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmn>4\u003c/mn>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003c/div>\u003c/div>"],"teacher":"Återvänd till lektionsmålen och låt varje elev markera ett område att träna."},{"title":"Stöd · Inför labben","body":"\u003cp class=\"note\">\u003cb>Referenssida:\u003c/b> använd efter behov vid eget arbete och inför kopplingslabben. Ingen extra gemensam genomgång.\u003c/p>\u003cdiv class=\"ref-grid\">\u003csection>\u003ch2>Batteriladdning och tid\u003c/h2>\u003cp>1 Ah = 3600 C; Q = It.\u003c/p>\u003cp>0,30 A under 2,0 h ger Q = 0,60 Ah = \u003cb>2160 C\u003c/b>.\u003c/p>\u003c/section>\u003csection>\u003ch2>Elektroner och strömriktning\u003c/h2>\u003cp>I metall går elektronerna motsatt konventionell ström. I den yttre kretsen räknas ström från + till −.\u003c/p>\u003cp>N = Q/e använder laddningsbeloppet.\u003c/p>\u003c/section>\u003csection>\u003ch2>Material och temperatur\u003c/h2>\u003cp>Ledare, isolator, halvledare och supraledare har olika ledningsförmåga. En glödlampa får högre R när glödtråden blir varm.\u003c/p>\u003c/section>\u003c/div>\u003cp>\u003cb>PhET-labb, separat aktivitet:\u003c/b> \u003ca href=\"https://phet.colorado.edu/sims/html/circuit-construction-kit-dc-virtual-lab/latest/circuit-construction-kit-dc-virtual-lab_en.html\" target=\"_blank\" rel=\"noopener noreferrer\">Öppna Circuit Construction Kit: DC – Virtual Lab\u003c/a>. Följ den befintliga laborationsinstruktionen. Bygg och mät i PhET.\u003c/p>","source":"9","teacher":"Referenssida efter avslutningen. Ge eleverna originalets PhET-PDF separat; ingen dubblering av laborationen. Mätning: ideal voltmeter är parallell; amperemeter i serie. Undvik att förväxla elektronrörelsen med konventionell ström.","side":"\u003cfigure class=\"phys-figure\">\u003csvg viewBox=\"0 0 560 335\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Kretsschema med amperemeter kopplad i serie och voltmeter parallellt över en resistor.\">\u003ctitle>Kretsschema med amperemeter kopplad i serie och voltmeter parallellt över en resistor.\u003c/title>\u003cdesc>Mätaren A sitter i strömvägen. Mätaren V är kopplad mellan resistorns två ändar.\u003c/desc>\u003cpath d=\"M90 165V92H458V285H90V165\" fill=\"none\" stroke=\"#315464\" stroke-width=\"3.3\"/>\u003crect x=\"72\" y=\"157\" width=\"36\" height=\"78\" fill=\"#fff\"/>\u003cline x1=\"69\" y1=\"184\" x2=\"111\" y2=\"184\" stroke=\"#bf7450\" stroke-width=\"4\"/>\u003cline x1=\"79\" y1=\"205\" x2=\"101\" y2=\"205\" stroke=\"#bf7450\" stroke-width=\"4\"/>\u003crect x=\"271.0\" y=\"77\" width=\"92\" height=\"30\" fill=\"#fff\" stroke=\"#315464\" stroke-width=\"3\" rx=\"2\"/>\u003ccircle cx=\"212\" cy=\"92\" r=\"25\" fill=\"white\" stroke=\"#2c8795\" stroke-width=\"3\"/>\u003cpath d=\"M270 92V170H364V92\" stroke=\"#2c8795\" stroke-width=\"2.8\" fill=\"none\"/>\u003ccircle cx=\"317\" cy=\"170\" r=\"24\" fill=\"white\" stroke=\"#2c8795\" stroke-width=\"3\"/>\u003ctext x=\"212\" y=\"100\" text-anchor=\"middle\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#187c92\">A\u003c/text>\u003ctext x=\"317\" y=\"178\" text-anchor=\"middle\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#187c92\">V\u003c/text>\u003ctext x=\"317\" y=\"58\" text-anchor=\"middle\" font-size=\"21\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#254d5d\">R\u003c/text>\u003ctext x=\"283\" y=\"326\" text-anchor=\"middle\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#254d5d\">A i serie • V parallellt\u003c/text>\u003c/svg>\u003cfigcaption>Mätaren A sitter i strömvägen. Mätaren V är kopplad mellan resistorns två ändar.\u003c/figcaption>\u003c/figure>"}]}</script><script src="../../gemensamt/models.js"></script><script src="kretsar-models.js?v=rev2"></script><script src="../../gemensamt/app.js"></script><script src="../../gemensamt/sjalvtest.js?v=papper1" defer></script><script src="../../gemensamt/matematik-typografi.js?v=1" defer></script></body></html>
