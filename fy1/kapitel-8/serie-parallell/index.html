Fysik nivå 1","chapter":"8.3 · Serie- och parallellkoppling","source":"261116 8.3 Seriekoppling och parallellkoppling.pdf","goals":["Känna igen serie- och parallellkoppling samt placera mätinstrument korrekt.","Förklara ström och spänning i respektive koppling.","Beräkna ersättningsresistans och strömmar i kretsar med två resistorer."],"pages":[{"title":"En extra resistor – större eller mindre ström?","body":"\u003cdiv class=\"question\">Vi har 12 V över en resistor på 100 Ω. En resistor på 200 Ω tillkommer. Hur ändras strömmen från batteriet?\u003c/div>\u003cdiv class=\"predict-cards\">\u003cdiv>\u003cb>A · Serie\u003c/b>\u003cspan>Ökar, minskar eller oförändrad?\u003c/span>\u003c/div>\u003cdiv>\u003cb>B · Parallellt\u003c/b>\u003cspan>Ökar, minskar eller oförändrad?\u003c/span>\u003c/div>\u003c/div>\u003cp>\u003cstrong>Gör först en förutsägelse.\u003c/strong> Rita de båda kopplingarna och förklara för en kamrat varför du tror att strömmen ändras.\u003c/p>\u003cdiv class=\"goalcard\">\u003cb>Efter lektionen ska du kunna\u003c/b>\u003col>\u003cli>Känna igen serie- och parallellkoppling och koppla A/V rätt.\u003c/li>\u003cli>Förklara strömmar och spänningar med bevarande av laddning.\u003c/li>\u003cli>Beräkna ersättningsresistans och strömmar.\u003c/li>\u003c/ol>\u003c/div>","source":"1","quiz":{"prompt":"Jämfört med en ensam resistor på 100 Ω blir batteriets ström ...","options":["Mindre i serie, större i parallellt","Större i serie, mindre i parallellt","Oförändrad i båda fallen"],"correct":0,"why":"Seriekoppling ger större total resistans och mindre ström. En extra parallell strömväg ger mindre ersättningsresistans och större totalström."},"teacher":"Start 6 min: låt eleverna förutsäga båda kopplingarna, gärna enskilt → par. Den här nya webbfrågan är inte originalets Socrative. Förhandsavslöja inte svaret genom modellen.","side":"\u003cfigure class=\"circuit-figure\">\u003csvg role=\"img\" aria-label=\"Startkrets: idealt batteri 12 V och en resistor 100 Ω\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 335\">\u003ctitle>Startkrets: idealt batteri 12 V och en resistor 100 Ω\u003c/title>\u003cdesc>Rita först hur en extra resistor kan kopplas i serie respektive parallellt.\u003c/desc>\u003cpath d=\"M88 156V77H497V267H88V156\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003crect x=\"70\" y=\"140\" width=\"36\" height=\"90\" fill=\"white\"/>\u003cline x1=\"67\" y1=\"177\" x2=\"109\" y2=\"177\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"76\" y1=\"198\" x2=\"100\" y2=\"198\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003ctext x=\"48\" y=\"150\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">+\u003c/text>\u003ctext x=\"48\" y=\"220\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"22\">−\u003c/text>\u003crect x=\"262.5\" y=\"63\" width=\"75\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/>\u003ctext x=\"300\" y=\"45\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">100 Ω\u003c/text>\u003ctext x=\"121\" y=\"296\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\">12 V\u003c/text>\u003c/svg>\u003cfigcaption>Rita först hur en extra resistor kan kopplas i serie respektive parallellt.\u003c/figcaption>\u003c/figure>","time":"Enskilt → par → klass"},{"title":"Samma batteri. Samma resistorer. Två kopplingar.","body":"\u003cp>Samma ideala \u003cb>12 V-batteri\u003c/b> och två resistorer: \u003cb>100 Ω\u003c/b> respektive \u003cb>200 Ω\u003c/b>.\u003c/p>\u003cdiv class=\"question\">Följ strömmens väg med pennan. Vilken koppling har förgreningar? Vad händer med batteriets ström när du byter koppling?\u003c/div>\u003cp>Rita båda kretsschemana. Byt sedan med \u003cb>Serie / Parallellt\u003c/b> i modellen. \u003cb>Förutsäg talvärdena innan du visar resultatet.\u003c/b>\u003c/p>\u003cp>Jämför med en ensam resistor på 100 Ω: då blir batteriströmmen \u003cb>0,120 A\u003c/b>.\u003c/p>","source":"2","model":"series","teacher":"Här gör klassen ett omkopplingsförsök i webben efter att eleverna ritat. Modellen håller U, R₁, R₂ samordnade med krets, strömmar, spänningar och R_ers. Laborationen i PhET är separat; denna bild är ingen ersättning för den.","time":"Förutsäg → pröva → förklara"},{"title":"Serie: samma ström genom båda","body":"\u003cp>Två resistorer på \u003cb>100 Ω\u003c/b> och \u003cb>200 Ω\u003c/b> är kopplade i serie till \u003cb>12 V\u003c/b>.\u003c/p>\u003cdiv class=\"question\">Vilken ström går genom var och en? Vilken resistor har störst spänningsfall? Föreslå beräkningsordningen.\u003c/div>\u003cp>En enda strömväg ger \u003cb>samma ström genom båda\u003c/b>. Spänningsfallen tillsammans blir batterispänningen.\u003c/p>","source":"3","steps":["\u003cdiv class=\"worked\">\u003cb>1 · Ersättningsresistans\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ers\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ers\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>100\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmrow>\u003cmn>200\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>300\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>2 · Batteriström\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ers\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>300\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>0,040\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>3 · Spänning över 100 Ω\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>·\u003c/mo>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>100\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003cmo>·\u003c/mo>\u003cmrow>\u003cmn>0,040\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>4,0\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>4 · Spänning över 200 Ω och kontroll\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>·\u003c/mo>\u003cmi>I\u003c/mi>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>200\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003cmo>·\u003c/mo>\u003cmrow>\u003cmn>0,040\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>8,0\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>4,0\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmrow>\u003cmn>8,0\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003cp>Vid samma ström ger dubbelt så stor resistans dubbelt så stort spänningsfall.\u003c/p>\u003c/div>\u003c/div>"],"teacher":"Cirka 7 min. Låt eleverna själva ange nästa steg innan varje avslöjande. Läs kretsschema och beräkning tillsammans; den större resistorn har större U i serie.","side":"\u003cfigure class=\"circuit-figure\">\u003csvg role=\"img\" aria-label=\"Seriekrets 12 V med resistorerna 100 Ω och 200 Ω\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 335\">\u003ctitle>Seriekrets 12 V med resistorerna 100 Ω och 200 Ω\u003c/title>\u003cdesc>Samma ström går genom båda resistorerna. Föreslå U₁ och U₂ före lösningen.\u003c/desc>\u003cpath d=\"M91 158V88H504V277H91V158\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003crect x=\"73\" y=\"144\" width=\"36\" height=\"90\" fill=\"white\"/>\u003cline x1=\"70\" y1=\"181\" x2=\"112\" y2=\"181\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"79\" y1=\"202\" x2=\"103\" y2=\"202\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003ctext x=\"51\" y=\"154\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">+\u003c/text>\u003ctext x=\"51\" y=\"224\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"22\">−\u003c/text>\u003crect x=\"204.0\" y=\"74\" width=\"82\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/>\u003crect x=\"350.0\" y=\"74\" width=\"82\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/>\u003ctext x=\"245\" y=\"59\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"19\">100 Ω\u003c/text>\u003ctext x=\"391\" y=\"59\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"19\">200 Ω\u003c/text>\u003cpath d=\"M123 88L183 88M172.0 83.0L183 88L172.0 93.0\" stroke=\"#087f99\" stroke-width=\"3.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"150\" y=\"64\" fill=\"#087f99\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">I\u003c/text>\u003ctext x=\"114\" y=\"313\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\">12 V\u003c/text>\u003ctext x=\"310\" y=\"320\" fill=\"#177c91\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">U₁ + U₂ = 12 V\u003c/text>\u003c/svg>\u003cfigcaption>Samma ström går genom båda resistorerna. Föreslå U₁ och U₂ före lösningen.\u003c/figcaption>\u003c/figure>"},{"title":"Parallellt: samma spänning över båda","body":"\u003cp>Resistorerna \u003cb>100 Ω\u003c/b> och \u003cb>200 Ω\u003c/b> ligger parallellt över \u003cb>12 V\u003c/b>.\u003c/p>\u003cdiv class=\"question\">Vilken gren har störst ström? Hur blir batteriets totalström? Motivera först med samma spänning över båda grenarna.\u003c/div>\u003cp>Parallellt gäller att \u003cb>U₁ = U₂\u003c/b>, men strömmarna kan vara olika. Laddningen bevaras i förgreningen.\u003c/p>","source":"4","steps":["\u003cdiv class=\"worked\">\u003cb>1 · Gemensamma anslutningspunkter\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmi>U\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003cp>Varje gren ligger mellan samma två noder.\u003c/p>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>2 · Ström i 100 Ω-grenen\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>100\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>0,120\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>3 · Ström i 200 Ω-grenen\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>200\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>0,060\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>4 · Batteriets totalström\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>0,120\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmrow>\u003cmn>0,060\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>0,180\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cp>\u003cb>Rimlighetskontroll:\u003c/b> halverad resistans ger dubbelt så stor grenström vid samma spänning. Batteriet levererar summan av grenströmmarna, inte en ”delad” totalström som är mindre än vardera grenströmmen.\u003c/p>"],"teacher":"Cirka 7 min. Visa tydligt de två gemensamma noderna, inte bara två resistorer. Låt eleverna jämföra grenströmmarna före facit.","side":"\u003cfigure class=\"circuit-figure\">\u003csvg role=\"img\" aria-label=\"Parallellkrets 12 V med en gren på 100 Ω och en gren på 200 Ω\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 335\">\u003ctitle>Parallellkrets 12 V med en gren på 100 Ω och en gren på 200 Ω\u003c/title>\u003cdesc>Båda grenarna har 12 V över sig. I₁ och I₂ kan vara olika.\u003c/desc>\u003cpath d=\"M92 154V77H423V145 M423 221V276H92V154 M278 77V145 M278 221V276\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003crect x=\"74\" y=\"138\" width=\"36\" height=\"90\" fill=\"white\"/>\u003cline x1=\"71\" y1=\"175\" x2=\"113\" y2=\"175\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"80\" y1=\"196\" x2=\"104\" y2=\"196\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003ctext x=\"52\" y=\"148\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">+\u003c/text>\u003ctext x=\"52\" y=\"218\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"22\">−\u003c/text>\u003crect x=\"264\" y=\"145.0\" width=\"28\" height=\"76\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/>\u003crect x=\"409\" y=\"145.0\" width=\"28\" height=\"76\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/>\u003ctext x=\"325\" y=\"195\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">100 Ω\u003c/text>\u003ctext x=\"469\" y=\"195\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">200 Ω\u003c/text>\u003cpath d=\"M278 97L278 137M283.0 126.0L278 137L273.0 126.0\" stroke=\"#087f99\" stroke-width=\"3.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003cpath d=\"M423 97L423 137M428.0 126.0L423 137L418.0 126.0\" stroke=\"#087f99\" stroke-width=\"3.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"254\" y=\"116\" fill=\"#087f99\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"17\">I₁\u003c/text>\u003ctext x=\"399\" y=\"116\" fill=\"#087f99\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"17\">I₂\u003c/text>\u003ctext x=\"118\" y=\"317\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"19\">12 V\u003c/text>\u003ctext x=\"357\" y=\"313\" fill=\"#177c91\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">U₁ = U₂ = 12 V\u003c/text>\u003c/svg>\u003cfigcaption>Båda grenarna har 12 V över sig. I₁ och I₂ kan vara olika.\u003c/figcaption>\u003c/figure>"},{"title":"Varför blir ersättningsresistansen mindre?","body":"\u003cp>\u003cb>Ersättningsresistans\u003c/b> är den enda resistans som skulle ge \u003cb>samma batteriström vid samma batterispänning\u003c/b>.\u003c/p>\u003cdiv class=\"question\">Varför kan ersättningsresistansen bli mindre än 100 Ω när ingen av de två grenresistanserna är mindre än 100 Ω?\u003c/div>\u003cp>Förklara först med \u003cb>en extra strömväg\u003c/b>, inte med en memorerad formel.\u003c/p>","source":"5","steps":["\u003cdiv class=\"worked\">\u003cb>1 · Ersätt med samma batteriström\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ers\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ers\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>12\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>0,180\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003cmo>≈\u003c/mo>\u003cmrow>\u003cmn>66,7\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>2 · Laddningen bevaras vid förgreningen\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ers\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/math>\u003c/div>\u003cp>Varje gren har samma spänning U. Därför kan Ohms lag sättas in för alla tre strömmar.\u003c/p>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>3 · Dividera med den gemensamma spänningen (U ≠ 0)\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ers\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ers\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmn>100\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmn>200\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ers\u003c/mtext>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>3\u003c/mn>\u003cmrow>\u003cmn>200\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ers\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>200\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003cmo>≈\u003c/mo>\u003cmrow>\u003cmn>66,7\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cp>\u003cb>Rimlighetskontroll:\u003c/b> 66,7 Ω är mindre än 100 Ω. Två strömvägar ger större batteriström vid samma spänning, alltså lägre ersättningsresistans.\u003c/p>"],"teacher":"Cirka 5 min. Prioritera den fysikaliska förklaringen till att R_ers blir mindre; visa algebra vid behov. Webbfrågan är ny och inte originalets Socrative.","side":"\u003cfigure class=\"circuit-figure\">\u003csvg role=\"img\" aria-label=\"Ersättningskrets med 12 volt och ett enda motstånd som ger 0,180 ampere\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 335\">\u003ctitle>Ersättningskrets med 12 volt och ett enda motstånd som ger 0,180 ampere\u003c/title>\u003cdesc>Denna enda resistor ger samma totalström som två parallella resistorer på 100 Ω och 200 Ω.\u003c/desc>\u003cpath d=\"M90 165V76H505V271H90V165\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003crect x=\"72\" y=\"137\" width=\"36\" height=\"90\" fill=\"white\"/>\u003cline x1=\"69\" y1=\"174\" x2=\"111\" y2=\"174\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"78\" y1=\"195\" x2=\"102\" y2=\"195\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003ctext x=\"50\" y=\"147\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">+\u003c/text>\u003ctext x=\"50\" y=\"217\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"22\">−\u003c/text>\u003crect x=\"257.0\" y=\"62\" width=\"94\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/>\u003ctext x=\"304\" y=\"48\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\">Rₑᵣₛ\u003c/text>\u003cpath d=\"M150 76L218 76M207.0 71.0L218 76L207.0 81.0\" stroke=\"#087f99\" stroke-width=\"3.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003ctext x=\"153\" y=\"316\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\">12 V\u003c/text>\u003ctext x=\"385\" y=\"308\" fill=\"#087f99\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\">I = 0,180 A\u003c/text>\u003c/svg>\u003cfigcaption>Denna enda resistor ger samma totalström som två parallella resistorer på 100 Ω och 200 Ω.\u003c/figcaption>\u003c/figure>","quiz":{"prompt":"Vilken ersättningsresistans är rimlig för 100 Ω och 200 Ω parallellt?","options":["66,7 Ω","150 Ω","300 Ω"],"correct":0,"why":"Parallellt blir ersättningsresistansen mindre än den minsta enskilda grenresistansen. Här Rₑᵣₛ ≈ 66,7 Ω."}},{"title":"Mät ström genom – spänning över","body":"\u003cp>\u003cstrong>Rita själv först:\u003c/strong> var ska du placera A och V för att mäta strömmen genom en resistor och spänningen över den?\u003c/p>\u003cdiv class=\"question\">Vad skulle kunna hända om amperemetern kopplas parallellt över resistorn?\u003c/div>\u003cdiv class=\"meter-points\">\u003cp>\u003cb>Amperemeter:\u003c/b> i serie så att strömmen går genom instrumentet. Låg inre resistans.\u003c/p>\u003cp>\u003cb>Voltmeter:\u003c/b> parallellt mellan komponentens båda anslutningar. Hög inre resistans.\u003c/p>\u003c/div>\u003cp class=\"safety-small\">Koppla inte en amperemeter direkt över en spänningskälla eller resistor i verkligheten: stor ström kan skada instrument eller krets.\u003c/p>","source":"6","steps":["\u003cp>\u003cb>Kontroll:\u003c/b> amperemetern visar ström \u003cem>genom\u003c/em>; voltmetern visar spänning \u003cem>mellan\u003c/em> två punkter.\u003c/p>","\u003cp>\u003cb>Felsökning:\u003c/b> att lägga en lågohmig amperemeter över resistorn ger en nästan kortslutande gren och kan orsaka hög ström.\u003c/p>"],"teacher":"Cirka 4 min. Rita först utan mätare på tavlan och låt eleverna placera A och V själva. Visa sedan denna figur. Kopplingslabben i PhET behålls separat.","side":"\u003cdiv class=\"meter-predict\">Rita först var A respektive V ska kopplas. Visa steg 1 för att jämföra med kretsschemat.\u003c/div>\u003cfigure class=\"circuit-figure meter-reveal\">\u003csvg role=\"img\" aria-label=\"Krets med batteri på 6 volt, amperemeter i serie och voltmeter parallellt över R\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 335\">\u003ctitle>Krets med batteri på 6 volt, amperemeter i serie och voltmeter parallellt över R\u003c/title>\u003cdesc>Mätaren A ligger i huvudströmvägen. Voltmeter V har var sin anslutning på resistorns båda sidor.\u003c/desc>\u003cpath d=\"M98 158V84H207 M263 84H345 M435 84H498V274H98V158 M345 84V171H363 M417 171H435V84\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003crect x=\"80\" y=\"149\" width=\"36\" height=\"90\" fill=\"white\"/>\u003cline x1=\"77\" y1=\"186\" x2=\"119\" y2=\"186\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"86\" y1=\"207\" x2=\"110\" y2=\"207\" stroke=\"#bb7148\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003ctext x=\"58\" y=\"159\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">+\u003c/text>\u003ctext x=\"58\" y=\"229\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"22\">−\u003c/text>\u003crect x=\"345.0\" y=\"70\" width=\"90\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/>\u003ccircle cx=\"235\" cy=\"84\" r=\"28\" fill=\"white\" stroke=\"#0a8094\" stroke-width=\"3\"/>\u003ccircle cx=\"390\" cy=\"171\" r=\"27\" fill=\"white\" stroke=\"#0a8094\" stroke-width=\"3\"/>\u003ctext x=\"235\" y=\"92\" fill=\"#087d93\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"24\">A\u003c/text>\u003ctext x=\"390\" y=\"180\" fill=\"#087d93\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"23\">V\u003c/text>\u003ctext x=\"390\" y=\"46\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"20\">R\u003c/text>\u003ctext x=\"116\" y=\"316\" fill=\"#b66c49\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"21\">6 V\u003c/text>\u003ctext x=\"301\" y=\"312\" fill=\"#56727e\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"16\">A i strömvägen · V över resistorn\u003c/text>\u003c/svg>\u003cfigcaption>Mätaren A ligger i huvudströmvägen. Voltmeter V har var sin anslutning på resistorns båda sidor.\u003c/figcaption>\u003c/figure>","quiz":{"prompt":"Hur ska en ideal voltmeter kopplas för att mäta spänningen över R?","options":["Parallellt över R","I serie före R","Direkt över amperemetern"],"correct":0,"why":"En voltmeter har hög inre resistans och ansluts mellan de två punkter vars potentialskillnad ska mätas."}},{"title":"Batterier: samma ord, en annan fråga","body":"\u003cp>Två likadana \u003cb>1,5 V-celler\u003c/b>. Förutsäg batterispänningen när de kopplas i serie respektive parallellt med samma polaritet.\u003c/p>\u003cdiv class=\"question\">När får vi 3,0 V och när får vi 1,5 V? Två identiska parallellkopplade celler driver tillsammans 0,10 A: vilken ström ger varje cell i den idealiserade modellen?\u003c/div>\u003cp class=\"note\">Symmetrisk modell med två likadana celler, samma inre resistans och likadana anslutningar: serie adderar spänning; parallellt ger oförändrad spänning men kan ge större tillgänglig kapacitet. Strömmen delas lika i detta symmetriska fall, inte enbart därför att cellernas polspänning är lika. Koppla inte i praktiken ihop olika celler utan lämpligt skydd.\u003c/p>","source":"7","steps":["\u003cdiv class=\"worked\">\u003cb>1 · Likriktad seriekoppling\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>serie\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>1,5\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmrow>\u003cmn>1,5\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>3,0\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cdiv class=\"worked\">\u003cb>2 · Parallellkoppling: lika polspänning\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>U\u003c/mi>\u003cmtext>parallell\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>1,5\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmtext>cell\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>0,10\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>0,050\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003cp>Strömdelningen 0,050 A per cell gäller när även inre resistanser och anslutningar är symmetriska. Enbart ideal spänningskälla med 1,5 V bestämmer inte varje individuell källström.\u003c/p>\u003c/div>\u003c/div>"],"teacher":"Cirka 3 min. Markera de viktiga antagandena lika ems, lika inre resistans och symmetriska anslutningar; en helt ideal parallellduo ger inte bestämd strömfördelning. Låt eleverna först rita polaritet och bara därefter avslöja 3,0/1,5 V. Webbfrågan är ett nytt övningsinslag, inte Socrative.","side":"\u003cfigure class=\"circuit-figure\">\u003csvg role=\"img\" aria-label=\"Två identiska 1,5-voltsceller kopplade i serie och parallellt\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 275\">\u003ctitle>Två identiska 1,5-voltsceller kopplade i serie och parallellt\u003c/title>\u003cdesc>Två identiska celler, 1,5 V vardera. Förutsäg innan värdena visas stegvis.\u003c/desc>\u003cpath d=\"M50 113V55H260V174H50V113\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003crect x=\"121.5\" y=\"160\" width=\"65\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/>\u003ctext x=\"153\" y=\"202\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"16\">R\u003c/text>\u003crect x=\"91\" y=\"44\" width=\"42\" height=\"21\" fill=\"white\"/>\u003crect x=\"163\" y=\"44\" width=\"42\" height=\"21\" fill=\"white\"/>\u003cline x1=\"105\" y1=\"44\" x2=\"105\" y2=\"67\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/>\u003cline x1=\"116\" y1=\"49\" x2=\"116\" y2=\"63\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/>\u003cline x1=\"177\" y1=\"44\" x2=\"177\" y2=\"67\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/>\u003cline x1=\"188\" y1=\"49\" x2=\"188\" y2=\"63\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/>\u003cpath d=\"M335 113V56H558V176H335V113 M335 110H558\" stroke=\"#315766\" stroke-width=\"3\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\u003crect x=\"414.5\" y=\"162\" width=\"67\" height=\"28\" rx=\"2\" fill=\"white\" stroke=\"#315766\" stroke-width=\"3\"/>\u003ctext x=\"446\" y=\"205\" fill=\"#264e5c\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"16\">R\u003c/text>\u003crect x=\"414\" y=\"45\" width=\"54\" height=\"22\" fill=\"white\"/>\u003crect x=\"414\" y=\"99\" width=\"54\" height=\"22\" fill=\"white\"/>\u003cline x1=\"429\" y1=\"44\" x2=\"429\" y2=\"68\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/>\u003cline x1=\"441\" y1=\"49\" x2=\"441\" y2=\"63\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/>\u003cline x1=\"429\" y1=\"98\" x2=\"429\" y2=\"122\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/>\u003cline x1=\"441\" y1=\"103\" x2=\"441\" y2=\"117\" stroke=\"#be754b\" stroke-width=\"3.4\" stroke-linecap=\"round\"/>\u003ctext x=\"153\" y=\"24\" fill=\"#087c93\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">SERIE · samma riktning\u003c/text>\u003ctext x=\"446\" y=\"24\" fill=\"#087c93\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"18\">PARALLELLT · lika poler ihop\u003c/text>\u003ctext x=\"153\" y=\"248\" fill=\"#b56b45\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"24\">? V\u003c/text>\u003ctext x=\"446\" y=\"248\" fill=\"#b56b45\" text-anchor=\"middle\" font-family=\"system-ui\" font-weight=\"650\" font-size=\"24\">? V\u003c/text>\u003c/svg>\u003cfigcaption>Två identiska celler, 1,5 V vardera. Förutsäg innan värdena visas stegvis.\u003c/figcaption>\u003c/figure>","quiz":{"prompt":"Två likadana 1,5 V-celler parallellt (lika poler ihop) ger idealiskt ...","options":["1,5 V","3,0 V","0 V"],"correct":0,"why":"Parallellkopplade identiska celler har samma polspänning som en cell; de kan tillsammans leverera större kapacitet."}},{"title":"Socrative: pröva din förklaring","body":"\u003cdiv class=\"socrative\">\u003cp>\u003cb>Originalets Socrative\u003c/b> · Fy1 … 903. Kopplingar\u003c/p>\u003ccode>SOC-37285032\u003c/code>\u003cp>1. Svara först enskilt och motivera en osäker fråga.\u003cbr>2. Jämför med en kamrat: följ strömmens vägar och jämför potentialskillnaderna.\u003cbr>3. Ompröva svaret. Förklara varför.\u003c/p>\u003c/div>\u003cdiv class=\"question\">Vilket resonemang i klassen behöver vi reda ut tillsammans? Målet är att förstå – inte bara få rätt alternativ.\u003c/div>","source":"8","time":"Enskilt → par → klass","teacher":"Befintlig Socrative Fy1 903, quiz-ID SOC-37285032 från originalet. Använd endast originalets aktiviteter; den får inte ersättas med nyskapad fråga. Föreslagen tidsram 6 min, anpassas till behovet."},{"title":"Nu använder du sambanden själv","body":"\u003cdiv class=\"book-main\">\u003ch2>Boken · s. 281–293\u003c/h2>\u003cp class=\"big-assignment\">Uppgifter / läxa \u003cstrong>829–838\u003c/strong>\u003c/p>\u003cp>\u003cb>Börja med 834 och 835 (s. 293)\u003c/b> – jämför samma resistorer i två olika kopplingar.\u003c/p>\u003c/div>\u003cdiv class=\"book-other\">\u003cp>\u003cb>Fortsätt:\u003c/b> 833 (mätinstrument) och 829 (batterier).\u003c/p>\u003cp>\u003cb>Därefter:\u003c/b> 830–832 (lampor) och 836–838 (blandade kretsar).\u003c/p>\u003c/div>\u003cdiv class=\"question\">För varje uppgift: rita och markera → välj samband → redovisa mellanled och enheter → rimlighetskontroll.\u003c/div>\u003cp>\u003cb>Arbeta själv först.\u003c/b> Jämför sedan resonemang med gruppen. Behöver du stöd för blandade kretsar finns sidan 11.\u003c/p>\u003cp>Alla uppgifter ska inte hinnas under lektionen. Skriv ner vilka du fortsätter med efteråt.\u003c/p>","source":"9","time":"Eget bokarbete · planera 20–25 min","teacher":"Bokarbetet är en obligatorisk arbetsfas, ingen restpost. Prioritera 834/835 med motivering och återkoppling; därefter 833 och 829. Avgränsa läxan utifrån elevernas faktiska arbete, inte automatiskt alla uppgifter."},{"title":"Visa vad du kan – på egen hand","body":"\u003cp>Sista fem minuterna: \u003cstrong>svara enskilt utan bok\u003c/strong>. Skriv kort, men motivera.\u003c/p>\u003cdiv class=\"exit-items\">\u003csection>\u003cb>1 · Serie eller parallellt?\u003c/b>\u003cp>Två resistorer sitter i serie. Vad är samma, I eller U? Vad gäller om de kopplas parallellt?\u003c/p>\u003c/section>\u003csection>\u003cb>2 · Beräkning\u003c/b>\u003cp>6,0 V över två parallella resistorer på 300 Ω vardera. Beräkna totalström och ersättningsresistans.\u003c/p>\u003c/section>\u003csection>\u003cb>3 · Mätning\u003c/b>\u003cp>Rita A och V för att mäta ström genom och spänning över en resistor.\u003c/p>\u003c/section>\u003c/div>\u003cdiv class=\"selfcheck\">Markera vilket av dagens lektionsmål du behöver träna mer på.\u003c/div>\u003cp>\u003cb>Inför nästa lektion:\u003c/b> Effekt, s. 294–299. Läs \u003cb>de gröna rutorna\u003c/b> noggrant och försök förklara sambanden.\u003c/p>","source":"10","steps":["\u003cp>\u003cb>1 · Begrepp:\u003c/b> I är lika genom serieresistorer; U är lika över parallellgrenar. Eleven motiverar med en enda strömväg respektive samma två anslutningspunkter.\u003c/p>","\u003cdiv class=\"worked\">\u003cb>2 · Två parallella 300 Ω-resistorer\u003c/b>\u003cdiv class=\"series-math-stack\">\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>300\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>0,020\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>300\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>0,020\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>0,040\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003cdiv class=\"series-equation\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmsub>\u003cmi>R\u003c/mi>\u003cmtext>ers\u003c/mtext>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>6,0\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>V\u003c/mtext>\u003c/mrow>\u003cmrow>\u003cmn>0,040\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>A\u003c/mtext>\u003c/mrow>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>150\u003c/mn>\u003cmspace width=\"0.2em\"/>\u003cmtext>Ω\u003c/mtext>\u003c/mrow>\u003c/math>\u003c/div>\u003c/div>\u003c/div>","\u003cp>\u003cb>3 · Mätning:\u003c/b> koppla A i serie så att strömmen går genom instrumentet; koppla V parallellt mellan resistorns båda anslutningar.\u003c/p>"],"teacher":"Avsätt fem minuter för individuell exit. Repetitionsläge kan visa facit stegvis. Nästa gång 8.4 Effekt, s. 294–299 och gröna rutorna."},{"titl
