name: Ma4 web lesson browser quality checks
on:
  push:
    paths:
      - "ma4/**"
      - ".github/workflows/ma4-browser-qa.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ma4-chapter4:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Wait for closely spaced updates to settle
        run: sleep 30
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start lesson site locally
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/ma4-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8123/ma4/kapitel-4/ >/dev/null && break; sleep 1; done
      - name: Check every Ma4 lesson on desktop and mobile
        run: |
          node ma4/kapitel-4/qa/browser-smoke.cjs
          node ma4/kapitel-4/qa/math-typography-pair-01.cjs
          node ma4/kapitel-4/qa/math-typography-pair-02.cjs
          node ma4/kapitel-4/qa/math-typography-pair-03.cjs
          node ma4/kapitel-4/qa/math-typography-pair-04.cjs
          node ma4/kapitel-4/qa/math-typography-pair-05.cjs
          node ma4/kapitel-4/qa/math-typography-pair-06.cjs
          node ma4/kapitel-4/qa/math-typography-pair-07.cjs
          node ma4/kapitel-4/qa/deep-review-ma4-01.cjs
          node ma4/kapitel-4/qa/deep-review-ma4-02.cjs
          node ma4/kapitel-4/qa/deep-review-ma4-03.cjs
          node ma4/kapitel-4/qa/deep-review-ma4-04.cjs
          node ma4/kapitel-4/qa/equation-spacing-ma4-01-03.cjs
          node ma4/kapitel-4/qa/unit-circle-browser.cjs
          node ma4/kapitel-4/qa/understand-browser.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ma4-browser-quality-evidence
          path: ma4-qa-screenshots/
          retention-days: 14
