<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Serie- och parallellkoppling · Fysik nivå 1</title><link rel="stylesheet" href="../../_gemensamt/lektion.css"></head><body><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Serie- och parallellkoppling</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Serie- och parallellkoppling","subject":"Fysik nivå 1","chapter":"8.3 · Serie- och parallellkoppling","source":"261116 8.3 Seriekoppling och parallellkoppling.pdf","goals":["Känna igen serie- och parallellkoppling samt placera mätinstrument korrekt.","Förklara ström och spänning i respektive koppling.","Beräkna ersättningsresistans och strömmar i kretsar med två resistorer."],"pages":[{"title":"En extra resistor – större eller mindre ström?","body":"<p>Utgångsläge: 12 V över en resistor på 100 Ω. Vi lägger till 200 Ω.<\/p><div class=\"question\">Vad händer med strömmen från batteriet om den extra resistorn kopplas <b>i serie<\/b> jämfört med <b>parallellt<\/b>? Ökar, minskar eller är den oförändrad?<\/div><p class=\"note\"><b>Mål:<\/b> skilja serie från parallellt, förklara ström och spänning samt beräkna ersättningsresistans.<\/p>","source":"1","quiz":{"prompt":"En extra resistor kopplas parallellt över samma ideala 12 V-batteri. Totalströmmen…","options":["ökar","minskar","är oförändrad"],"correct":0,"why":"En ytterligare parallell ledningsväg minskar ersättningsresistansen vid samma spänning.","hint":""},"teacher":"Begär både en förutsägelse och en mekanism, inte bara en minnesregel.","side":"<figure class=\"graph static-graph\"><svg role=\"img\" aria-label=\"En idealiserad oförgrenad krets. Punkterna A och B ligger före respektive efter resistorn.\" viewBox=\"0 0 550 310\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M90 160 V70 H470 V256 H90 V160\" stroke=\"#214956\" stroke-width=\"4\" fill=\"none\"/><rect x=\"250\" y=\"57\" width=\"82\" height=\"27\" fill=\"#f4fafb\" stroke=\"#254a59\" stroke-width=\"3\"/><text x=\"291\" y=\"48\" fill=\"#214956\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">100 Ω<\/text><rect x=\"80\" y=\"154\" width=\"21\" height=\"66\" fill=\"#eff7f9\"/><line x1=\"69\" y1=\"165\" x2=\"110\" y2=\"165\" stroke=\"#bd6b40\" stroke-width=\"4\"/><line x1=\"82\" y1=\"194\" x2=\"98\" y2=\"194\" stroke=\"#bd6b40\" stroke-width=\"4\"/><text x=\"60\" y=\"149\" fill=\"#214956\" font-size=\"24\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">+<\/text><text x=\"60\" y=\"220\" fill=\"#214956\" font-size=\"24\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">−<\/text><text x=\"96\" y=\"293\" fill=\"#214956\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"650\" text-anchor=\"middle\">12 V<\/text><\/svg><figcaption class=\"figcap\">En idealiserad oförgrenad krets. Punkterna A och B ligger före respektive efter resistorn.<\/figcaption><\/figure>"},{"title":"Samma batteri. Samma resistorer. Två kopplingar.","body":"<p>Jämför 100 Ω och 200 Ω i serie och parallellt över samma ideala 12 V-batteri.<\/p><div class=\"question\">Följ strömmens väg med fingret/pennan. Vilken koppling har förgreningar? Rita båda.<\/div><p>En ensam resistor på 100 Ω skulle ge I = 0,120 A.<\/p>","source":"2","model":"series","teacher":"Låt först eleverna rita. Växla sedan med reglaget och kontrollera i beräkningsmodellen. PhET-labben kvarstår separat."},{"title":"Serie: samma ström genom båda","body":"<p>R₁ = 100 Ω, R₂ = 200 Ω och U = 12 V. Beräkna strömmen och spänningen över varje resistor.<\/p><div class=\"question\">Varför får den större resistorn större spänningsfall när samma ström går genom båda?<\/div>","source":"3","steps":["<div class=\"mathrow\">Rₑᵣₛ = R₁ + R₂ = 100 Ω + 200 Ω = 300 Ω<\/div>","<div class=\"mathrow\">I = U/Rₑᵣₛ = 12 V / 300 Ω = 0,040 A<\/div>","<div class=\"mathrow\">U₁ = R₁I = 4,0 V &nbsp; och &nbsp; U₂ = R₂I = 8,0 V<\/div>","<p><b>Rimlighet:<\/b> 4,0 V + 8,0 V = 12,0 V. En enda strömväg innebär samma ström överallt.<\/p>"],"teacher":"Avslöja gärna ett mellanled i taget. Eleverna ska kunna motivera varje steg."},{"title":"Parallellt: samma spänning över båda","body":"<p>R₁ = 100 Ω och R₂ = 200 Ω ligger mellan samma två knutpunkter på ett 12 V-batteri.<\/p><div class=\"question\">Vilken gren får störst ström? Hur stor är totalströmmen från batteriet?<\/div>","source":"4","steps":["<div class=\"mathrow\">U₁ = U₂ = 12 V<\/div>","<div class=\"mathrow\">I₁ = U/R₁ = 12/100 = 0,120 A<\/div>","<div class=\"mathrow\">I₂ = U/R₂ = 12/200 = 0,060 A<\/div>","<div class=\"mathrow\">I = I₁ + I₂ = 0,180 A<\/div>","<p>Kirchhoffs första lag: laddning bevaras i förgreningarna. Strömmen delas inte alltid lika.<\/p>"],"teacher":"Eleverna kan missta lika spänning för lika ström. Håll isär dessa."},{"title":"Varför blir ersättningsresistansen mindre?","body":"<p>Ersättningsresistans är den resistans som ger samma totala ström vid samma batterispänning.<\/p><div class=\"question\">Förklara varför en extra parallell väg leder till mindre ersättningsresistans.<\/div>","source":"5","steps":["<div class=\"mathrow\">Rₑᵣₛ = U/I = 12 V / 0,180 A ≈ 66,7 Ω<\/div>","<div class=\"mathrow\">I = I₁ + I₂ ⇒ U/Rₑᵣₛ = U/R₁ + U/R₂<\/div>","<div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mfrac><mn>1<\/mn><msub><mi>R<\/mi><mtext>ers<\/mtext><\/msub><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><msub><mi>R<\/mi><mn>1<\/mn><\/msub><\/mfrac><mo>+<\/mo><mfrac><mn>1<\/mn><msub><mi>R<\/mi><mn>2<\/mn><\/msub><\/mfrac><\/math><\/div>","<p><b>Rimlighet:<\/b> 66,7 Ω är mindre än den minsta grenresistansen på 100 Ω.<\/p>"],"teacher":"Utgå från grenströmmarna för att motivera sambandet. Inget memorerat bråk utan förståelse."},{"title":"Mät ström genom – spänning över","body":"<p>Rita in A och V för att mäta ström genom och spänning över en resistor.<\/p><div class=\"question\">Vad kan hända om amperemetern kopplas parallellt över resistorn?<\/div><p><b>Amperemeter:<\/b> i serie, mycket liten inre resistans. <b>Voltmeter:<\/b> parallellt, stor inre resistans.<\/p>","source":"6","steps":["<p>Amperemetern får genomströmmas av strömmen vi vill mäta. Voltmetern ansluts mellan två punkter.<\/p>","<p>En amperemeter parallellt kan ge en lågohmig kortslutande väg och skada mätaren.<\/p>"],"teacher":"Visa verkliga instrument/koppling om tillgängligt. Interaktivitet ersätter inte hanteringskunskap."},{"title":"Batterier: samma ord, en annan fråga","body":"<p>Två likadana 1,5 V-celler. Förutsäg spänningen i serie (samma riktning) och parallellt (lika poler ihop).<\/p><div class=\"question\">I vilket fall ökar spänningen och i vilket ökar den möjliga kapaciteten?<\/div>","source":"7","steps":["<p>Serie: 1,5 V + 1,5 V = 3,0 V.<\/p>","<p>Parallellt med likadana celler: 1,5 V. De kan dela strömmen och ge högre möjlig kapacitet.<\/p>","<p>Om de tillsammans ger 0,10 A och är idealt lika, ger vardera 0,050 A.<\/p>"],"teacher":"Idealiseringsantaganden: cellerna är lika och ansluts med samma polaritet."},{"title":"Socrative: pröva din förklaring","body":"<div class=\"socrative\"><h2>Socrative · Fy1 · 903. Kopplingar<\/h2><p>Quiz-ID: <code>SOC-37285032<\/code><\/p><ol><li>Svara enskilt.<\/li><li>Jämför och förklara i par.<\/li><li>Gemensam återkoppling: motivera med fysik.<\/li><\/ol><\/div><p>Försök reda ut olika svar genom att följa strömmens väg och jämföra potentialskillnaderna.<\/p>","source":"8","time":"Gemensam återkoppling","teacher":"Befintlig Socrative, inte en nykonstruerad. Återkoppla bara på de frågor klassen faktiskt behöver."},{"title":"Nu använder du sambanden själv","body":"<div class=\"bookbox\"><strong>Bokens uppgifter: 829–838<\/strong><p>Boken s. 281–293. Börja med 834 och 835 på s. 293.<\/p><p>Fortsätt 833 (mätinstrument), 829 (batterier), 830–832 (lampor) och 836–838 (blandade kretsar). Alla ska inte hinnas under lektionen.<\/p><\/div><p>Rita och markera → välj samband → visa mellanled och enhet → kontrollera.<\/p>","source":"9","time":"Skyddad boktid","teacher":"Prioritera elevernas egen problemlösning och återkoppling; håll möjlighet att korta webbmodellen."},{"title":"Visa vad du kan – på egen hand","body":"<div class=\"question\">1. Två resistorer i serie: vad är samma, I eller U? Vad gäller parallellt?<\/div><div class=\"question\">2. Två parallella resistorer på 300 Ω över 6,0 V: bestäm totalström och ersättningsresistans.<\/div><div class=\"question\">3. Rita A och V för att mäta ström genom och spänning över R.<\/div><p>Inför nästa lektion: Effekt, s. 294–299. Läs gröna rutorna.<\/p>","source":"10","steps":["<p>Serie: samma I. Parallellt: samma U.<\/p>","<p>I per gren = 6,0/300 = 0,020 A; total I = 0,040 A; Rₑᵣₛ = 6,0/0,040 = 150 Ω.<\/p>","<p>Amperemeter i serie och voltmeter parallellt.<\/p>"],"teacher":"Fem avslutande minuter enligt original. Låt eleverna välja mål för fortsatt träning."},{"title":"Stöd: förenkla en del i taget","body":"<p>En resistor på 60 Ω ligger i serie med en parallellkoppling på 120 Ω och 240 Ω. Batteriet ger 14 V.<\/p><div class=\"question\">Vilka motstånd ligger mellan samma knutpunkter? Vad blir sedan seriekopplat?<\/div>","source":"11","steps":["<div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mfrac><mn>1<\/mn><msub><mi>R<\/mi><mi>p<\/mi><\/msub><\/mfrac><mo>=<\/mo><mfrac><mn>1<\/mn><mn>120<\/mn><\/mfrac><mo>+<\/mo><mfrac><mn>1<\/mn><mn>240<\/mn><\/mfrac><mo>⇒<\/mo><msub><mi>R<\/mi><mi>p<\/mi><\/msub><mo>=<\/mo><mn>80<\/mn><mtext> Ω<\/mtext><\/math><\/div>","<div class=\"mathrow\">Rₑᵣₛ = 60 Ω + 80 Ω = 140 Ω<\/div>","<div class=\"mathrow\">I = 14/140 = 0,10 A; &nbsp; Uₚ = 14 − 60·0,10 = 8,0 V<\/div>","<div class=\"mathrow\">I₁ = 8/120 ≈ 0,067 A; &nbsp; I₂ = 8/240 ≈ 0,033 A<\/div>","<p>Kontroll: I₁ + I₂ = 0,10 A.<\/p>"],"teacher":"Frivilligt stöd vid bokarbete, inte ytterligare obligatorisk lärarledd genomgång."}]}</script><script src="../../_gemensamt/models.js"></script><script src="../../_gemensamt/app.js"></script></body></html>
