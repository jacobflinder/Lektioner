tml">Fysik nivå 1</a> / <a href="../index.html">Kapitel 9</a> / Standardmodellen</div><div class="banner"><span class="class-only">Kort introduktion → grupparbete med boken → individuell slutkontroll. Visa återkoppling först efter elevernas försök.</span><span class="repeat-only">Repetitionsläge: välj och motivera innan du kontrollerar svaret. Inga elevsvar lagras.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Standardmodellen","subject":"Fysik nivå 1b","chapter":"9.1 · Standardmodellen","source":"230829 Standardmodellen Na22.pdf + film, Gy25-anpassad","goals":["Skilja kvarkar, leptoner och kraftförmedlare åt.","Bestämma protonens och neutronens laddning från kvarkarna.","Med boken förklara växelverkningar och Higgsmekanismen."],"pages":[{"title":"Vad finns inuti en proton?","label":"Start och mål","time":"5 min","body":"\u003cdiv class=\"question\">Tänk själv först: Är protonen en odelbar partikel? Vad skulle du vilja undersöka?\u003c/div>\u003cdiv class=\"youtube-start-wrap\">\u003cdiv class=\"youtube-start-meta\">\u003cb>Startfilm: Quarks Explained in Four Minutes\u003c/b>\u003cspan>Physics Girl · cirka 4 minuter\u003c/span>\u003c/div>\u003cdiv class=\"youtube-start\" id=\"youtube-start\" role=\"group\" aria-label=\"Inbäddad YouTube-film om kvarkar\">\u003cbutton type=\"button\" data-youtube-play class=\"youtube-start-button\" aria-label=\"Spela filmen om kvarkar här i lektionen\">\u003cspan class=\"youtube-play-icon\" aria-hidden=\"true\">▶\u003c/span>\u003cspan>Spela klippet här\u003c/span>\u003c/button>\u003c/div>\u003cp class=\"youtube-start-fallback\">Om inbäddningen blockeras: \u003ca href=\"https://www.youtube.com/watch?v=LraNu_78sCw\" target=\"_blank\" rel=\"noopener noreferrer\">öppna filmen på YouTube\u003c/a>. Videon hämtas först när du trycker på Spela.\u003c/p>\u003c/div>\u003cdiv class=\"goals\">\u003carticle>\u003cb>1. Sortera\u003c/b>\u003cp>Skilja kvarkar, leptoner och kraftförmedlande partiklar åt.\u003c/p>\u003c/article>\u003carticle>\u003cb>2. Förklara laddning\u003c/b>\u003cp>Använda u- och d-kvarkarnas laddningar för proton och neutron.\u003c/p>\u003c/article>\u003carticle>\u003cb>3. Söka och förklara\u003c/b>\u003cp>Med boken beskriva minst två växelverkningar och Higgsfältet.\u003c/p>\u003c/article>\u003c/div>\u003cp class=\"small-context\">Vi använder filmen för en fråga, inte för att memorera alla detaljer.\u003c/p>","teacher":"Originalets kvarkfilm spelas direkt i en inbäddad YouTube-spelare på första bilden. Klick krävs för att ladda filmen. När läraren lämnar bilden stängs spelaren och filmen upphör. Kör gärna endast valda delar om du behöver prioritera grupparbetet. Individuell förutsägelse innan film.","source":"Video + original-PDF s. 1"},{"title":"Tre nivåer av materia","label":"Kort introduktion","time":"3 min","body":"\u003cdiv class=\"question\">Vilken av partiklarna nedan är inte uppbyggd av kvarkar?\u003c/div>\u003cp>Atomer innehåller elektroner och en kärna. Kärnans \u003cb>protoner och neutroner\u003c/b> består av kvarkar. \u003cb>Elektronen är en lepton\u003c/b> och är inte uppbyggd av kvarkar.\u003c/p>\u003cp>Partiklar som är byggda av kvarkar kallas \u003cb>hadroner\u003c/b>. Protoner och neutroner är exempel.\u003c/p>\u003cp class=\"small-context\">Läs s. 327–328 om kvarkar och leptoner.\u003c/p>","side":"\u003cfigure class=\"physics-figure\">\u003csvg viewBox=\"0 0 600 355\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Schematisk atom med en elektron utanför en kärna. Inne i protonen syns två uppkvarkar och en nerkvark.\">\u003ctitle>Atom, proton och kvarkar\u003c/title>\u003ccircle cx=\"142\" cy=\"156\" r=\"105\" fill=\"#f1f9fb\" stroke=\"#98c6d3\" stroke-width=\"2\"/>\u003cellipse cx=\"142\" cy=\"156\" rx=\"105\" ry=\"44\" fill=\"none\" stroke=\"#9ab8c0\" stroke-width=\"2\" transform=\"rotate(-27 142 156)\"/>\u003ccircle cx=\"142\" cy=\"156\" r=\"28\" fill=\"#dce5eb\" stroke=\"#6b8f9a\"/>\u003ccircle cx=\"68\" cy=\"104\" r=\"14\" fill=\"#116d89\"/>\u003ctext x=\"68\" y=\"110\" text-anchor=\"middle\" font-size=\"18\" fill=\"white\">−\u003c/text>\u003ctext x=\"142\" y=\"295\" text-anchor=\"middle\" font-size=\"22\" fill=\"#204657\">Atom\u003c/text>\u003cpath d=\"M177 158H278\" stroke=\"#4e8795\" stroke-width=\"3\" stroke-dasharray=\"7 5\"/>\u003cpath d=\"M275 150L289 158L275 166\" stroke=\"#4e8795\" stroke-width=\"3\" fill=\"none\"/>\u003ccircle cx=\"431\" cy=\"157\" r=\"100\" fill=\"#eaf2f5\" stroke=\"#9bbac5\" stroke-width=\"2\"/>\u003ccircle cx=\"401\" cy=\"125\" r=\"31\" fill=\"#c97745\"/>\u003ccircle cx=\"461\" cy=\"125\" r=\"31\" fill=\"#c97745\"/>\u003ccircle cx=\"431\" cy=\"193\" r=\"31\" fill=\"#167f9d\"/>\u003cg font-size=\"26\" font-weight=\"750\" fill=\"white\" text-anchor=\"middle\">\u003ctext x=\"401\" y=\"133\">u\u003c/text>\u003ctext x=\"461\" y=\"133\">u\u003c/text>\u003ctext x=\"431\" y=\"201\">d\u003c/text>\u003c/g>\u003ctext x=\"431\" y=\"295\" text-anchor=\"middle\" font-size=\"22\" fill=\"#204657\">Proton (uud)\u003c/text>\u003ctext x=\"300\" y=\"335\" text-anchor=\"middle\" font-size=\"17\" fill=\"#536f78\">En förenklad bild – inte skalenlig\u003c/text>\u003c/svg>\u003c/figure>","quiz":{"prompt":"Vilken partikel är en lepton?","options":["Proton","Elektron","Neutron"],"correct":1,"why":"Elektronen är en lepton. Protonen och neutronen är hadroner som består av kvarkar."},"teacher":"Fysikrättelse mot Gy11-transkription: neutronen (udd), inte elektronen, är sammansatt av tre kvarkar.","source":"Originalets mindmap, genomgång samt nya boken s. 327–328"},{"title":"Kvarkarnas laddning","label":"Kort introduktion","time":"4 min","body":"\u003cp>\u003cb>Uppkvark (u)\u003c/b> har laddningen +⅔ av elementarladdningen. \u003cb>Nerkvark (d)\u003c/b> har laddningen −⅓.\u003c/p>\u003cdiv class=\"charge-equations\">\u003cdiv>\u003cb>Proton: uud\u003c/b>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmn>2\u003c/mn>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmn>2\u003c/mn>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmn>+1\u003c/mn>\u003c/math>\u003c/div>\u003c/div>\u003cdiv>\u003cb>Neutron: udd\u003c/b>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmn>2\u003c/mn>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmn>0\u003c/mn>\u003c/math>\u003c/div>\u003c/div>\u003c/div>\u003cp>Vi räknar laddningen i enheter av elementarladdningen \u003cb>e\u003c/b>.\u003c/p>\u003cp class=\"small-context\">Läs s. 327. Fråga: Hur kan kvarkarna ge heltalsladdning hos protonen?\u003c/p>","side":"\u003cfigure class=\"physics-figure\">\u003csvg viewBox=\"0 0 620 335\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Proton uud med laddning plus ett; neutron udd med laddning noll.\">\u003ctitle>Valenskvarkarna i proton och neutron\u003c/title>\u003cg fill=\"#f2f8fa\" stroke=\"#bcd2d9\" stroke-width=\"2\">\u003crect x=\"18\" y=\"16\" rx=\"20\" width=\"278\" height=\"266\"/>\u003crect x=\"325\" y=\"16\" rx=\"20\" width=\"278\" height=\"266\"/>\u003c/g>\u003cg font-size=\"26\" font-weight=\"760\" fill=\"#204657\" text-anchor=\"middle\">\u003ctext x=\"158\" y=\"57\">Proton\u003c/text>\u003ctext x=\"464\" y=\"57\">Neutron\u003c/text>\u003ctext x=\"158\" y=\"255\">+1e\u003c/text>\u003ctext x=\"464\" y=\"255\">0\u003c/text>\u003c/g>\u003cg stroke=\"#fff\" stroke-width=\"2\">\u003ccircle cx=\"121\" cy=\"121\" r=\"30\" fill=\"#bc7347\"/>\u003ccircle cx=\"194\" cy=\"121\" r=\"30\" fill=\"#bc7347\"/>\u003ccircle cx=\"157\" cy=\"184\" r=\"30\" fill=\"#117b97\"/>\u003ccircle cx=\"430\" cy=\"121\" r=\"30\" fill=\"#bc7347\"/>\u003ccircle cx=\"501\" cy=\"121\" r=\"30\" fill=\"#117b97\"/>\u003ccircle cx=\"465\" cy=\"184\" r=\"30\" fill=\"#117b97\"/>\u003c/g>\u003cg font-size=\"28\" font-weight=\"780\" fill=\"white\" text-anchor=\"middle\">\u003ctext x=\"121\" y=\"130\">u\u003c/text>\u003ctext x=\"194\" y=\"130\">u\u003c/text>\u003ctext x=\"157\" y=\"193\">d\u003c/text>\u003ctext x=\"430\" y=\"130\">u\u003c/text>\u003ctext x=\"501\" y=\"130\">d\u003c/text>\u003ctext x=\"465\" y=\"193\">d\u003c/text>\u003c/g>\u003ctext x=\"312\" y=\"322\" text-anchor=\"middle\" font-size=\"17\" fill=\"#536f78\">Här visas de tre valenskvarkarna i vardera partikel.\u003c/text>\u003c/svg>\u003c/figure>","quiz":{"prompt":"Vilken kombination ger neutronens laddning noll?","options":["uud","udd","ddd"],"correct":1,"why":"En u-kvark har +⅔ och två d-kvarkar har tillsammans −⅔. Summan blir 0."},"teacher":"Lärarens originalexempel med uud och full additionskedja är bevarat. Neutronen udd är direkt parallell, dessutom i nya boken.","source":"Originalmindmap: protonens uud, nya boken s. 327"},{"title":"Standardmodellens karta","label":"Kort introduktion","time":"4 min","body":"\u003cp>\u003cb>Materiepartiklar:\u003c/b> kvarkar och leptoner. De finns i tre familjer, med antipartiklar.\u003c/p>\u003cdiv class=\"model-grid\">\u003carticle>\u003cstrong>Kvarkar\u003c/strong>\u003cspan>u, d, c, s, t, b\u003c/span>\u003csmall>Bygger bland annat protoner och neutroner.\u003c/small>\u003c/article>\u003carticle>\u003cstrong>Leptoner\u003c/strong>\u003cspan>elektron, myon, tau och tre neutriner\u003c/span>\u003csmall>Elektronen är stabil; neutriner är svåra att upptäcka.\u003c/small>\u003c/article>\u003carticle>\u003cstrong>Växelverkningar\u003c/strong>\u003cspan>foton · gluoner · W och Z\u003c/span>\u003csmall>Förmedlar elektromagnetisk, stark och svag växelverkan.\u003c/small>\u003c/article>\u003carticle>\u003cstrong>Higgs\u003c/strong>\u003cspan>Higgsfältet och Higgsbosonen\u003c/span>\u003csmall>Fältet bidrar till elementarpartiklars massa.\u003c/small>\u003c/article>\u003c/div>\u003cp class=\"small-context\">Gravitation beskrivs inte i standardmodellen. Läs s. 326 samt 328–331.\u003c/p>","quiz":{"prompt":"Vilken partikel förmedlar elektromagnetisk växelverkan?","options":["Foton","Gluon","Elektron"],"correct":0,"why":"Fotonen är elektromagnetismens kraftförmedlare. Gluoner hör till stark växelverkan; elektronen är en materiepartikel."},"teacher":"Översikt, inte ett miniföredrag om alla sex kvarkar. Notera att neutrino är en lepton och att graviton är hypotetisk och inte en etablerad partikel i standardmodellen.","source":"Originalets klassificering + nya boken s. 326, 328–331"},{"title":"Undersök i grupp – boken är ert verktyg","label":"Grupparbete","time":"ca 35–40 min","body":"\u003cdiv class=\"question\">Uppdrag: använd läroboken som referenslitteratur och besvara några av uppgifterna 901–914. Ni behöver inte kunna alla namn utantill.\u003c/div>\u003col class=\"work-steps\">\u003cli>\u003cb>Enskilt:\u003c/b> Läs uppgiften och skriv ditt första försök.\u003c/li>\u003cli>\u003cb>Grupp:\u003c/b> Slå upp rätt textsida. Jämför förklaringar och enas om ett svar.\u003c/li>\u003cli>\u003cb>Förklara:\u003c/b> Skriv svaret med egna ord, skiss eller beräkning. Ange textsidan ni använde.\u003c/li>\u003cli>\u003cb>Kontroll:\u003c/b> Alla i gruppen ska kunna förklara svaret – inte bara den som skrev.\u003c/li>\u003c/ol>\u003cdiv class=\"bookbox\">\u003cstrong>Bok: avsnitt 9.1, s. 325–331\u003c/strong>\u003cp>Uppgifter på s. 332. Välj några; prioritera förståelse och tydliga förklaringar framför att hinna alla.\u003c/p>\u003c/div>","teacher":"Förslag: grupper om 3. Fördela uppgifterna så att grupperna arbetar med olika teman och får redovisa en central slutsats kort. Frigör skyddad arbetstid. Originalet anger 'några bland' och arbete i grupper; inte att alla 14 måste hinnas.","source":"Original-PDF: gruppläsning och några bland uppgifter"},{"title":"Gruppfrågor 901–907","label":"Bokarbete","time":"S. 332","body":"\u003cdiv class=\"bookbox\">\u003cb>Öppna boken på s. 332\u003c/b>\u003cp>Hitta förklaringen på angivna textsidor innan ni svarar. Skriv sidnumret i era anteckningar.\u003c/p>\u003c/div>\u003col class=\"exercise-list\">\u003cli data-exercise=\"901\">\u003cb class=\"ex-no\">901\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">Räkna kvarkar och leptoner i atomer\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 327–328\u003c/span>\u003c/span>\u003c/li>\u003cli data-exercise=\"902\">\u003cb class=\"ex-no\">902\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">Bestäm laddning hos en partikel med tre kvarkar\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 327\u003c/span>\u003c/span>\u003c/li>\u003cli data-exercise=\"903\">\u003cb class=\"ex-no\">903\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">Använd massa och energi vid ett sönderfall\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 325, 331\u003c/span>\u003c/span>\u003c/li>\u003cli data-exercise=\"904\">\u003cb class=\"ex-no\">904\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">Var kan kvarkar förekomma?\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 327\u003c/span>\u003c/span>\u003c/li>\u003cli data-exercise=\"905\">\u003cb class=\"ex-no\">905\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">Varför föreslogs neutrinon?\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 328\u003c/span>\u003c/span>\u003c/li>\u003cli data-exercise=\"906\">\u003cb class=\"ex-no\">906\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">Vardagsmateriens byggstenar\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 328\u003c/span>\u003c/span>\u003c/li>\u003cli data-exercise=\"907\">\u003cb class=\"ex-no\">907\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">Elektron och positron: frigjord energi\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 325, 329\u003c/span>\u003c/span>\u003c/li>\u003c/ol>","teacher":"Eleverna läser originaluppgiften i boken, inte en kopia på webben. Extra stöd vid 903: s. 331 visar förfarande med masskillnad; vid 907: s. 325 ger elektronens viloenergi och s. 329 beskriver annihilation.","source":"Nya läroboken, uppgifter s. 332"},{"title":"Gruppfrågor 908–914","label":"Bokarbete","time":"S. 332","body":"\u003cdiv class=\"bookbox\">\u003cb>Öppna boken på s. 332\u003c/b>\u003cp>Hitta förklaringen på angivna textsidor innan ni svarar. Skriv sidnumret i era anteckningar.\u003c/p>\u003c/div>\u003col class=\"exercise-list\">\u003cli data-exercise=\"908\">\u003cb class=\"ex-no\">908\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">Förklara partiklar och växelverkan i en väteatom\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 327, 330–331\u003c/span>\u003c/span>\u003c/li>\u003cli data-exercise=\"909\">\u003cb class=\"ex-no\">909\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">Kraften som binder kärnan\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 331\u003c/span>\u003c/span>\u003c/li>\u003cli data-exercise=\"910\">\u003cb class=\"ex-no\">910\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">Växelverkan som byter partikeltyp\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 330\u003c/span>\u003c/span>\u003c/li>\u003cli data-exercise=\"911\">\u003cb class=\"ex-no\">911\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">W-bosonens sönderfall\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 330\u003c/span>\u003c/span>\u003c/li>\u003cli data-exercise=\"912\">\u003cb class=\"ex-no\">912\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">Varför behövs Higgsmekanismen?\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 326\u003c/span>\u003c/span>\u003c/li>\u003cli data-exercise=\"913\">\u003cb class=\"ex-no\">913\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">Räkna fermionerna i modellen\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 329\u003c/span>\u003c/span>\u003c/li>\u003cli data-exercise=\"914\">\u003cb class=\"ex-no\">914\u003c/b>\u003cspan>\u003cspan class=\"ex-topic\">Neutriner och detektion\u003c/span>\u003cspan class=\"page-reference\">Läs: s. 328, 330\u003c/span>\u003c/span>\u003c/li>\u003c/ol>","teacher":"Uppgift 908 använder p.327 för uud och s.330–331 för fotoner/gluoner. Distinktion: gluoner binder kvarkar i hadroner; den kvarvarande starka växelverkan binder protoner och neutroner i kärnan.","source":"Nya läroboken, uppgifter s. 332"},{"title":"Jämför era förklaringar","label":"Återkoppling","time":"7 min","body":"\u003cdiv class=\"question\">Välj en av era uppgifter: Vilken var svårast att förstå, och vilken sida i boken hjälpte er?\u003c/div>\u003col>\u003cli>En annan grupp lyssnar på er förklaring och ställer en \u003cb>varför-fråga\u003c/b>.\u003c/li>\u003cli>Ni förbättrar ett svar genom att lägga till en skiss, ett samband eller ett fysikaliskt skäl.\u003c/li>\u003cli>Ni visar vilket stöd ni hittade på textsidan.\u003c/li>\u003c/ol>\u003cp>\u003cb>Tre saker att reda ut tillsammans:\u003c/b> elektronen är inte gjord av kvarkar; stark och svag växelverkan är olika; gravitation ligger utanför standardmodellen.\u003c/p>","teacher":"Ta upp ett eller två verkliga elevresonemang, gärna anonymt. Låt inte redovisningarna äta hela arbetstiden. Om filmen om kvarkar ger fördjupningsfråga: 3 valenskvarkar är en förenklad modell för laddning; protonen har också gluoner/kvark–antikvark-par.","source":"Originalets grupparbete, nu med planerad återkoppling"},{"title":"Kan du förklara utan boken?","label":"Individuell slutkontroll","time":"4–5 min","body":"\u003cdiv class=\"question\">Svara själv i häftet. Visa sedan återkopplingen och jämför med de tre målen från början.\u003c/div>\u003col class=\"exit-questions\">\u003cli>\u003cb>Sortera:\u003c/b> Är elektronen en kvark, lepton eller kraftförmedlare?\u003c/li>\u003cli>\u003cb>Beräkna:\u003c/b> En proton har två u och en d. Vad blir laddningen i enheter av e? Visa mellanled.\u003c/li>\u003cli>\u003cb>Förklara:\u003c/b> Nämn två växelverkningar och deras kraftförmedlare. Vad har Higgsfältet med partiklarna att göra?\u003c/li>\u003c/ol>\u003cp class=\"small-context\">Om du fastnar: anteckna vilken sida i boken som gav dig stöd.\u003c/p>","steps":["\u003cp>\u003cb>1.\u003c/b> Elektronen är en \u003cb>lepton\u003c/b> – inte en kvark och inte en kraftförmedlare.\u003c/p>","\u003cp>\u003cb>2.\u003c/b> Protonens laddning i enheter av e:\u003c/p>\u003cdiv class=\"mathrow\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\">\u003cmfrac>\u003cmn>2\u003c/mn>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmn>2\u003c/mn>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003cmo>−\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmn>3\u003c/mn>\u003c/mfrac>\u003cmo>=\u003c/mo>\u003cmn>+1\u003c/mn>\u003c/math>\u003c/div>","\u003cp>\u003cb>3.\u003c/b> Exempel: elektromagnetisk växelverkan – \u003cb>foton\u003c/b>; stark växelverkan – \u003cb>gluoner\u003c/b>; svag växelverkan – \u003cb>W- och Z-bosoner\u003c/b>. Higgsfältet är kopplat till vissa elementarpartiklars massa. Gravitation ingår inte i standardmodellen.\u003c/p>"],"teacher":"Tre kontrollerbara mål prövas individuellt, utan elevinloggning. Vid behov används svaren som start nästa gång. Ingen Socrative ingår i originallektionen.","source":"Lektionsmål och originalets standardmodellsinnehåll"}]}</script><script src="../../gemensamt/models.js"></script><script src="../../gemensamt/app.js"></script><script src="youtube-start.js"></script></body></html>
