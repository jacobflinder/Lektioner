<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Elektriska kretsar · Fysik nivå 1</title><link rel="stylesheet" href="../../gemensamt/lektion.css"><link rel="stylesheet" href="kretsar.css?v=rev2"><link rel="stylesheet" href="../../gemensamt/sjalvtest.css?v=2"></head><body data-fy1-lesson="elektriska-kretsar"><div class="shell"><header class="header"><div class="brand">FYSIK NIVÅ 1<span id="site-title"></span></div><div class="toolbar" role="group" aria-label="Visningsläge"><button id="classmode" aria-pressed="true">Klassrum</button><button id="repeatmode" aria-pressed="false">Repetition</button><button id="teacher-toggle" aria-pressed="false">Lärarnotiser</button><button id="fullscreen">Helskärm</button><a id="teacher-link" href="lararstod.html">Lärarstöd</a></div></header><div class="crumbs"><a href="../../index.html">Fysik nivå 1</a> / <a href="../index.html">Elektricitet</a> / Elektriska kretsar</div><div class="banner"><span class="class-only">Klassrumsläge: läraren styr när facit visas. Eleverna tänker först, enskilt eller tillsammans.</span><span class="repeat-only">Repetitionsläge: valda svar får omedelbar förklarande återkoppling. Ingen inloggning och inga elevsvar sparas.</span></div><main class="stage" id="stage" aria-live="off"></main><nav class="end-controls" aria-label="Lektionsnavigering"><div class="group"><button id="prev">Föregående</button><button id="step" class="primary">Visa nästa steg</button><button id="next">Nästa bild</button><button id="reset">Återställ bilden</button></div><div class="group"><label for="jump">Gå till bild</label><select id="jump"></select><span class="count" id="counter"></span></div></nav></div><script type="application/json" id="lesson-data">{"title":"Elektriska kretsar","subject":"Fysik nivå 1","chapter":"8.2 · Elektriska kretsar","source":"261104 8.2 Elektriska kretsar.pdf","goals":["Skilja ström från spänning och använda att laddning bevaras.","Beräkna ström, laddning, energi och elektronantal i en krets.","Förklara hur material, längd och tjocklek påverkar resistansen."],"pages":[{"title":"Förbrukas strömmen i resistorn?","body":"<div class=\"question\">Förbrukas strömmen när laddningarna passerar resistorn?<\/div><p>En sluten krets med ett batteri och en resistor. Jämför punkterna <b>A<\/b> och <b>B<\/b>.<\/p><p><b>Förutsäg:<\/b> Är strömmen större i A, större i B eller lika stor? Vad överförs i resistorn?<\/p><p>Rita strömpilar i häftet och motivera för en kamrat.<\/p><div class=\"goalcard\"><b>Efter lektionen ska du kunna<\/b><ol><li>Skilja ström från spänning och använda att laddning bevaras.<\/li><li>Beräkna I, Q och E samt elektronantal.<\/li><li>Förklara och beräkna trådens resistans.<\/li><\/ol><\/div>","source":"1","quiz":{"prompt":"I en enda sluten oförgrenad krets är strömmen…","options":["störst före resistorn","störst efter resistorn","lika stor överallt"],"correct":2,"why":"Samma laddning per sekund passerar A och B i stationärt tillstånd. Elektrisk energi överförs i resistorn, men laddning förbrukas inte.","hint":""},"teacher":"Var tyst efter frågan. Låt alla välja själva och förklara i par före klassens återkoppling. VIKTIGT: samma stationära ström genom en oförgrenad krets; elektrisk energi omvandlas men laddning förbrukas inte. Modell: ideala ledningar och ideal spänningskälla.","side":"<figure class=\"phys-figure\"><svg viewBox=\"0 0 560 335\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"En sluten batterikrets med en resistor och punkterna A och B på var sin sida om resistorn.\"><title>En sluten batterikrets med en resistor och punkterna A och B på var sin sida om resistorn.<\/title><desc>Punkterna A och B ligger före respektive efter resistorn längs den konventionella strömriktningen. Rita din förutsägelse innan facit visas.<\/desc><path d=\"M90 150V75H470V260H90V150\" stroke=\"#315464\" stroke-width=\"3.5\" fill=\"none\"/><rect x=\"72\" y=\"141\" width=\"36\" height=\"78\" fill=\"#fff\"/><line x1=\"69\" y1=\"168\" x2=\"111\" y2=\"168\" stroke=\"#bf7450\" stroke-width=\"4\"/><line x1=\"79\" y1=\"189\" x2=\"101\" y2=\"189\" stroke=\"#bf7450\" stroke-width=\"4\"/><rect x=\"237.0\" y=\"60\" width=\"94\" height=\"30\" fill=\"#fff\" stroke=\"#315464\" stroke-width=\"3\" rx=\"2\"/><text x=\"284\" y=\"46\" text-anchor=\"middle\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#254d5d\">resistor<\/text><text x=\"181\" y=\"57\" text-anchor=\"middle\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#0b7896\">A<\/text><text x=\"388\" y=\"57\" text-anchor=\"middle\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#0b7896\">B<\/text><text x=\"49\" y=\"132\" text-anchor=\"middle\" font-size=\"23\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#b76b47\">+<\/text><text x=\"49\" y=\"222\" text-anchor=\"middle\" font-size=\"23\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#b76b47\">−<\/text><text x=\"116\" y=\"285\" text-anchor=\"middle\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#546e79\">batteri<\/text><\/svg><figcaption>Punkterna A och B ligger före respektive efter resistorn längs den konventionella strömriktningen. Rita din förutsägelse innan facit visas.<\/figcaption><\/figure>"},{"title":"Laddning cirkulerar. Energi överförs.","body":"<div class=\"duo-concepts\"><div><span>STRÖM<\/span><div class=\"equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I<\/mi><mo>=<\/mo><mfrac><mi>Q<\/mi><mi>t<\/mi><\/mfrac><\/math><\/div><p><b>1 A = 1 C/s.<\/b> Hur mycket laddning passerar per sekund?<\/p><\/div><div><span>SPÄNNING<\/span><div class=\"equation\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U<\/mi><mo>=<\/mo><mfrac><mi>E<\/mi><mi>Q<\/mi><\/mfrac><\/math><\/div><p><b>1 V = 1 J/C.<\/b> Hur mycket energi överförs per laddning?<\/p><\/div><\/div><p><b>Ström<\/b> går <em>genom<\/em> en komponent. <b>Spänning<\/b> anges <em>mellan<\/em> två punkter.<\/p><div class=\"question\">6,0 V över 30 Ω: beräkna I. Vad händer med I om U halveras och R är konstant?<\/div>","source":"2","steps":["<div class=\"worked\"><b>Välj samband.<\/b><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U<\/mi><mo>=<\/mo><mi>R<\/mi><mi>I<\/mi><mo>⇒<\/mo><mi>I<\/mi><mo>=<\/mo><mfrac><mi>U<\/mi><mi>R<\/mi><\/mfrac><\/math><\/div><\/div>","<div class=\"worked\"><b>Sätt in med enheter.<\/b><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>I<\/mi><mo>=<\/mo><mfrac><mrow><mn>6,0<\/mn><mspace width=\"0.2em\"/><mi mathvariant=\"normal\">V<\/mi><\/mrow><mrow><mn>30<\/mn><mspace width=\"0.2em\"/><mo>Ω<\/mo><\/mrow><\/mfrac><mo>=<\/mo><mn>0,20<\/mn><mspace width=\"0.2em\"/><mi mathvariant=\"normal\">A<\/mi><\/math><\/div><\/div>","<p><b>Halva U vid oförändrat R:<\/b> I = 0,10 A. Ohms lag här förutsätter konstant resistans, exempelvis oförändrad temperatur.<\/p>"],"teacher":"Ohms lag gäller vid konstant resistans, exempelvis ungefär konstant temperatur.","side":"<figure class=\"phys-figure\"><svg viewBox=\"0 0 560 335\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Ohms lags exempel: 6,0 volt över 30 ohm, lika stor ström på båda sidor.\"><title>Ohms lags exempel: 6,0 volt över 30 ohm, lika stor ström på båda sidor.<\/title><desc>Båda turkosa strömpilarna har samma längd. Batteriet ger 6,0 V över resistorn på 30 Ω.<\/desc><path d=\"M90 145V70H460V248H90V145\" stroke=\"#315464\" stroke-width=\"3.5\" fill=\"none\"/><rect x=\"72\" y=\"137\" width=\"36\" height=\"78\" fill=\"#fff\"/><line x1=\"69\" y1=\"164\" x2=\"111\" y2=\"164\" stroke=\"#bf7450\" stroke-width=\"4\"/><line x1=\"79\" y1=\"185\" x2=\"101\" y2=\"185\" stroke=\"#bf7450\" stroke-width=\"4\"/><rect x=\"225.0\" y=\"55\" width=\"104\" height=\"30\" fill=\"#fff\" stroke=\"#315464\" stroke-width=\"3\" rx=\"2\"/><text x=\"277\" y=\"48\" text-anchor=\"middle\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#254d5d\">30 Ω<\/text><text x=\"90\" y=\"293\" text-anchor=\"middle\" font-size=\"19\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#b36a47\">6,0 V<\/text><text x=\"173\" y=\"53\" text-anchor=\"middle\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#117e97\">I<\/text><path d=\"M148 70 L215 70 M204.0 64.0 L215 70 L204.0 76.0\" stroke=\"#0a8297\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M358 70 L423 70 M412.0 64.0 L423 70 L412.0 76.0\" stroke=\"#0a8297\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\" fill=\"none\"/><text x=\"285\" y=\"331\" text-anchor=\"middle\" font-size=\"17\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#456e7d\">Samma ström före och efter resistorn<\/text><\/svg><figcaption>Båda turkosa strömpilarna har samma längd. Batteriet ger 6,0 V över resistorn på 30 Ω.<\/figcaption><\/figure>"},{"title":"Från ström till laddning, energi och elektroner","body":"<p>Samma ideala krets: <b>U = 6,0 V<\/b>, <b>I = 0,20 A<\/b>. Under <b>10 s<\/b> passerar laddning genom ett valt tvärsnitt, och energi omvandlas i resistorn.<\/p><div class=\"question\">Förutsäg vad som händer med <b>Q, E och N<\/b> när tiden fördubblas till 20 s. Fördubblas också strömmen?<\/div><p>Välj ett tidsintervall i modellen, gör en förutsägelse och visa sedan resultatet.<\/p>","source":"3","model":"current","steps":["<p><b>Laddning:<\/b> Q = It = 0,20 A · 10 s = <b>2,0 C<\/b>.<\/p>","<p><b>Energi:<\/b> E = UQ = 6,0 V · 2,0 C = <b>12 J<\/b>.<\/p>","<p><b>Elektronantal:<\/b> N = Q/e = 2,0 C/(1,602 · 10<sup>−19<\/sup> C) ≈ <b>1,2 · 10<sup>19<\/sup><\/b> elektroner. Här används laddningsbeloppet per elektron.<\/p>","<p><b>Dubbel tid:<\/b> Q, E och N fördubblas medan strömmen är oförändrad vid samma U och R. Laddningen cirkulerar – energi omvandlas.<\/p>"],"teacher":"Låt eleverna förutsäga och räkna för 10 s innan modellen avslöjar tal. Dra därefter tiden till 20 s. Kontrollera särskilt att de inte påstår att strömmen ökar med tiden. N=Q/e beräknas med e positivt som laddningsbelopp.","quiz":{"prompt":"Med oförändrade U och R: tiden fördubblas. Vad händer med antalet elektroner som passerat?","options":["Det är oförändrat","Det blir dubbelt","Det blir fyra gånger så stort"],"correct":1,"why":"N=Q/e=It/e. När tiden fördubblas vid samma ström fördubblas Q och därmed N.","hint":"Skilj ström (per sekund) från totalt antal under tidsintervallet."}},{"title":"Laddning försvinner inte vid en förgrening","body":"<div class=\"question\">0,50 A kommer in i en knutpunkt. 0,20 A går ut genom den övre grenen. Hur stor är den nedre strömmen – och åt vilket håll går den?<\/div><p>Rita riktningen själv. Förklara i par varför <b>laddning inte ansamlas<\/b> i knutpunkten när strömmarna är stationära.<\/p><p>Det här är <b>Kirchhoffs första lag<\/b>: summan av inkommande strömmar är summan av utgående.<\/p>","source":"4","steps":["<p><b>Bevarande:<\/b> 0,50 A = 0,20 A + I.<\/p>","<p><b>Lös:<\/b> I = 0,50 A − 0,20 A = <b>0,30 A<\/b>.<\/p>","<p><b>Riktning:<\/b> strömmen går <b>ut genom den nedre grenen<\/b>. Laddningen bevaras och ingen nettoansamling sker i knutpunkten i stationärt tillstånd.<\/p>"],"teacher":"Använd en synlig förgreningsfigur som du ritar tillsammans med klassen; elevens pilar och ord är det viktiga.","side":"<figure class=\"phys-figure\"><svg viewBox=\"0 0 560 335\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Förgrening där 0,50 ampere kommer in, 0,20 ampere går ut upptill och en okänd ström går i undre grenen.\"><title>Förgrening där 0,50 ampere kommer in, 0,20 ampere går ut upptill och en okänd ström går i undre grenen.<\/title><desc>Förutsäg storlek och riktning på den nedre grenströmmen innan du visar lösningen.<\/desc><path d=\"M74 171H258 M258 171L423 85 M258 171L423 259\" stroke=\"#315464\" stroke-width=\"4\" fill=\"none\"/><circle cx=\"258\" cy=\"171\" r=\"9\" fill=\"#315464\"/><path d=\"M103 171 L205 171 M194.0 165.0 L205 171 L194.0 177.0\" stroke=\"#0a8297\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M316 137 L387 100 M374.5 99.8 L387 100 L380.0 110.4\" stroke=\"#0a8297\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\" fill=\"none\"/><text x=\"151\" y=\"137\" text-anchor=\"middle\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#0a8297\">0,50 A<\/text><text x=\"382\" y=\"60\" text-anchor=\"middle\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#0a8297\">0,20 A<\/text><text x=\"389\" y=\"281\" text-anchor=\"middle\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#b06a43\">I = ?<\/text><text x=\"285\" y=\"317\" text-anchor=\"middle\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#466e79\">Vilket håll går strömmen?<\/text><\/svg><figcaption>Förutsäg storlek och riktning på den nedre grenströmmen innan du visar lösningen.<\/figcaption><\/figure>","quiz":{"prompt":"Hur stor ström går ut genom den nedre grenen?","options":["0,30 A ut","0,70 A ut","0,30 A in"],"correct":0,"why":"Kirchhoffs första lag: 0,50 A in = 0,20 A ut + 0,30 A ut.","hint":"Summan av utgående strömmar är lika stor som inkommande."}},{"title":"Vad gör en tråd till ett större motstånd?","body":"<p>Tre koppartrådar vid <b>samma temperatur<\/b>. Börja med A och förutsäg vad som händer med resistansen:<\/p><div class=\"compare-cases\"><div><b>A · Ursprung<\/b><span>l = 10 m, d = 0,50 mm<\/span><\/div><div><b>B · Längre<\/b><span>l = 20 m, d = 0,50 mm<\/span><\/div><div><b>C · Tjockare<\/b><span>l = 10 m, d = 1,00 mm<\/span><\/div><\/div><div class=\"question\">Hur förändras R för B och C jämfört med A? Gör en förutsägelse före demonstrationen och modellen.<\/div><p><b>Verklig demonstration:<\/b> Physics at School VI, försök 6. Förutsäg → observera → förklara.<\/p>","source":"5","model":"wire","steps":["<p><b>Sambandet:<\/b> R = ρl/A, där ρ är materialets resistivitet, l är längd och A är <b>tvärsnittsarea<\/b> (inte mantelyta).<\/p>","<p><b>För dubbla längden:<\/b> R blir dubbelt så stor om material, temperatur och diameter inte ändras.<\/p>","<p><b>För dubbla diametern:<\/b> A = π(d/2)² blir fyra gånger större, och R blir därför <b>en fjärdedel<\/b>.<\/p>"],"teacher":"Bevara verkliga demonstrationen Physics at School VI 6. Börja med två separata förutsägelser. Använd vid behov själva modellen först efter elevernas observation. Förklara skillnaden mellan radie, diameter, tvärsnittsarea och mantelyta. Undvik att ge intryck att trådens verkliga längd och diameter är i samma skala i bilden.","quiz":{"prompt":"Samma material, temperatur och längd: diametern fördubblas. Hur ändras R?","options":["Halveras","Blir en fjärdedel","Fördubblas"],"correct":1,"why":"Tvärsnittsarean är proportionell mot diametern i kvadrat. Dubbla diametern ger fyra gånger arean och R/4.","hint":"Tänk på att A=π(d/2)²."}},{"title":"Exempel · En tråds resistans","body":"<p><b>Uppgift:<\/b> En koppartråd är 10 m lång och har diametern 0,50 mm. Beräkna resistansen vid en temperatur där<\/p><div class=\"mathrow\">ρ = 0,018 Ω·mm²/m.<\/div><div class=\"question\">Vad behöver du räkna ut innan du kan använda R = ρl/A? Vilka enheter ska du välja?<\/div><p>Föreslå första steget själv innan vi visar lösningen.<\/p>","source":"6","steps":["<p><b>1 · Halvera diametern.<\/b> r = d/2 = 0,50 mm/2 = <b>0,25 mm<\/b>.<\/p>","<div class=\"worked\"><b>2 · Cirkulär tvärsnittsarea.<\/b><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A<\/mi><mo>=<\/mo><mi>π<\/mi><msup><mi>r<\/mi><mn>2<\/mn><\/msup><\/math><\/div><\/div>","<p><b>3 · Sätt in radien:<\/b> A = π(0,25 mm)² ≈ <b>0,196 mm²<\/b>.<\/p>","<div class=\"worked\"><b>4 · Resistans med enheter och riktiga mellanled.<\/b><div class=\"mathrow\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mi>R<\/mi><mo>=<\/mo><mfrac><mrow><mi>ρ<\/mi><mi>l<\/mi><\/mrow><mi>A<\/mi><\/mfrac><mo>=<\/mo><mfrac><mrow><mn>0,018<\/mn><mspace width=\"0.2em\"/><mfrac><mrow><mo>Ω<\/mo><mo>⋅<\/mo><msup><mi mathvariant=\"normal\">mm<\/mi><mn>2<\/mn><\/msup><\/mrow><mi mathvariant=\"normal\">m<\/mi><\/mfrac><mo>⋅<\/mo><mn>10<\/mn><mspace width=\"0.2em\"/><mi mathvariant=\"normal\">m<\/mi><\/mrow><mrow><mn>0,196<\/mn><mspace width=\"0.2em\"/><msup><mi mathvariant=\"normal\">mm<\/mi><mn>2<\/mn><\/msup><\/mrow><\/mfrac><mo>≈<\/mo><mn>0,92<\/mn><mspace width=\"0.2em\"/><mo>Ω<\/mo><\/math><\/div><\/div>","<p><b>5 · Rimlighetskontroll:<\/b> mm² och m förkortas bort; kvar blir Ω. En relativt lång men tunn koppartråd får en märkbar resistans.<\/p>"],"teacher":"Viktigt: r är radie och R är resistans, skriv olika tydligt.","side":"<figure class=\"phys-figure\"><svg viewBox=\"0 0 560 335\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"En tio meter lång koppartråd med cirkulärt tvärsnitt och diameter 0,50 millimeter.\"><title>En tio meter lång koppartråd med cirkulärt tvärsnitt och diameter 0,50 millimeter.<\/title><desc>Längd och tvärsnitt ritas i varsin skala. Tvärsnittsarean är den cirkulära ändytan.<\/desc><text x=\"278\" y=\"50\" font-family=\"system-ui\" font-size=\"19\" fill=\"#315c6a\" text-anchor=\"middle\">10 m koppartråd<\/text><rect x=\"68\" y=\"78\" width=\"392\" height=\"34\" rx=\"2\" fill=\"#c88857\"/><line x1=\"69\" y1=\"130\" x2=\"459\" y2=\"130\" stroke=\"#557d88\" stroke-width=\"2\"/><path d=\"M69 121V139 M459 121V139\" stroke=\"#557d88\" stroke-width=\"2\"/><text x=\"264\" y=\"156\" text-anchor=\"middle\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#254d5d\">l = 10 m<\/text><circle cx=\"275\" cy=\"245\" r=\"43\" fill=\"#f6ede3\" stroke=\"#b87743\" stroke-width=\"3\"/><path d=\"M232 245H318\" stroke=\"#315464\" stroke-width=\"2.5\"/><path d=\"M232 237V253 M318 237V253\" stroke=\"#315464\" stroke-width=\"2\"/><text x=\"275\" y=\"316\" text-anchor=\"middle\" font-size=\"20\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#254d5d\">d = 0,50 mm<\/text><\/svg><figcaption>Längd och tvärsnitt ritas i varsin skala. Tvärsnittsarean är den cirkulära ändytan.<\/figcaption><\/figure>"},{"title":"Nu övar du själv","body":"<div class=\"book-priority\"><div class=\"book-primary\"><h2>Boken · uppgifter 812–828, s. 279–280<\/h2><p><b>Börja med 814 → 819 → 822 → 824.<\/b><\/p><p>Ohms lag → förgrening → trådresistans → elektronantal.<\/p><\/div><div class=\"book-others\"><p><b>När du är klar:<\/b> 817–818 knyter ihop laddning, energi och batteritid.<\/p><p><b>Fördjupning:<\/b> 823 och 826–828 kombinerar flera steg.<\/p><\/div><\/div><p><b>Arbeta själv först.<\/b> Jämför sedan ett resonemang med en kamrat. Skriv samband, mellanled, enheter och ett rimligt svar.<\/p><p><b>Stöd:<\/b> använd exempelbilderna 2–6 eller stödsidan 9. Alla uppgifter ska inte hinnas under lektionen.<\/p><p><b>Inför labben:<\/b> läs s. 270–278, särskilt de <b>gröna rutorna<\/b> så noggrant som möjligt.<\/p>","source":"7","time":"Eget bokarbete • planera ca 25 min","teacher":"Detta är en verklig arbetsfas på ca 25 minuter i en 70-minuterslektion. Behåll de prioriterade uppgifterna. Förkorta i stället antalet gemensamma följdfrågor om klassen behöver mer tid. Ingen separat räknestuga finns."},{"title":"Visa vad du kan – utan bok","body":"<p>Arbeta <b>enskilt utan bok<\/b> och motivera dina svar. Jämför sedan med målen från första bilden.<\/p><div class=\"exit-items\"><div><b>1 · Begrepp<\/b><p>Vad betyder 1 A respektive 1 V? Varför är strömmen lika stor före och efter en resistor?<\/p><\/div><div><b>2 · Beräkning<\/b><p>I = 0,10 A, U = 4,0 V och t = 20 s. Beräkna Q och E.<\/p><\/div><div><b>3 · Resonemang<\/b><p>Samma material och längd: radien fördubblas. Hur förändras R? Förklara med tvärsnittsarean.<\/p><\/div><\/div><p class=\"selfcheck\">Markera ett mål du kan förklara för en annan elev och ett du behöver öva mer på.<\/p>","source":"8","steps":["<p><b>1:<\/b> 1 A = 1 C/s; 1 V = 1 J/C. Samma stationära ström före och efter resistorn eftersom laddningen bevaras.<\/p>","<p><b>2:<\/b> Q = It = 0,10 A · 20 s = <b>2,0 C<\/b>. E = UQ = 4,0 V · 2,0 C = <b>8,0 J<\/b>.<\/p>","<p><b>3:<\/b> A = πr². Dubbla radien ger fyra gånger arean och därmed <b>R/4<\/b> (samma material, längd och temperatur).<\/p>"],"teacher":"Återvänd till lektionsmålen och låt varje elev markera ett område att träna."},{"title":"Stöd · Inför labben","body":"<p class=\"note\"><b>Referenssida:<\/b> använd efter behov vid eget arbete och inför kopplingslabben. Ingen extra gemensam genomgång.<\/p><div class=\"ref-grid\"><section><h2>Batteriladdning och tid<\/h2><p>1 Ah = 3600 C; Q = It.<\/p><p>0,30 A under 2,0 h ger Q = 0,60 Ah = <b>2160 C<\/b>.<\/p><\/section><section><h2>Elektroner och strömriktning<\/h2><p>I metall går elektronerna motsatt konventionell ström. I den yttre kretsen räknas ström från + till −.<\/p><p>N = Q/e använder laddningsbeloppet.<\/p><\/section><section><h2>Material och temperatur<\/h2><p>Ledare, isolator, halvledare och supraledare har olika ledningsförmåga. En glödlampa får högre R när glödtråden blir varm.<\/p><\/section><\/div><p><b>PhET-labb, separat aktivitet:<\/b> <a href=\"https://phet.colorado.edu/sims/html/circuit-construction-kit-dc-virtual-lab/latest/circuit-construction-kit-dc-virtual-lab_en.html\" target=\"_blank\" rel=\"noopener noreferrer\">Öppna Circuit Construction Kit: DC – Virtual Lab<\/a>. Följ den befintliga laborationsinstruktionen. Bygg och mät i PhET.<\/p>","source":"9","teacher":"Referenssida efter avslutningen. Ge eleverna originalets PhET-PDF separat; ingen dubblering av laborationen. Mätning: ideal voltmeter är parallell; amperemeter i serie. Undvik att förväxla elektronrörelsen med konventionell ström.","side":"<figure class=\"phys-figure\"><svg viewBox=\"0 0 560 335\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Kretsschema med amperemeter kopplad i serie och voltmeter parallellt över en resistor.\"><title>Kretsschema med amperemeter kopplad i serie och voltmeter parallellt över en resistor.<\/title><desc>Mätaren A sitter i strömvägen. Mätaren V är kopplad mellan resistorns två ändar.<\/desc><path d=\"M90 165V92H458V285H90V165\" fill=\"none\" stroke=\"#315464\" stroke-width=\"3.3\"/><rect x=\"72\" y=\"157\" width=\"36\" height=\"78\" fill=\"#fff\"/><line x1=\"69\" y1=\"184\" x2=\"111\" y2=\"184\" stroke=\"#bf7450\" stroke-width=\"4\"/><line x1=\"79\" y1=\"205\" x2=\"101\" y2=\"205\" stroke=\"#bf7450\" stroke-width=\"4\"/><rect x=\"271.0\" y=\"77\" width=\"92\" height=\"30\" fill=\"#fff\" stroke=\"#315464\" stroke-width=\"3\" rx=\"2\"/><circle cx=\"212\" cy=\"92\" r=\"25\" fill=\"white\" stroke=\"#2c8795\" stroke-width=\"3\"/><path d=\"M270 92V170H364V92\" stroke=\"#2c8795\" stroke-width=\"2.8\" fill=\"none\"/><circle cx=\"317\" cy=\"170\" r=\"24\" fill=\"white\" stroke=\"#2c8795\" stroke-width=\"3\"/><text x=\"212\" y=\"100\" text-anchor=\"middle\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#187c92\">A<\/text><text x=\"317\" y=\"178\" text-anchor=\"middle\" font-size=\"22\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#187c92\">V<\/text><text x=\"317\" y=\"58\" text-anchor=\"middle\" font-size=\"21\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#254d5d\">R<\/text><text x=\"283\" y=\"326\" text-anchor=\"middle\" font-size=\"18\" font-family=\"system-ui\" font-weight=\"600\" fill=\"#254d5d\">A i serie • V parallellt<\/text><\/svg><figcaption>Mätaren A sitter i strömvägen. Mätaren V är kopplad mellan resistorns två ändar.<\/figcaption><\/figure>"}]}</script><script src="../../gemensamt/models.js"></script><script src="kretsar-models.js?v=rev2"></script><script src="../../gemensamt/app.js"></script><script src="../../gemensamt/sjalvtest.js?v=2" defer></script></body></html>
